.tcard .tn{font:700 14px Montserrat,sans-serif;letter-spacing:.06em;color:var(--c);text-transform:uppercase}
.tcard .tt{font-size:19px;line-height:1.35;margin:8px 0 14px;font-weight:500}
.tcard .tm{margin-top:auto;color:var(--muted);font-size:15px}
.tcard .chk{position:absolute;top:18px;right:18px;width:24px;height:24px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.tcard .badge{display:inline-block;margin-left:6px;font:600 11px Inter,sans-serif;color:var(--c);border:1px solid var(--c);border-radius:999px;padding:0 7px;vertical-align:2px}

{info:`<p>Слово <b>«історія»</b> — давньогрецького походження. Воно означає <b>дослідження, повідомлення, оповідь про події</b>. Свою історію мають кожне село чи місто, будівля, держава, навіть іграшки, одяг і морозиво.</p>
<p><b>Історія</b> — наука, що вивчає минуле людства на підставі усних, письмових свідчень, зображень і матеріальних пам’яток (житла, одягу, знарядь праці тощо).</p>
<h4>Як виникла наука історія</h4>
<p>Співці та збирачі легенд прославляли події минулого, згодом люди почали записувати відомості про важливі події та особистостей. «Батьком історії» в Європі вважають давньогрецького вченого <b>Геродота</b>, який жив понад 2000 років тому: мандруючи, він записував розповіді про війни, держави, побут людей і назвав ці записи «історіями». Згодом події почали записувати рік за роком (літо за літом): в Україні такі записи називали <b>літописами</b>, в інших країнах Європи — <b>хроніками</b>.</p>
<p>Людей, які вивчають минуле, називають <b>істориками</b>. Вони досліджують літописи, рештки будівель, знаряддя праці, посуд, прикраси, гроші, походження назв, з’ясовують причини й наслідки подій.</p>
<h4>Видатний історик</h4>
<p><b>Дмитро Яворницький</b> (1855–1940) — дослідник історії запорозьких козаків: археолог, етнограф, архіваріус. Залишив тритомну «Історію запорізьких козаків» і майже 150 праць. Консультував Іллю Рєпіна під час роботи над картиною «Запорожці пишуть листа турецькому султану» і сам позував у образі писаря.</p>

// 2 §1 Як люди живуть у спільнотах і суспільстві
{info:`<h4>Кожна людина — неповторна особистість</h4>
<p>Людина — частина живої природи, але, на відміну від інших живих істот, вона наділена <b>свідомістю</b> — розумінням навколишнього світу, себе й інших людей, здатністю змінювати довкілля. Люди різні за зовнішністю, характером, бажаннями й потребами, тому кожна людина <b>унікальна</b>.</p>
<p><b>Гідність</b> — це самоповага, усвідомлення власної цінності, знання своїх прав, а також повага до інших. Здавна відомо правило: <i>«Поводься з іншими так, як би ти хотів, щоб поводились з тобою»</i>. Допомагати, підтримувати, визнавати таланти інших — теж прояв гідності.</p>
<h4>Що об’єднує людей у спільноти</h4>
<p>Людина — істота <b>соціальна</b> (пов’язана із соціумом, людьми та їхніми спільнотами). Одними з перших спільнот були:</p>
<ul><li><b>рід</b> — об’єднання кровно пов’язаних людей;</li><li><b>плем’я</b> — союз людей зі спільним походженням, мовою, вірою і звичаями.</li></ul>
<p>Сьогодні людей об’єднують спільні життєві умови, потреби та інтереси, звичаї, релігія, мова. Приклади спільнот: <b>сім’я, клас, школа, місцева громада, громадське об’єднання</b> (наприклад, «Пласт»), віртуальні спільноти в Інтернеті, народ України, людство.</p>
<p><b>Суспільство</b> — це люди та спільноти в їхніх взаємовідносинах і взаємозв’язках.</p>`,

{info:`<p><b>Історичний час</b> — це час існування людства, який рухається тільки вперед — від минулого до майбутнього.</p>
<p><b>Хронологія</b> — наука про історичні події в їх часовій послідовності, що вивчає способи обчислення історичного часу. Вивчення історії починають саме з неї.</p>

// 5 §3 Лінія часу
{info:`<h4>Лінія часу</h4>
<p>Рух часу в історії уявляють за допомогою умовної <b>лінії (стрічки) часу</b> — прямої лінії з позначеними часовими проміжками.</p>
<ul><li>У центрі — позначка <b>Р. Х.</b> (Різдво Христове).</li>
<li><b>Праворуч</b> — події після Р. Х.: що далі праворуч, то ближче до нашого часу.</li>
<li><b>Ліворуч</b> — події до Р. Х.: <b>що далі ліворуч, то давніша подія</b>. Роки до Р. Х. рахують у зворотному напрямку: 500 р. до Р. Х. був раніше, ніж 100 р. до Р. Х.</li></ul>
<p>Приклади подій на лінії часу: будівництво пірамід і Олімпійські ігри в Давній Греції (до Р. Х.), Хрещення Русі (988 р.), Українська революція (1917 р.), проголошення незалежності України (1991 р.).</p>
<h4>Як правильно записувати дати</h4>
<ul><li>Скорочення: мільйон — <b>млн</b>, тисячоліття — <b>тис.</b>, століття — <b>ст.</b>, рік — <b>р.</b>, роки — <b>рр.</b></li>

<li>Початком століття вважається <b>«перший»</b> рік, а кінцем — <b>«сотий»</b>: XIX ст. почалося 1801 р. і закінчилося 1900 р. Щоб визначити століття, до числа сотень додають 1 (1648 р.: 16 + 1 = XVII ст.).</li></ul>

// 6 §4 Як пов'язані історія і простір
{info:`<h4>Простір життєдіяльності людини</h4>
<p>Життєдіяльність людини — це праця і відпочинок, свята і повсякдення, спілкування й усамітнення. Людина перебуває одночасно в трьох просторах:</p>
<ul><li><b>природному</b> — як жива істота вона є частиною природи;</li>
<li><b>соціальному</b> — простір суспільства: інші люди, спільноти, з якими вона спілкується, працює, дружить;</li>
<li><b>особистому</b> — місце проживання, особисті речі, коло друзів, власні думки й переживання. Він найважливіший для людини і з роками розширюється.</li></ul>
<p><b>Простір життєдіяльності</b> — існування людини в особистому, соціальному і природному середовищах, їх взаємозалежність і тісна взаємодія.</p>
<h4>Простір у географії та історії</h4>
<p><b>Географія</b> вивчає територію, на якій живуть люди: сторони світу, клімат, гори, річки, корисні копалини. Це пояснює, як заняття, житло, одяг і звичаї людей залежать від місцевості.</p>
<p>Для історика географічний простір перетворюється на <b>історичний</b> — місце, де відбувалися події минулого. <i>Історія — це подорож не лише в часі, а й у просторі.</i> Річки й моря історик розглядає як торговельні чи воєнні шляхи, гори — як захист від нападників; оцінює можливості для землеробства, будівництва міст.</p>
<h4>Людина і довкілля</h4>
<p>Спочатку люди збирали плоди й полювали, згодом почали змінювати природу: будувати житла, прокладати дороги, обробляти ґрунт. Це змінювало рослинний і тваринний світ, ґрунти й клімат. Нині забруднюються повітря, вода, ґрунт, зникають види рослин і тварин. Земля вже не встигає очищатися, тож <b>майбутнє планети залежить від дій кожного з нас</b>.</p>`,
terms:[["Простір життєдіяльності","поєднання особистого, соціального і природного середовищ людини"],["Соціальний простір","простір суспільства, інших людей і спільнот"],["Особистий простір","житло, речі, друзі, думки й переживання людини"],["Історичний простір","місце, де відбувалися події минулого"],["Довкілля","природне середовище, що оточує людину"]],

// 7 §5 Як карти розповідають про минуле й сьогодення
{info:`<h4>Як з’явилися карти</h4>
<p>Ще в давнину люди малювали на каменях, кістках, бересті найближчі околиці. Перші карти були недосконалими: на <b>вавилонській карті світу</b> (VIII–VII ст. до Р. Х., глиняна табличка) Земля оточена «Солоною водою». Згодом люди навчилися точніше відтворювати місцевість і створили систему умовних позначок.</p>
<p><b>Карта</b> (від грец. <i>chartes</i> — «сувій папірусу») — зменшене узагальнене зображення поверхні Землі або її частини на площині.</p>
<h4>Які бувають карти</h4>
<ul><li><b>Географічні (фізичні)</b> — природа, гори, річки, моря, корисні копалини.</li>
<li><b>Політичні</b> — держави, їхні кордони, столиці, області та їхні центри.</li>
<li><b>Історичні</b> — створені на основі географічних; показують розселення племен і народів, кордони держав, походи, війни, торговельні шляхи, міста, дати подій.</li></ul>
<h4>Легенда карти</h4>
<p><b>Легенда</b> — перелік умовних позначень із поясненнями (кольори — території держав, стрілки — напрямки руху, кола й точки — міста). Зазвичай вона розташована в нижньому куті карти.</p>
<h4>Як працювати з історичною картою</h4>
<ol><li>Як називається карта?</li><li>Яку державу зображено і яка її столиця?</li><li>З якими державами вона межує?</li><li>У якому столітті відбуваються події?</li><li>Які позначки складають легенду?</li><li>Які події зображено: що, де і коли відбулося?</li></ol>
<p>Україна впродовж історії була частиною європейського простору. З <b>1991 р.</b> — незалежна держава. Географічна карта показує її природу, політична — столицю, області, кордони сусідніх держав.</p>`,

// 8 §6 Етнографія та топоніміка
{info:`<h4>Історико-географічні регіони України</h4>
<p>Україна — <b>найбільша за площею держава Європи</b>. За частинами її території історично закріпилися назви: <b>Буковина, Волинь, Галичина, Закарпаття, Запоріжжя, Поділля, Слобожанщина, Чернігово-Сіверщина, Наддніпрянщина</b> та ін. На відміну від областей, вони не мають усталених кордонів.</p>
<p><b>Історико-географічні регіони</b> — місцини з природними, господарськими, історичними, мовними та культурними особливостями. Назва «Буковина» походить від букових лісів, «Слобожанщина» — від слобід, заснованих переселенцями.</p>
<h4>Етнографія</h4>
<p><b>Етнографія</b> — наука, що досліджує культурно-побутові особливості народів, їхнє походження, розселення та взаємини. Етнографи вивчають місцеві відмінності культури і створюють етнографічні карти. Побачити типи жител, начиння, знаряддя, одяг регіону можна в етнографічних і краєзнавчих музеях.</p>
<h4>Топоніміка</h4>
<p><b>Топоніміка</b> — наука, що вивчає географічні назви та їх історію. Назви міст, сіл, вулиць пов’язані з природою, мовою, заняттями людей та історичними подіями:</p>
<ul><li>місто <b>Ярослав</b> заснував у ХІ ст. князь Ярослав Мудрий на честь перемог;</li>
<li><b>Алчевськ</b> (ХІХ ст.) названо на честь промисловця й доброчинця Олексія Алчевського;</li>
<li>Рудники, Шахтарськ — від занять людей; Гончарна, Кожум’яцька — від ремесел; Грецька, Сербська — від спільнот; Соборна — від храмів.</li></ul>
<p>Після здобуття незалежності з’явилися вулиці на честь Івана Мазепи, Михайла Грушевського; із 1991 р. головна площа Києва — <b>майдан Незалежності</b>. Нині вулиці називають іменами учасників Революції Гідності та захисників України.</p>`,

// 9 §7 У яких джерелах люди шукають інформацію
{info:`<p><b>Інформація</b> (від лат. <i>informatio</i> — «роз’яснення, уявлення») — відомості про об’єкти і явища навколишнього світу, які підвищують обізнаність людини. Усе, що надає інформацію, називається <b>джерелом</b>: книги, телепередачі, спілкування з людьми, власний досвід і спостереження.</p>
<h4>Форми інформації</h4>
<ul><li><b>цифрова</b> — числа, вирази;</li><li><b>текстова</b> — розповідь, роман, тези;</li><li><b>графічна</b> — картина, креслення, графік;</li><li><b>звукова</b> — мова, музика, звуки природи;</li><li><b>складна</b> — відеокліп, кінофільм, концерт.</li></ul>
<h4>Текст і медіатекст</h4>
<p><b>Текст</b> — будь-яка записана мова (літературний твір, документ). У ХХ ст. з’явилися <b>медіатексти</b> — тексти, створені для передачі іншим людям і поширювані технічними засобами (кіно, телебачення, Інтернет). Особистий лист друзям — повідомлення, а відкритий лист міському голові в соцмережах — уже медіатекст.</p>
<h4>Факти і думки</h4>
<ul><li><b>Факт</b> — те, що сталося насправді (дати, імена, місця подій). Факти не залежать від наших бажань.</li>
<li><b>Думка</b> — судження конкретної людини, її оцінка чи емоційне ставлення.</li></ul>
<p>Інформація <b>достовірна</b>, якщо вона правдива, повна і точна, її можна підтвердити документами чи надійними джерелами.</p>
<h4>Як перевірити інформацію на сайті</h4>
<ol><li>Хто розміщує інформацію? Найнадійніші — сайти державних, освітніх і наукових установ.</li><li>Чи не застаріла вона?</li><li>Що це за джерело, хто автор і чи є він фахівцем?</li></ol>`,

// 10 §8 Де люди шукають інформацію про минуле
{info:`<p>Щоб дізнатися про минуле, потрібно знайти й дослідити результати життєдіяльності людей — <b>історичні джерела</b>.</p>
<h4>Види історичних джерел</h4>
<ul><li><b>Писемні</b> — рукописи, книги, літописи, газети, написи на камені чи стінах.</li>
<li><b>Речові</b> — усе, до чого можна торкнутися: від старовинних будівель до знарядь праці, пам’ятників і механізмів.</li>
<li><b>Зображувальні (візуальні)</b> — портрети, світлини, малюнки, картини, кінофільми, реклама.</li>
<li><b>Етнографічні</b> — орнаменти, традиції, звичаї, пісні.</li></ul>
<h4>Первинні та вторинні джерела</h4>
<table class="tbl"><tr><th>Первинні</th><th>Вторинні</th></tr>
<tr><td>створені протягом досліджуваного періоду або учасником подій: щоденники, листи, усні історії, світлини, газетні статті, закони, а також <b>артефакти</b> — будівлі, знаряддя, зброя, гроші, одяг</td><td>створені пізніше; пояснюють, тлумачать, узагальнюють первинні: <b>підручники, біографії, енциклопедії, словники</b>, документальні фільми</td></tr></table>
<p>Первинні джерела допомагають «наблизитися» до того, що відбулося. У добре підготовленому дослідженні є посилання на обидва види.</p>
<h4>Де шукати</h4>
<ul><li>Що, де, коли сталося і хто брав участь — <b>історичні словники, довідники, енциклопедії</b>.</li>
<li>Чому події важливі — <b>підручники, збірки документів</b>.</li>
<li>Як виглядали учасники та місця — <b>фотографії, ілюстрації, фільми, карти й атласи</b>.</li>
<li>Як люди ставилися до подій — <b>біографії, усні історії, листи, інтерв’ю</b>.</li></ul>`,

// 11 §9 Як речі та зображення стають історичними джерелами
{info:`<h4>Археологія</h4>
<p><b>Археологія</b> (від грец. «архео» — давнє, «логос» — вчення) — наука, що вивчає життя людини за матеріальними свідченнями минулого за допомогою <b>розкопок</b>. Археологи досліджують залишки посуду, будівель, знарядь, зброї, прикрас, встановлюють час їх створення; за кістками тварин і зернами дізнаються, що вирощували та їли люди. Існує й <b>підводна археологія</b>. Приклад знахідок — посуд <b>трипільців</b>, давніх землеробів, які жили приблизно 6 тисяч років тому.</p>
<h4>Речові джерела</h4>
<p>Побутові речі, знаряддя, зброя, одяг, прикраси, монети, будівлі, інструменти — <b>пам’ятки матеріальної культури</b>. Їх досліджують разом з іншими джерелами (наприклад, писемними). Речі, якими ми користуємося сьогодні, колись розповідатимуть нащадкам про наш час.</p>
<p><b>Як досліджувати речове джерело:</b> що це за річ? коли і де створена? з якою метою? кому могла належати? що вона розповідає про життя людей?</p>
<p>Приклади: браслет із кісток мамонта (≈20 тис. років, Мізин, Чернігівщина), римський театр, лицарські обладунки, Ейфелева вежа (1889), перші комп’ютери.</p>
<h4>Візуальні джерела</h4>
<p>Наскальні малюнки, герби, живопис, ілюстрації, комп’ютерна графіка, пам’ятники. У ХІХ ст. з винайденням <b>фотографії</b> з’явився <b>фотодокумент</b> — він завжди є відбитком того часу, коли зроблений.</p>
<p><b>Як досліджувати візуальне джерело:</b></p>
<ol><li>Визнач: що це (картина, фото, реконструкція), ким, коли і з якою метою створено.</li><li>Опиши: хто і що зображено, де, які деталі важливі.</li><li>Узагальни інформацію про минуле.</li><li>Порівняй з іншими джерелами.</li></ol>`,

// 12 §10 Писемні джерела, мова та фольклор
{info:`<h4>Писемні джерела</h4>
<p><b>Писемність</b> виникла майже <b>5 тисяч років тому</b>. Писали на глиняних табличках, корі дерев, кам’яних брилах; у Давньому Єгипті — на <b>папірусі</b> зі стебел рослини; на землях Русі-України — на <b>бересті</b> (корі берези). Пізніше — на <b>пергаменті</b> з оброблених шкір телят, овець і кіз. <b>Папір</b> винайшли в Китаї майже 2000 років тому.</p>
<p>Що розповідають писемні джерела:</p>
<ul><li><b>літописи й хроніки</b> — про події в країні;</li><li><b>стародавні закони</b> — як розуміли справедливість, власність, злочини;</li><li><b>літературні твори</b> — уявлення про красу, добро і зло;</li><li>записи ринків — про товари й ціни; <b>газети</b> — про новини суспільства; <b>шкільні журнали</b> — про предмети й учнів; <b>переписи</b> — про мешканців.</li></ul>
<p>Приклади: графіті (настінні написи) Софійського собору в Києві (ХІ ст.), берестяні грамоти, Радзивіллівський літопис (XV ст.).</p>
<h4>Мова як джерело</h4>
<p>Мова змінюється з часом і відображає, які народи жили поруч і які зміни відбувалися. Наприклад, слова «тротуар» (з французької) і «трамвай» (з англійської) з’явилися наприкінці ХІХ — на початку ХХ ст. разом із новим транспортом, а «ґаджет» — зовсім недавно.</p>
<h4>Фольклор</h4>
<p><b>Фольклор</b> (з англ. — «народна мудрість») — усна та музична народна творчість, обряди та звичаї давнього походження: прислів’я, казки, балади, думи, історичні пісні. Вони зберігають пам’ять про давні події, працю, побут і вірування.</p>
<p><b>Як дослідити фольклорну пам’ятку:</b> про що і про кого йдеться? до якої верстви належать персонажі? які події, історичний період, географічні назви згадано? що є правдою, а що — вигадкою?</p>
<p>Приклади: пісня «Розмова Дніпра з Дунаєм», прислів’я «Кінь та ніч — козакові товариші».</p>`,

// 13 §11–12 Музеї, архіви та книги
{info:`<h4>Музеї</h4>
<p>Для збереження історичних джерел створили <b>музеї</b>. Перший музей («Дім муз») заснували в давньому місті <b>Александрія Єгипетська</b> понад 2000 років тому. Є музеї в будівлях і <b>просто неба</b>; іноді музейною територією оголошують цілі квартали. Речові й писемні пам’ятки в музеях називають <b>експонатами</b>. Працівники музеїв проводять екскурсії, досліджують джерела, займаються <b>реставрацією</b> — відновленням пошкоджених пам’яток.</p>
<h4>Архіви</h4>
<p>Писемні джерела можуть псуватися, згоріти, бути викраденими. Тому їх зберігають в <b>архівах</b> (від грец. «архе» — давній) — збірках документів і місцях, де їх зберігають, упорядковують і вивчають. Працівники архівів — <b>архіваріуси</b>.</p>
<h4>Давні книги</h4>
<p>Слово <b>«книга»</b> має давнє походження й означає «те, що пов’язане, скріплене разом». Століттями книги переписували від руки в монастирях, оздоблювали золотом, сріблом, коштовним камінням, тому вони були дуже дорогі.</p>
<ul><li><b>Остромирове Євангеліє</b> (1056–1057) — пам’ятка Русі-України: 294 пергаментні аркуші, текст у дві колонки, слова не відділені одне від одного.</li>
<li><b>Пересопницьке Євангеліє</b> (XVI ст.) — унікальна рукописна пам’ятка; на ньому присягає новообраний Президент України.</li>
<li>Давні книги — одночасно писемні, речові й візуальні джерела (мініатюри, оправи).</li></ul>
<h4>Бібліотеки</h4>
<p><b>Бібліотека</b> — книгозбірня, місце збереження колекцій книг, інформаційний центр і суспільний простір. Щоб знайти потрібну книжку, користуються <b>каталогами</b> — паперовими й електронними переліками наявної літератури.</p>`,

// 14 Гутенберг і Федоров
{info:`<p>Дехто з істориків вважає <b>книгодрукування</b> одним із чотирьох великих відкриттів людства (разом із компасом, порохом і папером).</p>
<p>У XV ст. в Європі, зокрема на українських землях, зросла потреба в книжках: учителям і школярам потрібні були підручники, купцям — відомості про інші держави й карти, церквам — релігійні книги.</p>
<h4>Йоганн Гутенберг</h4>
<p>«Батько» європейського книгодрукування — німецький винахідник <b>Йоганн Гутенберг</b>. Винайшовши в середині XV ст. <b>друкарський верстат</b> і спеціальну фарбу для літер, він близько 1450 р. надрукував <b>Біблію</b>. Гутенберг започаткував традиції розміщення тексту на сторінці, види шрифтів, оздоблення книг; випускав підручники й календарі. Пам’ятник йому стоїть у місті Майнц.</p>
<h4>Іван Федоров (Федорович)</h4>
<p>Справу Гутенберга в Україні продовжив <b>Іван Федоров</b> — винахідник і майстер-друкар. Він опанував різні ремесла (тесля, ливарник, палітурник), розробив форми для літер, сам набирав і виправляв текст.</p>
<ul><li>Відкрив друкарню у <b>Львові</b> за гроші містян; 1574 р. надрукував <b>«Апостол»</b> — першу друковану книгу в Україні.</li>
<li>Переїхав до <b>Острога</b> й друкував книги коштом князя <b>Костянтина Василя Острозького</b>: <b>«Буквар»</b> — перший друкований підручник на українських землях; 1581 р. вийшла <b>Острозька Біблія</b> — перший друк Святого Письма в Україні.</li></ul>
<h4>Як книгодрукування змінило життя людей</h4>
<p>Книжок стало більше, вони <b>здешевіли</b> й стали доступнішими для різних верств населення. Це зумовило розвиток <b>освіти, науки і культури</b>.</p>`,

// 15 §13 Як досліджують історичні події та життя історичних діячів
{info:`<h4>Подія, явище, процес</h4>
<ul><li><b>Історична подія</b> — те, що відбулося з людьми в минулому, у певний час, у певному місці, за участі конкретних людей (подорож, відкриття, битва). Приклади: спорудження Софійського собору в Києві (ХІ ст.), відкриття Америки Колумбом (1492), Олімпійські ігри в Токіо (2020/2021).</li>
<li><b>Історичне явище</b> — сукупність подій, що повторюються в певній послідовності й мають спільні ознаки. Явища триваліші за події й охоплюють більші території (наприклад, війна).</li>
<li><b>Історичний процес</b> — послідовність взаємопов’язаних подій і явищ, у яких відбилася діяльність багатьох поколінь (перехід від первісності до античності, вплив Інтернету на освіту).</li></ul>
<p>Значущість події стає зрозумілою з часом: проголошення незалежності стосується всього населення, а будівництво школи в селі — лише його мешканців.</p>
<h4>Як вивчають події</h4>
<p>Досліджуючи подію, явище чи процес, з’ясовують: <b>що, де, коли, з ким</b> сталося; <b>причини</b> (чому це відбулося?); <b>наслідки</b> (який результат, які зміни в житті людей?).</p>
<p>Приклад: у XV ст. розвивалася морська торгівля → потрібні були швидкі кораблі → з’явилася <b>каравела</b>, нові карти, компаси й астролябії → відкриття нових земель.</p>
<h4>Історичні діячі</h4>
<p><b>Історичні діячі (постаті)</b> — люди, чиї здобутки залишили яскравий слід у минулому: правителі, полководці, вчені, винахідники, мандрівники, митці. Їхніми іменами називають вулиці, бібліотеки, міста, їм ставлять пам’ятники.</p>
<p><b>Як дослідити історичну постать:</b> про кого йдеться? коли і в якій країні жила людина? які її риси характеру й погляди? з чим пов’язана діяльність? які вчинки відомі? яке твоє ставлення?</p>
<p>Приклад: <b>Наталія Полонська-Василенко</b> (1884–1973) — історикиня й археологиня, перша в Україні жінка — доктор історичних наук, авторка двотомної «Історії України» та понад 200 праць.</p>`,

// 16 §14 Княгиня Ольга
{info:`<h4>Русь-Україна</h4>
<p>У період середньовіччя, у <b>ІХ ст.</b>, на землях сучасної України постає давня держава <b>Русь-Україна</b> — об’єднання слов’янських племен під єдиною владою (поляни, сіверяни, древляни та ін.).</p>
<p>Назва <b>«Україна»</b> вперше зустрічається в <b>Київському літописі</b> під <b>1187 роком</b>. Більшість дослідників вважають, що вона виникла від слов’янських слів «край, країна» — певні землі, відокремлені від інших («краяти» — «відрізати»). Історик <b>Михайло Грушевський</b> у 10-томній «Історії України-Руси» поєднав назви Русь і Україна, підкресливши безперервність нашої історії.</p>
<h4>Княгиня Ольга</h4>
<p>Правителів Русі-України називали <b>князями</b>. Ольга увійшла в історію як <b>єдина жінка-правителька Русі-України</b>. Вона почала правити <b>945 р.</b> після загибелі чоловіка — князя <b>Ігоря</b>.</p>
<ul><li>Жорстоко помстилася <b>древлянам</b>, які вбили Ігоря, — спалила їхню столицю <b>Іскоростень</b> (946 р.). Надалі дбала про мир у державі.</li>
<li>Зосередилася на <b>внутрішніх справах</b>: об’їжджала країну, закладала міста й оборонні споруди, <b>упорядкувала збір данини</b> (вид податків) з усіх земель. Це зміцнило господарство й державу.</li>
<li>Однією з перших на Русі стала <b>християнкою</b>: прийняла хрещення в <b>Константинополі</b> — столиці Візантії; її хрещеним батьком став візантійський імператор. Наказувала зводити храми.</li></ul>
<p>Давні хроністи писали, що Ольга рішучістю й мудрістю стоїть вище за інших жінок. Пам’ятник Ользі в Києві (І. Кавалерідзе) зображує її поруч із Кирилом, Мефодієм та Андрієм Первозванним. В Україні є державна нагорода — <b>орден княгині Ольги</b>. Її син — князь <b>Святослав</b> (964–972), який розширив кордони Русі.</p>`,

// 17 §14 Король Данило
{info:`<p>У <b>ХІІІ ст.</b> за правління князя <b>Данила</b>, якого прозвали <b>Галицьким</b>, <b>Галицько-Волинська держава</b>, що об’єднувала Галичину і Волинь, досягла найвищого розквіту. Правив 1238–1264 рр. Його життєпис — це літопис боротьби та захисту українських земель.</p>
<h4>Князь-воїн і дипломат</h4>
<ul><li>Створив <b>регулярне військо</b> — важко озброєну піхоту з селян — і значно розширив територію держави.</li>
<li>Мав небачену особисту відвагу: під час облоги польського містечка <b>Каліш</b> переодягнувся городянином, проник у місто й запропонував укласти мир — здивовані поляки погодилися.</li>
<li>Літопис відзначає його видатні <b>дипломатичні здібності</b>.</li></ul>
<h4>Будівник і господар</h4>
<p>Данило будував нові міста (зокрема <b>Холм</b> і <b>Львів</b>) і зміцнював старі, зводив церкви й укріплення. Держава стала <b>однією з найбагатших у Європі</b>: розташована на перехресті торговельних шляхів, вона мала великі запаси <b>солі</b>, на яку завжди був попит.</p>
<h4>Перший український король</h4>
<p>Під час <b>навали монголів</b> Данило відстояв владу й державу та домагався союзу з європейськими країнами проти монголів. На знак підтримки <b>папа Римський 1253 р. коронував</b> його в Дорогичині. Данило Галицький став <b>першим українським королем</b>, а держава увійшла в історію як <b>Королівство Руське</b>.</p>
<p>Ольга і Данило правили в період <b>Середніх віків</b>.</p>`,

// 18 §15 Українське козацтво
{info:`<h4>Хто такі козаки</h4>
<p>Малозаселені степи від Чорного й Азовського морів до Середнього Подніпров’я мають історичну назву <b>Дике поле</b>. Тут поруч жили українці й татари: воювали, але й торгували. Тоді до української мови увійшли слова <b>шабля, барабан, табір, майдан</b>.</p>
<p>У XV ст. татари створили <b>Кримське ханство</b> (столиця — Бахчисарай), почалися спустошливі набіги. Захист від них взяли на себе <b>козаки</b>. Слово «козак» означає <b>«вільна, озброєна людина»</b>. Козаки також займалися мисливством, рибальством, хліборобством, вправно їздили верхи й ходили на човнах — <b>чайках</b>.</p>
<h4>Запорозька Січ</h4>
<p>Козаки збиралися за <b>порогами Дніпра</b> — на Запорожжі, тому їх називають <b>запорожцями</b>. Тут вони зводили <b>Січі</b> — укріплення з високими валами й гарматами. Усередині були церква, господарські будівлі, житла — <b>курені</b>; на площі біля церкви збирали <b>козацькі ради</b>. За переказами, першу Січ збудував князь <b>Дмитро Вишневецький</b> у 1550-х рр. на острові <b>Мала Хортиця</b>. Історія Січей налічує майже два з половиною століття.</p>
<h4>Битви і походи</h4>
<ul><li>Козаки воювали з Османською імперією (Туреччиною), Кримським ханством і Польщею; їхнє військове мистецтво вражало Європу.</li>
<li>Гетьман <b>Петро Конашевич-Сагайдачний</b> перетворив окремі ватаги на <b>регулярне військо</b> із суворою дисципліною, захищав православну церкву, жертвував на школи й лікарні. Під Хотином (1621) українсько-польське військо перемогло турецько-татарське.</li>
<li>У XVII ст. зросли утиски українців у <b>Речі Посполитій</b>. <b>Богдан Хмельницький</b> очолив <b>Національно-визвольну війну 1648–1657 рр.</b></li></ul>
<p>На звільнених землях постала українська держава — <b>Військо Запорозьке (Гетьманщина)</b> з власними кордонами, органами влади й столицею <b>Чигирин</b>. Селяни стали вільними, зміцнилося становище церкви й козацтва.</p>
<p>Пам’ять про козацтво зберігають літописи, герби міст, пам’ятники (зокрема у Відні), фільми, банкноти (Іван Мазепа на 10 гривнях), День українського козацтва.</p>`,

// 19 §16 Українська революція
{info:`<p>Слово <b>«революція»</b> латинського походження й означає <b>«поворот, зміни»</b>. <b>Українська революція</b> — низка подій, пов’язаних із національно-визвольною боротьбою українського народу у <b>1917–1921 рр.</b></p>
<h4>Причини</h4>
<p>Революції передувала <b>Перша світова війна (1914–1918)</b>. Українські землі тоді були поділені між <b>Російською</b> та <b>Австро-Угорською</b> імперіями, тож українці воювали у двох ворожих арміях. Загибель людей, руйнування, голод, безробіття, зростання цін змусили людей протестувати проти війни та імператорської влади й вимагати <b>республіки</b> (держави, де правління здійснює обраний народом орган) і рівних прав.</p>
<h4>Перебіг подій</h4>
<ul><li><b>Березень 1917 р.</b> — у Києві створено <b>Українську Центральну Раду (УЦР)</b> на чолі з <b>Михайлом Грушевським</b>.</li>
<li>У своїх <b>універсалах</b> (офіційних документах) УЦР проголосила спочатку <b>автономію</b> (самоврядування) України, а згодом — незалежність <b>Української Народної Республіки (УНР)</b>.</li>
<li><b>22 січня 1918 р. — IV Універсал</b>: «Однині Українська Народна Республіка стає самостійною, ні від кого незалежною, вільною, суверенною державою українського народу».</li>
<li>Далі — <b>Українська держава</b> гетьмана <b>Павла Скоропадського</b> та відновлена УНР (Володимир Винниченко, Симон Петлюра).</li>
<li><b>Листопад 1918 р.</b> — у Львові проголошено <b>Західноукраїнську Народну Республіку (ЗУНР)</b> на чолі з <b>Євгеном Петрушевичем</b>.</li>
<li><b>22 січня 1919 р.</b> — <b>Акт Злуки</b> УНР і ЗУНР у Києві. Нині це <b>День Соборності України</b>.</li></ul>
<p>У 1919 р. Україну окупувала більшовицька Росія, а 1922 р. вона стала частиною <b>СРСР</b>. Хоча незалежність тоді не вдалося відстояти, революція вплинула на наступні покоління. Пам’ять про неї зберігають пам’ятники Грушевському, Винниченку, Петрушевичу, фільм «Крути 1918», назви вулиць.</p>`,

// 20 §17 Голодомор
{info:`<h4>Що таке Голодомор</h4>
<p>Після входження більшості українських земель до складу <b>СРСР</b> від другої половини 1920-х рр. у селах почали примусово створювати колективні господарства — <b>колгоспи</b>. Селяни втрачали право розпоряджатися своєю землею та врожаєм; попри спротив і повстання їх силоміць зганяли до колгоспів.</p>
<p><b>Голодомор 1932–1933 рр.</b> (від «морити голодом») — спланований радянською владою масовий голод.</p>
<ul><li>Селяни мусили здавати державі все зерно та іншу продукцію.</li>
<li>Улітку 1932 р. ухвалили закон, прозваний <b>«законом про п’ять колосків»</b>: за кілька зібраних потайки колосків голодну людину ув’язнювали на 10 років або навіть страчували.</li>
<li>Села, що не виконали план хлібозаготівель, блокували війська — люди не могли втекти від голоду.</li></ul>
<p>Голодомор не був наслідком посухи чи стихійного лиха — він стався через <b>сплановані дії радянської влади</b>. Загинули мільйони людей. В Україні Голодомор визнано <b>геноцидом українського народу</b>.</p>
<p><b>Геноцид</b> (з грец. «рід, плем’я» та лат. «вбиваю») — цілеспрямовані дії з метою знищення повністю або частково національних, етнічних, расових чи релігійних груп.</p>
<h4>Як зберігають пам’ять</h4>
<p>У СРСР десятиліттями забороняли навіть згадувати про Голодомор. Лише наприкінці 1980-х рр. почали записувати спогади тих, хто вижив. Першими правду розкрили <b>Люди Правди</b>: <b>Улас Самчук</b> (роман «Марія», 1934), <b>Василь Барка</b> («Жовтий князь», 1963), <b>Володимир Маняк</b> (Народна книга-меморіал «33-й: Голод», 1991). У Києві діє <b>Національний музей Голодомору-геноциду</b>; символ пам’яті — свічка й колоски.</p>
<p>Голодомор визнали геноцидом або засудили багато держав: Австралія, Канада, США, Польща, Литва, Латвія, Естонія, Грузія, Італія, Іспанія та ін. Меморіали є у Вашингтоні, Кракові, Віндзорі (Канада). В Україні День пам’яті жертв голодоморів відзначають у <b>четверту суботу листопада</b>.</p>`,
terms:[["Голодомор","спланований радянською владою масовий голод 1932–1933 рр."],["Колгосп","колективне господарство, куди примусово зганяли селян"],["«Закон про п’ять колосків»","закон 1932 р., що карав за кілька зібраних колосків"],["Геноцид","дії з метою знищення національних, етнічних, расових чи релігійних груп"],["Люди Правди","ті, хто першими розповів правду про Голодомор"]],

// 21 §18 Друга світова війна
{info:`<h4>Друга світова війна 1939–1945 рр.</h4>
<ul><li><b>1 вересня 1939 р.</b> — напад <b>нацистської Німеччини</b> на Польщу, початок війни. У 1939–1941 рр. Німеччина та її союзники захопили більшість країн Європи. Бої йшли на суші, морі й у повітрі — у Європі, Північній Африці та Азії.</li>
<li>У 1939–1940 рр. західноукраїнські землі, що були у складі Польщі й Румунії, приєднано до СРСР.</li>
<li><b>22 червня 1941 р.</b> — напад Німеччини на СРСР; війна охопила всю територію тодішньої України.</li>
<li>Вигнання нацистів з української землі тривало з зими 1942–1943 рр. до <b>жовтня 1944 р.</b></li>
<li><b>8 травня 1945 р.</b> нацистська Німеччина капітулювала. Поразка Японії <b>2 вересня 1945 р.</b> остаточно завершила війну. Перемогу здобули об’єднаними зусиллями багатьох країн.</li></ul>
<p><b>Нацисти</b> — прибічники партії Адольфа Гітлера, які вважали німців «вищою расою».</p>
<h4>Доля людини у війні</h4>
<p>Мільйони чоловіків і жінок пішли на фронт; у тилу люди працювали вдень і вночі. Окупанти вважали українців, євреїв, ромів та інші народи «менш вартісними», вивозили людей на <b>примусові роботи до Німеччини</b>, грабували зерно й худобу, за опір розстрілювали, палили села (<b>Корюківка</b> — найбільше в Європі поселення, знищене під час каральної операції).</p>
<p><b>Голокост</b> — масове знищення євреїв Європи. У <b>Бабиному Яру</b> в Києві нацисти розстріляли понад сто тисяч євреїв, а також ромів, українських діячів, військовополонених. <b>Гетто</b> — відокремлені частини міст для євреїв; <b>концтабори</b> — місця ув’язнення.</p>
<p><b>Рух Опору</b> — боротьба проти окупантів: радянські партизани, а на Волині й Галичині — <b>Українська повстанська армія (УПА)</b>, що боролася за незалежну Україну проти нацистів і проти радянської влади.</p>
<h4>Пам’ять</h4>
<p>Пам’ять зберігають меморіали, братські могили, музеї, щоденник Анни Франк, медаль «Праведник народів світу» для тих, хто рятував євреїв. В Україні <b>8 травня</b> відзначають як День пам’яті та примирення, <b>9 травня</b> — День Перемоги над нацизмом.</p>`,

// 22 §19 Сучасна Українська держава
{info:`<h4>Що таке незалежність</h4>
<p>Головна ознака незалежної держави — <b>державний суверенітет</b>: право самостійно здійснювати політику всередині країни та у міжнародних відносинах. Жодна інша країна не має права втручатися в її справи, порушувати кордони чи захоплювати територію.</p>
<p><b>Ознаки суверенної держави:</b> володіє землею, надрами, повітряним і водним простором; має власні фінанси й збирає податки; створює власні збройні сили й поліцію; має власні органи влади й закони; запроваджує державні символи й гроші.</p>
<h4>Пам’ятні дати</h4>
<ul><li><b>24 серпня 1991 р.</b> — Верховна Рада ухвалила <b>Акт проголошення незалежності України</b>. Оскільки незалежність уже проголошувала Центральна Рада 22 січня 1918 р., 1991 р. фактично відбулося її <b>відновлення</b>. 24 серпня — <b>День Незалежності</b>, головне державне свято.</li>
<li><b>1 грудня 1991 р.</b> — <b>всеукраїнський референдум</b>: понад 90 % учасників підтримали Акт. Того ж дня обрано першого Президента України — <b>Леоніда Кравчука</b>.</li>
<li>Упродовж кількох місяців Україну визнали майже 100 держав. У <b>грудні 1995 р.</b> Україну прийняли до <b>Ради Європи</b>.</li>
<li><b>28 червня 1996 р.</b> — ухвалено <b>Конституцію України</b> — Основний Закон.</li></ul>
<p><b>Акт</b> (від лат. «дія») — документ державного значення, що вводить у дію певні рішення.</p>
<h4>Державні символи</h4>
<p>За Конституцією: <b>Державний Прапор</b> — стяг із двох рівновеликих горизонтальних смуг синього і жовтого кольорів; <b>Державний Герб</b> — головний елемент — Знак Княжої Держави Володимира Великого (тризуб); <b>Державний Гімн</b> — на музику М. Вербицького.</p>
<p>Незалежність — результат тривалої боротьби багатьох українців, зокрема <b>В’ячеслава Чорновола</b> (1937–1999), якого радянська влада тричі ув’язнювала. Нині українські захисники й захисниці боронять незалежність і територіальну цілісність держави.</p>`,

// 23 §20 Господарство і гроші
{info:`<h4>Як виникло господарство</h4>
<p><b>Господарювання</b> — діяльність людей, що забезпечує задоволення їхніх потреб.</p>
<ul><li><b>Привласнювальне господарство</b> — збиральництво, полювання, рибальство: люди брали все необхідне з природи.</li>
<li><b>Відтворювальне господарство</b> — <b>землеробство і скотарство</b>: люди почали вирощувати рослини й приручили тварин (приблизно <b>10 тисяч років тому</b>).</li>
<li><b>Ремесло</b> — виготовлення посуду, тканин, одягу, згодом виробів із металу, зокрема на продаж.</li>
<li>Згодом ручну працю замінили машини: з’явилися залізниці, автомобілі, авіація, радіо, телефон; у ХХ–ХХІ ст. — освоєння космосу, комп’ютери, Інтернет, мобільний зв’язок.</li></ul>
<h4>Звідки беруться гроші</h4>
<p>Вироблене треба було обміняти чи продати — так з’явилася <b>торгівля</b> і <b>товарне господарство</b>, за якого вироби призначалися для продажу на ринку й обмінювалися за посередництва грошей. Платіжними засобами були мушлі, перлини, хутра, бруски солі, худоба.</p>
<p>Історія українських грошей бере початок з Русі-України. Назва <b>«гривня»</b>, ймовірно, походить від прикраси — золотого чи срібного обруча, який носили на шиї (на «загривку»). Перші монети — <b>златники й срібляники</b> князя <b>Володимира Великого</b> (кінець Х — початок ХІ ст.) із зображенням князя й тризуба. Гривня була грошовою одиницею УНР; гривні сучасної України запроваджено <b>1996 р.</b> Нині поширюються безготівкові розрахунки й електронні гроші.</p>
<h4>Підприємництво</h4>
<p>Слово «підприємництво» походить від французького <i>entrepreneur</i> — «посередник». Перші підприємці в Русі-Україні — ремісники, торговці, купці. Сьогодні підприємництво часто називають <b>бізнесом</b> (з англ. — «справа»). Підприємці виробляють товари, надають послуги, впроваджують нові ідеї.</p>
<p>Приклад: брати <b>Яхненки</b> зі Сміли разом із <b>Федором Симиренком</b> заснували торговий дім «Брати Яхненки і Симиренко», збудували найсучасніші цукрові заводи на Черкащині й власний машинобудівний завод.</p>`,

// 24 §21 Село і місто
{info:`<h4>Село в минулому</h4>
<p><b>Село</b> — невелике поселення, мешканці якого займаються землеробством і домашнім тваринництвом. У давнину селяни жили в хатах із глини, перемішаної із соломою; ззовні їх обмазували глиною й білили, дах крили соломою або очеретом, підлога була глиняною.</p>
<p>Вирощене й виготовлене селяни продавали на <b>ярмарках</b>: зерно, мак, льон, а з XVIII ст. — картоплю й соняшник, свійських тварин і птицю. Ярмарків чекали і дорослі, і діти — туди з’їжджалися люди різних народів (опис Д. Яворницького).</p>
<h4>Місто</h4>
<p>Міське життя на півдні сучасної України зародилося ще в античні часи, коли <b>давні греки</b> засновували міста й торгували з місцевими племенами.</p>
<p>Середньовічні міста мали спільні риси: <b>мури</b>, щільну забудову, головну площу, вулиці, вимощені бруківкою. Давня традиція мостити вулиці каменем зосталася в основі слова <b>«місто»</b>; мешканців називали <b>містянами</b>. Населення міст було багатомовним і різноманітним.</p>
<p>У багатьох містах запроваджували <b>самоврядування</b>: громада обирала міського голову та міську раду (Кам’янець-Подільський, Коломия, Луцьк, Чернівці та ін.).</p>
<p>У Новий час виникали нові міста: на Слобожанщині — <b>Суми, Чугуїв, Харків, Ізюм</b>; на Півдні — морські порти <b>Миколаїв, Одеса, Маріуполь, Херсон</b>.</p>
<h4>Сучасні села і міста</h4>
<p>Інтернет дає змогу і селянам, і містянам отримувати інформацію, послуги й товари. Фермери використовують сучасну техніку й комп’ютерні програми. Проте через брак роботи, віддаленість лікарень і університетів люди переселяються до міст — сьогодні <b>більшість населення України живе в містах</b>, а деякі села зникають.</p>`,

// 25 §22 Освіта і наука
{info:`<h4>Як розвивалися освіта і школа</h4>
<ul><li>Із появою держав в Азії та Африці, в Античній Греції та Римі виникли школи. У Давньому Вавилоні їх називали <b>«будинками табличок»</b>.</li>
<li>У середньовіччі школи поширилися Європою. У Києві першу школу заснував князь <b>Володимир</b> (989 р.). Школи відкривали при церквах, де вчили читати, писати й рахувати.</li>
<li>На початку Нового часу постали <b>братські школи</b> (братства — об’єднання переважно православних для розвитку освіти й книгодрукування). Перша — у <b>Львові 1586 р.</b>; згодом їх стало близько тридцяти. Навчали рідною мовою арифметики, астрономії, музики.</li>
<li>Мандрівник <b>Павло Алеппський</b> (1654) дивувався, що в козацькій землі майже всі, навіть більшість жінок і сиріт, уміють читати.</li></ul>
<h4>Університети</h4>
<ul><li>Перші університети в Європі з’явилися у XII–XIII ст.</li>
<li><b>1632 р.</b> — Київська колегія, названа на честь засновника <b>Петра Могили</b> Києво-Могилянською (згодом — академія).</li>
<li><b>1661 р.</b> — у Львові почав діяти один із найстаріших університетів України (нині ЛНУ імені Івана Франка).</li>
<li><b>1805 р.</b> — перший університет Наддніпрянщини в Харкові, заснований з ініціативи <b>Василя Каразіна</b>; нині носить його ім’я.</li></ul>
<h4>Наука</h4>
<p>Наука постала зі спостережень за довкіллям. У середньовіччі з’явилися фарфор, порох, навігаційні прилади; у XVIII–XIX ст. люди пізнали силу пари й електрики, створили фотографію й кінематограф; згодом — радіо, антибіотики, вакцини, комп’ютери, мобільні телефони, роботів.</p>
<p>Українські вчені: <b>Федір Піроцький</b> розробив передачу електроенергії й схему електричного трамвая (перший трамвай поїхав у Берліні 1881 р.); <b>Валентина Радзимовська</b> заснувала українську школу фізіологів і біохіміків; <b>Микола Амосов</b> — видатний кардіохірург, провів понад 6 тисяч операцій на серці.</p>
<p>Технічний прогрес не зупинити: він змінює всі сфери життя людей.</p>`,

// 26 §23 Дозвілля, спорт, подорожі, міграції
{info:`<h4>Дозвілля</h4>
<p><b>Дозвілля</b> — заняття людини у вільний від роботи чи навчання час залежно від уподобань, настрою і потреб. У давніх мешканців України багато свят припадало на пізню осінь, зиму й ранню весну, коли селяни відпочивали від праці; свята супроводжували музика, танці, спів, ігри. Згодом з’явилися читання, театр, концерти, кіно, музеї, а також спеціальні заклади — бібліотеки, спортивні клуби, кінотеатри.</p>
<h4>Спорт</h4>
<p>Люди винайшли лук і стріли, човен, лижі, навчилися плавати й метати спис, а згодом почали змагатися у вправності. Найвідоміші змагання — <b>Олімпійські ігри</b>, започатковані в Античній Греції й відроджені наприкінці ХІХ ст. (1896 р.). На початку ХХ ст. ухвалили олімпійську емблему — <b>5 кілець</b> (єдність людей різних континентів) і прапор; олімпійський вогонь запалюють у Греції від променів сонця. Від 1992 р. проводять <b>Паралімпійські ігри</b> («пара» — «поруч»), у яких беруть участь люди з інвалідністю.</p>
<p>Українські спортсмени: 1952 р. — участь у складі збірної СРСР; <b>1994 р.</b> (Ліллегаммер) — перший виступ України окремою збірною; 1996 р. (Атланта) — перша участь у Паралімпійських іграх. Жан Беленюк — олімпійський чемпіон у Токіо.</p>
<h4>Подорожі та міграції</h4>
<ul><li><b>Подорож</b> — пересування за межами своєї місцевості для пізнання, відпочинку, торгівлі. Мандрували купці, паломники (до святих місць), студенти.</li>
<li><b>Міграція</b> — переїзд з місця постійного проживання до іншої місцевості чи держави, що часто змінює спосіб життя. Бувають і <b>примусові</b> міграції: 1944 р. радянська влада виселила з Криму <b>кримських татар</b> та інші народи; після війни виселяли жителів Західної України. Найвразливіші мігранти сучасності — діти, які рятуються від війн.</li></ul>
<p><b>Українська діаспора</b> — українська спільнота поза межами України, що відчуває духовний зв’язок з нею: майже 15 млн людей у понад ста країнах. Про це свідчать назви міст (Одеса в Канаді, США, Бразилії; Мазеппа в США й Канаді) і пам’ятники — Тарасу Шевченку у Вашингтоні, Лесі Українці в Торонто.</p>`,

// 27 §24 Доброчинність і волонтерство
{info:`<h4>Доброчинність</h4>
<p><b>Доброчинність (благодійність)</b> — надання безоплатної допомоги тим, хто її потребує. Люди допомагають добровільно й самі обирають, коли і кому допомагати.</p>
<p>У ХХ–ХХІ ст. доброчинність поширилася в усьому світі: принцеса <b>Діана</b> («королева людських сердець») створила сотні благодійних фондів; засновник Microsoft <b>Білл Гейтс</b> 2010 р. став одним з ініціаторів кампанії «Присяга дарування» — віддати щонайменше половину статків на благодійність. В Україні діє багато фондів, що допомагають родинам воїнів, ветеранам, хворим, дітям, тваринам.</p>
<h4>Доброчинність в історії України</h4>
<p>На українських землях доброчинність поширювалася з утвердженням <b>християнства</b>: церква утримувала лікарні, <b>богадільні</b> (притулки для убогих і старих), опікувалася освітою. У середньовіччі осередками благодійності були церкви, монастирі, братства. З ХІХ ст. до неї активно долучалися підприємці, засновуючи притулки, читальні, ясла, лікарні, школи.</p>
<ul><li><b>Галшка Гулевичівна</b> — благодійниця, фундаторка (засновниця) Київського братства й школи, з яких виросла Києво-Могилянська академія: подарувала для них свою садибу.</li>
<li><b>Василь Симиренко</b> (1835–1915) — підприємець і <b>меценат</b> (людина, що безкорисливо підтримує мистецтво й освіту): віддавав 10 % прибутків на українську культуру, фінансував видання «Кобзаря», газет, творів письменників; заповів свій статок Товариству допомоги українській літературі, мистецтву й науці. Допомагав здебільшого анонімно.</li></ul>
<h4>Волонтерство</h4>
<p>У XVIII–XIX ст. волонтерами називали солдатів-добровольців. Нині <b>волонтерство</b> — добровільна безкорислива діяльність без винагороди. <b>Волонтер</b> (від лат. <i>voluntarius</i> — «воля, бажання») — людина, яка за власним бажанням допомагає іншим. На початку ХХІ ст. у світі було понад 100 млн волонтерів.</p>
<p>В Україні волонтерський рух поширився з <b>Революцією Гідності</b> й початком війни на сході: волонтери забезпечують військових одягом, технікою, транспортом, а також допомагають тваринам, громадам, очищують річки й ліси. <b>5 грудня</b> — Міжнародний день волонтерів.</p>`,

// 29 §25 Полікультурний світ
{info:`<p><b>Полікультурність (багатокультурність)</b> — співіснування на одній території людських спільнот, різних за етнічними, релігійними, культурними та іншими ознаками, зумовлене особливостями історичного розвитку. Частини слів «полі-» і «мульти-» означають «багато».</p>
<h4>Як жити в полікультурній державі</h4>
<p>Поруч із нами живуть люди різного етнічного походження, статі й віку, мови, віросповідання, уподобань. Нас об’єднує належність до єдиного суспільства та відповідальність за сьогодення й майбутнє України. Тому важливо бачити спільне і виявляти <b>толерантність</b> — повагу і розуміння розмаїття культур і поглядів. У демократичному суспільстві різноманітність стає <b>ресурсом</b> розвитку, якщо люди сприймають одне одного як партнерів і домовляються про спільні правила.</p>
<h4>Як формувалася полікультурність</h4>
<ul><li>Уже в середньовіччі в Русі-Україні та Королівстві Руському поруч з українцями жили представники інших спільнот. У <b>Львові</b> мешкали вірмени, німці, євреї, татари; кожна спільнота мала свою культуру, церкву й суд.</li>
<li>У <b>Києво-Могилянській академії</b> навчалися українці, білоруси, серби, румуни, греки та ін.</li>
<li>Нині переважну більшість населення України (77,8 % за переписом 2001 р.) становлять <b>українці</b>; живуть також росіяни, білоруси, молдовани, <b>кримські татари</b>, поляки, болгари, угорці, греки, євреї та ін.</li></ul>
<p>Культура України — мозаїка пам’яток різних народів: вірменська церква в Харкові, костел у Кам’янці-Подільському з мінаретом, Дні польської культури в Івано-Франківську, виставки кримськотатарської культури.</p>
<h4>Рівність усіх людей</h4>
<p><b>Загальна декларація прав людини</b> (ООН, 1948), ст. 1: «Всі люди народжуються вільними і рівними у своїй гідності та правах». <b>Конституція України</b>, ст. 24: громадяни мають рівні права і свободи; не може бути привілеїв чи обмежень за ознаками раси, кольору шкіри, переконань, статі, етнічного походження, мовними та іншими ознаками.</p>`,

// 30 §26 Замки, фортеці та палаци
{info:`<h4>Що таке замки, фортеці, палаци</h4>
<ul><li><b>Замок</b> поєднував оборонні та житлові будівлі. Зазвичай його обносили <b>муром</b> із зубцями та <b>бійницями</b> (вузькими отворами для гармат і рушниць), за муром були <b>рови з водою</b>, перед воротами — <b>підйомний міст</b> на канатах чи ланцюгах.</li>
<li><b>Фортеця</b> (від лат. «сильний, міцний») — укріплена зовнішніми валами й ровами споруда військово-оборонного призначення.</li>
<li><b>Палац</b> — велика парадна споруда, де жили правителі, знатні й багаті люди.</li></ul>
<p>В Україні збереглося не так багато старовинних замків, як у Європі; нині їх реставрують. Приклад — замок <b>Паланок</b> у Мукачеві (будувався з ХІ до XVII ст.).</p>
<h4>Генуезька фортеця (Судак, Крим)</h4>
<p>Місто <b>Судак</b> («чистий», «святий») постало на перехресті торговельних шляхів і стало великим портом: тут торгували вірмени, греки, італійці, слов’яни, татари. Найбільші укріплення звели вихідці з італійського міста <b>Генуя</b>, які володіли містом у XIV–XV ст., — звідси назва.</p>
<h4>Кам’янець-Подільська фортеця</h4>
<p>Розташована на високих скелястих берегах річки <b>Смотрич</b>; із містом її з’єднує вузька скеля з <b>«Турецьким мостом»</b>. Укріплення існувало ще за часів Русі-України; у XIV–XV ст. на пожертви містян і церкви звели <b>11 башт</b>. Нині — шедевр оборонної архітектури й популярне туристичне місце.</p>
<h4>Бахчисарайський (Ханський) палац</h4>
<p>У XVI ст. столицею Кримського ханства стало місто <b>Бахчисарай</b> — у перекладі з кримськотатарської «палац у саду». Протягом двох століть тут будували палац для ханів; поруч — велика мечеть. Відомий <b>«Фонтан сліз»</b>. Це єдина у світі пам’ятка кримськотатарської палацової архітектури світового значення.</p>
<h4>Маріїнський палац (Київ)</h4>
<p>Зведений у XVIII ст. за проєктом італійського архітектора <b>Бартоломео Растреллі</b>. Пишний фасад, ажурні ліплені наличники, розкішне оздоблення. Нині — місце урочистих державних подій.</p>`,

// 31 §27 Релігії і храми України
{info:`<p><b>Релігія</b> — віра і поклоніння людини Богу (богам) та пов’язані з цим уявлення про світ і цінності; передбачає дотримання певних обрядів і правил життя.</p>
<h4>Релігії в Україні в минулому й тепер</h4>
<ul><li><b>Язичництво (багатобожжя)</b> — одна з найдавніших форм релігії: віра в багатьох богів, що керують явищами природи.</li>
<li>У <b>І ст.</b> виникло <b>християнство</b>, яке стало основною релігією Європи. <b>988 р.</b> князь <b>Володимир Великий</b> запровадив християнство в Русі-Україні.</li>
<li>З <b>1596 р.</b> на українських землях існує <b>греко-католицька церква</b>.</li>
<li><b>Світові релігії</b>: буддизм, християнство (православ’я, католицизм, протестантизм), іслам.</li></ul>
<p>Більшість вірян в Україні — християни. Поруч жили християни, мусульмани, іудеї; мирні часи змінювалися протистоянням, але люди поступово усвідомили важливість толерантності. Конституція України: <i>«Кожен має право на свободу світогляду і віросповідання… сповідувати будь-яку релігію або не сповідувати ніякої»</i>.</p>
<h4>Софійський собор у Києві</h4>
<ul><li>Зведений за князя <b>Ярослава Мудрого</b> у першій половині ХІ ст. і присвячений Софії — Премудрості Божій.</li>
<li>Ярослав започаткував тут майстерню для переписування книг і першу бібліотеку (понад 900 томів), діяла школа.</li>
<li>Собор увінчують <b>13 куполів (бань)</b> — символ Ісуса Христа і дванадцяти апостолів.</li>
<li>У центрі — мозаїка <b>Богоматері Оранти</b> («молюся»), яку в народі називають <b>«Непорушна стіна»</b>.</li>
<li>Збереглися <b>фрески</b> (розпис на вологій штукатурці), зокрема «Родина Ярослава Мудрого».</li>
<li>Внесений до <b>Списку всесвітньої спадщини ЮНЕСКО</b>.</li></ul>

// 32 §28 Заповідники
{info:`<p><b>Заповідники</b> — унікальні пам’ятки живої і неживої природи, історії і культури, створені з науковою метою для збереження культурної спадщини та видів тварин і рослин, що перебувають під охороною держави.</p>
<h4>Природні та історико-культурні</h4>
<ul><li><b>Природні заповідники</b> — ділянки суші й води, де охороняють і досліджують рослини й тварин (багато з них — у Червоній книзі України). Будь-яка шкідлива діяльність людини тут заборонена. Є також <b>національні природні парки</b> для відпочинку серед природи. Приклади: Карпатський заповідник, Кінбурнська коса.</li>
<li><b>Історико-культурні заповідники</b> — території з комплексами пам’яток історії та культури: «Херсонес Таврійський», «Гетьманська столиця» (Батурин), «Хортиця». До <b>Списку всесвітньої спадщини ЮНЕСКО</b> внесено «Софію Київську» та Києво-Печерський заповідник (Лавру).</li></ul>
<p>Під заповідники та нацпарки в Україні відведено 6,3 % площі (у США — близько 18 %, у Швейцарії — 20 %).</p>
<h4>«Софіївка» в Умані</h4>
<p>Одна з найвидатніших пам’яток паркового мистецтва України. Заснував парк граф <b>Станіслав Потоцький</b> наприкінці XVIII ст. на честь дружини — грекині <b>Софії</b>. На горбкуватому місці з гранітними брилами створили дивовижне поєднання садово-паркового мистецтва й інженерної думки: підземна річка, якою можна пропливти човном, ставки, гроти, альтанки, фонтани, скульптури давньогрецьких богів і поетів — усе нагадує <b>Грецію</b>. Нині це Національний дендрологічний парк.</p>
<h4>«Качанівка» на Чернігівщині</h4>
<p>Палацово-парковий комплекс кінця XVIII — початку ХХ ст., що на початку ХІХ ст. перейшов до родини <b>Тарновських</b>. Сюди приїжджали Тарас Шевченко, Марко Вовчок, Пантелеймон Куліш, Ілля Рєпін. Тут зібрали твори мистецтва, діяла майстерня вишивальниць. Це єдина садиба в Україні, що збереглася в поєднанні паркової та архітектурної частин.</p>
<p><b>Василь Тарновський (молодший)</b> — колекціонер і меценат: зібрав 758 малюнків і рукописів Шевченка, упорядковував могилу поета в Каневі, власним коштом створив Київську громадську бібліотеку, заповів колекцію Чернігову (основа Чернігівського історичного музею).</p>`,
terms:[["Заповідник","охоронювана державою територія для збереження природи чи пам’яток"],["Природний заповідник","територія для охорони й дослідження рослин і тварин"],["Історико-культурний заповідник","територія з комплексом пам’яток історії та культури"],["Дендрологічний парк","парк із колекцією деревних рослин"],["Меценат","людина, що безкорисливо підтримує мистецтво й освіту"]],

["Як називають співіснування різних культур на одній території?",["Полікультурність","Глобалізація","Монархія","Колективізація"],0],
["Яка наука вивчає географічні назви?",["Топоніміка","Етнографія","Археологія","Хронологія"],0]]}
);


const LESSONS = META.map((m,i)=>Object.assign({}, m, L[i]||{}));

const SEC_STYLE = [
  {c:"#ef8a00", i:"🧑‍🤝‍🧑", d:"📜👪🏘️🤝✨"},
  {c:"#3a6fd8", i:"⏳", d:"🗺️🧭📅🌍⌛"},
  {c:"#8a5a2b", i:"📚", d:"🏺📜🖼️🏛️🔎"},
  {c:"#c0392b", i:"🇺🇦", d:"👑⚔️🕊️🌾🏛️"},
  {c:"#2e8b57", i:"🏡", d:"💰🏙️🎓⚽🤲"},
  {c:"#7b4fd6", i:"🏰", d:"⛪🕌🌳🎨🌈"}
];

const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let done = store.get("ih5_done")||{};

const SECTIONS = [];
LESSONS.forEach((l,i)=>{ let s=SECTIONS[SECTIONS.length-1]; if(s&&s.name!==l.section) s=null; if(!s){s={name:l.section,items:[],st:SEC_STYLE[SECTIONS.length%SEC_STYLE.length]};const m=/^Розділ\s+([IVXІ\d]+)\.\s*(.*)$/.exec(l.section); s.lab=m?m[1].replace(/І/g,'I'):''; s.short=m?m[2]:(/^Вступ\.\s*/.test(l.section)?l.section.replace(/^Вступ\.\s*/,''):l.section); SECTIONS.push(s)} s.items.push(i); l.sec=s; l.tnum=s.items.length; });

function firstPage(p){const m=/(\d+)/.exec(p||"");return m?+m[1]:0;}
function qWord(n){const a=n%10,b=n%100; if(a===1&&b!==11) return "запитання"; if(a>=2&&a<=4&&(b<10||b>=20)) return "запитання"; return "запитань";}
function meta(l){ const q=(l.q||[]).length; return q+" "+qWord(q); }
function themeBtn(){ return `<button class="btn icon-btn" onclick="toggleTheme()" title="Світла / темна тема">🌓</button>`; }

function renderHome(){
  const total=LESSONS.length, dn=Object.keys(done).length;
  $("#app").innerHTML = `
  <div class="hero">
    <div>
      <div class="kick">Ліцей «Ясно» · 5 клас</div>
      <h1>Досліджуємо історію і суспільство</h1>
      <p>Уроки за календарно-тематичним плануванням: основний теоретичний матеріал з параграфа підручника, ключові поняття й тест для самоперевірки.</p>
      <div class="stats"><span><b>${SECTIONS.length}</b> розділів</span><span><b>${total}</b> тем</span><span><b>${dn}</b> пройдено</span></div>
    </div>
    <div class="hero-actions"><a class="btn" href="index.html">← Усі предмети</a>${themeBtn()}</div>
  </div>
  ${SECTIONS.map((s,si)=>`
  <section class="sec" style="--c:${s.st.c}">
    <div class="sec-h"><div class="num">${s.lab||"★"}</div><h2>${esc(s.short)}</h2></div>
    <div class="sec-body">
      <div class="cover"><div class="ci">${s.st.i}</div><div><div class="rz">${s.lab?"РОЗДІЛ "+s.lab:"ВСТУП"}</div><div class="rn">${esc(s.short)}</div></div><div class="doodles">${[...s.st.d].join("")}</div></div>
      <div class="cards">${s.items.map(i=>{const l=LESSONS[i];return `
        <a class="tcard" href="#${i+1}">${done[i+1]?'<span class="chk">✓</span>':""}
          <div class="tn">Тема ${l.tnum}${l.diag?'<span class="badge">тренувальна</span>':""}</div>
          <div class="tt">${esc(l.title)}</div>
          <div class="tm">${meta(l)}</div>
        </a>`}).join("")}</div>
    </div>
  </section>`).join("")}`;
  document.title="Досліджуємо історію і суспільство · 5 клас";
}

function shuffle(a,seed){ const r=a.slice(); let s=seed; for(let i=r.length-1;i>0;i--){ s=(s*9301+49297)%233280; const j=Math.floor(s/233280*(i+1)); [r[i],r[j]]=[r[j],r[i]] } return r; }

function renderLesson(i){
  const l=LESSONS[i], n=i+1, s=l.sec, si=SECTIONS.indexOf(s);
  const chips = `<span class="chip c">${s.lab?"Розділ "+s.lab:"Вступ"}</span>`+(l.codes?l.codes.split(/,\s*/).map(c=>`<span class="chip">${esc(c)}</span>`).join(""):"")+(l.diag?'<span class="chip c">Тренувальна діагностувальна робота</span>':"")+`<span class="chip">${(l.q||[]).length} ${qWord((l.q||[]).length)}</span>`;
  const ktp = l.ktp ? `<div class="ktp"><b>За КТП:</b> ${esc(l.ktp)}</div>` : "";
  const terms = (l.terms&&l.terms.length) ? `<div class="box"><h3><span class="bi">✎</span>Ключові поняття</h3>${l.terms.map(t=>`<div class="term"><b>${esc(t[0])}</b> — ${esc(t[1])}</div>`).join("")}</div>` : "";
  const w = W[WORK_OF[n]];
  const work = w ? `<div class="box work"><h3><span class="bi">📖</span>Про твір: ${esc(w.name)}</h3>
      <div class="wmeta"><span>✍ ${esc(w.author)}</span><span>◆ ${esc(w.genre)}</span></div>
      <h4>Про що твір</h4><p>${esc(w.about)}</p>
      <h4>${esc(w.plotTitle||"Короткий сюжет")}</h4><ol class="plot">${w.plot.map(p=>`<li>${esc(p)}</li>`).join("")}</ol>
      <h4>${w.poem?"Ліричний герой":"Головні герої"}</h4><div class="heroes">${w.heroes.map(h=>`<div class="hero-c"><b>${esc(h[0])}</b><span>${esc(h[1])}</span></div>`).join("")}</div>
    </div>` : "";
  const workSide = w ? `<div class="box"><h3><span class="bi">✍</span>Твір уроку</h3><div style="font:700 18px Montserrat,sans-serif;line-height:1.3">${esc(w.name)}</div><div class="small" style="margin-top:4px">${esc(w.author)}</div><div class="small">${esc(w.genre)}</div><a class="btn" style="margin-top:14px" href="#work" onclick="document.querySelector('.work').scrollIntoView({behavior:'smooth'});return false">Сюжет і герої ↓</a></div>` : "";
  const qs=(l.q||[]).map((q,qi)=>{const order=shuffle(q[1].map((_,k)=>k),n*31+qi*7+3);
    return `<div class="qst" data-c="${q[2]}"><div class="qt">${qi+1}. ${esc(q[0])}</div>`+order.map(k=>`<label class="opt" data-k="${k}"><input type="radio" name="q${qi}" value="${k}"><span>${esc(q[1][k])}</span></label>`).join("")+`</div>`}).join("");
  const hw = "";
  const pl=i>0?LESSONS[i-1]:null, nl=i<LESSONS.length-1?LESSONS[i+1]:null;
  const navA=(x,k,cls)=>x?`<a class="${cls}" href="#${k}" style="--c:${x.sec.st.c}"><div class="tn">${cls==="next"?"Далі →":"← Назад"} · Тема ${x.tnum}</div><div class="t">${esc(x.title)}</div></a>`:"";

  $("#app").innerHTML = `<div style="--c:${s.st.c}">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><a class="back" href="#">← Усі розділи</a>${themeBtn()}</div>
    <div class="lhead"><div class="num">${s.lab||"★"}</div><div>
      <div class="tn">${esc(s.name)} · Тема ${l.tnum}</div>
      <h1>${esc(l.title)}</h1><div class="chips">${chips}</div></div></div>
    ${l.diag?`<div class="train"><div class="ti">📝</div><div><b>Це тренувальна діагностувальна робота.</b><br>Виконайте завдання, щоб підготуватися до діагностувальної роботи. Ці завдання не на оцінку.</div></div>`:""}
    <div class="lgrid"${w?"":' style="grid-template-columns:1fr"'}>
      <div>
        <div class="box"><h3><span class="bi">✦</span>Основна інформація</h3>${ktp}${l.info||""}</div>
        ${work}
        ${terms}
        <div class="box" id="test"><h3><span class="bi">✓</span>${l.diag?"Тренувальні тестові завдання":"Тест для самоперевірки"}</h3>${qs}
          <div class="actions"><button class="btn fill" id="check">Перевірити</button><button class="btn" id="reset">Спробувати ще раз</button></div>
          <div class="result" id="res"></div></div>
        ${hw}
      </div>
      <div class="side">
        ${workSide}
      </div>
    </div>
    <div class="nav">${navA(pl,n-1,"prev")}${navA(nl,n+1,"next")}</div></div>`;

  $("#check").onclick=()=>{let ok=0;const all=document.querySelectorAll(".qst");
    all.forEach(q=>{const c=q.dataset.c,sel=q.querySelector("input:checked");
      q.querySelectorAll(".opt").forEach(o=>{o.classList.remove("right","wrong");if(o.dataset.k===c)o.classList.add("right")});
      if(sel){if(sel.value===c)ok++;else sel.closest(".opt").classList.add("wrong");}});
    const r=$("#res"),p=ok/all.length;r.className="result show "+(p>=.75?"good":"mid");
    r.textContent=`Правильних відповідей: ${ok} з ${all.length}. `+(p===1?"Чудово!":p>=.75?"Добре! Перегляньте позначені питання.":"Перечитайте основну інформацію й спробуйте ще раз.");
    if(p>=.75){done[n]=true;store.set("ih5_done",done);}};
  $("#reset").onclick=()=>{document.querySelectorAll(".qst input").forEach(x=>x.checked=false);document.querySelectorAll(".opt").forEach(o=>o.classList.remove("right","wrong"));$("#res").className="result";};
  document.title=`${l.title} · Історія і суспільство 5`;
}

function route(){ const n=parseInt(location.hash.slice(1)); if(n>=1&&n<=LESSONS.length) renderLesson(n-1); else renderHome(); window.scrollTo(0,0); }
function toggleTheme(){ const d=document.documentElement; const dark=d.dataset.theme?d.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches; d.dataset.theme=dark?"light":"dark"; store.set("ih5_theme",d.dataset.theme); }
const th=store.get("ih5_theme"); if(th) document.documentElement.dataset.theme=th;
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
