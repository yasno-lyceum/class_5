<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Фізична культура · 5 клас</title>
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Manrope:wght@500;600;700&display=swap">
<style>
/* Layout: класний «підручник» — бічний зміст розділів зліва, колонка читання ~68 знаків справа, тест вбудований наприкінці кожного уроку */
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --sunk:#EAEEF4; --ink:#152030; --muted:#566275; --line:#D9DFE8;
  --accent:#1F4E79; --accent-soft:#E3ECF6; --copper:#B4521A; --copper-soft:#FBEDE3;
  --ok:#23703A; --ok-soft:#E3F2E7; --bad:#B42323; --bad-soft:#FBE6E6;
  --s-art:#8A3866; --s-zu:#56652A; --s-pe:#0F766E; --s-tech:#B4441C;
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-body:"Literata",Georgia,"Times New Roman",serif;
  --f-ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E141C; --surface:#151D28; --sunk:#1B2532; --ink:#E5EAF1; --muted:#9AA6B7; --line:#2A3546;
  --accent:#86B5E3; --accent-soft:#1C2D42; --copper:#E8925A; --copper-soft:#332317;
  --ok:#72C58A; --ok-soft:#173022; --bad:#F08383; --bad-soft:#3A1C1C;
  --s-art:#D88BB6; --s-zu:#B4C27A; --s-pe:#5CC9BE; --s-tech:#F0956B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141C; --surface:#151D28; --sunk:#1B2532; --ink:#E5EAF1; --muted:#9AA6B7; --line:#2A3546;
  --accent:#86B5E3; --accent-soft:#1C2D42; --copper:#E8925A; --copper-soft:#332317;
  --ok:#72C58A; --ok-soft:#173022; --bad:#F08383; --bad-soft:#3A1C1C;
  --s-art:#D88BB6; --s-zu:#B4C27A; --s-pe:#5CC9BE; --s-tech:#F0956B; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:34px;height:34px;border-radius:8px;display:block}
.brand b{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.01em}
.brand span{display:block;font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px;margin-left:auto;flex-wrap:wrap}
.tab{text-decoration:none;border:0;background:transparent;padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:7px}
.tab i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.back{margin-left:auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:600;text-decoration:none;font-size:14px}
.back:hover{border-color:var(--accent)}
.toc-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;cursor:pointer}

.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:20px 60px;display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;align-items:start}
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 90px);overflow:auto;padding-right:4px}
.prog{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.prog .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--sunk);border-radius:6px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--subj);border-radius:6px;transition:width .3s}
.search{width:100%;padding:9px 12px;border:1px solid var(--line);background:var(--surface);border-radius:8px;margin-bottom:12px}
.theme{margin-bottom:14px}
.theme h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 6px;font-weight:700;line-height:1.35}
.les{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:13.5px;line-height:1.35}
.les:hover{background:var(--sunk)}
.les[aria-current="true"]{background:var(--accent-soft);color:var(--ink)}
.les .no{flex:0 0 auto;min-width:30px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;padding-top:1px}
.les .tt{flex:1;min-width:0}
.les .st{flex:0 0 auto;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;padding:1px 6px;border-radius:999px}
.st.done{background:var(--ok-soft);color:var(--ok)}
.st.part{background:var(--copper-soft);color:var(--copper)}
.empty{color:var(--muted);font-size:13px;padding:8px}

main{min-width:0}
article{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(20px,4vw,44px)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--subj)}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(22px,3.2vw,30px);line-height:1.2;margin:8px 0 14px;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
a.chip{color:var(--accent);text-decoration:none}
a.chip:hover{text-decoration:underline}
.chip{font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);font-weight:600}
.goal{background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;font-family:var(--f-body);font-size:16px;line-height:1.55;max-width:68ch}
.goal b{font-family:var(--f-ui);color:var(--accent);margin-right:6px}
h2{font-family:var(--f-display);font-weight:500;font-size:17px;margin:30px 0 12px;color:var(--accent);display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
.prose{font-family:var(--f-body);font-size:16.5px;line-height:1.65;max-width:68ch}
.prose h4{font-family:var(--f-ui);font-size:15px;font-weight:700;margin:20px 0 6px}
.prose p{margin:0 0 10px;text-indent:1.4em}
.prose ul,.prose ol{margin:0 0 12px;padding-left:1.3em}
.prose li{margin-bottom:5px}
.terms{display:grid;grid-template-columns:minmax(120px,30%) 1fr;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;max-width:76ch}
.terms dt,.terms dd{margin:0;padding:9px 12px;border-top:1px solid var(--line)}
.terms dt:first-of-type,.terms dt:first-of-type+dd{border-top:0}
.terms dt{font-weight:700;background:var(--sunk);font-size:14px}
.terms dd{font-family:var(--f-body);font-size:15px}
.fact{margin-top:20px;background:var(--copper-soft);border-radius:var(--r);padding:14px 16px;max-width:68ch;font-family:var(--f-body);font-size:15.5px}
.fact b{display:block;font-family:var(--f-ui);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--copper);margin-bottom:4px}
.prose .lead{text-indent:0;font-size:17.5px}
.prose h3{font-family:var(--f-ui);font-size:16px;font-weight:700;margin:22px 0 8px}
.prose h2x{display:block}
.prose li b{font-family:var(--f-ui);font-size:.95em}
.call{background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;margin:14px 0;max-width:68ch}
.fig{margin:14px 0 18px;max-width:68ch}
.fig img,.cardx img{display:block;width:100%;height:auto;border-radius:10px;background:var(--sunk);cursor:zoom-in}
.cardsx{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin:12px 0 20px}
.cardx{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);min-width:0}
.cardx img{aspect-ratio:16/10;object-fit:cover;border-radius:0}
.cardx div{padding:10px 12px 12px;font-family:var(--f-body);font-size:14.5px}
.cardx h4{margin:0 0 4px;font-family:var(--f-ui);font-size:15px}
.cardx p{margin:0 0 6px;text-indent:0}
.cardx p b{display:block;font-family:var(--f-ui);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--subj)}
.prose .tgrid{padding-left:0}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin:8px 0 16px;padding:0;list-style:none}
.tgrid li{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14.5px;background:var(--surface);margin:0}
.tgrid li b{display:block;color:var(--subj);font-family:var(--f-ui)}
.steps{counter-reset:st;list-style:none;padding:0!important;display:grid;gap:8px}
.steps li{counter-increment:st;position:relative;padding:10px 12px 10px 46px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin:0}
.steps li::before{content:counter(st);position:absolute;left:12px;top:10px;width:24px;height:24px;border-radius:7px;background:var(--accent-soft);color:var(--accent);font:700 13px/24px var(--f-ui);text-align:center}
.steps li b{display:block;font-family:var(--f-ui)}
.lb{position:fixed;inset:0;z-index:50;background:rgba(8,10,14,.86);display:grid;place-items:center;padding:20px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;border-radius:8px}
.tasks li::marker{content:"✎  ";color:var(--copper)}

.quiz{margin-top:34px;border:1.5px solid var(--subj);border-radius:14px;padding:clamp(16px,3vw,26px);background:var(--bg)}
.qhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;justify-content:space-between}
.qhead h2{margin:0;color:var(--ink)}
.qhead h2::after{display:none}
.qhead p{margin:0;color:var(--muted);font-size:13px}
.q{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line)}
.q:first-of-type{border-top:0}
.q .qt{font-weight:700;margin-bottom:10px;display:flex;gap:8px}
.q .qt span{color:var(--subj);font-variant-numeric:tabular-nums;flex:0 0 auto}
.q .qt div{min-width:0}
.q .qt em{font-family:var(--f-body);font-weight:400}
.opts{display:grid;gap:7px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);background:var(--surface);border-radius:9px;cursor:pointer;font-family:var(--f-body);font-size:15px;line-height:1.45}
.opt:hover{border-color:var(--accent)}
.opt input{margin-top:4px;accent-color:var(--accent);flex:0 0 auto}
.opt span{min-width:0}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.checked .opt{cursor:default}
.qfoot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:20px}
.btn{border:0;border-radius:999px;padding:10px 20px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--surface)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.why{margin:8px 0 0;font-size:14px;color:var(--muted);font-family:var(--f-body)}
.score{font-weight:700;font-variant-numeric:tabular-nums}
.score.good{color:var(--ok)} .score.mid{color:var(--copper)} .score.low{color:var(--bad)}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:18px;flex-wrap:wrap}
.pager button{max-width:48%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;cursor:pointer;font-size:13px;color:var(--muted)}
.pager button b{display:block;color:var(--ink);font-size:14px}
.pager button:last-child{text-align:right;margin-left:auto}

@media (max-width:880px){
  .back{padding:6px 10px;font-size:13px}
  .wrap{grid-template-columns:minmax(0,1fr)}
  aside{position:static;max-height:none;display:none}
  aside.open{display:block}
  .back{margin-left:auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:600;text-decoration:none;font-size:14px}
.back:hover{border-color:var(--accent)}
.toc-btn{display:inline-block}
  .tabs{margin-left:0;order:3;width:100%;justify-content:space-between}
  .tabs{display:grid;grid-template-columns:1fr 1fr;border-radius:14px}
  .tab:last-child:nth-child(odd){grid-column:1/-1}
  .tab{flex:1 1 auto;justify-content:center;padding:7px 6px;font-size:12.5px;gap:5px;white-space:nowrap}
  .terms{grid-template-columns:1fr}
  .terms dt{border-top:1px solid var(--line)}
  .terms dd{border-top:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const DATA = [{"id": "fk5", "name": "Фізична культура · 5 клас", "short": "Фізкультура 5", "themes": [{"name": "І чверть. Рухливі ігри, футбол, панна", "lessons": [{"n": "1", "t": "Знайомство з модулями року, історія рухливих ігор, безпека у футболі та гігієна", "g": "Учень дізнається, які модулі вивчатиме цього року, звідки походять рухливі ігри в Україні, як безпечно займатися футболом і як дотримуватися гігієни на заняттях.", "k": "Модулі: Рухливі ігри · Футбол · Панна", "terms": [["Рухлива гра", "гра з активними рухами та простими правилами, у якій гравці змагаються або співпрацюють заради спільної мети."], ["ІБЖ", "інструктаж з безпеки життєдіяльності — пояснення правил, які допомагають уникнути травм на уроці."], ["ЗРВ", "загальнорозвивальні вправи — прості рухи для розминки всіх груп м’язів перед основною частиною уроку."], ["Модуль", "окремий розділ навчальної програми з фізичної культури, присвячений одному виду спорту чи рухової діяльності."], ["Особиста гігієна", "щоденні звички догляду за тілом, одягом і взуттям, які зберігають здоров’я."]], "th": [{"h": "Рухливі ігри. Передумови та історія розвитку рухливих ігор в Україні", "p": ["Цього року на уроках фізичної культури ти познайомишся з кількома модулями: рухливими іграми, футболом, панною, гімнастикою, аеробікою та чирлідингом. Кожен модуль розвиває різні якості — швидкість, спритність, силу, гнучкість, відчуття ритму та вміння працювати в команді.", "Рухливі ігри існують дуже давно. Діти й дорослі в різних куточках України гралися на святах, після роботи в полі, на вулицях і подвір’ях. Ігри передавалися від старших до молодших, тому в кожному регіоні є свої улюблені забави з різними назвами, лічилками та правилами."], "ul": ["Рухливі ігри навчали дітей бути спритними, уважними та чесними.", "Багато ігор пов’язані з народними святами, порами року, працею людей.", "Одна й та сама гра в різних регіонах може мати різні назви та правила.", "Народні ігри — частина української культури, яку варто зберігати."]}, {"h": "Футбол. Правила техніки безпеки на уроках футболу", "p": ["Футбол — командна гра, у якій потрібно забити м’яч у ворота суперника, граючи переважно ногами. Щоб гра приносила радість, а не травми, треба знати правила безпеки.", "Перед грою обов’язково роби розминку (ЗРВ): розігріті м’язи та суглоби менше травмуються. Під час гри дій чесно і стеж за тим, що відбувається довкола."], "ul": ["Займайся у спортивній формі та зручному взутті з нековзною підошвою.", "Зніми годинник, прикраси, вийми з кишень тверді предмети.", "Не штовхай суперника, не став підніжок, не бий по ногах.", "Не підходь до воріт, у які б’ють по м’ячу.", "Почувся погано або травмувався — одразу скажи вчителеві."]}, {"h": "Панна. Правила гігієни та санітарії під час занять фізичною культурою", "p": ["Панна — вулична гра з м’ячем, схожа на футбол, де гравці змагаються один проти одного на невеликому майданчику. Як і в будь-якому спорті, тут важлива гігієна.", "Гігієна — це не лише чисті руки. Це чистий одяг, правильне взуття, достатньо води та відпочинку. Дотримуючись цих правил, ти краще почуваєшся і рідше хворієш."], "ul": ["Спортивний одяг має бути чистим, зручним і за погодою.", "Після заняття вмийся або прийми душ, перевдягнися в сухий одяг.", "Май власну пляшку з водою, не пий з чужої.", "Не займайся одразу після щільного обіду — зачекай 1–1,5 години.", "Стеж, щоб шкарпетки й взуття були сухими."]}], "f": "У багатьох народних іграх є лічилки — короткі віршики, за допомогою яких чесно обирають ведучого.", "pr": ["Розпитай батьків або бабусю й дідуся, у які рухливі ігри вони гралися в дитинстві. Запиши назву однієї гри та її правила (5–6 речень).", "Склади пам’ятку «Мої 5 правил гігієни на уроці фізкультури» і прикрась її малюнком."], "q": ["Які модулі ти вивчатимеш цього року?", "Чому рухливі ігри вважають частиною народної культури?", "Назви три правила безпеки на уроці футболу.", "Що треба зробити після заняття фізичною культурою?"]}, {"n": "2", "t": "Рухливі ігри та естафети, гра «Довга лоза», безпека у футболі, історія панни", "g": "Учень дізнається, як організовують рухливі ігри та естафети, вивчить правила гри «Довга лоза», повторить правила безпеки у футболі та познайомиться з історією панни.", "k": "Модулі: Рухливі ігри · Футбол · Панна", "terms": [["Естафета", "командне змагання, у якому учасники по черзі виконують завдання і передають естафету наступному гравцеві."], ["Ведучий", "гравець, який у рухливій грі має особливу роль: ловить, наздоганяє або подає команди."], ["Розминка", "підготовка організму до навантаження за допомогою легких вправ."], ["Панна", "прийом, коли гравець прокидає м’яч між ногами суперника, і водночас назва вуличної гри з м’ячем."]], "th": [{"h": "Рухливі ігри. Проведення рухливих ігор та естафет. Гра «Довга лоза»", "p": ["Рухливі ігри — важливий засіб фізичного виховання: вони розвивають швидкість, спритність, витривалість, увагу та вміння дружити. Щоб гра пройшла добре, треба пояснити правила, вибрати ведучого, позначити межі майданчика й домовитися про сигнали.", "«Довга лоза» — давня українська гра з перестрибуванням. Гравці стають один за одним, нахилившись і впершись руками в коліна, а інші по черзі перестрибують через них, спираючись руками на спину. Грають лише під наглядом учителя, на м’якій поверхні."], "ul": ["Перед грою — розминка й пояснення правил.", "Під час естафети чекай своєї черги за лінією старту.", "Передавай естафету (м’яч, паличку) з рук у руки, не кидай її.", "У «Довгій лозі» той, хто стоїть, тримає спину рівно й не рухається.", "Перемагає не лише швидкий, а й той, хто не порушує правил."]}, {"h": "Футбол. Теоретичні відомості: правила техніки безпеки", "p": ["Більшість футбольних травм трапляються через неуважність, поспіх або відсутність розминки. Тому на кожному уроці футболу ми повторюємо правила безпеки.", "Особливо важливо уникати зіткнень: коли кілька гравців біжать до м’яча, треба дивитися, де партнери та суперники, і не стрибати в ноги іншим."], "ul": ["Виконуй вправи лише за сигналом учителя.", "Не бий по м’ячу, якщо перед тобою стоять люди, які не бачать удару.", "Не сідай і не стій біля воріт під час ударів.", "Не хапайся за одяг суперника.", "Пий воду під час перерв, а не на ходу."]}, {"h": "Панна. Історія розвитку гри", "p": ["Панна виникла з вуличного футболу, коли діти грали на маленьких майданчиках один проти одного. Найважливіший прийом — прокинути м’яч між ногами суперника; саме його і називають «панна».", "Сьогодні панна поширена в багатьох країнах, зокрема в Україні. У неї грають на невеликих огороджених майданчиках, проводять турніри серед дітей та молоді. Гра вчить добре володіти м’ячем, швидко думати й бути чесним суперником."], "ul": ["Панна — гра 1 на 1 або в маленьких командах.", "Майданчик невеликий, часто круглий або восьмикутний.", "Головне — техніка володіння м’ячем, а не сила.", "Прийом «панна» вважається особливо красивим.", "Грають без грубощів, з повагою до суперника."]}], "f": "Слово «панна» у вуличному футболі означає прокидання м’яча між ногами суперника.", "pr": ["Опиши правила гри «Довга лоза» своїми словами і намалюй схему, як стоять і рухаються гравці.", "Виконай удома розминку з 6 вправ: нахили голови, оберти плечима, нахили тулуба, оберти в колінах, 10 присідань, кругові рухи стопами."], "q": ["Що таке естафета?", "Як правильно передавати естафету?", "Чому під час гри у футбол не можна стояти біля воріт?", "Що означає слово «панна» у вуличному футболі?"]}, {"n": "3", "t": "Ігри на спритність і увагу, стройові вправи й різновиди ходьби та бігу, гнучкість плечей", "g": "Учень вивчить рухливі ігри для спритності та уваги, згадає стройові вправи й різновиди ходьби та бігу, навчиться вправ на гнучкість плечового пояса.", "k": "Модулі: Рухливі ігри · Футбол · Панна", "terms": [["Спритність", "здатність швидко і точно виконувати рухи та змінювати їх у несподіваній ситуації."], ["Стройові вправи", "дії в строю за командами: шикування, повороти, перешикування."], ["Шеренга", "стрій, у якому учні стоять поруч один з одним на одній лінії."], ["Колона", "стрій, у якому учні стоять один за одним."], ["Гнучкість", "здатність виконувати рухи з великою амплітудою, тобто з великим розмахом."]], "th": [{"h": "Рухливі ігри. Ігри для спритності та уваги: «Клас, струнко!», «Котики», «Потримай м’яч»", "p": ["Ігри на увагу вчать уважно слухати й швидко реагувати. У грі «Клас, струнко!» гравці виконують команду лише тоді, коли перед нею прозвучали слова «Клас, струнко!». Якщо команда без цих слів — виконувати її не можна, а хто помилився, отримує штрафне очко або робить крок назад.", "Ігри на спритність, наприклад «Потримай м’яч», вимагають швидко ловити, передавати і утримувати м’яч, не втрачаючи рівноваги. «Котики» — гра з м’якими, тихими й спритними рухами, як у кота."], "ul": ["Слухай команду до кінця, не поспішай.", "Дивись на м’яч і на партнерів одночасно.", "Рухайся м’яко, на напівзігнутих ногах.", "Не штовхайся, звільняючи собі місце.", "Чесно визнавай свою помилку."]}, {"h": "Футбол. Стройові вправи, різновиди ходьби та бігу", "p": ["На початку кожного уроку клас шикується в шеренгу, виконує повороти на місці та перешикування. Це допомагає організовано почати заняття й навчає дисципліни.", "Перед грою виконують різновиди ходьби (на носках, на п’ятах, у напівприсіді, з високим підніманням стегна) і бігу (з високим підніманням стегна, із закиданням гомілки, приставними кроками боком, спиною вперед). Вони розігрівають м’язи ніг і готують до футбольних рухів."], "ul": ["Команда «Струнко!» — стати рівно, п’яти разом, руки вздовж тулуба.", "«Праворуч!» — поворот на правій п’ятці та лівому носку.", "Під час ходьби на носках тримай спину рівно.", "Біг спиною вперед виконуй повільно і лише на вільному місці.", "Дотримуйся дистанції до того, хто попереду."]}, {"h": "Панна. Стрибкові вправи та вправи для гнучкості плечового пояса", "p": ["Гравцеві панни потрібні легкі, пружні ноги та рухливе тіло. Стрибкові вправи (на двох ногах, з ноги на ногу, через лінію) розвивають силу ніг і швидкість. Їх виконують у залі на м’якому покритті, приземляючись на носки з м’яким згинанням колін.", "Гнучкість плечового пояса допомагає зберігати рівновагу та швидко рухатися. Корисні махи руками, оберти в плечових суглобах, «замок» за спиною, ривки руками."], "ul": ["Оберти плечима вперед і назад по 8 разів.", "Колові рухи прямими руками — повільно, без ривків.", "Потягування рук у «замку» вгору.", "Розтягування виконуй плавно, до легкого натягу, а не до болю.", "Стрибки — лише після розминки та на м’якій поверхні."]}], "f": "Гра «Клас, струнко!» добре тренує здатність не поспішати і слухати уважно — це важливо і в спорті, і в навчанні.", "pr": ["Пограйся з рідними в «Клас, струнко!» вдома: ти — ведучий. Запиши, хто помилився найменше.", "Виконай комплекс для плечей: оберти плечима 8 разів уперед і назад, колові рухи руками 8 разів, потягування у «замку» 3 рази по 10 секунд."], "q": ["Чим шеренга відрізняється від колони?", "Які різновиди бігу ти знаєш?", "Як правильно приземлятися після стрибка?", "Чому розтягування не можна виконувати до болю?"]}, {"n": "4", "t": "Дисципліна в рухливих іграх, передавання й зупинка м’яча, розтягування та спритність", "g": "Учень засвоїть правила безпеки й дисципліни в рухливих іграх, дізнається, як правильно передавати та зупиняти м’яч у футболі, і вивчить вправи на розтягування та швидкість.", "k": "Модулі: Рухливі ігри · Футбол · Панна", "terms": [["Дисципліна", "дотримання правил і вказівок учителя під час заняття."], ["Передача", "спрямування м’яча партнерові ударом ноги."], ["Зупинка м’яча", "прийом, яким гравець гасить швидкість м’яча й залишає його біля себе."], ["Розтягування", "вправи, що поступово збільшують еластичність м’язів і зв’язок."], ["Швидкість", "здатність виконувати рухи за якомога коротший час."]], "th": [{"h": "Рухливі ігри. Правила безпеки та дисципліни на уроці", "p": ["У рухливих іграх діти бігають, змінюють напрямок, ловлять один одного. Якщо не дотримуватися правил, легко зіткнутися або впасти. Тому гра починається і закінчується лише за сигналом учителя.", "Хороший гравець не лише швидкий, а й уважний до інших: допомагає тому, хто впав, не грубить, не сперечається з ведучим."], "ul": ["Починай і зупиняй гру за сигналом (свисток, оплеск).", "Не виходь за межі майданчика.", "Під час бігу дивись уперед, а не лише на ведучого.", "Ловлячи гравця, торкайся легко — не штовхай.", "Якщо хтось упав, зупини гру й поклич учителя."]}, {"h": "Футбол. Навички передавання та зупинок м’яча", "p": ["Найпростіша й найточніша передача виконується внутрішньою частиною стопи. Опорна нога стоїть поруч із м’ячем, носок дивиться в бік партнера. Ударна нога розвернута назовні, удар — серединою внутрішньої частини стопи по центру м’яча.", "Щоб зупинити м’яч, підстав стопу назустріч і в момент дотику трохи відведи її назад — так м’яч «гасить» швидкість і не відскакує."], "ul": ["Перед передачею подивися на партнера.", "Опорна нога — поруч із м’ячем, коліно трохи зігнуте.", "Удар — по центру м’яча, щоб він котився по землі.", "Типова помилка — удар носком: м’яч летить неточно.", "Під час зупинки не напружуй ногу, а ніби «приймай» м’яч."]}, {"h": "Панна. Вправи на розтягування, швидкість і спритність", "p": ["У панні треба швидко рухати ногами, різко змінювати напрям і не втрачати рівноваги. Для цього потрібні еластичні м’язи та добра координація.", "Вправи на розтягування виконують після розминки: випади, нахили до прямих ніг, розтягування задньої та передньої поверхні стегна. Для швидкості та спритності в залі виконують біг із зміною напрямку, «човниковий» біг, ігри з сигналами."], "ul": ["Тримай позу розтягування 15–20 секунд.", "Дихай спокійно, не затримуй дихання.", "Не роби різких пружних рухів.", "Швидкісні вправи — короткі, з відпочинком між повтореннями.", "Після навантаження зроби легке розтягування для відновлення."]}], "f": "Передача внутрішньою стороною стопи — найпоширеніша передача у футболі, бо вона найточніша.", "pr": ["Намалюй схему передачі м’яча внутрішньою частиною стопи: де стоїть опорна нога, як розвернута ударна, куди спрямований м’яч.", "Виконай вдома розтягування: нахил до прямих ніг сидячи, розтягування передньої поверхні стегна стоячи біля стіни, «метелик» сидячи — кожну вправу по 20 секунд двічі."], "q": ["Чому гра повинна починатися лише за сигналом?", "Як розташована опорна нога під час передачі?", "Що треба зробити стопою, щоб м’яч не відскочив?", "Скільки секунд треба утримувати позу розтягування?"]}, {"n": "5", "t": "Рухливі ігри в історії та Олімпійські ігри, способи зупинки м’яча, правила панни", "g": "Учень дізнається про місце рухливих ігор у фізичному вихованні й зв’язок ігор з Олімпійськими іграми, познайомиться з різними способами зупинки м’яча та основними правилами панни.", "k": "Модулі: Рухливі ігри · Футбол · Панна", "terms": [["Олімпійські ігри", "найбільші міжнародні спортивні змагання, що відбуваються раз на чотири роки."], ["Фізичне виховання", "процес, під час якого людина зміцнює здоров’я та розвиває рухові якості."], ["Зупинка підошвою", "прийом, коли гравець накриває м’яч підошвою, щоб утримати його на місці."], ["Варіативний модуль", "модуль, який школа обирає додатково до основних, щоб урізноманітнити уроки."]], "th": [{"h": "Рухливі ігри. Рухливі ігри у фізичному вихованні та історія їх розвитку. Олімпійські ігри", "p": ["Ще в давнину люди використовували ігри, щоб готувати молодь до життя: бігати, стрибати, кидати, долати перешкоди. Згодом із багатьох ігор виросли справжні види спорту.", "Олімпійські ігри зародилися в Стародавній Греції. Тоді атлети змагалися в бігу, стрибках, метаннях, боротьбі. Сучасні Олімпійські ігри відродилися наприкінці XIX століття і тепер об’єднують спортсменів з усього світу."], "ul": ["Рухливі ігри — перший крок до занять спортом.", "Багато видів спорту з’явилися з народних ігор.", "Олімпійський девіз — «Швидше, вище, сильніше» (згодом додано «Разом»).", "Символ Олімпіади — п’ять переплетених кілець.", "Головне в Олімпійських іграх — чесна боротьба і повага до суперників."]}, {"h": "Футбол. Різновиди зупинки м’яча", "p": ["М’яч може прилетіти по-різному: котитися по землі, відскакувати або летіти в повітрі. Тому існує кілька способів зупинки: внутрішньою частиною стопи, підошвою, стегном, грудьми.", "У 5 класі найчастіше використовують зупинку внутрішньою частиною стопи та підошвою. Головне правило — «зустріти» м’яч м’яко і відвести ногу назад у момент дотику."], "ul": ["Внутрішньою частиною стопи — для м’яча, що котиться.", "Підошвою — легко накрити м’яч зверху, не наступаючи на нього всією вагою.", "Стегном — для м’яча, що летить на рівні пояса.", "Грудьми — для високого м’яча, руки розведені, але м’яча не торкаються.", "Помилка — напружена нога: м’яч відскакує далеко."]}, {"h": "Панна. Ознайомлення з модулем. Правила гри", "p": ["Панна — варіативний модуль, тобто додатковий вид рухової діяльності. Гра відбувається на невеликому майданчику, найчастіше 1 на 1, протягом кількох хвилин.", "Мета — забити м’яч у маленькі ворота суперника або виконати прийом «панна» — прокинути м’яч між його ногами. Правила можуть дещо відрізнятися на різних турнірах, але спільне одне: гра без грубощів, головне — техніка."], "ul": ["Гра коротка — кілька хвилин.", "Можна перемогти голом або прийомом «панна» (залежно від правил турніру).", "Заборонено штовхати, хапати, бити по ногах.", "М’яч грають ногами, руками його не торкаються.", "Наприкінці гри суперники тиснуть руки."]}], "f": "П’ять олімпійських кілець символізують єднання п’яти частин світу.", "pr": ["Напиши коротку розповідь (5–6 речень) «Як рухливі ігри допомагають стати спортсменом».", "Намалюй п’ять олімпійських кілець у правильних кольорах і підпиши, що вони означають."], "q": ["Де зародилися Олімпійські ігри?", "Назви способи зупинки м’яча у футболі.", "Що таке варіативний модуль?", "Яка головна мета гри в панну?"]}, {"n": "6", "t": "Ігри для розвитку сили, різновиди передач м’яча, силові вправи для панни", "g": "Учень вивчить рухливі ігри для розвитку сили, дізнається про різні способи передачі м’яча у футболі та навчиться вправ для зміцнення рук, ніг, пресу і спини.", "k": "Модулі: Рухливі ігри · Футбол · Панна", "terms": [["Сила", "здатність людини долати опір або протидіяти йому за допомогою м’язів."], ["Підйом стопи", "верхня частина стопи, якою виконують сильні удари та передачі."], ["Черевний прес", "м’язи живота, які утримують тулуб і допомагають зберігати поставу."], ["Повторення", "одне виконання вправи від початку до кінця."]], "th": [{"h": "Рухливі ігри. Ігри для розвитку сили: «Вудочка», «Гопак», «Десять паличок», «Гречка», «Довга лоза»", "p": ["Силові рухливі ігри містять стрибки, присідання, утримання тіла та перетягування. Наприклад, у «Вудочці» ведучий обертає мотузку низько над землею, а гравці перестрибують через неї. «Гопак» нагадує український танець з присіданнями та стрибками.", "Такі ігри зміцнюють м’язи ніг, рук і спини. Але сила розвивається поступово, тому важливо чергувати навантаження й відпочинок."], "ul": ["Перестрибуючи мотузку, відштовхуйся двома ногами і м’яко приземляйся.", "У «Гопаку» присідай з рівною спиною.", "Не змагайся «до знемоги» — зупинися, якщо втомився.", "Грай на рівній, не слизькій поверхні.", "Після силових ігор — спокійна ходьба і розтягування."]}, {"h": "Футбол. Різновиди передач м’яча", "p": ["Передачі бувають короткі й довгі, низом і верхом. Коротку передачу виконують внутрішньою частиною стопи, довгу — підйомом. Для обходу суперника іноді використовують передачу зовнішньою частиною стопи.", "Хороша передача — точна і своєчасна: м’яч повинен прийти партнерові так, щоб йому було зручно його прийняти."], "ul": ["Внутрішньою частиною стопи — коротка й точна передача.", "Серединою підйому — сильна і довга передача.", "Зовнішньою частиною стопи — передача вбік, щоб обдурити суперника.", "Дивись на партнера, а в момент удару — на м’яч.", "Після передачі одразу відкривайся для нової."]}, {"h": "Панна. Вправи для розвитку сили рук, ніг, пресу та спини", "p": ["Сильні ноги допомагають швидко стартувати, а сильний прес і спина — тримати рівновагу й не падати під час обведення. Руки теж важливі: вони допомагають балансувати.", "Силові вправи без обтяжень безпечні й корисні: присідання, віджимання від стіни або лавки, планка, «човник» лежачи на животі, підйом тулуба лежачи на спині."], "ul": ["Присідання — п’яти не відривай від підлоги, коліна дивляться вперед.", "Віджимання — тіло рівне, як дошка.", "Планка — не прогинай поперек.", "«Човник» — плавно піднімай руки й ноги, не різко.", "Між підходами відпочивай 30–60 секунд."]}], "f": "Гра «Гопак» названа на честь українського народного танцю, у якому багато стрибків і присідань.", "pr": ["Виконай силовий комплекс: 12 присідань, 8 віджимань від стіни, планка 20 секунд, «човник» 6 разів. Повтори двічі.", "Запиши в зошит три способи передачі м’яча і для кожного вкажи, коли його краще використати."], "q": ["Які рухливі ігри розвивають силу?", "Якою частиною стопи виконують довгу передачу?", "Як правильно виконувати планку?", "Чому між силовими вправами потрібен відпочинок?"]}, {"n": "7", "t": "Безпека в рухливих іграх, футбольні естафети, ведення м’яча в панні", "g": "Учень повторить правила безпеки в рухливих іграх, дізнається, як проводяться естафети з елементами футболу, та вивчить техніку ведення м’яча.", "k": "Модулі: Рухливі ігри · Футбол · Панна", "terms": [["Ведення м’яча", "переміщення гравця з м’ячем за допомогою частих легких поштовхів ногою."], ["Фішка", "невеликий конус, яким позначають межі або перешкоди на майданчику."], ["Сигнал", "умовний звук або жест, що означає початок чи зупинку дії."], ["Командний дух", "бажання підтримувати своїх товаришів і діяти разом заради спільної мети."]], "th": [{"h": "Рухливі ігри. Правила безпеки та дисципліни на уроці", "p": ["Безпеку на уроці забезпечують і вчитель, і самі учні. Перед грою треба перевірити, чи немає на майданчику зайвих предметів, а під час гри — тримати дистанцію та виконувати правила.", "Дисципліна — це не нудно. Коли всі знають правила й дотримуються їх, гра стає швидшою, цікавішою та справедливішою."], "ul": ["Перевір шнурки — вони мають бути зав’язані.", "Тримайся подалі від стін і лавок під час бігу.", "Чекаючи своєї черги, не заважай іншим.", "Гравець, якого «спіймали», виходить спокійно.", "Сперечання вирішує вчитель, а не гравці."]}, {"h": "Футбол. Ігри-естафети з елементами футболу", "p": ["Футбольні естафети поєднують біг, ведення м’яча, передачі й удари. Наприклад, гравець веде м’яч до фішки, обходить її і повертається, передаючи м’яч наступному.", "Перемагає команда, яка виконає все швидко і правильно. Якщо гравець втратив м’яч чи пропустив фішку, він повертається і виправляє помилку."], "ul": ["Стартуй лише тоді, коли попередній гравець передав тобі м’яч.", "Веди м’яч близько до себе.", "Обходь фішку, а не перестрибуй її.", "Повертаючись, передавай м’яч низом.", "Підбадьорюй своїх товаришів по команді."]}, {"h": "Панна. Техніка ведення м’яча. Рухливі ігри з м’ячем", "p": ["Ведення м’яча — основа панни. М’яч штовхають легкими дотиками внутрішньою, зовнішньою частиною стопи або підйомом, тримаючи його близько до ніг.", "Голова піднята, щоб бачити суперника і майданчик. Корпус трохи нахилений уперед, ноги злегка зігнуті. Рухливі ігри з м’ячем допомагають закріпити навичку ведення у веселій формі."], "ul": ["Торкайся м’яча майже на кожному кроці.", "Не бий по м’ячу сильно — він відкотиться далеко.", "Поглядай на м’яч і навколо себе по черзі.", "Веди м’яч обома ногами, не лише сильнішою.", "Типова помилка — постійно дивитися тільки під ноги."]}], "f": "Досвідчені футболісти під час ведення лише зрідка дивляться на м’яч — вони відчувають його ногою.", "pr": ["Опиши у 4–5 реченнях одну естафету з елементами футболу, яку ти хотів(-ла) б провести з друзями.", "Виконай вдома вправу на рівновагу: стоячи на одній нозі, роби легкі колові рухи стопою іншої ноги, 20 секунд на кожну ногу, по 2 рази."], "q": ["Що потрібно перевірити перед грою?", "Як правильно передати м’яч наступному гравцеві в естафеті?", "Якими частинами стопи можна вести м’яч?", "Чому під час ведення треба піднімати голову?"]}, {"n": "8", "t": "Ігри на витривалість, гігієна у футболі, удари по м’ячу в парах", "g": "Учень вивчить рухливі ігри для розвитку витривалості, дізнається про гігієнічні вимоги у футболі та навчиться виконувати удари по м’ячу в парах.", "k": "Модулі: Рухливі ігри · Футбол · Панна", "terms": [["Витривалість", "здатність довго виконувати роботу без втоми."], ["Квач", "гра, у якій ведучий наздоганяє гравців і торкається їх рукою."], ["Щитки", "захисні накладки на гомілки, які захищають від ударів."], ["Партнер", "гравець, з яким виконують вправу чи гру разом."]], "th": [{"h": "Рухливі ігри. Ігри для витривалості: «Потяг», «Квач», «Квач зі стрічками», «Карасі і щука»", "p": ["Ігри на витривалість тривають довше, у них багато бігу. У «Квачі» ведучий наздоганяє гравців; той, кого торкнулися, сам стає ведучим. У «Квачі зі стрічками» в кожного гравця за поясом стрічка, і ведучий намагається її висмикнути.", "У грі «Карасі і щука» «щука» ловить «карасів», які перебігають з одного боку майданчика на інший. Спіймані «карасі» допомагають щуці або стають «водоростями»."], "ul": ["Біжи рівномірно, не витрачай усі сили на старті.", "Дихай ритмічно — носом і ротом.", "Торкайся гравця легко, не хапай за одяг.", "Стрічку закріплюй так, щоб її легко було висмикнути.", "Відчув сильну втому — зупинись і скажи вчителеві."]}, {"h": "Футбол. Стройові вправи. Гігієнічні вимоги у футболі", "p": ["Футболісти тренуються на відкритому повітрі й багато бігають, тому гігієна для них особливо важлива. Одяг має бути за погодою, а взуття — зручне, з підошвою для потрібного покриття.", "На тренуваннях і змаганнях футболісти використовують щитки, які захищають гомілки. Після гри потрібно прийняти душ, висушити взуття і випрати форму."], "ul": ["У холодну погоду — кілька шарів одягу, щоб не перегрітися і не замерзнути.", "Шкарпетки — чисті та сухі, щоб не натерти ноги.", "Взуття — за розміром.", "Пий воду невеликими ковтками.", "Стройові вправи на початку уроку допомагають зібратися і сконцентруватися."]}, {"h": "Панна. Удари по м’ячу (робота в парах)", "p": ["У парах учні стоять один навпроти одного на відстані кількох метрів і по черзі передають м’яч. Спочатку — внутрішньою частиною стопи, потім — підйомом.", "Робота в парах вчить точності: м’яч має прийти прямо до партнера. Той, хто приймає, спочатку зупиняє м’яч, потім передає назад."], "ul": ["Стань напроти партнера, опорна нога біля м’яча.", "Дивись, куди спрямовуєш удар.", "Удар — по центру м’яча.", "Не бий сильно на маленькій відстані.", "Працюй обома ногами по черзі."]}], "f": "Витривалість краще за все розвивається, коли рухова активність повторюється регулярно, а не зрідка.", "pr": ["Склади правила гри «Квач зі стрічками» і придумай свій варіант цієї гри для двору.", "Склади список того, що має бути в спортивній сумці футболіста, і поясни, навіщо кожна річ."], "q": ["Що таке витривалість?", "Як правильно дихати під час тривалого бігу?", "Навіщо футболістам щитки?", "Як виконують удари по м’ячу в парах?"]}, {"n": "9", "t": "Комбіновані естафети, ходьба й біг у футболі, гра «Хто найвлучніший?»", "g": "Учень дізнається, як проводяться комбіновані естафети, повторить різновиди ходьби та бігу і зрозуміє правила гри на влучність «Хто найвлучніший?».", "k": "Модулі: Рухливі ігри · Футбол · Панна", "terms": [["Комбінована естафета", "естафета, у якій поєднуються різні завдання: біг, передача м’яча, перенесення предметів."], ["Старт", "початок руху за сигналом."], ["Влучність", "здатність точно потрапляти м’ячем або предметом у ціль."], ["Приставний крок", "крок, під час якого одна нога приставляється до іншої."]], "th": [{"h": "Рухливі ігри. Комбіновані естафети: «Швидко передай», «Старти спортсменів», «Тачка і м’яч»", "p": ["У комбінованих естафетах кожен етап має своє завдання. «Швидко передай» — передача м’яча над головою або між ногами вздовж колони. «Старти спортсменів» — старт із різних положень (сидячи, лежачи, стоячи спиною). «Тачка і м’яч» — один гравець іде на руках, а партнер тримає його за ноги, разом вони котять м’яч.", "Такі естафети розвивають швидкість, спритність і вміння діяти злагоджено."], "ul": ["Передавай м’яч, а не кидай.", "У «Тачці» партнер тримає ноги низько, щоб не навантажувати спину.", "Стартуй лише за сигналом.", "Не відходь від колони до свого етапу.", "Після фінішу стань у кінець колони."]}, {"h": "Футбол. Різновиди ходьби та бігу", "p": ["Футболіст під час гри постійно змінює вид руху: іде, біжить, прискорюється, рухається боком і спиною. Тому на уроці ми тренуємо всі ці способи.", "Біг приставними кроками допомагає швидко зміщуватися в захисті, біг спиною вперед — стежити за грою, відходячи назад. Прискорення — вирватися до м’яча раніше за суперника."], "ul": ["Ходьба з високим підніманням стегна — спина рівна.", "Біг із закиданням гомілки — п’ятки до сідниць.", "Приставні кроки — ноги не схрещуються.", "Біг спиною вперед — короткі кроки, погляд через плече.", "Прискорення — короткі, 10–15 метрів, з відпочинком."]}, {"h": "Панна. Рухлива гра «Хто найвлучніший?»", "p": ["Гра розвиває точність удару. Гравці по черзі б’ють по м’ячу з певної відстані, намагаючись влучити у фішки, кеглі або маленькі ворота. За кожне влучання — очко.", "Перемагає той, хто набере найбільше очок. Щоб бити влучно, треба правильно ставити опорну ногу і дивитися на ціль перед ударом."], "ul": ["Бий по черзі, не поспішай.", "Опорна нога вказує носком на ціль.", "Бий внутрішньою частиною стопи — це найточніше.", "Не стій навпроти цілі, коли б’є інший гравець.", "Спочатку точність, потім сила."]}], "f": "Футболісти під час одного матчу часто змінюють вид руху сотні разів: ходьба, біг, ривки, зупинки.", "pr": ["Придумай власну комбіновану естафету з трьох етапів для класу. Опиши кожен етап і правила безпеки.", "Виконай удома вправу на точність без м’яча: кидай згорнуті шкарпетки в кошик з відстані 2 метри — 10 спроб, запиши кількість влучань."], "q": ["Що таке комбінована естафета?", "Навіщо футболісту біг приставними кроками?", "Як поставити опорну ногу для влучного удару?", "Чому важливо не стояти навпроти цілі під час чужого удару?"]}, {"n": "10", "t": "Українські народні ігри «Фарби», «Птахи», «Ріпка», удари по м’ячу, стійка футболіста", "g": "Учень вивчить українські народні рухливі ігри, дізнається про техніку ударів по м’ячу та навчиться пересуватися у стійці футболіста.", "k": "Модулі: Рухливі ігри · Футбол · Панна", "terms": [["Народна гра", "гра, що створена народом і передається з покоління в покоління."], ["Удар підйомом", "удар верхньою частиною стопи, що дає силу і дальність."], ["Стійка футболіста", "положення тіла з трохи зігнутими ногами й нахиленим корпусом, з якого легко рушити в будь-який бік."], ["Замах", "рух ноги назад перед ударом."]], "th": [{"h": "Рухливі ігри. Українські народні ігри: «Фарби», «Птахи», «Ріпка»", "p": ["У грі «Фарби» кожен гравець таємно обирає собі колір, а «покупець» намагається вгадати фарбу. Якщо вгадав — гравець тікає, а покупець наздоганяє. «Птахи» — гра, де гравці-«птахи» перелітають з «гнізда» в «гніздо», а ловець намагається їх спіймати.", "«Ріпка» побудована на відомій казці: гравці чіпляються один за одного і разом «тягнуть ріпку», перевіряючи силу та злагодженість. Ці ігри навчають дружби й поваги до народних традицій."], "ul": ["Народні ігри часто починаються з лічилки чи діалогу.", "Ловити треба легким дотиком.", "У «Ріпці» тягни плавно, без ривків.", "Вигадуй нові кольори та назви птахів — це робить гру цікавішою.", "Шануй правила, які передали нам предки."]}, {"h": "Футбол. Навички удару по м’ячу", "p": ["Удар складається з фаз: розбіг, постановка опорної ноги, замах, удар, супровід м’яча ногою. Удар внутрішньою частиною стопи точніший, підйомом — сильніший.", "Під час удару підйомом носок ударної ноги відтягнутий донизу, гомілкостоп напружений. Корпус над м’ячем, щоб м’яч летів низом, а не вгору."], "ul": ["Розбіг — кілька кроків під невеликим кутом.", "Опорна нога — поруч із м’ячем.", "Замах — від стегна, нога згинається в коліні.", "Удар — по центру м’яча.", "Після удару нога продовжує рух у напрямку цілі."]}, {"h": "Панна. Пересування у стійці футболіста (праворуч, ліворуч)", "p": ["Гравець панни постійно в русі: стежить за суперником і м’ячем, готовий рушити в будь-який бік. Для цього потрібна правильна стійка: ноги на ширині плечей, коліна злегка зігнуті, вага тіла на передній частині стоп.", "Пересування праворуч і ліворуч виконують приставними кроками, не схрещуючи ноги, щоб не заплутатися і не впасти."], "ul": ["Ноги трохи зігнуті, не прямі.", "Корпус нахилений уперед.", "Руки злегка розведені для рівноваги.", "Кроки короткі й швидкі.", "Не підстрибуй — ковзай над підлогою."]}], "f": "У грі «Фарби» перемагає не лише швидкість, а й кмітливість — треба вибрати несподіваний колір.", "pr": ["Пограй з рідними в «Фарби» — гра підходить для кімнати без бігу, якщо замість наздоганяння вгадувати. Запиши, які кольори обирали найчастіше.", "Виконай удома 3 підходи по 20 секунд перебування у стійці футболіста, з короткими приставними кроками праворуч і ліворуч (на вільному місці)."], "q": ["Як грають у «Фарби»?", "Назви фази удару по м’ячу.", "Чим удар підйомом відрізняється від удару внутрішньою частиною стопи?", "Як правильно стояти у стійці футболіста?"]}, {"n": "11", "t": "Творчість і командна взаємодія в іграх, футбольні естафети, вихідне положення для ударів", "g": "Учень зрозуміє, як поєднувати власну творчість і командну взаємодію в рухливих іграх, закріпить естафети з елементами футболу та навчиться обирати вихідне положення для ударів і прийому м’яча від стіни.", "k": "Модулі: Рухливі ігри · Футбол · Панна", "terms": [["Командна взаємодія", "узгоджені дії гравців однієї команди для досягнення спільної мети."], ["Креативність", "уміння вигадувати нові, незвичні рішення."], ["Вихідне положення", "положення тіла, з якого починають виконання вправи."], ["Відскок", "повернення м’яча після удару об стіну або поверхню."]], "th": [{"h": "Рухливі ігри. Індивідуальна творчість і командна взаємодія", "p": ["У кожній грі важливі дві речі: власна ініціатива і робота з командою. Гравець може вигадати хитрий рух чи план, але успіху досягають тоді, коли команда діє злагоджено.", "Креативний гравець бачить різні варіанти: кому передати, куди перебігти, як обдурити ведучого. Командний гравець думає про всіх, а не лише про себе."], "ul": ["Слухай партнерів і домовляйся перед грою.", "Пропонуй свої ідеї, але поважай ідеї інших.", "Допомагай слабшим гравцям.", "Радій перемозі команди, а не лише власним успіхам.", "Після гри обговоріть, що вдалося, а що ні."]}, {"h": "Футбол. Ігри-естафети з елементами футболу", "p": ["Сьогодні естафети стають трохи складнішими: ведення між фішками, передача партнерові, удар у маленькі ворота. Кожен етап перевіряє одне вміння.", "Щоб команда перемогла, потрібно не тільки швидко бігти, а й акуратно працювати з м’ячем — втрата м’яча забирає більше часу, ніж повільне ведення."], "ul": ["Тримай м’яч близько, особливо біля фішок.", "Передачу виконуй точно, внутрішньою частиною стопи.", "Не починай, поки партнер не завершив свій етап.", "Слухай підказки капітана.", "Дій чесно — не пропускай фішки."]}, {"h": "Панна. Вихідне положення для ударів і прийому м’яча від стіни", "p": ["Вправи зі стіною — чудовий спосіб тренуватися самостійно: стіна завжди повертає м’яч. Учень стоїть на відстані кількох метрів, б’є по м’ячу і приймає його після відскоку.", "Правильне вихідне положення: стійка обличчям до стіни, ноги злегка зігнуті, вага на передній частині стопи. Для прийому м’яча підстав внутрішню частину стопи і злегка відведи її назад."], "ul": ["Вибирай рівну стіну без вікон.", "Починай з невеликої відстані і помірної сили удару.", "Чергуй праву та ліву ногу.", "Після кожного прийому одразу готуйся до наступного удару.", "Не бий у стіну в приміщеннях, де можна щось розбити."]}], "f": "Багато відомих футболістів у дитинстві годинами тренувалися, б’ючи м’яч об стіну.", "pr": ["Напиши 5 порад «Як бути хорошим гравцем команди».", "Виконай удома вправу на рівновагу й координацію: стоячи у стійці футболіста, по черзі торкайся носком правої і лівої ноги уявного м’яча перед собою — 3 рази по 20 дотиків."], "q": ["Чим командна взаємодія допомагає перемогти?", "Чому втрата м’яча в естафеті забирає багато часу?", "Яким має бути вихідне положення для прийому м’яча від стіни?", "Яку стіну можна використовувати для тренувань?"]}, {"n": "12", "t": "Патріотичні рухливі ігри, удари по воротах, прийом м’яча внутрішньою частиною стопи", "g": "Учень дізнається, які рухливі ігри мають патріотичне спрямування, навчиться основ удару по воротах та прийому м’яча внутрішньою частиною стопи в різному темпі.", "k": "Модулі: Рухливі ігри · Футбол · Панна", "terms": [["Патріотизм", "любов до своєї Батьківщини, повага до її історії та традицій."], ["Ворота", "споруда зі стійками та поперечиною, у яку забивають м’яч."], ["Прийом м’яча", "дія, якою гравець бере м’яч під контроль."], ["Темп", "швидкість виконання рухів."]], "th": [{"h": "Рухливі ігри. Рухливі ігри патріотичного спрямування", "p": ["Патріотичні ігри нагадують про історію України, козацькі традиції й захисників рідної землі. Наприклад, у козацьких забавах гравці змагаються в силі, спритності й витримці, як колись козаки.", "Такі ігри виховують мужність, взаємодопомогу і гордість за свою країну. Водночас вони вчать чесно змагатися і поважати суперника."], "ul": ["У багатьох іграх є «загони» чи «команди» з назвами.", "Важливі спритність, сила і спільні дії.", "Кожен гравець — частина команди, як у справжньому війську.", "Поважай суперника, навіть якщо він з «іншого загону».", "Після гри подякуй усім учасникам."]}, {"h": "Футбол. Різновиди ходьби та бігу. Удари по воротах", "p": ["Перед ударами обов’язково розминаємося різновидами ходьби та бігу. Удар по воротах — це та сама техніка удару, але з метою забити гол: м’яч треба направити туди, де немає воротаря.", "Найчастіше б’ють у кути воріт, бо воротареві туди складніше дотягнутися. Для точності використовують удар внутрішньою частиною стопи, для сили — підйомом."], "ul": ["Перед ударом подивися на ворота.", "Цілься в кут, а не в центр.", "Не нахиляйся назад — м’яч полетить вище воріт.", "Чекай своєї черги збоку від воріт.", "Воротар виходить на позицію лише за сигналом учителя."]}, {"h": "Панна. Прийом м’яча внутрішньою частиною стопи в різному та заданому темпі", "p": ["Прийом внутрішньою частиною стопи — найнадійніший. Нога, що приймає, розвертається назовні, стопа йде назустріч м’ячу і в момент дотику плавно відходить назад.", "Коли м’яч летить швидко, нога відходить назад більше. Коли повільно — ледь торкається. Тренування в різному темпі вчить пристосовуватися до будь-якої передачі."], "ul": ["Стопа паралельно до землі, на рівні центру м’яча.", "Ногу не напружуй.", "Опорна нога злегка зігнута.", "Після прийому м’яч має залишитися поруч.", "Чим швидший м’яч, тим м’якше його приймай."]}], "f": "Удари в нижні кути воріт вважаються одними з найнеприємніших для воротаря.", "pr": ["Запиши назву та правила однієї гри патріотичного спрямування (можна розпитати рідних або вигадати свою на основі козацьких традицій).", "Намалюй футбольні ворота і познач кольором зони, куди найкраще бити по воротах. Поясни чому."], "q": ["Чого навчають патріотичні рухливі ігри?", "Куди краще цілитися, б’ючи по воротах?", "Чому м’яч може полетіти вище воріт?", "Як змінюється прийом м’яча, коли він летить швидко?"]}, {"n": "13", "t": "Козацькі забави та патріотичні ігри, точність ударів по воротах, контроль м’яча в різному темпі", "g": "Учень закріпить знання про патріотичні рухливі ігри, удосконалить розуміння техніки ударів по воротах та прийому м’яча внутрішньою частиною стопи.", "k": "Модулі: Рухливі ігри · Футбол · Панна", "terms": [["Козацькі забави", "давні змагання та ігри, якими козаки розвивали силу, спритність і витримку."], ["Воротар", "гравець, який захищає ворота і може грати руками у своєму штрафному майданчику."], ["Контроль м’яча", "уміння тримати м’яч біля себе і керувати ним."], ["Розбіг", "кілька кроків перед ударом, які додають швидкості та сили."]], "th": [{"h": "Рухливі ігри. Рухливі ігри патріотичного спрямування (закріплення)", "p": ["Козаки дбали про свою фізичну підготовку: змагалися в бігу, стрибках, перетягуванні, боротьбі. Багато з цих забав стали основою сучасних рухливих ігор.", "Сьогодні ми граємо в ігри, де команди долають «перешкоди», виконують «завдання» й рятують «полонених» товаришів. Головне — діяти разом і допомагати одне одному."], "ul": ["Перетягування — сила і злагодженість команди.", "Ігри з «порятунком» — взаємодопомога.", "Естафети з перешкодами — спритність і витримка.", "Не кидай товариша — це головне правило «козацьких» ігор.", "Будь справедливим, навіть коли програєш."]}, {"h": "Футбол. Різновиди ходьби та бігу. Удари по воротах (закріплення)", "p": ["Повторюємо техніку удару по воротах. Удар із розбігу: 2–3 кроки, опорна нога поруч з м’ячем, замах, удар, супровід. Чим точніше поставлена опорна нога, тим точніший удар.", "Корисно бити з різних точок і різними ногами: тоді у грі ти зможеш ударити з будь-якої позиції."], "ul": ["Розбіг невеликий і прямий або під кутом.", "Корпус над м’ячем.", "Б’ючи підйомом, носок відтягнутий.", "Помилка — удар «на щастя», без прицілювання.", "Після удару повертайся на своє місце бігом підтюпцем."]}, {"h": "Панна. Прийом м’яча внутрішньою частиною стопи (закріплення)", "p": ["Хороший прийом — половина успіху в панні: якщо м’яч відскочив, суперник одразу його забере. Тому вправу виконуємо багато разів, змінюючи силу та темп передачі.", "Задавай собі завдання: прийняти м’яч і одразу повернути його партнерові, або прийняти й зробити крок з м’ячем убік."], "ul": ["Тренуйся обома ногами.", "Стеж за м’ячем до моменту дотику.", "Приймай м’яч трохи вбік — так легше продовжити рух.", "Не зупиняй м’яч «наглухо», якщо потрібно рухатися далі.", "Рахуй вдалі прийоми й намагайся покращити результат."]}], "f": "Перетягування канату колись навіть входило до програми Олімпійських ігор.", "pr": ["Склади коротку розповідь (5–6 речень) про те, як козаки тренували силу та спритність, і які сучасні ігри на це схожі.", "Виконай вправу «стійка з дотиками»: стоячи на одній нозі, по черзі торкайся носком іншої ноги точок перед собою, збоку і позаду — по 8 разів кожною ногою."], "q": ["Які забави були в козаків?", "Як точність постановки опорної ноги впливає на удар?", "Чому погано, якщо м’яч під час прийому відскочив?", "Навіщо тренувати прийом обома ногами?"]}, {"n": "14", "t": "Гра «М’яч ведучому», футбольні естафети, удари й прийом м’яча від стіни", "g": "Учень вивчить гру «М’яч ведучому», закріпить естафети з елементами футболу та вдосконалить роботу з м’ячем біля стіни.", "k": "Модулі: Рухливі ігри · Футбол · Панна", "terms": [["Передача з рук", "кидок м’яча партнерові двома руками від грудей або з-за голови."], ["Ловіння м’яча", "прийом м’яча руками, коли пальці розставлені, а руки м’яко згинаються."], ["Колона по одному", "шикування, при якому гравці стоять один за одним."], ["Капітан команди", "гравець, який організовує команду і представляє її перед суддею."]], "th": [{"h": "Рухливі ігри. Рухлива гра «М’яч ведучому»", "p": ["Гравці стають у колони, перед кожною стоїть ведучий з м’ячем. Ведучий по черзі кидає м’яч кожному гравцеві своєї колони, той ловить і кидає назад, після чого присідає. Перемагає команда, яка швидше завершить передачі без падіння м’яча.", "Гра тренує точність передач, ловіння і швидкість реакції."], "ul": ["Кидай м’яч двома руками від грудей.", "Лови м’яч м’якими руками, пальці розставлені.", "Не кидай сильно на близькій відстані.", "Якщо м’яч упав — підніми і продовж з того ж гравця.", "Присідай лише після передачі м’яча назад."]}, {"h": "Футбол. Ігри-естафети з елементами футболу", "p": ["Естафети цього уроку поєднують ведення, обведення фішок і передачу. Важливо поєднати швидкість і контроль м’яча.", "Капітан допомагає команді: стежить за чергою, підказує, підбадьорює. Ми вчимося не лише виконувати вправи, а й підтримувати одне одного."], "ul": ["Веди м’яч обома ногами.", "Біля фішки сповільнюйся.", "Передавай м’яч наступному точно в ноги.", "Команда стоїть за лінією і не заважає.", "Перемога — це результат усієї команди."]}, {"h": "Панна. Вибір вихідного положення для ударів і прийому м’яча від стіни (удосконалення)", "p": ["Повторюємо вправу зі стіною, але ускладнюємо: удар однією ногою, прийом іншою; удар з відстані, що поступово збільшується; прийом із поворотом.", "Щоразу перед ударом перевіряй своє положення: ноги злегка зігнуті, корпус над м’ячем, погляд на точку на стіні."], "ul": ["Намалюй уявну мішень на стіні й цілься в неї.", "Збільшуй відстань поступово.", "Після кожного удару готуйся до відскоку.", "Чергуй ноги.", "Слідкуй, щоб поблизу нікого не було."]}], "f": "Гра «М’яч ведучому» — одна з найпопулярніших шкільних естафет, бо в ній бере участь кожен гравець команди.", "pr": ["Пограйте вдома з рідними в «М’яч ведучому» з м’якою іграшкою замість м’яча: кидайте по колу двома руками від грудей. Опиши, як вам вдалося.", "Склади схему естафети з футбольними елементами для 3 команд: намалюй фішки, лінію старту й напрямок руху."], "q": ["Як грати в «М’яч ведучому»?", "Як правильно ловити м’яч руками?", "Які обов’язки має капітан команди?", "Як ускладнити вправу з м’ячем біля стіни?"]}, {"n": "15", "t": "Безпека на уроці, ведення м’яча та вправи на спритність, робота з м’ячем біля стіни", "g": "Учень повторить правила безпеки та дисципліни, вивчить техніку ведення м’яча у футболі й вправи для розвитку спритності, закріпить роботу з м’ячем біля стіни.", "k": "Модулі: Рухливі ігри · Футбол · Панна", "terms": [["Травма", "пошкодження тіла, що виникає внаслідок удару, падіння чи надмірного навантаження."], ["Координація", "здатність узгоджено поєднувати різні рухи."], ["Обведення", "прийом, яким гравець з м’ячем обходить суперника або перешкоду."], ["Дистанція", "відстань між гравцями під час виконання вправ."]], "th": [{"h": "Рухливі ігри. Правила безпеки та дисципліни на уроці", "p": ["Найчастіші травми в іграх — забиті коліна, розтягнення гомілкостопа і подряпини. Більшість із них трапляються через поспіх, штовхання або неправильне взуття.", "Щоб захистити себе й інших, тримай дистанцію, дивись довкола і виконуй команди вчителя. Якщо ти побачив небезпеку — скажи про неї."], "ul": ["Не грай у мокрому або слизькому взутті.", "Тримай дистанцію в колоні — 1–2 кроки.", "Не грайся м’ячем без дозволу вчителя.", "Відпочивай, коли відчуваєш втому.", "Повідом учителя про травму навіть незначну."]}, {"h": "Футбол. Ведення м’яча. Вправи для розвитку спритності", "p": ["Ведення м’яча — переміщення з м’ячем легкими поштовхами. На уроці ведуть м’яч по прямій, по колу, між фішками («змійкою»).", "Спритність допомагають розвинути вправи зі зміною напрямку, бігу з поворотами, ловіння м’яча після відскоку, а також ігри на реакцію."], "ul": ["Під час «змійки» торкайся м’яча частіше.", "Обводь фішку зовнішньою або внутрішньою частиною стопи.", "Не відпускай м’яч далеко.", "Тримай корпус трохи нахиленим уперед.", "Вправи на спритність виконуй спершу повільно, потім швидше."]}, {"h": "Панна. Удари та прийом м’яча від стіни (закріплення)", "p": ["Завдання сьогодні — виконати серію ударів і прийомів без помилки. Кожна вдала серія показує, що навичка закріплюється.", "Пам’ятай, що в панні м’яч приймають так, щоб одразу продовжити гру. Отже, прийом і наступний удар мають бути одним плавним рухом."], "ul": ["Почни з 5 вдалих повторень поспіль.", "Потім спробуй 10.", "Прийом — удар — прийом — удар без пауз.", "Тримай ритм.", "Записуй свої найкращі результати."]}], "f": "Гравці, які добре ведуть м’яч, можуть змінювати напрям руху майже не сповільнюючись.", "pr": ["Склади пам’ятку «Як уникнути травм на уроці фізкультури» з 5 правил.", "Виконай вдома вправу на координацію: стоячи, одночасно роби колові рухи правою рукою вперед, а лівою назад — 3 рази по 10 обертів, потім поміняй."], "q": ["Через що найчастіше трапляються травми в іграх?", "Що таке «змійка» під час ведення м’яча?", "Як вправи на спритність потрібно виконувати спочатку?", "Чому прийом і удар у панні мають бути одним рухом?"]}, {"n": "16", "t": "Ігри на швидкість, удар головою на точність, удари по м’ячу, що котиться", "g": "Учень вивчить рухливі ігри для розвитку швидкості, дізнається про техніку удару по м’ячу головою з місця на точність і ударів по м’ячу, що котиться, внутрішньою частиною стопи та серединою підйому.", "k": "Модулі: Рухливі ігри · Футбол · Панна", "terms": [["Реакція", "швидка відповідь організму рухом на сигнал."], ["Удар головою", "удар по м’ячу лобовою частиною голови."], ["Середина підйому", "частина верхньої поверхні стопи, якою виконують сильні й точні удари."], ["М’яч, що котиться", "м’яч, який рухається по землі назустріч чи від гравця."]], "th": [{"h": "Рухливі ігри. Ігри для розвитку швидкості: «Останній вибуває», «Виклик номерів», «Коники»", "p": ["У грі «Виклик номерів» кожен гравець має номер. Учитель називає номер, і названі гравці біжать до позначки й назад. Хто швидший — приносить очко команді. «Останній вибуває» — хто останнім виконав завдання, той вибуває з гри. «Коники» — гравці рухаються стрибками, як коники.", "Ігри на швидкість розвивають реакцію: уміння миттєво почати рух після сигналу."], "ul": ["Слухай уважно свій номер.", "Стартуй одразу після сигналу.", "Біжи до позначки по своїй доріжці, щоб не зіткнутися.", "У «Кониках» стрибай м’яко.", "Не засмучуйся, якщо вибув, — підтримуй інших."]}, {"h": "Футбол. Удари по м’ячу головою з місця на точність", "p": ["Удар головою виконують лобом — це найміцніша й найбезпечніша частина голови. Ноги на ширині плечей, корпус відхиляється назад, а потім різко подається вперед. Очі відкриті, шия напружена.", "На уроках у 5 класі використовують легкі, м’які м’ячі і виконують лише прості удари з невеликої відстані. Учитель стежить, щоб ніхто не перевантажувався."], "ul": ["Бий тільки лобом, не тім’ям і не скронею.", "Не заплющуй очі.", "Шия напружена, підборіддя трохи опущене.", "Використовуй легкий м’яч.", "Відчув біль чи запаморочення — одразу припини вправу."]}, {"h": "Панна. Удари по м’ячу, що котиться, внутрішньою частиною стопи та серединою підйому", "p": ["Бити по м’ячу, що котиться, складніше, ніж по нерухомому: треба вгадати, де він буде в момент удару. Опорну ногу ставлять трохи попереду м’яча, якщо він котиться назустріч.", "Внутрішньою частиною стопи б’ють на точність з близької відстані, серединою підйому — коли потрібно сильніше і далі."], "ul": ["Дивись на м’яч до самого удару.", "Оцінюй швидкість м’яча.", "Не поспішай із замахом.", "Удар підйомом — носок униз, гомілкостоп напружений.", "Спочатку тренуйся з повільними передачами."]}], "f": "Лоб — одна з найміцніших ділянок черепа, тому у футболі б’ють саме ним.", "pr": ["Пограй з рідними у «Виклик номерів» без бігу: замість пробіжки названий гравець має швидко присісти й встати. Запиши, хто реагував найшвидше.", "Намалюй людину, яка виконує удар по м’ячу головою, і підпиши 4 правила правильного виконання."], "q": ["Як грати у «Виклик номерів»?", "Яку частину голови використовують для удару?", "Що робити, якщо після удару головою закрутилася голова?", "Куди ставлять опорну ногу, коли м’яч котиться назустріч?"]}, {"n": "17", "t": "Всесвітні рухливі ігри на спритність і увагу, футбольні естафети, ведення з пересуваннями", "g": "Учень познайомиться з рухливими іграми народів світу, вивчить ігри «Правильний рух», «Абетка», «Баранець», закріпить футбольні естафети та навчиться поєднувати пересування з веденням м’яча.", "k": "Модулі: Рухливі ігри · Футбол · Панна", "terms": [["Всесвітні рухливі ігри", "ігри, поширені в різних країнах світу, часто зі схожими правилами, але різними назвами."], ["Увага", "здатність зосередитися на важливому і не відволікатися."], ["Зміна напрямку", "швидкий поворот руху в інший бік без втрати рівноваги."], ["Фінт", "обманний рух, яким гравець вводить суперника в оману."]], "th": [{"h": "Рухливі ігри. Всесвітні рухливі ігри. Ігри на спритність і увагу: «Правильний рух», «Абетка», «Баранець»", "p": ["У різних країнах діти грають у дуже схожі ігри: квача, хованки, ігри з м’ячем. Це показує, що гра об’єднує людей незалежно від мови.", "У грі «Правильний рух» ведучий показує рухи, а гравці мають повторювати лише правильні (наприклад, ті, що супроводжуються словом «так»). «Абетка» — гравці утворюють тілом літери або виконують завдання на певну літеру. «Баранець» — гра з ведучим-«баранцем», який намагається спіймати гравців."], "ul": ["Слухай і дивись уважно — ведучий може «обманювати».", "Повторюй рухи точно.", "Помилився — виконай умову гри без образ.", "Поважай правила ігор інших народів.", "Пропонуй класу ігри, які знаєш сам."]}, {"h": "Футбол. Ігри-естафети з елементами футболу", "p": ["Естафети цього уроку включають ведення з обведенням, зупинку м’яча підошвою на лінії й передачу наступному гравцеві.", "Добре організована естафета — це швидко, весело і безпечно. Для цього кожен знає свою роль, а команда стежить за порядком."], "ul": ["Зупиняй м’яч на лінії підошвою.", "Обводь фішки без дотику до них.", "Дотримуйся черги.", "Не виходь на доріжку іншої команди.", "Після фінішу підтримуй товаришів."]}, {"h": "Панна. Поєднання прийомів пересування з веденням м’яча", "p": ["У грі гравець не просто веде м’яч, а постійно змінює швидкість і напрям: зупиняється, рушає, повертає. Поєднання цих пересувань з веденням робить гравця непередбачуваним для суперника.", "Тренуйся вести м’яч і за сигналом змінювати напрям, зупиняти м’яч підошвою, робити крок убік і знову рушати."], "ul": ["Зміна напрямку — зовнішньою або внутрішньою частиною стопи.", "Зупинка — підошвою.", "Старт після зупинки — коротким поштовхом.", "Тримай м’яч близько, коли повертаєш.", "Найпростіший фінт — показати рух в один бік і піти в інший."]}], "f": "Гра в квача відома у багатьох країнах світу, хоча скрізь вона має свою назву.", "pr": ["Дізнайся і запиши правила однієї рухливої гри з іншої країни. Поясни, чим вона схожа на українські ігри.", "Пограй з рідними в «Правильний рух»: показуй рухи (руки вгору, присісти, плеснути), а вони повторюють тільки після слова «так». 5 хвилин гри."], "q": ["Чому рухливі ігри різних народів часто схожі?", "Як грати в «Правильний рух»?", "Як зупинити м’яч під час естафети?", "Що таке фінт?"]}, {"n": "18", "t": "Естафети за спрямованістю дій, удар головою на дальність, зупинка м’яча підошвою", "g": "Учень дізнається, як поділяють естафети за спрямованістю рухових дій, вивчить техніку удару по м’ячу головою на дальність та зупинку м’яча підошвою.", "k": "Модулі: Рухливі ігри · Футбол · Панна", "terms": [["Спрямованість естафети", "головна якість чи навичка, яку розвиває естафета: швидкість, спритність, сила."], ["Скакалка", "мотузка з ручками для стрибків."], ["Дальність удару", "відстань, на яку пролітає м’яч після удару."], ["Підошва", "нижня частина стопи, якою можна зупиняти й котити м’яч."]], "th": [{"h": "Рухливі ігри. Естафети за спрямованістю рухових дій: «Естафета комбінована», «Скакалка під ногами», «Альпіністи»", "p": ["Естафети поділяють за тим, що вони розвивають: швидкісні (біг), силові (перенесення, перетягування), координаційні (стрибки, обходи), комбіновані (усе разом).", "У «Скакалці під ногами» двоє гравців тримають скакалку і проводять її під ногами всієї команди, а гравці підстрибують. В «Альпіністах» команда долає «гору» — перешкоди з лав, матів, проходячи їх обережно."], "ul": ["Перестрибуючи скакалку, стрибай невисоко й м’яко.", "Тримай скакалку низько.", "В «Альпіністах» — повільно й обережно, страхуй товариша.", "Не штовхай того, хто попереду.", "Обирай естафети відповідно до мети уроку."]}, {"h": "Футбол. Удари по м’ячу головою з місця на дальність", "p": ["Для удару на дальність потрібно більше сили: корпус сильніше відхиляється назад, а потім різко рухається вперед. Удар лобом по нижній половині м’яча посилає його вгору і далеко.", "У 5 класі такі удари виконують з легкими м’ячами, кілька повторень, з перервами."], "ul": ["Удар виконується рухом усього тулуба, а не лише шиї.", "Ноги стоять стійко, одна попереду.", "Очі відкриті до моменту удару.", "Мало повторень — шия не повинна втомлюватися.", "Удар головою — лише за дозволом учителя."]}, {"h": "Панна. Зупинка м’яча підошвою (в парах, в колонах)", "p": ["Зупинка підошвою — швидкий і надійний спосіб залишити м’яч на місці. Нога піднімається, носок трохи вгору, підошва м’яко накриває м’яч зверху.", "У парах партнери передають м’яч один одному і зупиняють його підошвою. У колонах кожен по черзі приймає м’яч і зупиняє, а потім передає далі."], "ul": ["Не став ногу на м’яч усією вагою — можна послизнутися.", "Носок трохи піднятий.", "Опорна нога злегка зігнута.", "Після зупинки м’яч під контролем.", "Чергуй праву й ліву ногу."]}], "f": "Зупинку м’яча підошвою дуже часто використовують у міні-футболі та панні, бо там мало місця.", "pr": ["Розподіли естафети, які ти знаєш, за спрямованістю: швидкісні, силові, координаційні, комбіновані. Склади таблицю.", "Виконай вправу на рівновагу «Ластівка» біля стіни: тримайся рукою за стіну, нахились уперед і підніми одну ногу назад — по 15 секунд на кожну ногу, 2 рази."], "q": ["Як поділяють естафети за спрямованістю?", "Як правильно грати у «Скакалку під ногами»?", "Чим удар головою на дальність відрізняється від удару на точність?", "Чому не можна ставати на м’яч усією вагою?"]}, {"n": "19", "t": "Стройові вправи та етапи навчання в іграх, захист у футболі, метання малого м’яча", "g": "Учень повторить стройові й загальнорозвивальні вправи, дізнається про індивідуальні дії в захисті у футболі та вивчить техніку метання малого м’яча «із-за голови через плече».", "k": "Модулі: Рухливі ігри · Футбол · Панна", "terms": [["Захисник", "гравець, який заважає суперникові забити гол і відбирає м’яч."], ["Відбір м’яча", "дія, якою гравець забирає м’яч у суперника за правилами."], ["Метання", "кидок предмета на дальність або в ціль."], ["Розбіг у метанні", "кілька кроків перед кидком, які додають швидкості снаряду."]], "th": [{"h": "Рухливі ігри. Стройові та загальнорозвивальні вправи. Поєднання рухів і навичок", "p": ["Будь-який урок починається зі стройових вправ та ЗРВ. Вони налаштовують на роботу й розігрівають організм.", "Навчання в рухливих іграх відбувається поетапно: спочатку вивчаємо окремі рухи (біг, стрибок, кидок), потім поєднуємо їх, а згодом використовуємо в грі. Так навичка стає міцною."], "ul": ["Етап 1 — знайомство з рухом.", "Етап 2 — повторення і виправлення помилок.", "Етап 3 — поєднання рухів.", "Етап 4 — використання у грі.", "ЗРВ виконують від голови до ніг."]}, {"h": "Футбол. Індивідуальні дії в захисті", "p": ["Захисник повинен заважати супернику передати м’яч, вести його і бити по воротах. Для цього він стає між суперником і своїми воротами, тримає невелику відстань і стежить за м’ячем, а не за рухами ніг суперника.", "Відбирати м’яч треба чесно: ногою по м’ячу, а не по ногах. Штовхання, підніжки й хапання за одяг заборонені правилами."], "ul": ["Стань між суперником і своїми воротами.", "Стійка — ноги злегка зігнуті, бокова.", "Дивись на м’яч.", "Не кидайся в ноги — чекай моменту.", "Закривай напрямок передачі."]}, {"h": "Панна. Метання малого м’яча способом «із-за голови через плече» (тримання снаряда і розбіг)", "p": ["Малий м’яч тримають пальцями, а не долонею: великий палець і мізинець з боків, решта — ззаду. Під час розбігу рука з м’ячем спочатку біля плеча, потім відводиться назад.", "Кидок виконується «через плече»: рука проходить над плечем, лікоть вище плеча, м’яч вилітає вперед-угору. Метання — лише на стадіоні чи в залі, за сигналом учителя, у бік, де немає людей."], "ul": ["Тримай м’яч пальцями.", "Розбіг — кілька рівномірних кроків.", "Перед кидком рука відведена назад.", "Кидок — рухом від ніг через тулуб до руки.", "Ніколи не кидай, якщо в напрямку кидка є люди."]}], "f": "У метанні сила кидка йде не лише від руки — у ньому працюють ноги, тулуб і плече.", "pr": ["Намалюй три фази метання малого м’яча: тримання, розбіг, кидок. Підпиши кожну.", "Імітуй удома рух метання без м’яча: 10 повільних «кидків» правою рукою і 10 лівою, звертаючи увагу на лікоть вище плеча."], "q": ["Які етапи навчання рухових навичок ти знаєш?", "Де має стояти захисник щодо суперника і своїх воріт?", "Як правильно тримати малий м’яч?", "Коли метати м’яч заборонено?"]}, {"n": "20", "t": "Ігри на силу «Влуч у ціль», «Козак», «Два цапки», футбольні естафети, «Гонка м’ячів»", "g": "Учень вивчить рухливі ігри для розвитку сили, закріпить естафети з елементами футболу та дізнається правила естафети «Гонка м’ячів №1».", "k": "Модулі: Рухливі ігри · Футбол · Панна", "terms": [["Ціль", "об’єкт, у який потрібно влучити."], ["Рівновага", "здатність утримувати стійке положення тіла."], ["Передача по колу", "почергове передавання м’яча від гравця до гравця, що стоять колом."], ["Змагальний дух", "бажання чесно перемогти й показати найкращий результат."]], "th": [{"h": "Рухливі ігри. Ігри для розвитку сили: «Влуч у ціль», «Козак», «Два цапки»", "p": ["«Влуч у ціль» — гравці кидають м’ячі в мішень з певної відстані; розвиваються сила рук і точність. «Козак» — гра з елементами козацьких забав, де потрібно показати силу та витривалість. «Два цапки» — двоє гравців, стоячи один навпроти одного, намагаються виштовхнути суперника з кола, впираючись долонями.", "Силові ігри проводять у парах, підібраних за силою і зростом, щоб усе було справедливо й безпечно."], "ul": ["Пари підбирають за силою.", "Штовхай лише долонями, не бий.", "Не тягни суперника за одяг.", "Як тільки хтось вийшов за межу — зупинка.", "Кидаючи в ціль, переконайся, що за нею нікого немає."]}, {"h": "Футбол. Ігри-естафети з елементами футболу", "p": ["У естафетах поєднуємо всі вивчені навички: ведення, обведення, зупинку, передачу, удар у ворота.", "Порівнюй свої результати з попередніми естафетами — так ти побачиш свій прогрес."], "ul": ["Пам’ятай про техніку, а не лише про швидкість.", "Передавай м’яч низом.", "Б’ючи по воротах — цілься.", "Чекай своєї черги за лінією.", "Вітай суперника після естафети."]}, {"h": "Панна. Естафета «Гонка м’ячів №1»", "p": ["Гравці стоять колом або колоною й передають м’ячі одне одному. Завдання — щоб м’яч якнайшвидше пройшов усе коло. Можна передавати руками або ногами — залежно від умов.", "Перемагає команда, у якої м’яч «обійде» коло швидше. Головне — точність і злагодженість: втрачений м’яч забирає багато часу."], "ul": ["Передавай м’яч саме сусідові.", "Будь готовий прийняти м’яч у будь-який момент.", "Не кидай м’яч через одного гравця.", "Втрачений м’яч повертає той, хто його впустив.", "Підбадьорюйте одне одного."]}], "f": "У грі «Два цапки» перемагає не завжди сильніший — важливі рівновага та кмітливість.", "pr": ["Виконай силові вправи: віджимання від стіни 10 разів, присідання 15 разів, планка 25 секунд, «супермен» лежачи на животі 8 разів. Повтори двічі.", "Опиши правила гри «Два цапки» і поясни, чому пари потрібно підбирати за силою."], "q": ["Які ігри розвивають силу?", "Що забороняється в грі «Два цапки»?", "Як виконується «Гонка м’ячів»?", "Чому втрата м’яча в естафеті шкодить команді?"]}, {"n": "21", "t": "Рухливі ігри у вихованні молоді, самоконтроль у футболі, ведення підйомом з ударом", "g": "Учень зрозуміє значення рухливих ігор для фізичного виховання дітей і молоді, навчиться прийомів самоконтролю під час занять футболом та дізнається про ведення м’яча серединою підйому з подальшим ударом.", "k": "Модулі: Рухливі ігри · Футбол · Панна", "terms": [["Самоконтроль", "спостереження за власним самопочуттям і станом організму під час занять."], ["Пульс", "частота поштовхів крові в судинах, яка показує, як часто б’ється серце."], ["Самопочуття", "відчуття власного стану: бадьорість, втома, біль."], ["Перевтома", "стан сильної втоми після надмірного навантаження."]], "th": [{"h": "Рухливі ігри. Рухливі ігри як засіб фізичного виховання дітей і молоді України", "p": ["Рухливі ігри є в шкільній програмі, у таборах, спортивних секціях, на святах. Вони доступні для всіх: не потребують дорогого інвентарю і підходять для різного віку.", "Ігри зміцнюють здоров’я, розвивають рухові якості, вчать дружити й поважати правила. Тому рухливі ігри вважають вагомим засобом фізичного виховання."], "ul": ["Зміцнюють серце, легені, м’язи.", "Розвивають швидкість, спритність, витривалість.", "Виховують чесність і відповідальність.", "Допомагають знайти друзів.", "Підходять для будь-якого віку й місця."]}, {"h": "Футбол. Прийоми самоконтролю під час занять", "p": ["Самоконтроль — це вміння слухати свій організм. Під час гри стеж за диханням і самопочуттям. Простий спосіб — порахувати пульс: приклади два пальці до зап’ястя або шиї і порахуй удари за 10 секунд, а потім помнож на 6.", "Порівнюй пульс до заняття, після навантаження і після відпочинку. Якщо пульс швидко відновлюється — організм добре справляється з навантаженням."], "ul": ["Рахуй пульс у спокої вранці.", "Після вправи порахуй ще раз.", "Ознаки перевтоми: запаморочення, нудота, біль у грудях, бліда шкіра.", "При таких ознаках — припини вправу і скажи вчителеві.", "Записуй свої результати в щоденник самоконтролю."]}, {"h": "Панна. Ведення м’яча серединою підйому з наступним ударом по воротах", "p": ["Ведення серединою підйому дозволяє рухатися швидко по прямій. Нога, що веде, трохи зігнута, носок відтягнутий і повернутий донизу, поштовх — легкий, по центру м’яча.", "Перед ударом гравець останнім дотиком відпускає м’яч трохи вперед, ставить опорну ногу поруч і б’є по воротах. Ведення й удар мають злитися в одну дію."], "ul": ["Під час ведення носок дивиться вниз.", "Торкайся м’яча кожні 1–2 кроки.", "Перед ударом підніми голову і подивися на ворота.", "Опорна нога — поруч з м’ячем.", "Удар — без зупинки, з ходу."]}], "f": "Пульс можна знайти на зап’ясті з боку великого пальця або на шиї збоку.", "pr": ["Порахуй свій пульс у спокої (за 10 секунд × 6), потім після 15 повільних присідань і через 2 хвилини відпочинку. Запиши три числа і зроби висновок.", "Напиши 4–5 речень на тему «Чому рухливі ігри потрібні кожній дитині»."], "q": ["Чому рухливі ігри в
