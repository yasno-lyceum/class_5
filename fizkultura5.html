важають важливим засобом фізичного виховання?", "Як порахувати пульс?", "Назви ознаки перевтоми.", "Як ведення переходить в удар по воротах?"]}, {"n": "22", "t": "Ігри на витривалість, ведення з обведенням перешкод і ударом, удари у ворота на точність", "g": "Учень вивчить рухливі ігри для витривалості, дізнається про ведення м’яча з обведенням перешкод і ударом по воротах та про удари на точність.", "k": "Модулі: Рухливі ігри · Футбол · Панна", "terms": [["Переправа", "подолання умовної «річки» або перешкоди в грі."], ["Перешкода", "предмет, який гравець має обійти, перестрибнути чи подолати."], ["Точність", "відповідність результату задуманій меті, наприклад влучання м’ячем у потрібну точку."], ["Квач парами", "різновид квача, у якому гравці бігають, тримаючись парами."]], "th": [{"h": "Рухливі ігри. Ігри для витривалості: «Переправа через річку», «Львівський трамвай», «Квач парами»", "p": ["У «Переправі через річку» гравці перебігають з одного «берега» на інший, а ведучі намагаються їх спіймати. У «Львівському трамваї» гравці бігають «вагончиками», тримаючись одне за одного, і повинні не «розчепитися». У «Квачі парами» бігають і ловлять парами, тримаючись за руки.", "Ці ігри тривалі, тому розвивають витривалість, а також уміння діяти злагоджено з партнером."], "ul": ["У парі домовляйтеся, куди бігти.", "Не тягни партнера різко.", "«Вагончики» бігають у помірному темпі.", "Розподіляй сили на всю гру.", "Після гри — спокійна ходьба і відновлення дихання."]}, {"h": "Футбол. Ведення м’яча з обведенням перешкод і наступним ударом по воротах", "p": ["Вправа поєднує три навички: ведення, обведення фішок і удар. Біля фішки зменшуй швидкість і обходь її внутрішньою чи зовнішньою частиною стопи.", "Після останньої фішки підніми голову, подивися на ворота і бий. Важливо не втратити м’яч після обведення і не бити поспіхом."], "ul": ["Тримай м’яч близько біля перешкод.", "Після обведення — прискорення.", "Перед ударом — погляд на ворота.", "Б’ючи, опорна нога поруч з м’ячем.", "Повертайся на старт збоку, не через ворота."]}, {"h": "Панна. Удари по м’ячу у ворота на точність", "p": ["У панні ворота маленькі, тому влучність особливо важлива. Найточніший удар — внутрішньою частиною стопи.", "Тренуйся бити з різних позицій: прямо, під кутом, з місця і після короткого ведення. Ставь собі мету: влучити в лівий чи правий кут."], "ul": ["Цілься в конкретну точку.", "Бий з невеликої відстані, поступово збільшуючи.", "Перевір постановку опорної ноги.", "Не бий щосили — важливіша точність.", "Рахуй влучання з 10 спроб."]}], "f": "Трамвай у Львові — один із символів міста, тому й гра з «вагончиками» отримала таку назву.", "pr": ["Намалюй схему вправи «ведення з обведенням трьох фішок і удар по воротах» і познач стрілками рух гравця та м’яча.", "Виконай вдома 3 хвилини ходьби на місці з високим підніманням колін, потім 1 хвилину відпочинку — повтори тричі. Запиши, як змінилося дихання."], "q": ["Як грати у «Львівський трамвай»?", "Чому в іграх на витривалість треба розподіляти сили?", "Що робити перед ударом після обведення перешкод?", "Який удар найточніший?"]}, {"n": "23", "t": "Ігри на швидкість «Мисливці і качки», «Наступ», обведення фішок, удари з 7–10 метрів", "g": "Учень вивчить рухливі ігри для розвитку швидкості, удосконалить ведення м’яча з обведенням фішок і дізнається про удари з відстані 7–10 метрів.", "k": "Модулі: Рухливі ігри · Футбол · Панна", "terms": [["Ухиляння", "швидкий рух тілом убік, щоб уникнути дотику м’яча чи ведучого."], ["Наступ", "рух команди вперед з метою досягти певної лінії чи цілі."], ["Обведення фішок", "ведення м’яча з обходом конусів, розставлених у ряд."], ["Відстань удару", "дистанція від м’яча до цілі в момент удару."]], "th": [{"h": "Рухливі ігри. Ігри для швидкості: «Мисливці і качки», «Наступ», «Садіння і збір картоплі»", "p": ["У грі «Мисливці і качки» «мисливці» стоять за колом і кидають легкий м’яч, а «качки» всередині ухиляються. Влучили — «качка» виходить. Кидати можна лише в ноги. «Наступ» — дві команди по черзі наступають і відходять за сигналом. «Садіння і збір картоплі» — естафета, де треба розкласти предмети по колах і зібрати їх назад.", "Ці ігри розвивають швидкість реакції та бігу."], "ul": ["У «Мисливцях і качках» кидай тільки в ноги, м’яким м’ячем.", "Ухиляйся, а не відштовхуй інших.", "У «Наступі» рухайся за сигналом.", "В естафеті з «картоплею» клади предмет, а не кидай.", "Чесно виходь з гри, якщо в тебе влучили."]}, {"h": "Футбол. Ігри-естафети. Техніка ведення м’яча з обведенням фішок", "p": ["Обведення фішок «змійкою» вимагає коротких дотиків і постійного контролю. Обходь фішку то правою, то лівою ногою, змінюючи частину стопи.", "Чим ближче розставлені фішки, тим частіше треба торкатися м’яча. Швидкість збільшуй лише тоді, коли рухи виходять без помилок."], "ul": ["Обходь фішки по черзі з різних боків.", "Використовуй внутрішню й зовнішню частину стопи.", "Корпус над м’ячем.", "Не збивай фішки.", "Після «змійки» — передача наступному гравцеві."]}, {"h": "Панна. Удари по м’ячу вивченими способами з 7–10 метрів з місця", "p": ["Удар з 7–10 метрів — середня відстань, з якої вже потрібні і сила, і точність. Для точного удару використовуй внутрішню частину стопи, для сильнішого — середину підйому.", "Б’ючи з місця, особливо важливо правильно поставити опорну ногу та зробити замах від стегна."], "ul": ["Відміряй відстань кроками.", "Вибери спосіб удару залежно від мети.", "Бий у центр м’яча, щоб він летів низом.", "Дивись на м’яч у момент удару.", "Порівнюй результати різними ногами."]}], "f": "Гра «Мисливці і качки» дуже схожа на спортивну гру доджбол, з якою ти познайомишся пізніше.", "pr": ["Опиши правила гри «Мисливці і качки» і поясни, чому кидати м’яч можна тільки в ноги.", "Виконай вправу на швидкість реакції вдома: рідні плескають у долоні, а ти якнайшвидше присідаєш і встаєш. 3 серії по 8 сигналів."], "q": ["Чому в «Мисливцях і качках» кидають тільки в ноги?", "Як обводити фішки «змійкою»?", "Який спосіб удару обрати для точності, а який — для сили?", "Чому важливо дивитися на м’яч у момент удару?"]}, {"n": "24", "t": "Підсумок І чверті: народні ігри, дії в нападі, «Гонка м’ячів №2», діагностична робота", "g": "Учень повторить українські народні ігри, дізнається про індивідуальні дії в нападі у футболі, закріпить удари на точність і швидкість та підготується до діагностичної роботи з теми «Рухливі ігри, футбол, панна».", "k": "Модулі: Рухливі ігри · Футбол · Панна", "terms": [["Відкривання", "переміщення гравця без м’яча у вільну зону, щоб отримати передачу."], ["Відволікання", "рух гравця, який відводить захисника й звільняє місце партнерові."], ["Нападник", "гравець, головне завдання якого — забивати голи."], ["Діагностична робота", "перевірка знань і вмінь з вивченої теми."]], "th": [{"h": "Рухливі ігри. Українські народні ігри «Фарби», «Птахи», «Ріпка». Підсумок модуля", "p": ["Повторюємо улюблені народні ігри та згадуємо все, що вивчили в модулі: історію рухливих ігор, ігри на швидкість, силу, спритність, витривалість, естафети й патріотичні ігри.", "Для діагностичної роботи важливо пам’ятати правила кількох ігор, правила безпеки і те, які якості розвиває кожна гра."], "ul": ["Ігри на швидкість: «Виклик номерів», «Мисливці і качки».", "Ігри на силу: «Вудочка», «Два цапки».", "Ігри на витривалість: «Квач», «Карасі і щука», «Львівський трамвай».", "Ігри на увагу: «Клас, струнко!», «Правильний рух».", "Народні ігри: «Фарби», «Птахи», «Ріпка», «Довга лоза»."]}, {"h": "Футбол. Індивідуальні дії в нападі: відкривання, відволікання. Естафети", "p": ["У нападі важливі не лише дії з м’ячем, а й рухи без нього. Відкривання — коли ти перебігаєш на вільне місце, щоб партнер міг віддати тобі пас. Відволікання — коли ти біжиш так, щоб захисник пішов за тобою і звільнив простір для партнера.", "Підсумок модуля: ти вивчив правила безпеки, стройові вправи, передачі, зупинки, ведення, удари ногою та головою, дії в захисті й нападі."], "ul": ["Відкривайся туди, де немає суперників.", "Подай знак партнерові рукою або голосом.", "Не стій на місці — рухайся.", "Після передачі — знову відкривайся.", "Пам’ятай про чесну гру."]}, {"h": "Панна. Удари на точність, спритність і швидкість. «Гонка м’ячів №2». Діагностична робота", "p": ["«Гонка м’ячів №2» ускладнена: м’яч передається ногами від гравця до гравця, і команда має виконати кілька кіл. Ще одне завдання — швидкі удари у ворота з ходу.", "Діагностична робота виконується за групами результатів (ГР 1, ГР 2, ГР 3). Кожен показує, що вміє: знання правил, техніку удару, ведення, прийом м’яча. Оцінюй себе чесно: що виходить добре, а що варто покращити."], "ul": ["Перед роботою добре розімнися.", "Виконуй вправи технічно правильно, а не лише швидко.", "Повтори правила панни й безпеки.", "Порівняй свої вміння з першими уроками.", "Склади собі мету на наступну чверть."]}], "f": "Найкращі нападники більшу частину матчу рухаються без м’яча, шукаючи вільний простір.", "pr": ["Склади таблицю «Що я вмію в рухливих іграх, футболі та панні»: у першу колонку — вміння, у другу — оцінка від 1 до 5, у третю — що покращити.", "Намалюй схему: нападник відкривається, а партнер віддає йому передачу. Познач стрілками рух гравців і м’яча."], "q": ["Назви по одній грі на швидкість, силу і витривалість.", "Що таке відкривання у футболі?", "Чим відволікання допомагає команді?", "Що ти найкраще навчився робити в цій чверті?"]}]}, {"name": "ІІ чверть. Гімнастика, аеробіка, чирлідинг", "lessons": [{"n": "25", "t": "Вступ до гімнастики, стройові прийоми в аеробіці, безпечна поведінка в чирлідингу", "g": "Учень дізнається, що таке гімнастика та її основні поняття, повторить стройові вправи і різновиди ходьби та бігу, засвоїть правила безпечної поведінки під час виконання фізичних вправ у чирлідингу.", "k": "Модулі: Гімнастика · Аеробіка · Чирлідинг", "terms": [["Гімнастика", "вид спорту і система вправ для розвитку сили, гнучкості, координації та гарної постави."], ["Аеробіка", "виконання ритмічних вправ під музику для зміцнення серця й підвищення витривалості."], ["Чирлідинг", "вид спорту, що поєднує танцювальні рухи, стрибки, акробатику та підтримку команди закличками."], ["Снаряд", "спортивне обладнання, на якому або з яким виконують вправи."]], "th": [{"h": "Гімнастика. Загальна характеристика та основні поняття. Правила", "p": ["Гімнастика — одна з найдавніших систем фізичних вправ. Вона включає стройові вправи, загальнорозвивальні вправи, акробатику (перекиди, стійки, міст), вправи на снарядах (колода, бруси, перекладина, канат, козел) та опорні стрибки.", "На уроках гімнастики діють чіткі правила: виконувати вправу лише з дозволу вчителя, мати страховку, займатися на матах. Головні якості гімнаста — сила, гнучкість, координація, рівновага та сміливість."], "ul": ["Акробатика — вправи на матах: перекиди, стійки, міст.", "Снаряди: колода, бруси, перекладина, канат, козел.", "Страховка — допомога вчителя або партнера під час вправи.", "Виконуй вправу лише тоді, коли попередній учень завершив свою.", "Гімнастика формує красиву поставу."]}, {"h": "Аеробіка. Стройові вправи і прийоми. Різновиди ходьби, бігу", "p": ["Аеробіка теж починається зі стройових вправ: шикування, повороти, перешикування в кілька колон. Це допомагає розставити учнів так, щоб усім було вільно рухатися.", "Різновиди ходьби й бігу під музику — це вже перший крок до аеробіки: рухи стають ритмічними, під рахунок «раз-два-три-чотири»."], "ul": ["Між учнями — відстань витягнутих рук.", "Рухайся під рахунок.", "Ходьба на носках, на п’ятах, з високим підніманням колін.", "Легкий біг на місці і з просуванням.", "Дихай рівно, не затримуй дихання."]}, {"h": "Чирлідинг. Правила безпечної поведінки під час виконання фізичних вправ", "p": ["Чирлідинг поєднує танець, стрибки та акробатику, тому безпека тут дуже важлива. Займаються в зручній формі, кросівках, без прикрас; довге волосся збирають.", "Складні елементи виконують тільки після вивчення простих і лише під наглядом учителя. Якщо щось болить — вправу не виконують."], "ul": ["Обов’язкова розминка всіх груп м’язів.", "Без годинників, сережок, браслетів.", "Волосся зібране.", "Тримай дистанцію в групі.", "Не роби акробатичних елементів самостійно без учителя."]}], "f": "Слово «гімнастика» походить з грецької мови і пов’язане з тренуванням тіла.", "pr": ["Напиши, які вправи належать до гімнастики, аеробіки та чирлідингу (по 3 приклади для кожного).", "Виконай ходьбу на місці під улюблену пісню 3 хвилини: 1 хвилина звичайна, 1 — з високим підніманням колін, 1 — з махами руками."], "q": ["Що таке гімнастика?", "Назви гімнастичні снаряди.", "Чим аеробіка відрізняється від звичайної ходьби чи бігу?", "Які правила безпеки діють у чирлідингу?"]}, {"n": "26", "t": "Безпека в гімнастиці й аеробіці, запобігання травмам, змагання з чирлідингу", "g": "Учень засвоїть правила техніки безпеки на уроках гімнастики й аеробіки, дізнається, як запобігати травмам, і познайомиться з видами змагальної програми в чирлідингу.", "k": "Модулі: Гімнастика · Аеробіка · Чирлідинг", "terms": [["Мат", "м’який товстий килимок, що захищає від ударів під час гімнастичних вправ."], ["Страхування", "підтримка учня вчителем або партнером, яка захищає від падіння."], ["Розтягнення", "травма зв’язок або м’язів через різкий чи надмірний рух."], ["Змагальна програма", "набір виступів, у яких змагаються команди з чирлідингу."]], "th": [{"h": "Гімнастика. Правила техніки безпеки під час занять гімнастичними вправами", "p": ["Гімнастичні вправи виконують на висоті, з обертаннями, тому помилка може призвести до травми. Безпеку забезпечують мати, страхування і правильна послідовність навчання — від простого до складного.", "Перед заняттям учитель перевіряє снаряди, а учні — свою форму. Під час вправ не можна відволікати інших і стояти близько до снаряда, на якому хтось працює."], "ul": ["Займайся лише на матах і з дозволу вчителя.", "Мати лежать щільно, без щілин.", "Руки сухі — щоб не зісковзнути зі снаряда.", "Не виконуй складну вправу без страховки.", "Біля снаряда — лише той, хто виконує вправу."]}, {"h": "Аеробіка. Правила безпеки. Заходи щодо попередження травм", "p": ["В аеробіці багато кроків, стрибків і поворотів, тому найчастіше страждають гомілкостопи та коліна. Щоб цього уникнути, потрібне зручне взуття, рівна підлога та правильна техніка: приземлення на всю стопу, коліна дивляться в напрямку носків.", "Навантаження збільшують поступово. Починають із розминки, закінчують спокійними вправами та розтягуванням."], "ul": ["Взуття з амортизацією, яке добре тримає стопу.", "Коліна не «заходять» усередину.", "Не вмикай занадто швидку музику на початку.", "Пий воду.", "Відчув біль — зупинись."]}, {"h": "Чирлідинг. Правила змагань з окремих видів змагальної програми", "p": ["Змагання з чирлідингу відбуваються в різних видах програми. Найчастіше виділяють чир (виступ з акробатикою, стрибками, підтримками) і чир-денс (танцювальна програма, часто з помпонами). Команди виступають під музику протягом обмеженого часу.", "Судді оцінюють техніку, синхронність, складність, видовищність, побудови та безпеку виконання. За небезпечні елементи чи падіння знімають бали."], "ul": ["Виступ має обмежений час.", "Важлива синхронність команди.", "Оцінюють і техніку, і артистизм.", "Безпека — головна умова виступу.", "Команда виходить і йде з майданчика організовано."]}], "f": "У чирлідингу суддям важливо не лише, наскільки складний виступ, а й наскільки він безпечний.", "pr": ["Склади пам’ятку «Безпека на уроках гімнастики» (6 правил) і повісь її над робочим столом.", "Перевір удома свою поставу біля стіни: торкнися стіни п’ятами, сідницями, лопатками й потилицею — постій так 30 секунд, повтори 3 рази."], "q": ["Навіщо потрібні мати і страхування?", "Які травми найчастіше трапляються в аеробіці і як їх уникнути?", "Що оцінюють судді на змаганнях з чирлідингу?", "Чим чир відрізняється від чир-денсу?"]}, {"n": "27", "t": "Перекиди, міст і стійка на лопатках, аеробіка у фітнесі, позиції рук у чирлідингу", "g": "Учень дізнається техніку перекидів уперед і назад, мосту та стійки на лопатках, зрозуміє місце аеробіки у фітнесі та вивчить базові позиції рук у чирлідингу.", "k": "Модулі: Гімнастика · Аеробіка · Чирлідинг", "terms": [["Перекид", "обертання тіла через голову з послідовним торканням мату спиною."], ["Групування", "положення, коли коліна підтягнуті до грудей, руки обхоплюють гомілки, підборіддя притиснуте до грудей."], ["Міст", "вигнуте положення тіла дугою з опорою на руки і ноги."], ["Фітнес", "заняття для підтримки здоров’я, гарної фігури та самопочуття."], ["Позиція рук", "визначене положення рук у чирлідингу, яке має свою назву."]], "th": [{"h": "Гімнастика. Перекиди вперед і назад у групуванні, міст із положення лежачи, стійка на лопатках", "p": ["Перекид уперед: присід, руки на мат перед собою, підборіддя до грудей, поштовх ногами — перекочування по спині в групуванні і вихід у присід. Перекид назад: з присіду перекочування назад у групуванні, руки біля плечей долонями до мату, поштовх руками і вихід у присід.", "Міст із положення лежачи на спині: руки біля плечей пальцями до ніг, ноги зігнуті; випрямити руки й ноги, піднімаючи тулуб дугою. Стійка на лопатках: з положення лежачи піднімаємо прямі ноги вгору, руки підтримують поперек, тіло тримається рівно на лопатках."], "ul": ["Підборіддя завжди притиснуте до грудей у перекиді.", "Не ставай на голову — котися по спині.", "Міст — з допомогою вчителя.", "У стійці на лопатках не перекладай вагу на шию.", "Виконуй лише на матах, удома — заборонено."]}, {"h": "Аеробіка. Роль і місце аеробіки в системі фітнесу. Регбі-5: рухливі ігри та естафети", "p": ["Фітнес включає різні види занять: аеробіку, силові тренування, вправи на гнучкість. Аеробіка в цій системі розвиває серце, легені, витривалість, координацію та настрій.", "Також у КТП згадано регбі-5 — спрощений різновид регбі для школярів, з овальним м’ячем. На уроці через нього проводять рухливі ігри та естафети з перенесенням і передачею овального м’яча руками."], "ul": ["Аеробіка — ритмічні вправи під музику.", "Вона тренує серцево-судинну систему.", "Підходить для різного віку.", "Овальний м’яч у регбі передають руками.", "У естафетах з регбійним м’ячем — без грубих захоплень."]}, {"h": "Чирлідинг. Базові та додаткові позиції рук", "p": ["Позиції рук — це «абетка» чирлідингу. Руки рівні й напружені, кисті стиснуті в кулаки, рухи — чіткі. Серед базових позицій: «V вгору» (руки вгору під кутом), «V вниз», «Т» (руки в сторони), «руки на поясі», «кинджали» (кулаки біля плечей).", "Додаткові позиції — комбінації базових: одна рука вгору, інша в сторону, «діагональ», «L» тощо. З позицій складаються комбінації на рахунок."], "ul": ["Руки прямі, лікті не згинаються (крім «кинджалів»).", "Кулаки стиснуті, великий палець зверху.", "Позиції фіксуються чітко, без розмахування.", "Плечі опущені.", "Вивчай кожну позицію окремо, потім поєднуй."]}], "f": "У чирлідингу позиції рук мають однакові назви в багатьох країнах, тому команди легко розуміють одна одну.", "pr": ["Намалюй схематично (людинки з паличок) 5 позицій рук чирлідингу і підпиши їх.", "Перед дзеркалом виконай позиції рук «V вгору», «V вниз», «Т», «руки на поясі», «кинджали» по 4 рахунки кожну, 3 рази поспіль."], "q": ["Як правильно виконати перекид уперед?", "Чому під час перекиду підборіддя притиснуте до грудей?", "Яке місце аеробіки у фітнесі?", "Назви базові позиції рук у чирлідингу."]}, {"n": "28", "t": "Лазіння по канату у два й три прийоми, стройові вправи в аеробіці, комбінації в різному темпі", "g": "Учень дізнається техніку лазіння по вертикальному канату у два та три прийоми, повторить стройові прийоми та різновиди ходьби й бігу, навчиться виконувати комбінації чирлідингу в різному темпі під музику.", "k": "Модулі: Гімнастика · Аеробіка · Чирлідинг", "terms": [["Канат", "товста мотузка, закріплена вертикально, для лазіння."], ["Прийом лазіння", "повторюваний цикл рухів рук і ніг, яким піднімаються по канату."], ["Перешикування", "зміна строю, наприклад з однієї колони у дві або три."], ["Ритм", "чергування рухів і пауз через однакові проміжки часу."]], "th": [{"h": "Гімнастика. Лазіння по вертикальному канату у два та три прийоми", "p": ["Лазіння у три прийоми: 1) з вису на прямих руках зігнути ноги і захопити канат стопами (одна стопа на канаті, друга притискає зверху); 2) випрямити ноги, підводячи тіло; 3) перехопити руки вище. Лазіння у два прийоми — швидший спосіб: підтягування з захватом ногами і випрямлення з перехопленням рук.", "Спускаються по канату так само, у зворотному порядку, перехоплюючи руки. Ковзати вниз долонями заборонено — можна обпекти руки."], "ul": ["Під канатом обов’язково лежать мати.", "Підніматися — лише на висоту, дозволену вчителем.", "Спускатися перехватами, не ковзати.", "Ноги міцно затискають канат.", "Руки сухі, без кремів."]}, {"h": "Аеробіка. Стройові вправи і прийоми. Різновиди ходьби, бігу", "p": ["Повторюємо стройові вправи: перешикування з однієї колони у дві чи три, розмикання на витягнуті руки. Так кожен отримує місце для вправ.", "Ходьба й біг виконуються під музику, з різним темпом і рухами рук. Це гарна розминка перед основними кроками аеробіки."], "ul": ["Розмикайся так, щоб не торкатися сусідів.", "Ходьба з рухами рук: вперед, у сторони, вгору.", "Біг на місці з закиданням гомілки.", "Слухай музику і рахуй вісімками.", "Закінчуй ходьбою для відновлення дихання."]}, {"h": "Чирлідинг. Виконання комбінацій у різному темпі, ритмі, під музичний супровід", "p": ["Комбінація — кілька позицій рук або рухів, що йдуть одне за одним. Спочатку її вивчають повільно, під рахунок, потім пришвидшують і виконують під музику.", "Зміна темпу допомагає відчути ритм: той самий рух можна виконати на 1 рахунок або на 2. Важливо, щоб уся команда рухалася разом."], "ul": ["Спочатку — повільно, без музики.", "Потім — під рахунок «1–8».", "Далі — під музику.", "Кожна позиція чітко зафіксована.", "Дивись на свою позицію в дзеркалі."]}], "f": "Лазіння по канату колись входило до програми Олімпійських ігор як окремий гімнастичний вид.", "pr": ["Опиши послідовність лазіння по канату у три прийоми (3 кроки) і намалюй схему положення ніг на канаті.", "Склади й виконай комбінацію з 4 позицій рук чирлідингу на 8 рахунків: спочатку повільно, потім удвічі швидше. Повтори 5 разів."], "q": ["Як лізти по канату у три прийоми?", "Чому не можна ковзати вниз по канату?", "Як виконують перешикування з однієї колони у дві?", "Як вивчають нову комбінацію в чирлідингу?"]}, {"n": "29", "t": "Опорний стрибок «ноги нарізно», історія оздоровчої аеробіки, комбінації з кроками", "g": "Учень дізнається техніку опорного стрибка через козла «ноги нарізно», історію оздоровчої аеробіки та частини уроку аеробіки, навчиться поєднувати комбінації рук із кроками й рухами тулуба.", "k": "Модулі: Гімнастика · Аеробіка · Чирлідинг", "terms": [["Опорний стрибок", "стрибок через снаряд з опорою на нього руками."], ["Гімнастичний місток", "пружна дошка, від якої відштовхуються перед опорним стрибком."], ["Оздоровча аеробіка", "аеробіка для зміцнення здоров’я, а не для змагань."], ["Підготовча частина", "початок заняття, що включає розминку."]], "th": [{"h": "Гімнастика. Опорний стрибок через гімнастичного козла «ноги нарізно» (козел у ширину)", "p": ["Стрибок складається з фаз: розбіг, наскок на місток, поштовх двома ногами, політ, опора руками на козла, розведення ніг у сторони, переліт, приземлення. Руками відштовхуються від козла, а ноги проходять по боках.", "Приземлення — на дві ноги, м’яко, з присіданням, руки вперед або в сторони. Стрибок виконують тільки зі страховкою вчителя, який стоїть за снарядом."], "ul": ["Розбіг — прискорений, але контрольований.", "Поштовх від містка — двома ногами одночасно.", "Руки ставлять на дальній край козла.", "Ноги — широко нарізно.", "За снарядом — учитель для страховки."]}, {"h": "Аеробіка. Історія виникнення та розвитку оздоровчої аеробіки. Частини уроку", "p": ["Оздоровча аеробіка стала популярною у другій половині XX століття, коли люди почали шукати прості способи зміцнити серце й легені. Ритмічні вправи під музику виявилися веселими й доступними для всіх.", "Урок аеробіки має три частини: підготовчу (розминка, ходьба), основну (базові кроки і комбінації з підвищеною інтенсивністю) і заключну (спокійні вправи, розтягування, відновлення дихання)."], "ul": ["Підготовча частина — розігріває організм.", "Основна — найбільше навантаження.", "Заключна — заспокоює пульс і дихання.", "Кожна частина важлива.", "Не пропускай заключну частину."]}, {"h": "Чирлідинг. Комбінації під музику зі зміною положення тулуба та кроками", "p": ["Сьогодні комбінації ускладнюються: до позицій рук додаються кроки (вперед, убік, назад) і зміна положення тулуба (поворот, нахил).", "Щоб рухи виглядали гарно, тримай спину рівно, голову піднятою, а рухи рук — чіткими навіть під час кроків."], "ul": ["Спочатку вивчай кроки окремо.", "Потім додавай руки.", "Поворот тулуба — без втрати рівноваги.", "Рахуй вісімки.", "Посміхайся — це частина виступу."]}], "f": "В опорних стрибках великих змагань використовують не козла, а спеціальний снаряд — «стіл».", "pr": ["Намалюй фази опорного стрибка «ноги нарізно» (від розбігу до приземлення) у вигляді коміксу з 5 кадрів.", "Склади короткий план власного уроку аеробіки на 10 хвилин: що робиш у підготовчій, основній і заключній частинах."], "q": ["Назви фази опорного стрибка.", "Як правильно приземлятися після стрибка?", "З яких частин складається урок аеробіки?", "Що додається до позицій рук у складніших комбінаціях чирлідингу?"]}, {"n": "30", "t": "Два перекиди злито, міст із положення стоячи, базові кроки аеробіки, комбінації на 8 рахунків", "g": "Учень дізнається, як виконати два перекиди вперед злито й міст із положення стоячи з допомогою, вивчить назви базових кроків аеробіки та складе комбінацію позицій рук на 8 рахунків.", "k": "Модулі: Гімнастика · Аеробіка · Чирлідинг", "terms": [["Злито", "виконання двох вправ підряд без зупинки."], ["Упор присівши", "положення в присіді з опорою руками об підлогу."], ["Базовий крок", "основний рух ногами в аеробіці, з якого складаються комбінації."], ["Вісімка", "8 рахунків музики, якими вимірюють довжину комбінації."]], "th": [{"h": "Гімнастика. Два перекиди вперед злито; міст із положення стоячи (з допомогою) — перехід в упор присівши", "p": ["Два перекиди злито: після першого перекиду не встаємо, а одразу з присіду ставимо руки й виконуємо другий. Головне — зберегти групування й напрямок руху по прямій.", "Міст із положення стоячи виконують тільки з допомогою вчителя: учень прогинається назад, вчитель підтримує під спину, руки ставляться на мат. Після мосту з допомогою переходять в упор присівши."], "ul": ["Між перекидами — без пауз, але й без поспіху.", "Котися прямо, не на бік.", "Міст зі стійки — тільки з учителем.", "Голова в мості відкинута назад, погляд на руки.", "Після вправи — легкий нахил уперед для розслаблення спини."]}, {"h": "Аеробіка. Назви базових аеробних кроків. Методика вивчення", "p": ["Базові кроки: марш (ходьба на місці), степ-тач (крок убік і приставлення), V-степ (крок уперед-врізнобіч і назад), грейпвайн (схресний крок убік), ліфт коліна (підйом коліна), кік (мах ногою вперед).", "Новий крок вивчають так: показ, повільне виконання без рук, виконання під рахунок, додавання рук, виконання під музику."], "ul": ["Марш — основа всіх комбінацій.", "Степ-тач — крок убік і приставлення.", "V-степ — ноги описують літеру V.", "Грейпвайн — крок убік, схресно позаду, крок убік, приставити.", "Вивчай від простого до складного."]}, {"h": "Чирлідинг. Комбінації базових позицій рук на 8 рахунків", "p": ["Вісімка — стандартна одиниця в чирлідингу та аеробіці. На кожен рахунок можна виконати одну позицію, або тримати позицію 2 рахунки.", "Склади комбінацію: 1 — руки на поясі, 2 — «Т», 3 — «V вгору», 4 — «V вниз», 5–6 — «кинджали», 7–8 — руки на поясі. Повтори кілька разів, поки не запам’ятаєш."], "ul": ["Кожен рахунок — чітка позиція.", "Переходи — короткі й різкі.", "Тримай рахунок уголос.", "Повтори з різних позицій.", "Запиши свою комбінацію."]}], "f": "Назви базових кроків аеробіки прийшли з англійської мови і використовуються у фітнес-клубах багатьох країн.", "pr": ["Склади власну комбінацію позицій рук чирлідингу на 8 рахунків, запиши її (1 — …, 2 — …) і виконай 5 разів.", "Виконай вдома базові кроки аеробіки — марш, степ-тач, V-степ — по 1 хвилині кожен під музику."], "q": ["Що означає «виконати злито»?", "Чому міст із положення стоячи виконують лише з допомогою?", "Назви 4 базові кроки аеробіки.", "Що таке «вісімка»?"]}, {"n": "31", "t": "Стійка на лопатках і стійка на голові, ЗРВ і відчуття ритму, складання чирів і чантів", "g": "Учень удосконалить стійку на лопатках, дізнається про техніку стійки на голові (хлопці), розучить комплекс загальнорозвивальних вправ під ритм і навчиться складати заклички «чир» і «чант».", "k": "Модулі: Гімнастика · Аеробіка · Чирлідинг", "terms": [["Стійка на голові", "положення вниз головою з опорою на голову і руки, що утворюють трикутник."], ["Чир", "довша кричалка з рухами, що підтримує команду."], ["Чант", "коротка заклична фраза, яку повторюють кілька разів поспіль."], ["Комплекс вправ", "кілька вправ, складених у певному порядку."]], "th": [{"h": "Гімнастика. Стійка на лопатках; стійка на голові (хлопці)", "p": ["Стійка на лопатках — знайома вправа: тіло рівне, ноги разом, носки відтягнуті, руки підтримують спину. Утримують 3–5 секунд, потім плавно опускаються.", "Стійка на голові виконується з упору присівши: руки й голова утворюють трикутник, ноги поступово підіймаються вгору. Вправу роблять тільки на матах і зі страховкою вчителя. Удома цю вправу робити заборонено."], "ul": ["Голова і руки — трикутник, а не лінія.", "Ноги піднімай повільно.", "Вчитель страхує за ноги.", "Виходь зі стійки перекидом або опусканням ніг у присід.", "Біль у шиї — негайна зупинка."]}, {"h": "Аеробіка. Комплекс загальнорозвивальних вправ. Відчуття ритму", "p": ["Комплекс ЗРВ під музику: рухи головою, плечима, руками, нахили тулуба, присідання, випади. Кожна вправа триває 1–2 вісімки.", "Ритм — це «пульс» музики. Слухай сильні долі (1, 3, 5, 7) і роби на них головний рух. Так рухи стануть злагодженими з музикою."], "ul": ["Почни з голови і закінчуй ногами.", "Плесни в долоні на кожен рахунок — так відчуєш ритм.", "Не поспішай за музикою.", "Дихай рівно.", "Обирай музику помірного темпу."]}, {"h": "Чирлідинг. Складання чирів і чантів", "p": ["Чант — коротка ритмічна фраза, яку повторюють кілька разів, наприклад: «Вперед, ЯСНО, вперед!». Чир — довша кричалка, часто з римою і рухами, яку виконують один раз під час перерви.", "Хороша закличка проста, ритмічна, дружня і не ображає суперника. Її супроводжують позиціями рук та оплесками."], "ul": ["Коротко і ритмічно.", "Легко запам’ятати й повторити.", "Згадуй назву своєї команди чи школи.", "Жодних образ на адресу суперника.", "Додавай чіткі рухи рук."]}], "f": "Чанти добре запам’ятовуються саме тому, що вони короткі й ритмічні, як вірш.", "pr": ["Склади власний чант (1–2 рядки) і чир (4 рядки) для підтримки команди ліцею. Запиши їх і придумай до кожного по 2 позиції рук.", "Виконай під музику комплекс ЗРВ: нахили голови, оберти плечима, нахили тулуба, присідання, випади — по 1 вісімці на кожну вправу, 2 кола."], "q": ["Чим стійка на голові відрізняється від стійки на лопатках?", "Чому стійку на голові не можна робити вдома?", "Що таке ритм у музиці?", "Чим чир відрізняється від чанта?"]}, {"n": "32", "t": "Лазіння по канату, базові кроки аеробіки з руками, вправи чирлідингу", "g": "Учень закріпить техніку лазіння по канату, навчиться поєднувати базові кроки аеробіки з роботою рук і повторить основні вправи чирлідингу.", "k": "Модулі: Гімнастика · Аеробіка · Чирлідинг", "terms": [["Хват", "спосіб тримання руками за снаряд."], ["Вис", "положення, коли тіло тримається на руках під снарядом."], ["Робота рук", "рухи рук, що додаються до кроків в аеробіці."], ["Подвійний ритм", "виконання руху вдвічі швидше, на кожен півтакт."]], "th": [{"h": "Гімнастика. Лазіння по вертикальному канату (закріплення)", "p": ["Тепер лазіння виконують плавніше і без зупинок. Важливо, щоб основну роботу виконували не тільки руки, а й ноги: вони тримають тіло, поки руки перехоплюються вище.", "Ті, кому важко лізти, тренують вис на канаті, підтягування з колін і захоплення ногами. Сила рук розвивається поступово."], "ul": ["Хват — однією рукою над іншою.", "Ноги затискають канат при кожному перехопленні.", "Не лізь вище дозволеного.", "Спуск — перехватами, контрольовано.", "Мати — під канатом завжди."]}, {"h": "Аеробіка. Базові кроки аеробіки з роботою рук", "p": ["Крок + руки = аеробна комбінація. Наприклад, марш з рухами рук вперед, степ-тач з руками в сторони, V-степ з руками вгору.", "Спочатку вивчай ноги, потім руки окремо, а потім поєднуй. Якщо збився — продовжуй лише ноги, потім знову додай руки."], "ul": ["Руки рухаються в ритмі кроків.", "Плечі опущені.", "Не згинай спину.", "Помилка — дивитися під ноги.", "Поєднуй нове з уже вивченим."]}, {"h": "Чирлідинг. Вправи чирлідингу", "p": ["Основні вправи чирлідингу — позиції рук, кроки, прості стрибки, танцювальні рухи, вигуки. На цьому уроці повторюємо все вивчене і з’єднуємо в коротку програму.", "Чирлідинг розвиває силу, гнучкість, координацію, витривалість, а також упевненість у собі й командний дух."], "ul": ["Позиції рук — чіткі.", "Кроки — синхронні з командою.", "Голос — гучний, але без крику.", "Вираз обличчя — усміхнений.", "Повторюй програму кілька разів."]}], "f": "Помпони в чирлідингу роблять рухи рук помітнішими для глядачів.", "pr": ["Склади комбінацію аеробіки на 2 вісімки: марш з руками вперед (1 вісімка) + степ-тач з руками в сторони (1 вісімка). Запиши і виконай під музику 5 разів.", "Виконай вправи для сили рук без снарядів: віджимання від стіни 10 разів, стискання м’ячика або згорнутого рушника 20 разів кожною рукою."], "q": ["Яку роль відіграють ноги під час лазіння по канату?", "Як поєднати базовий крок і рух рук?", "Що робити, якщо збився з комбінації?", "Які якості розвиває чирлідинг?"]}, {"n": "33", "t": "Гімнастика: комбінація вправ з рівноваги на гімнастичній колоді", "g": "Учень дізнається, з яких елементів складається комбінація на гімнастичній колоді, як правильно і безпечно її виконувати та як розвивати рівновагу.", "k": "Модулі: Гімнастика", "terms": [["Гімнастична колода", "вузький довгий снаряд на опорах, на якому виконують вправи на рівновагу."], ["Комбінація", "кілька елементів, виконаних один за одним без зупинки."], ["Зіскок", "завершальний елемент, яким гімнаст сходить або зістрибує зі снаряда."], ["Центр ваги", "точка, навколо якої розподілена вага тіла; від її положення залежить стійкість."]], "th": [{"h": "Гімнастика. Комбінація вправ з рівноваги на гімнастичній колоді (дівчата)", "p": ["Комбінація на колоді для 5 класу складається з простих елементів: вскок або заходження на колоду, ходьба на носках, приставні кроки, поворот на носках, рівновага на одній нозі («ластівка» або нога зігнута), присід, зіскок прогнувшись.", "Усі елементи виконують плавно, з рівною спиною і піднятою головою. Руки допомагають тримати рівновагу — їх розводять у сторони."], "ul": ["Погляд — на кінець колоди, а не під ноги.", "Ставь стопу на колоду всією підошвою або на носок, але точно по центру.", "Поворот — на носках, руки вгору.", "Зіскок — м’яке приземлення на дві ноги в напівприсід.", "Під колодою — мати, поруч — страховка вчителя."]}, {"h": "Гімнастика. Розвиток рівноваги. Безпека на колоді", "p": ["Рівновага — уміння зберігати стійке положення тіла. Вона потрібна не лише гімнастам, а й у повсякденному житті: щоб не впасти на слизькій дорозі чи сходах.", "Розвивають рівновагу поступово: спочатку на лінії на підлозі, потім на гімнастичній лаві, і лише після цього на колоді. Хлопці тим часом виконують вправи на рівновагу на лаві та ЗФП."], "ul": ["Починай з низької опори.", "Втрачаєш рівновагу — зійди, а не стрибай невдало.", "Не виконуй вправу, коли на колоді хтось інший.", "Тримай руки в сторони.", "Тренуй рівновагу щодня кілька хвилин."]}], "f": "Ширина гімнастичної колоди на змаганнях — лише близько 10 сантиметрів, а гімнастки виконують на ній навіть сальто.", "pr": ["Пройди вдома по прямій лінії (стрічка або шов на килимі) «п’ятка до носка» 5 разів туди й назад, руки в сторони.", "Виконай «ластівку» біля опори (стілець або стіна) — по 15 секунд на кожну ногу, 3 рази. Запиши, на якій нозі стояти легше."], "q": ["З яких елементів складається комбінація на колоді?", "Куди треба дивитися, рухаючись по колоді?", "Як безпечно зіскочити з колоди?", "Чому рівновагу розвивають поступово — від підлоги до колоди?"]}, {"n": "34", "t": "Самоконтроль у гімнастиці, силові вправи в аеробіці, синхронні рухи в чирлідингу", "g": "Учень навчиться основ самоконтролю під час гімнастичних вправ, вивчить силові вправи аеробіки для різних груп м’язів і дізнається, що таке синхронне виконання рухів.", "k": "Модулі: Гімнастика · Аеробіка · Чирлідинг", "terms": [["Щоденник самоконтролю", "записи про самопочуття, пульс, сон і результати тренувань."], ["Синхронність", "одночасне й однакове виконання рухів усіма учасниками."], ["Група м’язів", "кілька м’язів, що разом виконують певний рух."], ["Навантаження", "обсяг і інтенсивність фізичної роботи."]], "th": [{"h": "Гімнастика. Основи самоконтролю під час занять гімнастичними вправами", "p": ["Під час гімнастики навантаження буває різким: висіння, упори, стрибки. Тому важливо стежити за собою: самопочуття, дихання, пульс, відчуття в м’язах і суглобах.", "Зручно вести щоденник самоконтролю: записувати дату, які вправи виконав, як почувався, пульс до і після. Так видно свій прогрес і вчасно помітно перевтому."], "ul": ["Гарне самопочуття — бадьорість, бажання займатися.", "Погане — слабкість, запаморочення, біль.", "Пульс після відпочинку має швидко знижуватися.", "Не виконуй вправу, якщо щось болить.", "Сон 9–10 годин допомагає відновлюватися."]}, {"h": "Аеробіка. Вправи для розвитку сили м’язів шиї, рук і плечового пояса, тулуба та ніг", "p": ["Силові вправи в аеробіці виконують без важких обтяжень, з вагою власного тіла. Для шиї — повільні нахили з легким опором долоні. Для рук — віджимання від стіни чи лави, згинання рук з легкими гантелями. Для тулуба — підйоми тулуба, планка, «човник». Для ніг — присідання, випади, підйоми на носки.", "Кожну вправу виконують 8–15 разів, плавно, з правильним диханням: зусилля — на видиху."], "ul": ["Шия — тільки повільно, без обертань із силою.", "Віджимання — тіло рівне.", "Підйоми тулуба — без ривків шиєю.", "Присідання — коліна над стопами.", "Видих — на зусиллі."]}, {"h": "Чирлідинг. Спосіб виконання рухів: синхронне виконання", "p": ["Синхронність — головна краса чирлідингу. Коли вся команда робить один рух одночасно, виступ виглядає потужно і гарно.", "Для синхронності рахуйте разом, вивчайте рухи однаково (однаковий кут рук, однакова висота стрибка) і тренуйтеся перед дзеркалом або знімайте себе на відео для аналізу."], "ul": ["Один рахунок для всіх.", "Однакова амплітуда рухів.", "Дивись на сусіда боковим зором.", "Починай і закінчуй рух разом.", "Тренуйтеся спочатку повільно."]}], "f": "У чирлідингу команда може втратити бали, навіть якщо кожен виконав рух добре, але не одночасно з іншими.", "pr": ["Заведи щоденник самоконтролю: протягом тижня записуй щодня пульс у спокої, години сну і самопочуття (добре / нормально / погано).", "Виконай силовий комплекс: 10 присідань, 8 віджимань від стіни, 10 підйомів на носки, планка 20 секунд, 6 «човників» — 2 кола."], "q": ["Що записують у щоденник самоконтролю?", "Назви ознаки поганого самопочуття.", "На якій фазі дихання виконують зусилля?", "Що таке синхронне виконання рухів?"]}, {"n": "35", "t": "ЛФК для хребта й акробатичні комбінації, темп і ритм в аеробіці, асинхронні рухи", "g": "Учень вивчить комплекс лікувальної фізкультури для профілактики викривлень хребта, повторить акробатичні комбінації, навчиться виконувати поєднання аеробіки в різному темпі та дізнається про асинхронне виконання рухів у чирлідингу.", "k": "Модулі: Гімнастика · Аеробіка · Чирлідинг", "terms": [["ЛФК", "лікувальна фізична культура — вправи для відновлення та профілактики порушень здоров’я."], ["Постава", "звичне положення тіла людини, коли вона стоїть, сидить чи ходить."], ["Сколіоз", "бокове викривлення хребта."], ["Асинхронність", "виконання рухів учасниками не одночасно, а по черзі або з затримкою."]], "th": [{"h": "Гімнастика. Комплекс ЛФК для профілактики викривлень хребта. Комбінації з акробатики", "p": ["Хребет школяра навантажується через тривале сидіння, важкий рюкзак, неправильну позу. Вправи ЛФК зміцнюють м’язи спини та живота, які тримають хребет рівно.", "Комплекс: «кішка» (прогинання і вигинання спини стоячи на колінах і руках), «човник» лежачи на животі, «місток» з положення лежачи на спині з піднятим тазом, потягування лежачи, «плавання» руками лежачи на животі. Акробатичну комбінацію (перекид, стійка на лопатках, перекид назад) виконуємо в залі на матах."], "ul": ["Вправи ЛФК — повільно, плавно.", "Кожна вправа — 6–10 повторень.", "Спина не болить під час виконання.", "Рюкзак носи на двох плечах.", "Акробатика — лише в залі з учителем."]}, {"h": "Аеробіка. Виконання поєднань у різному темпі, ритмі, під музику", "p": ["Одне й те саме поєднання кроків можна виконувати повільно (крок на 2 рахунки) і швидко (крок на кожен рахунок). Зміна темпу розвиває координацію й увагу.", "Почни з повільної музики, а коли рухи стануть упевненими, переходь до швидшої. Слухай ритм і не обганяй музику."], "ul": ["Повільний темп — для вивчення.", "Середній — для закріплення.", "Швидкий — для витривалості.", "Не жертвуй технікою заради швидкості.", "Після швидкої частини — повільна для відновлення."]}, {"h": "Чирлідинг. Спосіб виконання рухів: асинхронне виконання", "p": ["Асинхронне виконання — коли учасники роблять рухи не разом, а з затримкою або по черзі. Наприклад, перша група піднімає руки на рахунок 1, друга — на 2, третя — на 3.", "Такі рухи створюють цікаві візуальні ефекти — «хвилі», «каскади». Вони вимагають від кожного точного знання свого рахунку."], "ul": ["Кожен знає свій рахунок.", "Затримка між групами — однакова.", "Не поспішай почати раніше.", "Рух кожного — так само чіткий, як і в синхронному виконанні.", "Дивись на попередню групу, щоб не збитися."]}], "f": "Вправа «кішка» отримала назву тому, що нагадує рухи кота, який потягується.", "pr": ["Виконай вдома комплекс ЛФК: «кішка» 8 разів, «човник» 8 разів, «місток» з положення лежачи 8 разів, «плавання» 10 разів, потягування лежачи 3 рази по 10 секунд.", "Поясни письмово різницю між синхронним і асинхронним виконанням рухів і наведи по одному прикладу."], "q": ["Навіщо потрібна ЛФК для хребта?", "Як рюкзак впливає на поставу?", "Навіщо змінювати темп виконання в аеробіці?", "Що таке асинхронне виконання рухів?"]}, {"n": "36", "t": "Опорний стрибок «ноги нарізно» (закріплення), різновиди кроків аеробіки, «ріплами»", "g": "Учень удосконалить знання техніки опорного стрибка, дізнається про різновиди основних кроків аеробіки та зрозуміє, як виконувати рухи потоком — «ріплами».", "k": "Модулі: Гімнастика · Аеробіка · Чирлідинг", "terms": [["Наскок", "останній крок розбігу, яким потрапляють на місток двома ногами."], ["Переліт", "фаза стрибка, коли тіло пролітає над снарядом."], ["Ріпл", "потокове виконання руху учасниками один за одним, схоже на хвилю."], ["Ударний крок", "крок аеробіки, під час якого стопа ненадовго відривається від підлоги."]], "th": [{"h": "Гімнастика. Опорний стрибок через козла «ноги нарізно» (закріплення)", "p": ["Повторюємо фази стрибка і звертаємо увагу на типові помилки: слабкий поштовх від містка, руки ставлять на близький край козла, ноги розводять недостатньо широко, жорстке приземлення.", "Щоб стрибок вийшов, розбіг має бути рівномірним із прискоренням, наскок — на дві ноги, а поштовх руками — активним."], "ul": ["Помилка 1 — наскок з однієї ноги.", "Помилка 2 — затримка на козлі.", "Помилка 3 — ноги чіпляють снаряд.", "Помилка 4 — приземлення на прямі ноги.", "Завжди — страховка вчителя."]}, {"h": "Аеробіка. Різновиди основних кроків", "p": ["Кроки аеробіки поділяють на безударні (стопа не відривається від підлоги, наприклад марш, степ-тач) і ударні (з легким підскоком, наприклад джампінг-джек, біг на місці).", "Ударні кроки дають більше навантаження, тому їх чергують із безударними. Для початківців спочатку краще вивчати безударні."], "ul": ["Безударні — для розминки й вивчення.", "Ударні — для основної частини.", "Приземлення — м’яке, на передню частину стопи з опусканням на п’яту.", "Коліна злегка зігнуті.", "Чергуй кроки для відпочинку."]}, {"h": "Чирлідинг. Потокове виконання «ріплами»", "p": ["Ріпл — це «хвиля»: рух починає перший учасник, на наступний рахунок його повторює другий, потім третій і так далі. Так рух «пробігає» вздовж шеренги.", "Ріпли виглядають ефектно, тому їх часто використовують на початку або в кінці виступу. Для хорошого ріплу всі повинні знати свій рахунок."], "ul": ["Стійте в шерензі рівно.", "Кожен робить рух на свій рахунок.", "Рух однаковий у всіх.", "Хвиля може йти в обидва боки.", "Тренуйтеся спочатку з голосним рахунком."]}], "f": "Ріпли нагадують «хвилю», яку роблять глядачі на стадіонах, по черзі встаючи й піднімаючи руки.", "pr": ["Розкажи рідним, що таке ріпл, і спробуйте разом зробити «хвилю» руками, сидячи поруч на дивані. Опиши, що вийшло.", "Випиши типові помилки опорного стрибка і поруч напиши, як їх виправити."], "q": ["Назви типові помилки опорного стрибка.", "Чим ударні кроки відрізняються від безударних?", "Що таке ріпл?", "Коли в виступі використовують ріпли?"]}, {"n": "37", "t": "Відомі гімнасти України, вправи на гнучкість в аеробіці, почергове виконання підгрупами", "g": "Учень дізнається про досягнення українських гімнастів, вивчить вправи на гнучкість для різних груп м’язів і навчиться почергового виконання рухів підгрупами.", "k": "Модулі: Гімнастика · Аеробіка · Чирлідинг", "terms": [["Спортивна гімнастика", "вид гімнастики, у якому змагаються на снарядах та у вільних вправах."], ["Художня гімнастика", "вид гімнастики з виконанням вправ під музику з предметами: м’ячем, обручем, стрічкою, булавами, скакалкою."], ["Амплітуда", "розмах руху."], ["Підгрупа", "частина команди, яка виконує свою частину рухів."]], "th": [{"h": "Гімнастика. Відомі гімнасти України. Стройові вправи", "p": ["Україна має сильну гімнастичну школу. Українські гімнасти й гімнастки ставали чемпіонами та призерами Олімпійських ігор, чемпіонатів світу та Європи у спортивній і художній гімнастиці. Серед відомих імен — олімпійська чемпіонка Лілія Подкопаєва (спортивна гімнастика) та олімпійська призерка Ганна Безсонова (художня гімнастика).", "Їхні перемоги — результат багатьох років щоденних тренувань, дисципліни і віри в себе. Урок розпочинаємо зі стройових вправ, повторюючи шикування й повороти."], "ul": ["Спортивна гімнастика — снаряди та вільні вправи.", "Художня гімнастика — вправи з предметами під музику.", "Спортсмени починають тренуватися з раннього віку.", "Успіх — це наполегливість і праця.", "Дізнавайся про українських чемпіонів — це надихає."]}, {"h": "Аеробіка. Вправи для гнучкості м’язів рук і плечового пояса, тулуба та ніг", "p": ["Вправи на гнучкість роблять після розминки, коли м’язи теплі. Для рук і плечей — потягування, «замок» за спиною, відведення руки за голову. Для тулуба — нахили в сторони, вперед, повороти. Для ніг — випади, нахили до прямих ніг, «метелик».", "Гнучкість розвивається поступово: збільшуй амплітуду обережно, без болю і ривків."], "ul": ["Тримай положення 15–30 секунд.", "Дихай спокійно.", "Не роби пружних ривків.", "Розтягуй обидві сторони однаково.", "Займайся регулярно — результат буде помітним."]}, {"h": "Чирлідинг. Почергове виконання підгрупами", "p": ["Команду ділять на 2–3 підгрупи. Кожна підгрупа виконує свою вісімку, а інші в цей час стоять у фіксованій позі. Потім естафета переходить до наступної підгрупи.", "Почергове виконання робить виступ різноманітним і дає змогу показати кожну групу."], "ul": ["Кожна підгрупа знає свою вісімку.", "Поки чекаєш — тримай фінальну позу.", "Підгрупа починає точно на свій рахунок.", "Переходи між підгрупами плавні.", "В кінці — спільний рух усієї команди."]}], "f": "Лілія Подкопаєва стала абсолютною олімпійською чемпіонкою зі спортивної гімнастики на Іграх 1996 року в Атланті.", "pr": ["Знайди в книжці або розпитай дорослих про одного відомого українського гімнаста чи гімнастку. Напиши 4–5 речень про його (її) досягнення.", "Виконай комплекс на гнучкість: потягування рук угору, «замок» за спиною, нахили в сторони, нахил до прямих ніг сидячи, «метелик» — кожна вправа 20 секунд."], "q": ["Чим спортивна гімнастика відрізняється від художньої?", "Назви відомих гімнастів України.", "Коли можна виконувати вправи на гнучкість?", "Як виконується почергове виконання підгрупами?"]}, {"n": "38", "t": "Ходьба, біг і стрибки в гімнастиці, поєднання аеробіки в різному темпі, робота з помпонами", "g": "Учень повторить різновиди ходьби, бігу та стрибків у гімнастиці, закріпить поєднання аеробіки в різному темпі й дізнається про взаємодію з помпонами — передачі та перекиди.", "k": "Модулі: Гімнастика · Аеробіка · Чирлідинг", "terms": [["Помпон", "яскравий пухнастий предмет з тонких стрічок, який тримають у руках чирлідери."], ["Підскок", "невеликий стрибок з однієї ноги з приземленням на неї ж."], ["Галоп", "біг із підскоками боком або вперед, коли одна нога весь час попереду."], ["Перекид помпона", "підкидання помпона вгору для того, щоб його зловив партнер або ти сам."]], "th": [{"h": "Гімнастика. Різновиди ходьби, бігу та стрибків", "p": ["У гімнастиці ходьба й біг виконуються красиво: на носках, з відтягнутими стопами, рівною спиною. Різновиди: ходьба на носках, у напівприсіді, з махами ніг; біг з високим підніманням стегна, галоп, підскоки.", "Стрибки: на двох ногах, з ноги на ногу, з поворотом, «зірочка». Приземлення — завжди м’яке, на передню частину стопи."], "ul": ["Стопи відтягнуті.", "Спина рівна, голова піднята.", "Руки допомагають рухам.", "Стрибки — м’які, без стуку.", "Дистанція між учнями — 2 кроки."]}, {"h": "Аеробіка. Поєднання у різному темпі під музику. Відчуття ритму", "p": ["Продовжуємо вчитися відчувати ритм. Візьми поєднання з двох вісімок і виконай його спочатку в повільному, а потім у звичайному темпі.", "Ритм можна «почути» тілом: легенько кивай головою або притупуй ногою в такт музиці, перш ніж почати рухатися."], "ul": ["Слухай вступ музики перед початком.", "Почни рух на «1».", "Тримай темп до кінця вісімки.", "Збився — підхопи з наступної «1».", "Повтори кілька разів, поки не вийде впевнено."]}, {"h": "Чирлідинг. Взаємодія за допомогою помпонів: передачі та перекиди", "p": ["Помпони — головний атрибут чир-денсу. Вони підсилюють рухи рук і роблять виступ яскравим. Помпони тримають за ручку всередині, кулак стиснутий.", "Передача — коли помпон простягають партнерові з рук у руки. Перекид — коли помпон невисоко підкидають і ловлять. Ці елементи вимагають точності й уваги."], "ul": ["Тримай помпон міцно, але не напружено.", "Перекидай невисоко.", "Дивись на помпон, поки ловиш.", "Передачі — на рахунок, одночасно в усіх парах.", "Не кидай помпон у обличчя партнеру."]}], "f": "Помпони роблять із тонких пластикових або металізованих стрічок, які блищать на світлі.", "pr": ["Зроби вдома саморобні помпони з паперу або стрічок і склади з ними комбінацію з 4 позицій рук на 8 рахунків.", "Виконай вдома різновиди ходьби: на носках, на п’ятах, у напівприсіді, з високим підніманням колін — по 30 секунд кожен, 2 кола."], "q": ["Як правильно приземлятися після стрибка?", "Що таке галоп?", "Як тримати помпон?", "Чим передача помпона відрізняється від перекиду?"]}, {"n": "39", "t": "Акробатичні комбінації, вправи на розслаблення, взаємодія без помпонів у парах і трійках", "g": "Учень повторить комбінації акробатичних вправ, вивчить вправи на розслаблення м’язів і дізнається про взаємодію в чирлідингу без помпонів — у парах, трійках і четвірках.", "k": "Модулі: Гімнастика · Аеробіка · Чирлідинг", "terms": [["Акробатична комбінація", "кілька акробатичних елементів, виконаних поспіль."], ["Розслаблення", "зменшення напруження м’язів після навантаження."], ["Струшування", "легкі швидкі рухи кінцівками для зняття напруги в м’язах."], ["Взаємодія", "узгоджені дії кількох учасників, які залежать одне від одного."]], "th": [{"h": "Гімнастика. Комбінації елементів з акробатики (хлопці й дівчата)", "p": ["Акробатична комбінація для 5 класу може складатися так: з основної стійки — упор присівши, перекид уперед, перекид назад, стійка на лопатках, перекат, міст з положення лежачи, поворот і вихід в основну стійку.", "Між елементами не повинно бути довгих пауз. Кожен елемент завершується чітким положенням."], "ul": ["Вивчи порядок елементів напам’ять.", "Виконуй плавно.", "Помилка — «падіння» на бік у перекиді.", "Закінчуй комбінацію красиво — руки вгору.", "Тільки на матах і з учителем."]}, {"h": "Аеробіка. Вправи на розслаблення м’язів рук і плечового пояса, тулуба та ніг", "p": ["Після навантаження м’язи потрібно розслабити — так вони швидше відновлюються. Вправи на розслаблення: струшування рук і ніг, вільні махи, нахил уперед з розслабленими руками, лежання на спині з глибоким диханням.", "Розслаблення — обов’язкова частина заключної частини уроку."], "ul": ["Струшуй руки, піднявши їх, потім опусти.", "Нахил уперед — руки вільно звисають.", "Струшування ніг — по черзі, стоячи біля опори.", "Глибоке дихання: вдих носом, повільний видих ротом.", "Спокійна музика допомагає розслабитися."]}, {"h": "Чирлідинг. Взаємодія без помпонів. Вправи в парах, трійках, четвірках", "p": ["Без помпонів чирлідери взаємодіють руками: тримаються за руки, роблять дзеркальні рухи, утворюють спільні фігури. У парі — дзеркальні позиції рук, у трійці — фігури з центральним учасником, у четвірці — «квадрат» чи «хрест».", "Такі вправи вчать довіряти партнерам і точно розраховувати рухи."], "ul": ["Домовтеся, хто з якого боку.", "Дзеркальні рухи — одночасно.", "Тримайте рахунок.", "Беріть одне одного за руки м’яко.", "Жодних підтримок без учителя."]}], "f": "Вправи на розслаблення допомагають не тільки м’язам, а й заспокоюють після хвилювання.", "pr": ["Запиши порядок своєї акробатичної комбінації (5–6 елементів) і намалюй її схемою з людинок-паличок.", "Виконай вдома вправи на розслаблення: струшування рук 15 секунд, нахил уперед з вільними руками 20 секунд, лежання на спині з глибоким диханням 1 хвилину."], "q": ["З яких елементів може складатися акробатична комбінація?", "Навіщо розслабляти м’язи після навантаження?", "Назви 3 вправи на розслаблення.", "Як взаємодіють чирлідери без помпонів?"]}, {"n": "40", "t": "Комбінації на брусах і перекладині, поєднання аеробіки під музику, танцювальні рухи чирлідингу", "g": "Учень дізнається про прості комбінації вправ на брусах і низькій перекладині, закріпить поєднання аеробіки під музику та вивчить танцювальні рухи чирлідингу.", "k": "Модулі: Гімнастика · Аеробіка · Чирлідинг", "terms": [["Бруси", "гімнастичний снаряд із двох паралельних жердин."], ["Перекладина", "горизонтальна металева поперечина для висів і упорів."], ["Упор", "положення, коли тіло тримається на прямих руках над снарядом."], ["Танцювальний рух", "ритмічний рух тілом під музику, що виражає її настрій."]], "th": [{"h": "Гімнастика. Комбінації вправ з акробатики, на брусах і низькій перекладині (хлопці)", "p": ["На брусах виконують упор, ходьбу на руках в упорі, розмахування, зіскок. На низькій перекладині — вис, вис зігнувшись, підтягування, перемахи, зіскок.", "Найважливіше на снарядах — міцний хват і контроль тіла. Кожну вправу виконують тільки з дозволу і під наглядом учителя."], "ul": ["Хват — великий палець обхоплює жердину знизу.", "Руки сухі, магнезія — якщо дозволяє вчитель.", "Не розгойдуйся сильно.", "Зіскок — лише на мат.", "Чекай, поки снаряд звільниться."]}, {"h": "Аеробіка. Виконання поєднань у різному темпі під музику", "p": ["Сьогодні поєднуємо 3–4 вивчені кроки в одну комбінацію: марш, степ-тач, V-степ, грейпвайн — по одній вісімці кожен. Потім додаємо рухи рук.", "Виконуємо спочатку під повільну музику, потім під середню. Слідкуємо за плавністю переходів між кроками."], "ul": ["Переходи між кроками — без зупинки.", "Руки допомагають ритму.", "Тримай поставу.", "Повторюй кілька разів.", "Відпочивай після кожного повторення."]}, {"h": "Чирлідинг. Танцювальні рухи. Поєднання та комбінації під музику", "p": ["Танцювальна частина виступу — це рухи плечима, стегнами, кроки, повороти, оплески, поєднані з позиціями рук. Вони роблять виступ живим і веселим.", "Вивчай танцювальні рухи окремо, потім поєднуй із позиціями рук і кроками в комбінацію на 2–4 вісімки."], "ul": ["Рухи відповідають характеру музики.", "Посмішка й енергія.", "Синхронність з командою.", "Голова піднята, погляд на «глядачів».", "Повтори комбінацію під музику кілька разів."]}], "f": "Бруси та перекладина входять до чоловічого багатоборства спортивної гімнастики разом з іншими снарядами.", "pr": ["Склади комбінацію аеробіки з 4 кроків по 1 вісімці і запиши її. Виконай удома під музику 4 рази.", "Під улюблену пісню придумай 2 вісімки танцювальних рухів у стилі чирлідингу і покажи рідним."], "q": ["Які вправи виконують на брусах?", "Як правильно тримати хват на перекладині?", "Як зробити плавні переходи між кроками аеробіки?", "Чим танцювальна частина важлива в чирлідингу?"]}, {"n": "41", "t": "Рівновага на колоді, підбір рухів під музику, геометричні побудови в чирлідингу", "g": "Учень закріпить комбінацію вправ на гімнастичній колоді, навчиться підбирати рухи аеробіки відповідно до музики та дізнається про вертикальні, горизонтальні й діагональні побудови в чирлідингу.", "k": "Модулі: Гімнастика · Аеробіка · Чирлідинг", "terms": [["Вскок", "спосіб потрапити на снаряд стрибком з опорою руками."], ["Музичний супровід", "музика, під яку виконують вправи."], ["Побудова", "розташування учасників на майданчику у певній фігурі."], ["Діагональ", "лінія, що йде з одного кута майданчика в протилежний."]], "th": [{"h": "Гімнастика. Комбінація вправ з рівноваги на гімнастичній колоді (дівчата)", "p": ["Удосконалюємо комбінацію на колоді: вскок в упор присівши, вставання, ходьба на носках, приставні кроки, поворот, рівновага на одній нозі, присід, зіскок. Тепер завдання — виконати все без зупинок і з гарною поставою.", "Хлопці в цей час виконують вправи на рівновагу на лаві та силові вправи. Усі учні дбають про безпеку: страховка і мати обов’язкові."], "ul": ["Рухи плавні, без поспіху.", "Руки в сторони або вгору — для рівноваги й краси.", "Погляд уперед.", "Рівновагу тримай 2–3 секунди.", "Зіскок — м’який, з фіксацією положення."]}, {"h": "Аеробіка. Відчуття ритму. Підбір рухів відповідно до музики", "p": ["Музика буває швидкою і повільною, веселою і спокійною. Під бадьору музику підходять енергійні кроки й махи руками, під спокійну — плавні рухи та кроки на місці.", "Вправа: прослухай уривок музики, визнач її темп (повільний, середній, швидкий) і підбери кроки, що найкраще підходять."], "ul": ["Швидка музика — ударні кроки, енергійні руки.", "Середня — базові кроки з руками.", "Повільна — розтягування і розслаблення.", "Рахуй вісімки, щоб знайти початок фрази.", "Не обирай занадто швидку музику на початку."]}, {"h": "Чирлідинг. Побудови та перебудови. Вертикальні, горизонтальні, діагональні побудови", "p": ["Побудови — це «малюнок» команди на майданчику. Вертикальна — колона (учасники один за одним), горизонтальна — шеренга (поруч), діагональна — лінія з кута в кут.", "Перебудова — перехід з однієї побудови в іншу за кілька рахунків. Кожен учасник має знати свою точку і шлях до неї."], "ul": ["Геометрично правильна побудова — рівні інтервали між учасниками.", "Перебудовуйся на рахунок.", "Не перетинай шлях іншим.", "Стоячи в побудові, тримай позу.", "Перевіряй рівність ліній поглядом на сусідів."]}], "f": "Глядачам на трибунах побудови команди здаються «живими малюнками», тому їх ретельно продумують.", "pr": ["Підбери три пісні різного темпу (повільну, середню, швидку) і для кожної напиши, які вправи під неї виконувати.", "Намалюй на аркуші три побудови для команди з 6 осіб: вертикальну, горизонтальну й діагональну."], "q": ["З яких елементів складається комбінація на колоді?", "Як підбирати рухи до музики?", "Чим вертикальна побудова відрізняється від горизонтальної?", "Що таке перебудова?"]}, {"n": "42", "t": "Вправи для постави й проти плоскостопості, танцювальні кроки, складні побудови в чирлідингу", "g": "Учень вивчить комплекс вправ для формування постави та профілактики плоскостопості, познайомиться з танцювальними кроками в аеробіці й дізнається про Т-подібні, хрестоподібні, дугоподібні побудови й кола.", "k": "Модулі: Гімнастика · Аеробіка · Чирлідинг", "terms": [["Плоскостопість", "зниження склепіння стопи, через яке стопа гірше пружинить під час ходьби."], ["Склепіння стопи", "природний вигин стопи, що пом’якшує поштовхи під час ходьби й бігу."], ["Танцювальний крок", "крок з елементами танцю, що додає аеробіці виразності."], ["Дугоподібна побудова", "розташування учасників півколом."]], "th": [{"h": "Гімнастика. Комплекс вправ для формування постави та запобігання плоскостопості", "p": ["Правильна постава — голова піднята, плечі розправлені, живіт підтягнутий, спина рівна. Її формують вправи для м’язів спини й живота, а також звичка правильно сидіти.", "Для профілактики плоскостопості корисні ходьба на носках, на п’ятах, на зовнішньому краї стопи, захоплювання дрібних предметів пальцями ніг, катання м’ячика стопою."], "ul": ["Стоячи біля стіни — перевір поставу.", "Ходьба з книжкою на голові.", "Ходьба на носках і на зовнішньому краї стопи.", "Збирання олівців пальцями ніг.", "Катання м’ячика або пляшки стопою."]}, {"h": "Аеробіка. Танцювальні кроки", "p": ["Танцювальні кроки додають аеробіці виразності: ча-ча-ча (три швидкі кроки на місці), мамбо (крок уперед і повернення), кроки з поворотом, крос-степ (схресний крок).", "Вивчаємо кожен крок повільно, потім під музику, поєднуючи з базовими кроками."], "ul": ["Спочатку ноги, потім руки.", "Відчувай ритм.", "Рухайся легко, на передній частині стопи.", "Тримай спину рівно.", "Повторюй, поки крок не стане звичним."]}, {"h": "Чирлідинг. Геометричні побудови: Т-подібні, хрестоподібні, дугоподібні, кола", "p": ["Т-подібна побудова нагадує літеру Т: шеренга зверху і колона знизу. Хрестоподібна — дві лінії, що перетинаються в центрі. Дугоподібна — півколо, коло — учасники стоять по колу на однаковій відстані.", "Такі побудови потребують точного розрахунку місць. Їх відпрацьовують, позначаючи точки на підлозі."], "ul": ["Визнач центр побудови.", "Інтервали — однакові.", "Кожен знає свою точку.", "Перехід — на рахунок.", "Перевіряй форму з боку, як глядач."]}], "f": "Склепіння стопи працює як пружина, пом’якшуючи кожен крок.", "pr": ["Виконай вдома комплекс для стоп: ходьба на носках 30 секунд, на п’ятах 30 секунд, на зовнішньому краї стопи 30 секунд, збирання 10 олівців пальцями ніг, катання м’ячика стопою 1 хвилину кожною ногою.", "Намалюй схеми Т-подібної, хрестоподібної побудови та кола для команди з 8 осіб."], "q": ["Як виглядає правильна постава?", "Які вправи допомагають запобігти плоскостопості?", "Назви два танцювальні кроки аеробіки.", "Що таке хрестоподібна побудова?"]}, {"n": "43", "t": "Вправи на гнучкість, базові кроки аеробіки з руками, перешикування з комбінаціями рук", "g": "Учень вивчить вправи для розвитку гнучкості, удосконалить поєднання кроків аеробіки з рухами рук і навчиться перешиковуватися з однієї побудови в іншу, виконуючи комбінації рук.", "k": "Модулі: Гімнастика · Аеробіка · Чирлідинг", "terms": [["Активна гнучкість", "здатність виконувати рух з великою амплітудою лише силою власних м’язів."], ["Пасивна гнучкість", "здатність досягти великої амплітуди за допомогою зовнішньої сили: партнера, опори, власних рук."], ["Шпагат", "положення, у якому ноги розведені по одній лінії."], ["Перешикування з рухами", "зміна побудови, під час якої учасники одночасно виконують позиції рук."]], "th": [{"h": "Гімнастика. Вправи на розвиток гнучкості", "p": ["Гнучкість потрібна для гарного виконання гімнастичних вправ і зменшує ризик травм. Розрізняють активну (рух силою власних м’язів, наприклад мах ногою) і пасивну (з допомогою, наприклад нахил з тягою руками).", "Вправи: нахили вперед сидячи, «метелик», випади, напівшпагат, «кішка», «міст» з положення лежачи. Виконувати після розминки, плавно, регулярно."], "ul": ["Розминка перед розтягуванням обов’язкова.", "Без ривків — тільки плавно.", "Легкий натяг — так, біль — ні.", "Тренуйся 3–4 рази на тиждень.", "Результат з’являється поступово."]}, {"h": "Аеробіка. Основні рухи та базові кроки з роботою рук у поєднанні з вивченим", "p": ["Збираємо разом усе вивчене: базові кроки, танцювальні кроки, рухи рук. Комбінація з 4 вісімок — це вже маленький танець.", "Для кожної вісімки обери крок і рух рук. Повтори кожну вісімку окремо, потім з’єднай."], "ul": ["Вісімка 1 — марш з руками вперед.", "Вісімка 2 — степ-тач з руками в сторони.", "Вісімка 3 — V-степ з оплесками.", "Вісімка 4 — грейпвайн з руками вгору.", "Виконай усе поспіль під музику."]}, {"h": "Чирлідинг. Перешикування і перебудова з різноманітних побудов з комбінаціями рук", "p": ["Тепер перебудовуємося не просто кроками, а з одночасними позиціями рук. Наприклад, з шеренги в коло за 8 рахунків, змінюючи позиції рук на кожні 2 рахунки.", "Це вимагає уваги: треба стежити і за своїм шляхом, і за руками, і за рахунком."], "ul": ["Спочатку вивчи шлях без рук.", "Потім додай руки.", "Рахуй уголос.", "Не зупиняйся посередині перебудови.", "Фінальна позиція — чітка й однакова в усіх."]}], "f": "Гнучкість легше розвивати в дитячому та підлітковому віці, ніж у дорослому.", "pr": ["Виконай комплекс на гнучкість: нахил уперед сидячи, «метелик», випад уперед, «кішка» — по 20–30 секунд кожна вправа, 2 рази.", "Запиши комбінацію аеробіки з 4 вісімок (крок + руки) і виконай її під музику 3 рази."], "q": ["Чим активна гнучкість відрізняється від пасивної?", "Чому не можна розтягуватися ривками?", "Як скласти комбінацію з 4 вісімок?", "Як перебудовуватися з одночасними рухами рук?"]}, {"n": "44", "t": "Стрибкові вправи з присіду, роль аеробіки для здоров’я, стрибки в чирлідингу", "g": "Учень дізнається техніку підстрибувань з упору присівши та стрибків у присіді, зрозуміє роль аеробіки у зміцненні здоров’я, вивчить додаткові силові вправи та основні стрибки чирлідингу.", "k": "Модулі: Гімнастика · Аеробіка · Чирлідинг", "terms": [["Вистрибування", "стрибок угору з присіду з повним випрямленням тіла."], ["Амортизація", "м’яке гасіння удару під час приземлення згинанням ніг."], ["Серцево-судинна система", "серце й судини, які переносять кров до всіх органів."], ["Стрибок «групування»", "стрибок, у якому коліна підтягнуті до грудей у польоті."]], "th": [{"h": "Гімнастика. Підстрибування вгору з упору присівши; стрибки у присіді з пересуванням", "p": ["Підстрибування з упору присівши: з упору присівши поштовхом двома ногами вистрибнути вгору, руки вгору, тіло випрямлене, і м’яко приземлитися знову в присід. Стрибки у присіді виконують невеликими кроками вперед, убік, назад.", "Ці вправи розвивають силу ніг і стрибучість, але дають велике навантаження на коліна, тому виконуються в залі, на м’якому покритті, у невеликій кількості."], "ul": ["Приземлення — на передню частину стопи з амортизацією.", "Коліна дивляться вперед.", "Спина рівна.", "Невелика кількість повторень.", "Удома ці стрибки не виконувати."]}, {"h": "Аеробіка. Роль аеробіки у зміцненні здоров’я. Додаткові силові вправи", "p": ["Аеробіка тренує серцево-судинну і дихальну системи, підвищує витривалість, покращує координацію, поставу і настрій. Регулярні заняття допомагають підтримувати нормальну вагу тіла.", "Додаткові силові вправи: для шиї — повільні нахили з легким опором долоні; для рук — віджимання від лави; для тулуба — підйоми ніг лежачи, планка; для ніг — випади та підйоми на носки."], "ul": ["Зміцнює серце й легені.", "Покращує настрій.", "Розвиває координацію.", "Формує красиву поставу.", "Силові вправи — 8–12 повторень, без ривків."]}, {"h": "Чирлідинг. Стрибки: прямий стрибок, стрибок ноги нарізно, групування", "p": ["Прямий стрибок — вистрибування вгору з прямим тілом і руками вгору («свічка»). Стрибок ноги нарізно — у польоті ноги розводяться в сторони, руки у «V вгору». Групування — у польоті коліна підтягуються до грудей.", "Кожен стрибок має три фази: підготовка (присід і замах руками), політ, приземлення. Приземлюються на дві ноги, разом, з м’яким згинанням колін."], "ul": ["Підготовка — на рахунок «5-6», стрибок — на «7», приземлення — на «8».", "Приземлення — тихо й м’яко.", "Носки відтягнуті в польоті.", "Голова піднята.", "Стрибки — тільки в залі після розминки."]}], "f": "Слово «аеробіка» пов’язане зі словом «аеробний», тобто таким, що відбувається з участю кисню.", "pr": ["Напиши 5 причин, чому аеробіка корисна для здоров’я.", "Виконай силові вправи без стрибків: 10 випадів на кожну ногу, 15 підйомів на носки, 8 підйомів ніг лежачи на спині, планка 20 секунд — 2 кола."], "q": ["Як виконується підстрибування з упору присівши?", "Що таке амортизація під час приземлення?", "Як аеробіка впливає на здоров’я?", "Назви три основні стрибки чирлідингу."]}, {"n": "45", "t": "Смуга перешкод, комбінації аеробіки, стрибки з руками; узагальнення за І семестр", "g": "Учень дізнається, як проходити гімнастичну смугу перешкод, складе власну комбінацію аеробіки, навчиться поєднувати стрибки з позиціями рук і повторить вивчене за І семестр перед діагностичною роботою.", "k": "Модулі: Гімнастика · Аеробіка · Чирлідинг", "terms": [["Смуга перешкод", "маршрут з кількох перешкод, які треба послідовно подолати."], ["Підлізання", "подолання перешкоди знизу, низько пригнувшись або повзком."], ["Узагальнення", "повторення і поєднання всього вивченого в єдину систему."], ["Група результатів", "рівень навчальних досягнень, за яким оцінюють діагностичну роботу."]], "th": [{"h": "Гімнастика. Бігова смуга перешкод з елементами гімнастики", "p": ["Смуга перешкод поєднує біг, підлізання, перелізання через лаву чи козла, ходьбу по лаві, перекид на маті. Перемагає не лише той, хто швидкий, а й той, хто правильно і безпечно долає кожну перешкоду.", "Підсумок модуля «Гімнастика» за семестр: стройові вправи, акробатика (перекиди, стійки, міст), лазіння по канату, опорний стрибок, вправи на колоді, бруси й перекладина, ЛФК і самоконтроль."], "ul": ["Пройди смугу спершу повільно.", "На кожній перешкоді — правильна техніка.", "Не обганяй на перешкодах.", "Перекид — тільки на маті.", "Фініш — з контролем, не падай."]}, {"h": "Аеробіка. Складання комбінацій з базових кроків під музику. Підсумок", "p": ["Склади свою комбінацію з 4 вісімок, використовуючи базові й танцювальні кроки та руки. Виконай її під музику від початку до кінця.", "Підсумок модуля «Аеробіка»: історія аеробіки, безпека, базові кроки, ударні й безударні кроки, танцювальні кроки, відчуття ритму, силові вправи, вправи на гнучкість і розслаблення."], "ul": ["Початок — на «1».", "Кожна вісімка — новий крок.", "Переходи плавні.", "Темп — під музику.", "Наприкінці — фінальна поза."]}, {"h": "Чирлідинг. Стрибки з комбінаціями позицій рук без музики. Діагностична робота", "p": ["Стрибки поєднують з позиціями рук: наприклад, 1–4 — позиції рук, 5–6 — підготовка, 7 — стрибок ноги нарізно, 8 — приземлення. Без музики легше стежити за рахунком.", "Діагностична робота з теми «Гімнастика, аеробіка» проводиться за групами результатів (ГР 1, ГР 2, ГР 3). Готуйся так: повтори правила безпеки, техніку основних вправ, назви кроків і позицій рук, виконуй усе технічно правильно і спокійно."], "ul": ["Повтори теорію: безпека, назви вправ.", "Виконуй вправи технічно, а не поспіхом.", "Оцінюй себе чесно: що вийшло, що ні.", "Порівняй себе з початком чверті.", "Постав мету на наступний семестр."]}], "f": "Смуги перешкод використовують для тренувань у багатьох видах спорту, бо вони розвивають одразу кілька якостей.", "pr": ["Склади таблицю «Мої досягнення за І семестр»: модуль — що навчився — що хочу покращити (для рухливих ігор, футболу, панни, гімнастики, аеробіки, чирлідингу).", "Склади й запиши свою комбінацію аеробіки з 4 вісімок і виконай її під музику (без стрибків) 3 рази."], "q": ["Які перешкоди можуть бути в гімнастичній смузі?", "Назви основні вправи, вивчені в модулі «Гімнастика».", "Які кроки аеробіки ти знаєш?", "Як поєднати стрибок із позиціями рук на 8 рахунків?"]}, {"n": "46", "t": "Стройові прийоми та вправи на брусах і перекладині, розслаблення й сила, стрибки під музику", "g": "Учень повторить стройові прийоми, закріпить вправи на брусах і низькій перекладині, вивчить додаткові вправи на розслаблення і силу та навчиться виконувати стрибки з позиціями рук під музику.", "k": "Модулі: Гімнастика · Аеробіка · Чирлідинг", "terms": [["Розмикання", "збільшення інтервалів між учнями у строю."], ["Перемах", "рух ногою або обома ногами над снарядом."], ["Чергування навантаження", "зміна напруження й відпочинку під час заняття."], ["Фінальна поза", "положення, яким завершується комбінація чи виступ."]], "th": [{"h": "Гімнастика. Стройові вправи і прийоми. Вправи на брусах і низькій перекладині", "p": ["Стройові прийоми: шикування, розмикання і змикання, повороти кругом, перешикування з однієї шеренги у дві. Вони вчать чіткості й уваги.", "На брусах — упори, розмахування в упорі, зіскок. На низькій перекладині — вис, вис присівши, перемах однією ногою, підтягування. Головне — контроль тіла й безпечний зіскок."], "ul": ["Повороти — на рахунок «раз-два».", "Розмикання — на витягнуті руки.", "Хват міцний, руки сухі.", "Не розгойдуйся без контролю.", "Зіскок — на мат, м’яко."]}, {"h": "Аеробіка. Додаткові вправи на розслаблення і розвиток сили", "p": ["Правильне заняття — це чергування сили й розслаблення. Після силової вправи для рук струшуємо руки; після вправ для ніг — легко струшуємо ноги, ходимо.", "Силові вправи: віджимання від лави, підйоми тулуба, «човник», присідання. Розслаблення: струшування, нахил з вільними руками, глибоке дихання."], "ul": ["Сила — 8–12 повторень.", "Розслаблення — 20–30 секунд.", "Чергуй вправи для різних груп м’язів.", "Слухай свій організм.", "Заверши спокійним диханням."]}, {"h": "Чирлідинг. Стрибки з комбінаціями позицій рук під музику", "p": ["Тепер ту саму комбінацію зі стрибком виконуємо під музику. Музика задає темп, тому важливо почати точно на «1» і стрибнути саме на свій рахунок.", "Уся команда стрибає одночасно — це перевірка синхронності. Наприкінці — чітка фінальна поза."], "ul": ["Почни на «1».", "Стрибок — на заданий рахунок.", "Приземлення разом із командою.", "Руки фіксуються чітко.", "Фінальна поза — усмішка й рівна спина."]}], "f": "Чергування напруження і розслаблення допомагає м’язам працювати довше без втоми.", "pr": ["Склади міні-комплекс «сила + розслаблення» з 4 пар вправ (наприклад, присідання — струшування ніг) і виконай його вдома.", "Виконай вдома стройові повороти на місці («Праворуч!», «Ліворуч!», «Кругом!») по 5 разів кожен, рахуючи «раз-два»."], "q": ["Що таке розмикання?", "Які вправи виконують на низькій перекладині?", "Навіщо чергувати силові вправи і розслаблення?", "Чим виконання стрибків під музику складніше, ніж без неї?"]}, {"n": "47", "t": "Стрибки через скакалку і ЗФП («планка», «скелелаз»), музика в аеробіці, акробатика в чирлідингу", "g": "Учень дізнається техніку стрибків через скакалку, вправи загальної фізичної підготовки для сили рук «планка» і «скелелаз», роль музики в аеробіці та акробатичні елементи чирлідингу.", "k": "Модулі: Гімнастика · Аеробіка · Чирлідинг", "terms": [["ЗФП", "загальна фізична підготовка — вправи для розвитку основних фізичних якостей."], ["Планка", "утримання тіла рівною лінією з опорою на руки (або передпліччя) і носки."], ["Скелелаз", "вправа в упорі лежачи, коли коліна по черзі підтягуються до грудей."], ["Темп музики", "кількість ударів за хвилину, що визначає швидкість рухів."], ["Перекид боком", "акробатичний перекат тіла в бік через спину, у групуванні."]], "th": [{"h": "Гімнастика. Стрибки через скакалку 2 (4) × 30. ЗФП: «планка», «скелелаз»", "p": ["Стрибки через скакалку: ручки скакалки біля стегон, обертають скакалку кистями, а не всією рукою. Стрибають невисоко, на передній частині стопи. Виконують 2 або 4 серії по 30 стрибків із відпочинком.", "«Планка» — тіло рівне від голови до п’ят, живіт підтягнутий, поперек не прогинається. «Скелелаз» — з упору лежачи по черзі підтягувати коліна до грудей, тримаючи таз низько. Ці вправи зміцнюють руки, плечі та прес."], "ul": ["Скакалка підходить за довжиною: стань на середину — ручки до пахв.", "Обертай кистями.", "Стрибки невисокі й м’які.", "«Планка» — рівна лінія тіла.", "«Скелелаз» — без «підкидання» таза."]}, {"h": "Аеробіка. Додаткові вправи на гнучкість і силу. Музика в аеробіці", "p": ["Музика — серце аеробіки. Вона задає темп, допомагає не збитися і піднімає настрій. Для розминки обирають помірну музику, для основної частини — енергійну, для заключної — спокійну.", "Додаткові вправи на гнучкість і силу: нахили, випади, «метелик», віджимання від лави, підйоми тулуба. Вправи виконують у ритмі музики."], "ul": ["Музика з чітким ритмом.", "Темп відповідає частині уроку.", "Рахуй вісімки.", "Гнучкість — плавно.", "Силові вправи — з правильним диханням."]}, {"h": "Чирлідинг. Акробатичні елементи: перекиди, перекид боком, міст", "p": ["Акробатика в чирлідингу робить виступ видовищним. Для 5 класу — прості елементи: перекид уперед і назад, перекид боком (перекочування в групуванні на бік), міст з положення лежачи.", "Акробатику виконують тільки на матах і під наглядом учителя, після доброї розминки. Перед складним елементом обов’язково повторюють простіший."], "ul": ["Перекиди — у групуванні.", "Міст — з положення лежачи.", "Страховка вчителя.", "Не роби акробатику на твердій підлозі.", "Відчув біль у шиї чи спині — зупинись."]}], "f": "«Скелелаз» отримав назву через те, що рухи ніг нагадують підйом по скелі.", "pr": ["Виконай вдома «планку» 3 рази по 20 секунд і «скелелаза» 3 рази по 10 повторень з відпочинком 30 секунд. Запиши, наскільки важко було (від 1 до 5).", "Підбери 3 музичні треки для уроку аеробіки: для розминки, основної та заключної частини, і поясни свій вибір."], "q": ["Як правильно обертати скакалку?", "Як виконується «планка»?", "Яку роль відіграє музика в аеробіці?", "Які акробатичні елементи використовують у чирлідингу для 5 класу?"]}, {"n": "48", "t": "Підсумок ІІ чверті: акробатика, аеробіка, танцювальні рухи чирлідингу, діагностична робота", "g": "Учень підсумує знання з модулів «Гімнастика», «Аеробіка», «Чирлідинг», поєднає танцювальні рухи й вправи чирлідингу під музику та підготується до діагностичної роботи з теми «Чирлідинг».", "k": "Модулі: Гімнастика · Аеробіка · Чирлідинг", "terms": [["Підсумок", "коротке повторення головного з вивченої теми."], ["Виступ", "показ підготовленої програми перед глядачами або суддями."], ["Самооцінка", "чесна оцінка власних знань і вмінь."], ["Програма виступу", "послідовність усіх рухів, побудов і стрибків, які команда показує під музику."]], "th": [{"h": "Гімнастика. Акробатичні вправи. Підсумок знань з модуля", "p": ["За чверть ти вивчив: правила безпеки, стройові вправи, перекиди вперед і назад, два перекиди злито, стійку на лопатках, міст, лазіння по канату, опорний стрибок «ноги нарізно», рівновагу на колоді, вправи на брусах і перекладині, ЛФК для хребта і стоп, самоконтроль.", "Найголовніше в гімнастиці — техніка, безпека і регулярність занять."], "ul": ["Безпека: мати, страховка, дозвіл учителя.", "Акробатика: перекиди, стійки, міст.", "Снаряди: канат, козел, колода, бруси, перекладина.", "Постава і ЛФК.", "Самоконтроль: пульс, самопочуття, щоденник."]}, {"h": "Аеробіка. Узагальнення знань з модуля", "p": ["Аеробіка — ритмічні вправи під музику, які зміцнюють серце, легені й м’язи. Урок аеробіки має підготовчу, основну і заключну частини.", "Ти знаєш базові кроки (марш, степ-тач, V-степ, грейпвайн), ударні та безударні кроки, танцювальні кроки, вмієш складати комбінації з вісімок і підбирати рухи під музику."], "ul": ["Безпека: взуття, рівна підлога, розминка.", "Базові й танцювальні кроки.", "Відчуття ритму і рахунок вісімками.", "Вправи на силу, гнучкість, розслаблення.", "Користь для здоров’я."]
