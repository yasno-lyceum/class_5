}, {"h": "Чирлідинг. Танцювальні рухи під музику. Поєднання вправ. Діагностична робота", "p": ["Поєднуємо все: позиції рук, кроки, танцювальні рухи, побудови, ріпли, стрибки — у коротку програму під музику. Головне — синхронність, чіткість і гарний настрій.", "Діагностична робота з теми «Чирлідинг» проводиться за групами результатів (ГР 1, ГР 2, ГР 3). Повтори назви позицій рук, види побудов, синхронне й асинхронне виконання, правила безпеки і виконай свою частину програми впевнено."], "ul": ["Позиції рук: «V вгору», «V вниз», «Т», «кинджали», руки на поясі.", "Побудови: колона, шеренга, діагональ, коло, хрест.", "Способи: синхронно, асинхронно, ріплами, підгрупами.", "Стрибки: прямий, ноги нарізно, групування.", "Чири і чанти — без образ суперника."]}], "f": "", "pr": ["Склади коротку програму чирлідингу на 4 вісімки (позиції рук, кроки, танцювальні рухи, без стрибків і акробатики), запиши її і покажи рідним під музику.", "Напиши відповіді на питання: «Що мені найбільше сподобалося в ІІ чверті і чому?» та «Що я хочу покращити?» (по 3–4 речення)."], "q": ["Назви 5 вправ, вивчених у модулі «Гімнастика».", "З яких частин складається урок аеробіки?", "Чим синхронне виконання відрізняється від асинхронного?", "Назви види побудов у чирлідингу."]}]}, {"name": "ІІІ чверть. Настільний теніс, шашки, волейбол", "lessons": [{"n": "49", "t": "Нові модулі ІІІ чверті: історія настільного тенісу, шашкова дошка, безпека у волейболі", "g": "Учень знатиме, які модулі вивчатиме в другому семестрі, дізнається про походження настільного тенісу й шашок та запам'ятає правила безпеки на волейбольному майданчику.", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Модуль", "окремий розділ програми з фізичної культури, присвячений одному виду спорту чи групі вправ."], ["Настільний теніс", "спортивна гра, у якій гравці ракетками перебивають легкий м'ячик через сітку на столі."], ["Шашкова дошка", "квадратне поле, поділене на світлі й темні клітинки, на якому грають у шашки."], ["Техніка безпеки", "правила поведінки, що допомагають уникнути травм під час занять."]], "th": [{"h": "Настільний теніс. Історія розвитку в Україні та світі", "p": ["Настільний теніс з'явився в Англії наприкінці ХІХ століття як домашня розвага: спочатку грали на звичайних обідніх столах. Згодом гра стала справжнім спортом зі своїми правилами, а з 1988 року настільний теніс входить до програми Олімпійських ігор. В Україні в нього грають у школах, спортивних секціях і клубах, проводять змагання для дітей і дорослих."], "ul": ["Гра народилася як домашня розвага, а стала олімпійським видом спорту.", "Іноді настільний теніс називають «пінг-понг» — за звуком удару м'ячика.", "Для гри потрібні стіл, сітка, ракетки й легкий пластиковий м'ячик.", "Грати можна вдвох (одиночна гра) або вчотирьох (парна гра).", "Гра розвиває швидкість реакції, спритність і уважність."]}, {"h": "Шашки. Історія гри, поняття про шашкову дошку", "p": ["Шашки — одна з найдавніших настільних ігор: схожі ігри на клітчастих дошках знали ще в давні часи. Сьогодні шашки — визнаний вид спорту, у якому проводять турніри та чемпіонати. Найпоширеніша дошка має 64 клітинки (8 на 8), а в міжнародних шашках — 100 клітинок (10 на 10)."], "ul": ["Клітинки дошки чергуються: світла — темна.", "Грають лише на темних полях.", "Дошку кладуть так, щоб у лівому нижньому кутку кожного гравця було темне поле.", "У кожного гравця шашки свого кольору — білі або чорні.", "Гра тренує пам'ять, увагу та логічне мислення."]}, {"h": "Волейбол. Правила безпеки на ігровому майданчику", "p": ["Перед будь-якою грою з м'ячем важливо подбати про безпеку. На майданчику не повинно бути сторонніх предметів, а взуття — зручне й на неслизькій підошві. Розминка обов'язкова: вона готує м'язи та суглоби до роботи і зменшує ризик травм."], "ul": ["Займайся у спортивній формі, зніми годинник, браслети, прикраси.", "Виконуй вправи лише за командою вчителя.", "Не штовхайся і стеж за м'ячем та партнерами.", "Не вибігай за межі майданчика близько до стін і предметів.", "Якщо щось болить — одразу скажи вчителю."]}], "f": "Назва «пінг-понг» з'явилася через характерні звуки: «пінг» — удар по ракетці, «понг» — відскок від столу.", "pr": ["Намалюй шашкову дошку 8 на 8 клітинок, правильно розфарбуй світлі й темні поля та познач лівий нижній кут.", "Склади й запиши 5 правил безпеки під час гри у волейбол та розкажи їх рідним."], "q": ["Де і як з'явився настільний теніс?", "Скільки клітинок має шашкова дошка у звичайних і в міжнародних шашках?", "На яких полях дошки стоять шашки?", "Чому перед грою у волейбол потрібна розминка?"]}, {"n": "50", "t": "Настільний теніс і зміст гри в шашки, історія волейболу, стройові вправи", "g": "Учень зможе пояснити суть гри в настільний теніс і шашки, розповість, як розвивався волейбол, та знатиме основні стройові команди.", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Розіграш", "частина гри від подачі до моменту, коли один із гравців виграв очко."], ["Партія", "одна завершена гра в шашки від першого до останнього ходу."], ["Стройові вправи", "дії учнів у шерензі чи колоні за командами вчителя."], ["Шеренга", "стрій, у якому учні стоять поруч один з одним плечем до плеча."]], "th": [{"h": "Настільний теніс. Загальна характеристика гри", "p": ["Гравці стоять по різні боки столу й по черзі б'ють по м'ячику так, щоб він перелетів через сітку та торкнувся половини суперника. Очко отримує той, чий суперник помилився: не відбив м'ячик, вибив його за стіл або в сітку. Партія зазвичай триває до 11 очок, але для перемоги потрібна перевага щонайменше у 2 очки."], "ul": ["Кожен розіграш починається з подачі.", "М'ячик має відскочити від столу лише один раз на кожному боці.", "Подавати по черзі: кожні 2 очки подача переходить до суперника.", "Матч складається з кількох партій.", "Головне в грі — точність, швидкість і уважність."]}, {"h": "Шашки. Зміст гри", "p": ["Мета гри в шашки — забрати всі шашки суперника або поставити його в таке становище, коли він не може зробити жодного ходу. Гравці ходять по черзі, починають білі. Шашки рухаються по діагоналі темними полями."], "ul": ["Звичайна шашка ходить вперед по діагоналі на одне поле.", "Шашку суперника можна «побити», перестрибнувши через неї на вільне поле.", "Шашка, що дійшла до останнього ряду, стає дамкою.", "Дамка ходить по діагоналі на будь-яку кількість вільних полів.", "Перемагає той, хто позбавив суперника всіх шашок або ходів."]}, {"h": "Волейбол. Історія розвитку. Стройові вправи", "p": ["Волейбол придумав у 1895 році у США вчитель фізичного виховання Вільям Морган. Гра швидко поширилася світом, а згодом стала олімпійським видом спорту. В Україні волейбол дуже популярний: у нього грають у школах, на пляжах і в спортивних клубах, а українські команди виступають на міжнародних змаганнях."], "ul": ["Стройові вправи допомагають швидко й організовано почати урок.", "«Рівняйсь!» — повернути голову праворуч, вирівнятися в шерензі.", "«Струнко!» — стати рівно, п'яти разом, руки вздовж тулуба.", "«Вільно!» — розслабити одну ногу, не сходячи з місця.", "«Праворуч!», «Ліворуч!» — поворот на місці на 90 градусів."]}], "f": "Спочатку волейбол вигадали як спокійнішу гру, ніж баскетбол, щоб у неї могли грати люди різного віку.", "pr": ["Удома перед дзеркалом виконай стройові команди «Струнко!», «Вільно!», «Праворуч!», «Ліворуч!» по 5 разів.", "Розкажи комусь із рідних, у чому полягає мета гри в шашки і як шашка стає дамкою."], "q": ["До скількох очок триває партія в настільний теніс?", "Яка мета гри в шашки?", "Хто і коли придумав волейбол?", "Що треба зробити за командою «Струнко!»?"]}, {"n": "51", "t": "Швидкість реакції в тенісі, розміщення шашок на дошці, ходьба, біг і гра «Малюкбол»", "g": "Учень знатиме вправи на швидкість реакції, правильно розставлятиме шашки на дошці та розумітиме правила гри «Малюкбол».", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Швидкість реакції", "здатність якнайшвидше відповісти рухом на сигнал."], ["Початкова позиція", "розташування всіх шашок на дошці перед першим ходом."], ["Повільний біг", "біг у спокійному темпі, під час якого можна вільно дихати й розмовляти."], ["Малюкбол", "рухлива гра з м'ячем через сітку, що готує дітей до волейболу."]], "th": [{"h": "Настільний теніс. Вправи для розвитку швидкості реакції", "p": ["У настільному тенісі м'ячик летить дуже швидко, тому гравцеві треба миттєво помітити, куди він летить, і встигнути відбити. Швидкість реакції можна тренувати простими вправами на сигнал: оплеск, слово, зміну кольору картки."], "ul": ["Ловити м'ячик, який партнер несподівано відпускає з руки.", "Плескати в долоні або присідати за сигналом вчителя.", "Вправа «Світлофор»: різні кольори — різні рухи.", "Ловити паличку, яку партнер відпускає згори.", "Головне — бути зосередженим і не відволікатися."]}, {"h": "Шашки. Розміщення шашок на шашковій дошці", "p": ["Перед партією у звичайні шашки кожен гравець ставить 12 шашок на темні поля перших трьох рядів зі свого боку. Середні два ряди залишаються порожніми — там і починається боротьба."], "ul": ["Білі займають ряди 1–3, чорні — ряди 6–8.", "Шашки стоять тільки на темних полях.", "У кожного гравця по 12 шашок.", "Перший хід робить той, хто грає білими.", "Перед грою перевір: у лівому нижньому кутку — темне поле."]}, {"h": "Волейбол. Різновиди ходьби, повільний біг, гра «Малюкбол»", "p": ["Розминку часто починають з різних видів ходьби: на носках, на п'ятах, з високим підніманням стегна, у напівприсіді. Потім виконують повільний біг, щоб розігріти тіло. «Малюкбол» — гра для двох команд, які перекидають м'яч через сітку руками; м'яч можна ловити, а мета — щоб він упав на половині суперника."], "ul": ["Під час ходьби тримай спину рівно, дивись уперед.", "Повільний біг — дихай рівно, не поспішай.", "У «Малюкболі» м'яч кидають через сітку двома руками.", "Команда отримує очко, якщо м'яч торкнувся підлоги на боці суперника.", "Не можна торкатися сітки і заходити на чужу половину."]}], "f": "Тенісисти тренують реакцію так само ретельно, як силу й витривалість, адже м'ячик долітає до суперника менш ніж за секунду.", "pr": ["Попроси когось із рідних плескати в долоні в різному темпі, а ти щоразу присідай або піднімай руки — 2 хвилини.", "Намалюй дошку й розстав на ній 12 білих і 12 чорних шашок у початковій позиції."], "q": ["Як можна тренувати швидкість реакції?", "Скільки шашок у кожного гравця і де вони стоять на початку гри?", "Які види ходьби використовують у розминці?", "Як команда отримує очко в «Малюкболі»?"]}, {"n": "52", "t": "Інвентар для настільного тенісу, різновиди шашок, волейбольний майданчик", "g": "Учень знатиме, який інвентар потрібен для настільного тенісу, чим відрізняються різні види шашок та як розмічено волейбольний майданчик.", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Ракетка", "дерев'яна основа з ручкою, обклеєна гумовими накладками, якою відбивають м'ячик."], ["Накладка", "гумове покриття ракетки, що впливає на швидкість і обертання м'ячика."], ["Чекерс", "англійський різновид шашок, у якому дамка ходить лише на одне поле."], ["Лицьова лінія", "лінія, що обмежує волейбольний майданчик ззаду, за нею виконують подачу."]], "th": [{"h": "Настільний теніс. Інвентар для гри", "p": ["Для гри потрібні стіл із сіткою, ракетки та м'ячики. Стандартний стіл має довжину 2 м 74 см, ширину 1 м 52,5 см і висоту 76 см. М'ячик легкий, пластиковий, діаметром 40 мм. Ракетка складається з дерев'яної основи та гумових накладок різного кольору з двох боків."], "ul": ["Сітка ділить стіл навпіл.", "Біла лінія по центру потрібна для парної гри.", "Накладки бувають з шипами назовні або всередину.", "Ракетку бережуть від ударів і бруду, зберігають у чохлі.", "Тріснутий м'ячик замінюють новим."]}, {"h": "Шашки. Шашки-100 і шашки-64", "p": ["Існує кілька видів шашок. У міжнародні (стоклітинкові) шашки грають на дошці 10 на 10, у кожного гравця по 20 шашок. На дошці 8 на 8 (64 поля) грають у кілька різновидів, що мають трохи різні правила."], "ul": ["Шашки-100: велика дошка, по 20 шашок у гравця.", "Бразильські шашки: дошка 64 поля, але правила як у міжнародних.", "Російські шашки: дошка 64 поля, по 12 шашок, дамка ходить далеко.", "Чекерс (англійські шашки): звичайна шашка не б'є назад, дамка ходить лише на одне поле.", "Перед грою завжди домовляйтеся, за якими правилами граєте."]}, {"h": "Волейбол. Загальна характеристика гри. Розмітка майданчика", "p": ["У волейбол грають дві команди по 6 гравців. Мета — перебити м'яч через сітку так, щоб він упав на половині суперника. Команда може торкнутися м'яча не більше 3 разів, перш ніж перебити його. Майданчик прямокутний, розміром 18 на 9 метрів, його ділить навпіл сітка."], "ul": ["Бічні лінії — довгі лінії з боків майданчика.", "Лицьові лінії — короткі лінії ззаду, за ними виконують подачу.", "Середня лінія — під сіткою, ділить майданчик на дві половини.", "Лінія атаки відділяє передню зону від задньої.", "Лінії входять у площу майданчика: м'яч на лінії — у полі."]}], "f": "Шашки-100 називають міжнародними, бо саме за цими правилами проводять чемпіонати світу.", "pr": ["Намалюй схему волейбольного майданчика й підпиши бічні, лицьові, середню лінії та лінію атаки.", "Запиши у зошит різницю між шашками-100 та шашками-64 (3–4 речення)."], "q": ["Які розміри м'ячика для настільного тенісу?", "Чим чекерс відрізняється від російських шашок?", "Скільки гравців у волейбольній команді на майданчику?", "Як називаються лінії волейбольного майданчика?"]}, {"n": "53", "t": "Ходьба і біг тенісиста, розміщення шашок, зони й перехід у волейболі", "g": "Учень знатиме спеціальні види ходьби й бігу для тенісиста, навчиться правильно розміщувати шашки та зрозуміє, як волейболісти переходять на майданчику.", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Спеціальні вправи", "вправи, що схожі на рухи в певному виді спорту і готують до нього."], ["Приставний крок", "крок, під час якого одна нога приставляється до іншої без схрещування."], ["Зона", "частина волейбольного майданчика, де розташований певний гравець."], ["Перехід", "зміна позицій волейболістів за годинниковою стрілкою після виграшу подачі."]], "th": [{"h": "Настільний теніс. Спеціальні вправи: ходьба і біг", "p": ["Тенісист увесь час рухається біля столу короткими швидкими кроками. Тому в розминку включають ходьбу та біг приставними кроками, схресними кроками, з поворотами, зі зміною напрямку за сигналом."], "ul": ["Ходьба приставними кроками праворуч і ліворуч.", "Біг дрібними кроками на носках.", "Біг зі зміною напрямку за сигналом.", "Ноги злегка зігнуті, вага тіла — на передній частині стопи.", "Не схрещуй ноги під час швидких бічних переміщень, щоб не спіткнутися."]}, {"h": "Шашки. Прийоми розміщення шашок на дошці", "p": ["Від того, як стоять шашки, залежить, наскільки сильна позиція. Шашки краще тримати разом, щоб вони прикривали одна одну. Шашка, яка залишилася одна, легко стає здобиччю суперника."], "ul": ["Шашки, що стоять поруч по діагоналі, захищають одна одну.", "Не поспішай розміщувати шашки на краю дошки: там вони менш активні.", "Центр дошки важливий: звідти шашка має більше ходів.", "Задній ряд допомагає не пропустити шашки суперника в дамки.", "Перед кожним ходом перевір, чи не залишаєш шашку без захисту."]}, {"h": "Волейбол. Розміщення гравців та правила переходу", "p": ["Майданчик кожної команди поділено на 6 зон, їх нумерують від 1 до 6. Зона 1 — праворуч ззаду, звідти подають. Коли команда виграє право подачі в суперника, гравці переходять на одну зону за годинниковою стрілкою."], "ul": ["Зони 2, 3, 4 — передня лінія, біля сітки.", "Зони 1, 6, 5 — задня лінія.", "Подає гравець, який перейшов у зону 1.", "Перехід виконують за годинниковою стрілкою.", "Неправильне розміщення під час подачі — помилка, очко отримує суперник."]}], "f": "Перехід у волейболі придумали для того, щоб кожен гравець побував і біля сітки, і в захисті та вмів грати на всіх позиціях.", "pr": ["Намалюй майданчик однієї команди, пронумеруй зони від 1 до 6 і покажи стрілками напрямок переходу.", "Виконай удома ходьбу приставними кроками праворуч і ліворуч у напівприсіді (2 серії по 10 кроків у кожен бік)."], "q": ["Які спеціальні види ходьби та бігу корисні тенісисту?", "Чому шашки краще тримати разом?", "У якій зоні знаходиться гравець, що подає?", "У якому напрямку переходять волейболісти?"]}, {"n": "54", "t": "Присідання і переміщення тенісиста, нумерація шашкових полів, стійка волейболіста", "g": "Учень знатиме спеціальні вправи для ніг тенісиста, вмітиме називати поля шашкової дошки та правильно ставати в стійку волейболіста.", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Нотація", "спосіб позначення полів і ходів на дошці буквами й цифрами."], ["Вертикаль", "ряд полів дошки, що йде від одного гравця до іншого, позначається буквою."], ["Горизонталь", "ряд полів дошки зліва направо, позначається цифрою."], ["Стійка волейболіста", "положення тіла, з якого гравець готовий швидко рушити до м'яча."]], "th": [{"h": "Настільний теніс. Присідання, стрибкові вправи та переміщення", "p": ["Сильні ноги допомагають тенісисту швидко рухатися й стійко стояти біля столу. На уроці виконують присідання, легкі стрибки на носках та переміщення в різні боки."], "ul": ["Присідання: спина рівна, коліна не виходять далеко за носки.", "Легкі стрибки на носках у місці — як «пружинка».", "Переміщення праворуч-ліворуч приставними кроками.", "Повернення в основну стійку після кожного переміщення.", "Стрибки виконують тільки в залі на рівній поверхні під наглядом вчителя."]}, {"h": "Шашки. Нумерація шашкових полів", "p": ["Щоб записувати ходи, кожне поле дошки має свою назву. Вертикалі позначають латинськими буквами від a до h (зліва направо з боку білих), а горизонталі — цифрами від 1 до 8 (знизу вгору). Назва поля складається з букви та цифри, наприклад, c3."], "ul": ["Ліве нижнє темне поле білих — a1.", "Букву пишуть першою, цифру — другою.", "Білі починають з полів 1–3 горизонталей.", "У шашках-100 поля часто нумерують числами від 1 до 50.", "Знання назв полів допомагає записувати й розбирати партії."]}, {"h": "Волейбол. Стійка волейболіста", "p": ["Стійка — основа всіх дій волейболіста. Із правильної стійки легко рушити вперед, назад чи вбік, прийняти або передати м'яч."], "ul": ["Ноги на ширині плечей або трохи ширше, одна трохи попереду.", "Коліна зігнуті, вага на передній частині стоп.", "Тулуб злегка нахилений уперед, спина рівна.", "Руки зігнуті в ліктях, перед собою.", "Помилки: прямі ноги, вага на п'ятах, опущені руки."]}], "f": "Завдяки нотації можна відтворити партію, зіграну багато років тому, хід за ходом.", "pr": ["Намалюй дошку 8 на 8, підпиши вертикалі буквами a–h і горизонталі цифрами 1–8, назви 5 темних полів.", "Виконай 3 підходи по 10 присідань із рівною спиною та 3 рази затримайся в стійці волейболіста по 20 секунд."], "q": ["Як позначаються вертикалі та горизонталі шашкової дошки?", "Як називається ліве нижнє поле білих?", "Чому тенісисту потрібні сильні ноги?", "Опиши правильну стійку волейболіста."]}, {"n": "55", "t": "Вправи для кисті й пальців тенісиста, назви діагоналей у шашках, спеціальні вправи волейболіста", "g": "Учень знатиме вправи для кисті та пальців, назви головних діагоналей шашкової дошки та спеціальні вправи волейболіста.", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Діагональ", "ряд полів одного кольору, що йде навскіс через дошку."], ["Велика дорога", "найдовша діагональ дошки від a1 до h8."], ["Двійник", "дві паралельні діагоналі g1–a7 та h2–b8."], ["Хват", "спосіб утримання ракетки в руці."]], "th": [{"h": "Настільний теніс. Обертальні рухи кистю, вправи з ракеткою та для пальців", "p": ["Удари в настільному тенісі виконують не лише рукою, а й кистю. Гнучка й сильна кисть допомагає керувати напрямком і обертанням м'ячика. Перед грою розминають кисті та пальці."], "ul": ["Обертання кистями в обидва боки по 10 разів.", "Стискання і розтискання пальців у кулак.", "Обертання ракетки в руці, перехоплення її пальцями.", "Набивання м'ячика ракеткою на місці.", "Ракетку тримай вільно, не стискай надто сильно."]}, {"h": "Шашки. Назви діагоналей", "p": ["Деякі діагоналі мають особливі назви, бо відіграють важливу роль у грі. Найголовніша — велика дорога, що з'єднує кути a1 і h8. Хто контролює її дамкою, той часто має перевагу."], "ul": ["Велика дорога: a1–h8, найдовша діагональ.", "Двійник: дві діагоналі g1–a7 та h2–b8.", "Трійник: діагоналі, що утворюють прямокутник навколо великої дороги (наприклад, c1–h6 та a3–f8).", "Діагоналі завжди складаються з полів одного кольору.", "Запам'ятай назви — так легше розуміти шашкові підручники."]}, {"h": "Волейбол. Спеціальні вправи волейболіста", "p": ["Спеціальні вправи готують тіло до рухів, які виконують у грі: швидких переміщень, передач, прийомів м'яча. Їх виконують у розминці після загальних вправ."], "ul": ["Імітація верхньої передачі без м'яча.", "Переміщення в стійці вперед, назад, убік.", "Вправи для пальців і кистей.", "Підстрибування на місці з витягнутими вгору руками.", "Розтягування плечей і рук."]}], "f": "Діагоналям шашкової дошки дали назви ще давно, щоб гравцям було зручно пояснювати один одному свої плани.", "pr": ["Виконай комплекс для кистей і пальців: обертання кистей, стискання кулаків, «піаніно» пальцями по столу — по 10 разів.", "Намалюй дошку й кольоровими олівцями позначи велику дорогу та двійник."], "q": ["Навіщо тенісисту гнучка кисть?", "Які поля з'єднує велика дорога?", "Що таке двійник?", "Наведи приклади спеціальних вправ волейболіста."]}, {"n": "56", "t": "Імітація ударів і подач, нумерація ходів у шашках, рухлива гра «Малюкбол»", "g": "Учень зрозуміє, навіщо імітувати удари, навчиться описувати хід шашки та повторить правила «Малюкболу».", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Імітація", "виконання руху без м'яча, щоб запам'ятати правильну техніку."], ["Подача", "удар, яким починається кожен розіграш."], ["Номер ходу", "порядкове число, під яким записують пару ходів білих і чорних."], ["Ведучий гравець", "гравець, який керує діями команди в грі."]], "th": [{"h": "Настільний теніс. Імітація ударів і подач з ракеткою і без", "p": ["Перш ніж бити по м'ячику, рух треба запам'ятати. Для цього виконують імітацію: повторюють удар у повітрі перед дзеркалом або за показом вчителя. Спочатку без ракетки, потім із ракеткою."], "ul": ["Займи стійку: ноги на ширині плечей, коліна злегка зігнуті.", "Замах — удар — повернення у вихідне положення.", "Після кожного удару повертайся до готовності.", "Рух має бути плавним, без різких ривків.", "Стеж, щоб поруч не було людей і предметів."]}, {"h": "Шашки. Нумерація ходів, початкове й кінцеве положення шашки", "p": ["Хід записують так: спочатку поле, з якого шашка пішла, потім — куди прийшла. Наприклад, c3-d4. Ходи нумерують: під одним номером пишуть хід білих і відповідь чорних."], "ul": ["Перше поле — початкове положення шашки.", "Друге поле — кінцеве положення шашки.", "Між полями ставлять тире «-», якщо це простий хід.", "Під номером 1 записують перший хід білих і перший хід чорних.", "Запис допомагає потім знайти свої помилки."]}, {"h": "Волейбол. Рухлива гра «Малюкбол»", "p": ["У «Малюкболі» команди перекидають м'яч через сітку, а гравці ловлять його і кидають далі. Гра вчить орієнтуватися на майданчику, стежити за м'ячем і діяти разом із командою."], "ul": ["Кидай м'яч двома руками через сітку.", "Лови м'яч у стійці, не стій на прямих ногах.", "Не бігай з м'ячем у руках.", "Підказуй партнерам, хто ловить м'яч.", "Поважай суперника і рішення судді."]}], "f": "Шахісти й шашкісти здавна записують партії, тож деякі цікаві ігри можна розібрати навіть через багато років.", "pr": ["Перед дзеркалом виконай імітацію удару справа без ракетки 3 серії по 10 разів, стежачи за стійкою.", "Запиши 3 будь-які ходи білих і чорних у нотації з нумерацією (наприклад, 1. c3-d4 f6-e5)."], "q": ["Навіщо виконувати імітацію ударів?", "Як записується хід шашки?", "Що означає номер ходу в записі партії?", "Яких правил треба дотримуватися в «Малюкболі»?"]}, {"n": "57", "t": "Способи переміщення тенісиста, запис шашкових позицій, розміщення гравців у волейболі", "g": "Учень знатиме способи переміщення біля тенісного столу, вмітиме записати позицію в шашках та закріпить знання про розміщення й перехід у волейболі.", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Схресний крок", "крок, під час якого одна нога переходить перед або за іншою."], ["Позиція", "розташування шашок на дошці в певний момент гри."], ["Діаграма", "малюнок дошки з розставленими шашками."], ["Подавальний", "гравець, який виконує подачу із зони 1."]], "th": [{"h": "Настільний теніс. Способи переміщення тенісиста", "p": ["Біля столу тенісист рухається дуже швидко, але на короткі відстані. Головні способи — приставні кроки, схресні кроки, випади та короткі стрибки. Після кожного удару гравець повертається в центр, щоб бути готовим до наступного м'ячика."], "ul": ["Приставні кроки — для коротких переміщень.", "Схресний крок — коли треба дотягнутися далі.", "Випад — для м'ячиків, що летять низько або далеко.", "Тримай коліна зігнутими, не випрямляйся.", "Повертайся у вихідне положення після удару."]}, {"h": "Шашки. Запис шашкових ходів і позицій", "p": ["Позицію записують так: спочатку перелічують поля білих шашок, потім чорних. Дамки позначають окремо, наприклад, буквою «Д». Діаграма — це малюнок такої позиції."], "ul": ["Пиши: «Білі: a1, c3, e3. Чорні: f6, h6».", "Дамку позначай: «Д» перед назвою поля.", "Перевір, чи всі шашки стоять на темних полях.", "Діаграма допомагає побачити позицію без дошки.", "Запис корисний для розв'язування задач."]}, {"h": "Волейбол. Розміщення гравців та правила переходу на майданчику", "p": ["Гравці стоять у двох лініях по троє. У момент подачі кожен має бути у своїй зоні, а після цього гравці можуть рухатися вільно. Перехід виконують тільки тоді, коли команда відігравала подачу в суперника."], "ul": ["Передній ряд: зони 4, 3, 2 (зліва направо).", "Задній ряд: зони 5, 6, 1.", "Під час подачі суперника перехід не виконують.", "Порядок переходу не можна змінювати впродовж партії.", "Сусіди мають стояти правильно один відносно одного."]}], "f": "Найкращі тенісисти за один розіграш можуть зробити більше десятка коротких кроків біля столу.", "pr": ["Намалюй діаграму будь-якої позиції (3–4 білі та 3–4 чорні шашки) і запиши її словами.", "Виконай вдома приставні кроки праворуч і ліворуч по 10 разів у 3 серії, тримаючи коліна зігнутими."], "q": ["Які способи переміщення використовує тенісист?", "Як записати позицію в шашках?", "Які зони складають передній ряд волейбольної команди?", "Коли волейболісти виконують перехід?"]}, {"n": "58", "t": "Зрізки справа і зліва, значки ходів у шашках, сила кистей волейболіста", "g": "Учень зрозуміє, що таке зрізка в настільному тенісі, знатиме спеціальні значки оцінки ходів і вправи для сили кистей рук.", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Зрізка", "захисний удар, після якого м'ячик отримує нижнє обертання."], ["Нижнє обертання", "обертання м'ячика «назад», через яке він летить повільніше й низько відскакує."], ["Тихий хід", "хід без взяття, який не створює прямої загрози."], ["Взяття", "хід, під час якого шашка суперника знімається з дошки."]], "th": [{"h": "Настільний теніс. Захисні прийоми: зрізки справа та зліва", "p": ["Зрізка — спокійний захисний удар. Ракетку трохи відкривають (повертають робочим боком угору) й ведуть зверху вниз і вперед під м'ячик. М'ячик отримує нижнє обертання й летить низько над сіткою."], "ul": ["Справа — удар з правого боку від тіла (для правші).", "Зліва — удар з лівого боку, перед животом.", "Ракетка злегка відкрита, рух зверху вниз — вперед.", "Типова помилка: занадто відкрита ракетка — м'ячик летить високо.", "Після удару одразу повертайся в стійку."]}, {"h": "Шашки. Спеціальні значки ходу", "p": ["У записах партій ходи оцінюють спеціальними значками. Вони допомагають зрозуміти, де гравець зіграв добре, а де помилився."], "ul": ["«-» — простий хід, «:» — взяття (у деяких записах «x»).", "«!» — сильний хід, «!!» — дуже сильний.", "«?» — слабкий хід, «??» — груба помилка.", "Тихий хід — хід без взяття.", "Значки допомагають швидко знайти ключові моменти партії."]}, {"h": "Волейбол. Вправи для розвитку сили кистей рук", "p": ["Під час передач волейболіст приймає м'яч пальцями й кистями, тому вони мають бути сильними та пружними. Такі вправи захищають пальці від травм."], "ul": ["Стискання м'якого м'ячика або еспандера.", "Віджимання від стіни на пальцях.", "Обертання кистями в обидва боки.", "«Ножиці» та «млин» руками.", "Збільшуй навантаження поступово, без болю."]}], "f": "Зрізка — улюблений удар захисників: вони можуть довго тримати м'ячик у грі, чекаючи помилки суперника.", "pr": ["Виконай вправи для кистей: стискання м'якого м'ячика або згорнутої шкарпетки 3 серії по 15 разів кожною рукою, віджимання від стіни 10 разів.", "Запиши 5 значків оцінки ходів у шашках і поясни кожен."], "q": ["Що таке зрізка і яке обертання вона дає?", "Яка типова помилка під час зрізки?", "Що означають значки «!» та «?»?", "Навіщо волейболісту сильні кисті?"]}, {"n": "59", "t": "Подача з нижнім обертанням, правила шашок, сила рук і гнучкість плечей", "g": "Учень знатиме, як виконувати подачу з нижнім обертанням, основні правила гри в шашки та вправи для сили рук і гнучкості плечового поясу.", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Підкидання м'ячика", "вертикальне підкидання м'ячика з розкритої долоні перед подачею."], ["Обов'язкове взяття", "правило, за яким гравець мусить побити шашку суперника, якщо це можливо."], ["Плечовий пояс", "кістки та м'язи, що з'єднують руки з тулубом."], ["Навчальна гра", "гра за спрощеними правилами для закріплення вивчених прийомів."]], "th": [{"h": "Настільний теніс. Подачі з нижнім обертанням, елементи навчальної гри", "p": ["Подачу виконують так: м'ячик лежить на розкритій долоні, його підкидають майже вертикально вгору щонайменше на 16 см і б'ють, коли він падає. М'ячик спочатку має відскочити від своєї половини столу, а потім — від половини суперника. Для нижнього обертання ракетку відкривають і ведуть під м'ячиком зверху вниз-вперед."], "ul": ["Подачу виконують з-за задньої лінії столу.", "М'ячик не можна закручувати пальцями під час підкидання.", "Ракетка торкається нижньої частини м'ячика.", "Якщо м'ячик на подачі зачепив сітку і впав правильно — подачу переграють.", "У навчальній грі спочатку граєте без рахунку, потім — до 11 очок."]}, {"h": "Шашки. Правила гри", "p": ["У шашки на дошці 64 поля грають двоє, білі ходять першими. Звичайна шашка ходить уперед по діагоналі на одне поле, а бити може і вперед, і назад. Якщо є можливість побити — бити обов'язково."], "ul": ["Ходи роблять по черзі.", "Якщо можна побити кілька шашок поспіль — їх збивають за один хід.", "Збиті шашки знімають з дошки після завершення ходу.", "Шашка, що дійшла до останнього ряду, стає дамкою.", "Торкнувся шашки — мусиш нею ходити (якщо хід можливий)."]}, {"h": "Волейбол. Вправи для сили рук і гнучкості плечового поясу", "p": ["Волейболіст часто тягнеться до м'яча над головою, тому плечі мають бути рухливими, а руки — сильними. Вправи виконують плавно, без ривків, після розминки."], "ul": ["Колові рухи руками вперед і назад.", "Відведення рук за спину в замку.", "Віджимання від стіни або від лави.", "«Ножиці» прямими руками перед собою.", "Розтягування: потягнути лікоть за голову іншою рукою."]}], "f": "Правило про підкидання м'ячика на подачі придумали для того, щоб суперник чітко бачив м'ячик і міг підготуватися до прийому.", "pr": ["Виконай вправи для плечей: колові рухи руками вперед і назад по 10 разів, віджимання від стіни 2 серії по 10 разів.", "Запиши 5 головних правил гри в шашки своїми словами."], "q": ["Як правильно підкидати м'ячик під час подачі?", "Як отримати нижнє обертання м'ячика?", "Що означає обов'язкове взяття в шашках?", "Які вправи розвивають гнучкість плечового поясу?"]}, {"n": "60", "t": "Пересування тенісиста в парі, хід і взяття в шашках, естафета з передачами", "g": "Учень знатиме, як тенісист рухається в парі та біля столу, розрізнятиме хід і взяття шашкою й дамкою та знатиме правила рухливої гри-естафети.", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Дамка", "шашка, яка дійшла до останнього ряду й отримала право ходити далеко по діагоналі."], ["Черговість ходу", "правило, за яким гравці роблять ходи по одному, по черзі."], ["Естафета", "командне змагання, у якому учасники по черзі виконують завдання."], ["Ігрова зона", "простір біля тенісного столу, у якому гравець рухається під час розіграшу."]], "th": [{"h": "Настільний теніс. Пересування у парі та у 3-метровій зоні", "p": ["Тенісист рухається в зоні приблизно до 3 метрів від столу. У парній грі партнери б'ють по м'ячику по черзі, тому після удару треба звільнити місце партнеру. Це вимагає узгоджених рухів."], "ul": ["Після свого удару відійди вбік або назад.", "Не заступай дорогу партнеру.", "Тримайся близько до столу, але не торкайся його.", "Рухайся короткими приставними кроками.", "Домовтеся з партнером, хто куди відходить."]}, {"h": "Шашки. Хід, взяття, шашка, дамка. Черговість ходу та бою", "p": ["Простий хід — переміщення шашки на сусіднє вільне поле по діагоналі. Взяття (бій) — коли шашка перестрибує через шашку суперника на вільне поле за нею. Дамка ходить і б'є на будь-яку відстань по діагоналі."], "ul": ["Звичайна шашка ходить тільки вперед, а б'є вперед і назад.", "Дамка ходить вперед і назад на будь-яку кількість вільних полів.", "За один хід можна побити кілька шашок.", "Якщо є кілька варіантів бою — можна обрати будь-який.", "Бити обов'язково, пропускати бій не можна."]}, {"h": "Волейбол. Рухлива гра «Передав м'яч – стань назад в колону»", "p": ["Учні шикуються в колони навпроти один одного. Перший гравець передає м'яч гравцеві навпроти й біжить у кінець своєї колони. Гра вчить точно передавати м'яч і швидко звільняти місце."], "ul": ["Передавай м'яч точно в руки партнеру.", "Після передачі одразу стань у кінець колони.", "Не штовхай інших, біжи збоку від колони.", "Перемагає команда, яка першою виконала завдання без помилок.", "Уважно стеж за м'ячем."]}], "f": "У міжнародних шашках бити треба найбільшу кількість шашок, а в шашках на 64 поля можна обрати будь-який варіант бою.", "pr": ["Намалюй діаграму, на якій біла шашка може побити дві чорні шашки за один хід, і запиши цей хід.", "Виконай 3 серії по 10 приставних кроків уперед-назад у напівприсіді біля столу чи стільця (без торкання)."], "q": ["Як тенісисти рухаються під час парної гри?", "Чим хід відрізняється від взяття?", "Як ходить дамка?", "Як проходить гра «Передав м'яч – стань назад в колону»?"]}, {"n": "61", "t": "Правила подачі з нижнім обертанням, фізичні якості шашкіста, розмітка волейбольного майданчика", "g": "Учень закріпить правила подачі, знатиме, які вправи корисні шашкісту, та детальніше розглядатиме розмітку волейбольного майданчика.", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Переподача", "повторення подачі, якщо м'ячик зачепив сітку, але впав на правильну половину."], ["Постава", "звичне положення тіла, коли людина сидить або стоїть."], ["Вільна зона", "простір навколо волейбольного майданчика без перешкод."], ["Сітка", "перегородка, що розділяє волейбольний майданчик на дві половини."]], "th": [{"h": "Настільний теніс. Подачі з нижнім обертанням м'ячика", "p": ["Подача з нижнім обертанням змушує суперника відбивати обережно, адже м'ячик «тягне» вниз до сітки. Для гарної подачі важливі спокій, правильне підкидання та короткий точний рух ракеткою."], "ul": ["Стань трохи боком до столу.", "Підкинь м'ячик з долоні вертикально.", "Веди відкриту ракетку під м'ячиком.", "Удар роби, коли м'ячик опускається.", "Типові помилки: м'ячик ударено в повітрі над столом, підкидання надто низьке."]}, {"h": "Шашки. Спеціальні індивідуальні вправи для розвитку фізичних якостей", "p": ["Шашкіст довго сидить за дошкою, тому йому потрібні рівна постава, витривалість і уважність. Короткі фізичні вправи між партіями допомагають зняти втому з шиї, спини та очей."], "ul": ["Нахили голови вперед-назад і в боки.", "Потягування рук угору в замку.", "Повороти тулуба сидячи на стільці.", "Гімнастика для очей: подивитися вдалину, потім близько.", "Сиди рівно, обидві стопи на підлозі."]}, {"h": "Волейбол. Розмітка ігрового майданчика", "p": ["Волейбольний майданчик має розмір 18 на 9 метрів. Його оточує вільна зона, де не повинно бути предметів. Посередині натягнута сітка, а по її краях — антени, які показують межі, де м'яч може перелітати."], "ul": ["Ширина ліній — 5 см, вони входять у майданчик.", "Лінія атаки — на відстані 3 м від середньої лінії.", "Зона подачі — за лицьовою лінією.", "М'яч, що пролетів поза антенами, — помилка.", "Вільна зона потрібна для безпеки гравців."]}], "f": "Кожна лінія волейбольного майданчика рахується як частина поля, тож м'яч, що торкнувся лінії, — в полі.", "pr": ["Склади і виконай комплекс із 5 вправ для шашкіста (шия, плечі, спина, очі) і запиши його у зошит.", "Повтори вдома імітацію подачі без ракетки: підкидання уявного м'ячика й рух рукою зверху вниз — 15 разів."], "q": ["Які помилки бувають під час подачі?", "Чому шашкісту потрібні фізичні вправи?", "Що таке вільна зона і навіщо вона?", "Що означає, якщо м'яч пролетів поза антенами?"]}, {"n": "62", "t": "Захисні серії по прямій і діагоналі, спокій за дошкою, приставні кроки вперед", "g": "Учень знатиме, як виконувати серії захисних ударів у різних напрямках, вмітиме заспокоїтися під час гри та пересуватися приставними кроками вперед.", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Удар по прямій", "удар, після якого м'ячик летить уздовж бічної лінії столу."], ["Удар по діагоналі", "удар, після якого м'ячик летить навскіс через стіл."], ["Емоційний стан", "настрій і відчуття людини в певний момент."], ["Дихальна вправа", "вправа, під час якої свідомо керують вдихом і видихом."]], "th": [{"h": "Настільний теніс. Серії захисних прийомів по прямій і діагоналі", "p": ["Серія — це кілька однакових ударів поспіль. Тенісисти тренують зрізки, спрямовуючи м'ячик то по прямій, то по діагоналі. Так вони вчаться керувати напрямком і не втрачати точність."], "ul": ["По діагоналі відстань більша, тому м'ячик рідше вилітає за стіл.", "По прямій — коротша відстань, потрібна більша точність.", "Напрямок змінюють поворотом ракетки й тулуба.", "Після кожного удару — повернення в стійку.", "Рахуй, скільки ударів поспіль виконано без помилки."]}, {"h": "Шашки. Вправи для відновлення емоційного стану", "p": ["Під час партії можна хвилюватися, засмучуватися через помилку чи радіти занадто рано. Спокій допомагає думати краще. Прості вправи на дихання й розслаблення повертають зосередженість."], "ul": ["Глибокий вдих носом на 4 рахунки, видих ротом на 4 рахунки.", "Стиснути кулаки на 5 секунд, потім розслабити.", "Заплющити очі й порахувати до 10.", "Повторити собі: «Я спокійний, я думаю».", "Після поразки подякуй супернику та розбери помилки."]}, {"h": "Волейбол. Пересування в стійці приставними кроками вперед", "p": ["Щоб устигнути до м'яча, волейболіст рухається не випрямляючись, у стійці. Під час кроку вперед спочатку ставиться передня нога, а задня приставляється до неї."], "ul": ["Тримай коліна зігнутими весь час.", "Не підстрибуй, рухайся плавно.", "Руки тримай перед собою.", "Дивись уперед, а не під ноги.", "Після кожних 3–4 кроків зупиняйся в стійці."]}], "f": "Багато спортсменів виконують дихальні вправи перед важливими змаганнями, щоб заспокоїтися.", "pr": ["Виконай вправу «квадратне дихання»: вдих — 4 рахунки, затримка — 4, видих — 4, пауза — 4; повтори 5 разів і запиши, як змінилося самопочуття.", "Пройди вдома приставними кроками вперед у стійці волейболіста 3 серії по 6 кроків."], "q": ["Чим відрізняється удар по прямій від удару по діагоналі?", "Який напрямок удару надійніший і чому?", "Які вправи допомагають заспокоїтися під час гри?", "Як правильно пересуватися приставними кроками вперед?"]}, {"n": "63", "t": "Правила поведінки на заняттях настільним тенісом, етапи шашкової партії, приставні кроки назад", "g": "Учень знатиме правила поведінки біля тенісного столу, назви етапів шашкової партії та вмітиме пересуватися приставними кроками назад.", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Дебют", "початковий етап шашкової партії, коли шашки виходять з вихідних позицій."], ["Мітельшпіль", "середина партії, коли на дошці відбувається основна боротьба."], ["Ендшпіль", "завершальний етап партії, коли на дошці залишилося мало шашок."], ["Спортивна етика", "правила чесної та ввічливої поведінки під час гри."]], "th": [{"h": "Настільний теніс. Правила поведінки під час занять", "p": ["У залі може бути кілька столів, тому м'ячики часто летять у різні боки. Щоб ніхто не травмувався, треба дотримуватися простих правил і поважати інших гравців."], "ul": ["Не сідай і не спирайся на стіл.", "Не бігай між столами під час гри інших.", "Якщо м'ячик відлетів до сусіднього столу — зачекай кінця розіграшу.", "Не кидай ракетку, навіть якщо програв очко.", "Перед грою і після неї потисни руку супернику."]}, {"h": "Шашки. Етапи шашкової партії, їхні завдання", "p": ["Кожна партія має три етапи. У дебюті гравці розвивають шашки й займають центр. У мітельшпілі виникають комбінації та розміни. В ендшпілі шашок мало, і важливо провести шашку в дамки або не пустити туди шашки суперника."], "ul": ["Дебют — перші ходи партії.", "Мітельшпіль — середина гри.", "Ендшпіль — кінець гри.", "Кожен етап має свої завдання.", "Помилка на будь-якому етапі може вирішити результат."]}, {"h": "Волейбол. Пересування приставними кроками назад", "p": ["Іноді м'яч летить далі, ніж очікував гравець, і треба швидко відступити. Рух назад приставними кроками виконують у стійці, не обертаючись спиною до м'яча."], "ul": ["Спочатку відставляй назад задню ногу, потім приставляй передню.", "Вага тіла — на передній частині стоп.", "Не відхиляйся корпусом назад, щоб не впасти.", "Дивись на м'яч або вперед.", "Рухайся тільки на вільному просторі."]}], "f": "Назви «мітельшпіль» та «ендшпіль» прийшли з німецької мови й означають «середина гри» та «кінець гри».", "pr": ["Запиши у зошит 3 етапи шашкової партії і головне завдання кожного.", "Виконай у вільному місці кімнати приставні кроки назад у стійці: 3 серії по 5 кроків, потім повернися вперед."], "q": ["Яких правил поведінки слід дотримуватися біля тенісного столу?", "Назви етапи шашкової партії.", "Що відбувається в ендшпілі?", "Як правильно рухатися приставними кроками назад?"]}, {"n": "64", "t": "Повторення зрізок справа і зліва, виграш і нічия в шашках, приставні кроки вправо", "g": "Учень удосконалить знання про зрізки, знатиме, як завершується шашкова партія, та вмітиме рухатися приставними кроками вправо.", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Нічия", "результат партії, у якому жоден гравець не переміг."], ["Виграш", "результат партії, коли суперник втратив усі шашки або не має ходів."], ["Відкрита ракетка", "положення ракетки, коли її робоча поверхня повернута вгору."], ["Бічне переміщення", "рух гравця вправо або вліво без повороту корпусу."]], "th": [{"h": "Настільний теніс. Захисні прийоми: зрізки справа та зліва", "p": ["Повторюємо зрізки. Зрізка справа виконується з правого боку тіла, зліва — перед собою. Щоб удар вийшов, важливо вчасно підійти до м'ячика й не тягнутися до нього рукою."], "ul": ["Спочатку — крок до м'ячика, потім — удар.", "Рух ракетки короткий, кисть стабільна.", "Б'ють у момент, коли м'ячик опускається після відскоку.", "Помилка: удар «згори» — м'ячик іде в сітку.", "Помилка: ракетка надто відкрита — м'ячик летить високо."]}, {"h": "Шашки. Виграш партії, нічия", "p": ["Партію виграє той, хто забрав усі шашки суперника або заблокував їх так, що той не може зробити хід. Якщо жоден не може перемогти, оголошують нічию."], "ul": ["Виграш: у суперника не залишилося шашок.", "Виграш: суперник не має жодного можливого ходу.", "Виграш: суперник здався.", "Нічия: гравці домовилися про неї.", "Нічия: позиція така, що ніхто не може виграти."]}, {"h": "Волейбол. Пересування приставними кроками вправо", "p": ["Бічні переміщення потрібні, щоб опинитися точно навпроти м'яча. Під час руху вправо спочатку робиться крок правою ногою, а ліва приставляється до неї."], "ul": ["Ноги не схрещуй.", "Тримай однакову висоту стійки.", "Корпус повернутий до сітки.", "Руки перед собою, готові до прийому.", "Зупинка — у стійці, на обох ногах."]}], "f": "Буває, що дві дамки довго ганяються одна за одною, але виграти не можуть — така партія завершується нічиєю.", "pr": ["Намалюй діаграму, де чорні шашки не можуть зробити жодного ходу (білі виграли), і поясни її.", "Виконай приставні кроки вправо в стійці 3 серії по 6 кроків, повертаючись у вихідне положення."], "q": ["Які помилки бувають під час зрізки?", "У яких випадках гравець виграє партію в шашки?", "Коли оголошують нічию?", "Як правильно рухатися приставними кроками вправо?"]}, {"n": "65", "t": "Навчальна гра в теніс, завдання етапів шашкової партії, приставні кроки вліво", "g": "Учень знатиме, як проходить навчальна гра в настільний теніс, зрозуміє, що робити на кожному етапі шашкової партії, та вмітиме рухатися приставними кроками вліво.", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Рахунок", "кількість очок, набраних гравцями в партії."], ["Розмін", "обмін шашок, коли кожен гравець втрачає однакову кількість шашок."], ["Центр дошки", "поля посередині дошки, звідки шашки мають найбільше ходів."], ["Зупинка в стійці", "завершення переміщення в положенні готовності до гри."]], "th": [{"h": "Настільний теніс. Елементи навчальної гри", "p": ["У навчальній грі поєднують подачу, прийом і захисні удари. Гравці вчаться вести рахунок, вчасно змінювати подачу й поводитися чесно. Головне — не виграти будь-що, а правильно виконувати прийоми."], "ul": ["Рахунок оголошує подавальний: спочатку свої очки.", "Подача переходить кожні 2 очки.", "Партія — до 11 очок з перевагою у 2 очки.", "Після партії гравці міняються сторонами.", "Визнавай свої помилки чесно."]}, {"h": "Шашки. Етапи шашкової партії", "p": ["У дебюті шашки виводять до центру й зберігають зв'язок між ними. У мітельшпілі шукають слабкі місця суперника, роблять розміни. В ендшпілі рахують ходи й намагаються першими пройти в дамки."], "ul": ["Дебют: займай центр, не залишай шашки самотніми.", "Мітельшпіль: шукай вигідні розміни й комбінації.", "Ендшпіль: рахуй, хто швидше пройде в дамки.", "Зберігай шашки заднього ряду якомога довше.", "Перед кожним ходом подумай про відповідь суперника."]}, {"h": "Волейбол. Пересування приставними кроками вліво", "p": ["Рух вліво виконують так само, як і вправо, але першою ступає ліва нога. Гравцеві важливо однаково добре рухатися в обидва боки."], "ul": ["Крок лівою — приставити праву.", "Коліна зігнуті, спина рівна.", "Не підстрибуй і не випрямляйся.", "Тримай руки перед собою.", "Змінюй напрямок за сигналом, не падаючи."]}], "f": "У настільному тенісі гравці змінюють сторони столу після кожної партії, щоб умови були рівними.", "pr": ["Запиши поради для кожного етапу шашкової партії (по 2 поради для дебюту, мітельшпілю й ендшпілю).", "Виконай приставні кроки вліво і вправо в стійці волейболіста — 3 серії по 5 кроків у кожен бік."], "q": ["Як ведуть рахунок у настільному тенісі?", "Що варто робити в дебюті шашкової партії?", "Що таке розмін?", "Як рухатися приставними кроками вліво?"]}, {"n": "66", "t": "Накати, удари й контрудари в тенісі, закономірності дебюту в шашках, гра «Малюкбол»", "g": "Учень знатиме, що таке накат і контрудар, зрозуміє завдання дебюту в шашках та закріпить уміння грати в «Малюкбол».", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Накат", "атакувальний удар, після якого м'ячик отримує верхнє обертання."], ["Контрудар", "атакувальний удар у відповідь на атакувальний удар суперника."], ["Верхнє обертання", "обертання м'ячика «вперед», через яке він швидко пірнає вниз після сітки."], ["Закономірність дебюту", "загальні правила, як правильно починати партію."]], "th": [{"h": "Настільний теніс. Накати справа та зліва, удари, контрудари", "p": ["Накат — основний атакувальний удар. Ракетку трохи закривають (робочим боком униз-уперед) й ведуть знизу вгору-вперед, ніби «натягують» м'ячик. Контрудар — відповідь накатом на накат суперника."], "ul": ["Ракетка злегка закрита, рух знизу вгору-вперед.", "Удар виконують з поворотом тулуба.", "Накат справа — збоку від тіла, зліва — перед собою.", "Контрудар — короткий рух, швидка реакція.", "Помилка: занадто відкрита ракетка — м'ячик вилітає за стіл."]}, {"h": "Шашки. Завдання етапів. Закономірність дебюту", "p": ["У дебюті є загальні правила, що допомагають отримати гарну позицію. Їх дотримуються навіть досвідчені гравці. Добрий дебют — це половина успіху."], "ul": ["Займай центр дошки.", "Розвивай шашки рівномірно на обох флангах.", "Не відривайся однією шашкою вперед.", "Не поспішай ходити шашками заднього ряду.", "Не пускай шашки суперника в центр."]}, {"h": "Волейбол. Рухлива гра «Малюкбол»", "p": ["Тепер у «Малюкболі» намагаємося не лише перекинути м'яч, а й кидати його туди, де немає гравців суперника. Команда грає разом: гравці стежать за своїми зонами."], "ul": ["Кожен гравець відповідає за свою зону.", "Кидай м'яч у вільні місця на боці суперника.", "Лови м'яч двома руками перед собою.", "Після кидка повертайся у свою зону.", "Підбадьорюй товаришів по команді."]}], "f": "Сучасні тенісисти завдяки накатам можуть надавати м'ячику дуже швидкого обертання, тож він змінює траєкторію після відскоку.", "pr": ["Перед дзеркалом виконай імітацію накату справа без ракетки — 3 серії по 10 разів, стежачи за поворотом тулуба.", "Запиши у зошит 5 правил вдалого дебюту в шашках."], "q": ["Як виконується накат?", "Що таке контрудар?", "Які правила допомагають добре зіграти дебют у шашках?", "Куди краще кидати м'яч у «Малюкболі»?"]}, {"n": "67", "t": "Подача з верхнім обертанням, шашкові комбінації, вихідне положення волейболіста", "g": "Учень знатиме, як подавати з верхнім обертанням, що таке комбінація в шашках та як обирати вихідне положення для передачі й прийому м'яча.", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Комбінація", "серія ходів із жертвою шашки, яка дає гравцеві перевагу."], ["Жертва", "свідома віддача шашки суперникові заради вигоди."], ["Вихідне положення", "положення тіла перед виконанням технічного прийому."], ["Прийом м'яча", "дія гравця, якою він зупиняє і спрямовує м'яч після подачі чи удару суперника."]], "th": [{"h": "Настільний теніс. Подачі з верхнім обертанням", "p": ["Для верхнього обертання ракетку злегка закривають і проводять по м'ячику знизу вгору-вперед. Після такої подачі м'ячик після відскоку прискорюється й летить уперед."], "ul": ["Підкидання — так само вертикальне, не нижче 16 см.", "Ракетка торкається задньої-верхньої частини м'ячика.", "Рух короткий, кисть допомагає.", "М'ячик має відскочити спочатку від своєї половини.", "Помилка: сильний удар — м'ячик вилітає за стіл."]}, {"h": "Шашки. Поняття комбінації, найпростіші комбінації, типові помилки", "p": ["Комбінація — це коли ти навмисне віддаєш шашку, а потім б'єш більше шашок суперника. Найпростіша: віддаєш одну шашку, суперник мусить бити (бо це обов'язково), а ти потім береш дві."], "ul": ["Комбінація спирається на правило обов'язкового бою.", "Перш ніж жертвувати, порахуй усі ходи до кінця.", "Помилка: не помітити комбінацію суперника.", "Помилка: залишати шашки з вільним полем позаду.", "Розв'язуй задачі на комбінації — це найкраще тренування."]}, {"h": "Волейбол. Вибір вихідного положення для передачі та прийому м'яча", "p": ["Перед передачею зверху гравець стоїть у середній стійці, руки над головою, пальці утворюють «ківш». Для прийому знизу стійка нижча, руки випрямлені перед собою й з'єднані."], "ul": ["Стань так, щоб м'яч летів прямо на тебе.", "Передача зверху: руки біля чола, лікті розведені.", "Прийом знизу: руки прямі, долоні з'єднані.", "Ноги завжди зігнуті в колінах.", "Помилка: чекати м'яч на прямих ногах."]}], "f": "Деякі шашкові комбінації настільки гарні, що їм дають власні назви, а любителі вивчають їх, як вірші.", "pr": ["Намалюй діаграму простої комбінації: біла шашка жертвується, чорна б'є, а потім біла забирає дві чорні шашки; запиши ходи.", "Покажи рідним вихідне положення для передачі зверху і для прийому знизу, затримуючись у кожному по 10 секунд (5 повторень)."], "q": ["Як виконується подача з верхнім обертанням?", "Що таке комбінація в шашках?", "Яких помилок варто уникати, щоб не потрапити в комбінацію суперника?", "Яке вихідне положення для передачі м'яча зверху?"]}, {"n": "68", "t": "Накат справа і зліва, фізичні якості шашкіста, передача м'яча від стіни", "g": "Учень знатиме техніку накату справа і зліва, вправи для бадьорості шашкіста та вмітиме пояснити, як виконувати передачу м'яча двома руками зверху від стіни.", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Атакувальний прийом", "швидкий удар, мета якого — ускладнити відповідь суперника або виграти очко."], ["Передача зверху", "передача м'яча кінчиками пальців обох рук над головою."], ["Ківш", "положення кистей, коли пальці обох рук утворюють заглиблення для м'яча."], ["Фізична активність", "будь-який рух тіла, що потребує зусиль м'язів."]], "th": [{"h": "Настільний теніс. Атакувальні прийоми: накат справа та зліва", "p": ["Накат справа виконують з поворотом тулуба праворуч: ракетка опускається нижче м'ячика, потім іде вгору-вперед. Накат зліва — коротший рух перед животом, кисть і передпліччя рухаються вперед."], "ul": ["Перед ударом — поворот корпусу.", "Вага переноситься з задньої ноги на передню.", "Удар — у найвищій точці відскоку м'ячика.", "Після удару рука закінчує рух біля чола.", "Не бий сильно, поки не освоїш точність."]}, {"h": "Шашки. Спеціальні індивідуальні вправи для розвитку фізичних якостей", "p": ["Шашкістові потрібна витривалість, щоб довго зберігати увагу. Регулярна фізична активність, прогулянки й зарядка допомагають краще думати за дошкою."], "ul": ["Ранкова зарядка 10 хвилин.", "Вправи на поставу біля стіни.", "Нахили та повороти тулуба.", "Вправи для пальців і кистей.", "Прогулянки на свіжому повітрі між заняттями."]}, {"h": "Волейбол. Передача м'яча двома руками від стіни", "p": ["Передачу зверху тренують біля стіни: гравець передає м'яч у стіну й ловить або знову передає. Так відпрацьовують положення рук і ніг."], "ul": ["Стань на відстані 1–2 м від стіни.", "М'яч торкається пальців над чолом.", "Розгинай ноги й руки одночасно.", "Пальці пружні, долоні не торкаються м'яча.", "Помилки: удар долонями, прямі ноги, руки занадто низько."]}], "f": "Навіть професійні волейболісти щодня тренують передачі біля стіни.", "pr": ["Виконай вправу «постава біля стіни»: стань спиною до стіни, торкаючись її потилицею, лопатками, сідницями й п'ятами, — 3 рази по 30 секунд.", "Імітуй передачу зверху без м'яча: стійка, руки над чолом, розгинання ніг і рук — 3 серії по 10 разів."], "q": ["Як виконується накат справа?", "У який момент краще бити по м'ячику під час накату?", "Чому шашкістові корисна фізична активність?", "Які помилки бувають під час передачі зверху?"]}, {"n": "69", "t": "Удар і контрудар, зняття хвилювання в шашках, передача м'яча в парах", "g": "Учень знатиме, як виконувати атакувальний удар і контрудар, вмітиме впоратися з хвилюванням під час партії та знатиме правила передачі м'яча в парах.", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Удар", "швидкий атакувальний прийом, коли м'ячик сильно спрямовують на бік суперника."], ["Зосередженість", "уміння довго тримати увагу на одній справі."], ["Передача в парах", "вправа, у якій двоє гравців передають м'яч один одному."], ["Траєкторія", "лінія, по якій летить м'яч."]], "th": [{"h": "Настільний теніс. Атакувальні прийоми: удар, контрудар", "p": ["Удар у настільному тенісі — сильний швидкий рух по високому м'ячику. Контрудар виконують, коли суперник атакує: гравець відповідає коротким, точним рухом, використовуючи швидкість м'ячика суперника."], "ul": ["Удар — по м'ячику, що відскочив високо.", "Контрудар — близько до столу, рух короткий.", "Ракетка злегка закрита.", "Завжди повертайся в стійку після удару.", "Сила удару не важливіша за точність."]}, {"h": "Шашки. Вправи для відновлення емоційного стану", "p": ["Перед партією й під час неї корисно перевірити свій настрій. Якщо ти хвилюєшся, руки поспішають зробити хід раніше, ніж голова встигне подумати. Кілька простих прийомів допоможуть повернути спокій."], "ul": ["Перш ніж торкнутися шашки, сядь на руки на кілька секунд.", "Зроби 3 повільні вдихи й видихи.", "Розімни плечі та шию.", "Подивися у вікно, щоб дати відпочити очам.", "Пам'ятай: поразка — це урок, а не трагедія."]}, {"h": "Волейбол. Передача м'яча двома руками в парах", "p": ["Партнери стоять один навпроти одного на відстані 3–4 м. Один накидає м'яч, другий передає його зверху двома руками назад партнеру. Потім міняються ролями."], "ul": ["Виходь під м'яч, щоб він летів над чолом.", "Передавай м'яч по високій дузі.", "Пальці пружні, лікті розведені.", "Дивись на м'яч до останнього моменту.", "Рахуй кількість передач без помилки."]}], "f": "Під час контрудару тенісист використовує енергію м'ячика суперника, тому сильно замахуватися не потрібно.", "pr": ["Виконай дихальну вправу: 5 повільних вдихів носом і видихів ротом, потім запиши, які ще способи заспокоїтися ти знаєш.", "Намалюй схему передачі м'яча в парах: розташування гравців, траєкторію м'яча й положення рук."], "q": ["Чим удар відрізняється від контрудару?", "Чому хвилювання може заважати під час гри в шашки?", "Як правильно стати для передачі м'яча в парах?", "Чому важливо передавати м'яч по високій дузі?"]}, {"n": "70", "t": "Подачі з верхнім обертанням, комбінації в шашках, передачі в колонах", "g": "Учень закріпить знання про подачу з верхнім обертанням, навчиться шукати комбінації на різних етапах гри та знатиме, як виконувати передачу в колонах і зустрічних колонах.", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Розміщення подачі", "вибір місця на столі суперника, куди спрямовують м'ячик."], ["Ударна позиція", "розташування шашок, яке дозволяє провести комбінацію."], ["Зустрічні колони", "дві колони гравців, що стоять одна навпроти одної."], ["Колона", "стрій, у якому учні стоять один за одним."]], "th": [{"h": "Настільний теніс. Подачі з верхнім обертанням м'ячика", "p": ["Подачу з верхнім обертанням можна спрямовувати в різні частини столу: у кут, на середину, ближче до сітки. Чим точніше розміщена подача, тим важче її прийняти."], "ul": ["Перед подачею вирішуй, куди спрямуєш м'ячик.", "Подача в кут змушує суперника рухатися.", "Тримай однаковий замах для різних подач.", "Відбивай подачу верхнього обертання трохи закритою ракеткою.", "Тренуй подачі серіями по 10."]}, {"h": "Шашки. Практичне виконання комбінацій на різних етапах гри", "p": ["Комбінації трапляються і в дебюті, і в середині гри, і в ендшпілі. Найчастіше — у мітельшпілі, коли на дошці багато шашок і вони близько одна до одної."], "ul": ["У дебюті стеж, щоб шашки не залишалися без захисту.", "У мітельшпілі шукай вільні поля за шашками суперника.", "В ендшпілі комбінація може привести шашку в дамки.", "Перевіряй кожен хід суперника: чи не готує він жертву?", "Після партії перевір, чи не було пропущених комбінацій."]}, {"h": "Волейбол. Передача м'яча в колонах, у зустрічних колонах", "p": ["Учні стоять у двох колонах навпроти одна одної. Перший гравець передає м'яч першому гравцеві іншої колони і переходить у кінець своєї або протилежної колони — як скаже вчитель."], "ul": ["Відстань між колонами — 3–4 м.", "Передача — двома руками зверху.", "Після передачі звільни місце, перебігаючи збоку.", "Тримай дистанцію в колоні.", "Помилки: низька передача, передача долонями."]}], "f": "Шашкісти розв'язують задачі на комбінації так само, як математики — приклади: що більше розв'язав, то швидше бачиш рішення в грі.", "pr": ["Намалюй схему вправи «передача в зустрічних колонах» і стрілками покажи, куди летить м'яч і куди переходить гравець.", "Знайди або склади одну шашкову позицію з комбінацією, намалюй її і запиши рішення."], "q": ["Чому важливо розміщувати подачу в різні частини столу?", "На якому етапі партії найчастіше виникають комбінації?", "Як виконується передача м'яча в зустрічних колонах?", "Які помилки бувають під час передачі в колонах?"]}, {"n": "71", "t": "Навчальна гра в настільний теніс, вади гри в дебюті, рухлива гра «Малюкбол»", "g": "Учень зможе застосувати вивчені удари в навчальній грі, знатиме типові помилки дебюту в шашках та вдосконалить гру в «Малюкбол».", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Партія в настільному тенісі", "частина матчу, що триває до 11 очок з перевагою у 2 очки."], ["Вада", "слабке місце в позиції або грі."], ["Відстала шашка", "шашка, що залишилася позаду без підтримки і може стати легкою здобиччю."], ["Командна гра", "спільні дії гравців однієї команди для досягнення мети."]], "th": [{"h": "Настільний теніс. Навчальна гра", "p": ["У навчальній грі використовують усі вивчені прийоми: подачі з різним обертанням, зрізки, накати. Гравці дотримуються правил, чесно ведуть рахунок і допомагають одне одному."], "ul": ["Перед грою — розминка й кілька розіграшів без рахунку.", "Подача змінюється кожні 2 очки.", "При рахунку 10:10 подача змінюється після кожного очка.", "Для перемоги потрібна перевага у 2 очки.", "Після гри — дякуємо супернику."]}, {"h": "Шашки. Вади гри в дебюті", "p": ["Новачки часто роблять у дебюті однакові помилки. Вони не одразу помітні, але потім суперник отримує перевагу."], "ul": ["Ходити тільки одним флангом.", "Залишати відсталі шашки.", "Рано виводити шашки з заднього ряду.", "Пускати суперника в центр.", "Робити хід, не подумавши, що відповість суперник."]}, {"h": "Волейбол. Рухлива гра «Малюкбол»", "p": ["Ускладнюємо гру: перш ніж перекинути м'яч, команда робить одну передачу партнеру. Так «Малюкбол» стає ближчим до справжнього волейболу, де команда має до трьох торкань."], "ul": ["Спіймав — передай партнеру — партнер перекидає через сітку.", "Не тримай м'яч занадто довго.", "Не заходь під сітку.", "Перехід гравців — як у волейболі.", "Головне — грати разом, а не поодинці."]}], "f": "У настільному тенісі гравець не може виграти партію з рахунком 11:10 — потрібна перевага у 2 очки.", "pr": ["Запиши у зошит 5 типових помилок у дебюті й пораду, як кожну виправити.", "Розкажи рідним правила навчальної гри в настільний теніс: рахунок, зміна подачі, перевага у 2 очки."], "q": ["Як змінюється подача при рахунку 10:10?", "Які вади гри в дебюті ти знаєш?", "Що таке відстала шашка?", "Чим ускладнений «Малюкбол» на цьому уроці?"]}, {"n": "72", "t": "Повороти тулуба тенісиста, решітка в шашках, естафета з передачами м'яча", "g": "Учень знатиме, навіщо тенісисту повороти тулуба, що таке решітка в шашковій позиції, та закріпить правила естафети з передачами.", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Поворот тулуба", "обертання корпусу навколо своєї осі під час замаху та удару."], ["Решітка", "розміщення шашок «через поле», коли між ними залишаються порожні поля."], ["Фланг", "лівий або правий край шашкової дошки."], ["Естафетна передача", "передача м'яча наступному учаснику команди в естафеті."]], "th": [{"h": "Настільний теніс. Найпростіші види поворотів", "p": ["Сила і точність удару залежать не лише від руки, а й від повороту тулуба. Перед ударом корпус повертається назад (замах), а під час удару — вперед. Ноги допомагають цьому руху."], "ul": ["Поворот праворуч — для ударів справа.", "Поворот ліворуч — для ударів зліва.", "Плечі повертаються разом із тазом.", "Голова стабільна, погляд на м'ячику.", "Помилка: бити «самою рукою» без повороту."]}, {"h": "Шашки. Решітка в позиції", "p": ["Решітка — це будова, коли шашки стоять через одне поле, утворюючи візерунок, схожий на решітку. Між ними є порожні поля, тому суперник іноді може бити кілька шашок поспіль. Але якщо решітка надійно підтримана задніми шашками, вона може бути міцною."], "ul": ["Подивися, чи є вільні поля за твоїми шашками.", "Якщо є — суперник може побити кілька шашок підряд.", "Закривай вільні поля підтримкою ззаду.", "Шукай решітку в позиції суперника — це шанс для комбінації.", "Вчися бачити будову позиції, а не лише окремі шашки."]}, {"h": "Волейбол. Рухлива гра-естафета «Передав м'яч – стань назад в колону»", "p": ["Тепер естафету проводять на швидкість, але з правилом: передача має бути точною й виконаною правильно. Неточна передача — команда повторює її."], "ul": ["Перевага не в швидкості, а у безпомилковості.", "Чекай свою чергу за лінією.", "Перебігай у кінець колони збоку.", "Не кидай м'яч занадто сильно.", "Підтримуй команду словами."]}], "f": "Візерунок шашок, схожий на решітку, легко помітити, якщо подивитися на дошку здалеку.", "pr": ["Виконай імітацію повороту тулуба для удару справа і зліва без ракетки — по 10 разів у кожен бік, ноги не відриваються від підлоги.", "Намалюй позицію, у якій шашки утворюють решітку, і познач, яку шашку може побити суперник."], "q": ["Навіщо тенісисту поворот тулуба?", "Що таке решітка в шашках?", "Чим решітка може бути небезпечною?", "Яке головне правило естафети з передачами?"]}, {"n": "73", "t": "Повороти при накатах, навчальна гра в шашки, вибір вихідного положення для передачі й прийому", "g": "Учень знатиме, як поєднувати поворот тулуба з накатом, зможе зіграти партію в шашки за правилами та вчасно обирати вихідне положення для гри з м'ячем.", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Перенесення ваги", "переміщення ваги тіла з однієї ноги на іншу під час удару."], ["Етикет шашиста", "правила ввічливої поведінки за шашковою дошкою."], ["Вихід під м'яч", "переміщення гравця так, щоб м'яч летів точно до нього."], ["Оцінка позиції", "визначення, хто має перевагу на дошці і чому."]], "th": [{"h": "Настільний теніс. Повороти при ударах накатами зліва та справа", "p": ["Під час накату справа корпус повертається праворуч, вага переходить на праву ногу, а під час удару — на ліву. Під час накату зліва поворот менший, але так само важливий."], "ul": ["Замах — поворот корпусу й перенесення ваги назад.", "Удар — поворот вперед, вага на передню ногу.", "Рука рухається разом із корпусом.", "Завершення — у стійці готовності.", "Тренуй спочатку повільно, потім швидше."]}, {"h": "Шашки. Навчальна гра", "p": ["Під час навчальної партії застосовуємо все, що вивчили: правила, дебютні поради, комбінації. Важливо не лише грати, а й поводитися чемно."], "ul": ["Перед грою потисніть руки.", "Торкнувся шашки — ходи нею.", "Не підказуй і не коментуй гру інших.", "Перед кожним ходом подумай про загрози.", "Після партії разом розберіть цікаві моменти."]}, {"h": "Волейбол. Вибір вихідного положення для передач і прийому м'яча", "p": ["Щоб вдало передати чи прийняти м'яч, треба встигнути вийти під нього. Гравець стежить за польотом м'яча, швидко переміщається і зупиняється в стійці ще до того, як м'яч прилетить."], "ul": ["Високий м'яч — готуйся до передачі зверху.", "Низький швидкий м'яч — до прийому знизу.", "Зупиняйся до того, як м'яч долетить.", "Стій обличчям туди, куди передаєш.", "Помилка: грати м'ячем збоку від себе."]}], "f": "Добрі волейболісти вгадують, куди прилетить м'яч, ще коли суперник тільки замахується.", "pr": ["Зіграй удома партію в шашки з кимось із рідних (або намалюй і розбери позицію), запиши 3 перші ходи кожного гравця.", "Виконай 10 разів зміну стійки: передача зверху — прийом знизу за сигналом рідних."], "q": ["Як перенести вагу тіла під час накату справа?", "Які правила етикету шашиста ти знаєш?", "Як обрати положення для передачі зверху чи прийому знизу?", "Чому треба зупинитися до того, як м'яч долетить?"]}, {"n": "74", "t": "Подачі з бічним обертанням і підрізкою, шашкові задачі, прийом м'яча знизу", "g": "Учень знатиме, які бувають подачі з різним обертанням, навчиться розв'язувати шашкові задачі за діаграмою та виконувати прийом м'яча знизу над собою.", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Підрізка", "подача або удар з нижнім обертанням, коли ракетка ковзає під м'ячиком."], ["Бічне обертання", "обертання м'ячика вбік, через яке він відхиляється після відскоку."], ["Шашкова задача", "позиція, у якій треба знайти найкращий хід або серію ходів."], ["Прийом знизу", "прийом м'яча випрямленими з'єднаними руками нижче пояса."]], "th": [{"h": "Настільний теніс. Подачі м'ячика з відкиданням (бічним обертанням) і підрізкою", "p": ["Крім нижнього та верхнього обертання, м'ячику можна надати бічного. Тоді після відскоку він відкидається вбік від ракетки суперника. Підрізка — подача з нижнім обертанням, яка змушує м'ячик летіти низько й повільно."], "ul": ["Бічне обертання — ракетка рухається збоку м'ячика.", "Підрізка — ракетка ковзає під м'ячиком.", "Подача має бути низькою над сіткою.", "Правила подачі однакові для всіх видів обертання.", "Суперник має бачити м'ячик під час подачі — не ховай його."]}, {"h": "Шашки. Розв'язування шашкових позицій і діаграм", "p": ["Задачу дають у вигляді діаграми й завдання, наприклад: «Хід білих. Виграти». Треба знайти хід, після якого білі отримують перевагу або виграють."], "ul": ["Спочатку перерахуй шашки обох сторін.", "Подивися, хто зараз ходить.", "Шукай обов'язкові взяття та жертви.", "Перевір відповідь суперника на кожен свій хід.", "Запиши рішення в нотації."]}, {"h": "Волейбол. Прийом м'яча знизу над собою, від стіни", "p": ["Руки з'єднують перед собою: одна долоня в іншій, великі пальці поруч. Руки прямі, м'яч приймають на передпліччя, а не на кисті. Рух виконують ногами, піднімаючись угору."], "ul": ["Руки прямі, утворюють «майданчик».", "М'яч приймай на передпліччя.", "Підйом за рахунок ніг, а не замаху рук.", "Над собою — м'яч летить вертикально вгору.", "Помилки: зігнуті лікті, удар кистями, замах руками."]}], "f": "Шашкові задачі складають так само, як головоломки, і для них навіть проводять окремі конкурси.", "pr": ["Розв'яжи шашкову задачу із запропонованих учителем або склади свою, намалюй діаграму й запиши рішення.", "Перед дзеркалом покажи положення рук для прийому знизу і зроби 10 повільних підйомів зі згинанням-розгинанням ніг."], "q": ["Чим підрізка відрізняється від подачі з бічним обертанням?", "З чого почати розв'язування шашкової задачі?", "Як правильно з'єднати руки для прийому знизу?", "Які помилки бувають під час прийому м'яча знизу?"]}, {"n": "75", "t": "Короткі та довгі подачі, передчасне вторгнення в шашках, прийом м'яча з накидання партнера", "g": "Учень знатиме, коли використовувати коротку й довгу подачу, чому небезпечне передчасне вторгнення в шашках, та як приймати м'яч після накидання партнера.", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Коротка подача", "подача, після якої м'ячик відскакує біля сітки на боці суперника."], ["Довга подача", "подача, після якої м'ячик летить до задньої лінії столу суперника."], ["Передчасне вторгнення", "просування шашки в табір суперника без підтримки інших шашок."], ["Накидання", "подача м'яча партнеру рукою для виконання вправи."]], "th": [{"h": "Настільний теніс. Короткі та довгі подачі", "p": ["Коротка подача ускладнює суперникові атаку, бо м'ячик відскакує біля сітки. Довга подача змушує суперника відійти назад. Чергування коротких і довгих подач робить гру непередбачуваною."], "ul": ["Коротка подача — м'який рух, м'ячик торкається свого столу ближче до сітки.", "Довга подача — швидший рух, перший відскок ближче до своєї задньої лінії.", "Однаковий замах приховує, яка буде подача.", "Не роби подачу занадто високою.", "Тренуй по 10 коротких і 10 довгих подач."]}, {"h": "Шашки. Передчасне вторгнення", "p": ["Інколи хочеться швидше пройти шашкою в дамки й кинути її вперед. Але самотня шашка в таборі суперника часто гине або заважає своїм. Це і є передчасне вторгнення."], "ul": ["Не відривайся вперед без підтримки.", "Самотня шашка легко потрапляє під удар.", "Вторгнення доречне, коли за ним стоять інші шашки.", "Перевір, чи не заблокують твою шашку.", "Спершу зміцни позицію, потім наступай."]}, {"h": "Волейбол. Прийом м'яча з накидання партнера", "p": ["Один гравець накидає м'яч рукою знизу, інший приймає його знизу двома руками й спрямовує назад. Відстань і силу накидання збільшують поступово."], "ul": ["Накидай м'яч точно й не сильно.", "Той, хто приймає, стоїть у низькій стійці.", "Виходь під м'яч, щоб він летів у центр тіла.", "Направляй м'яч до партнера, а не вгору.", "Міняйтеся ролями після 10 спроб."]}], "f": "Найкращі тенісисти виконують коротку й довгу подачу однаковим рухом, тому суперник до останнього не знає, яка буде подача.", "pr": ["Поясни письмово (3–4 речення), чому передчасне вторгнення в шашках може привести до втрати шашки.", "Виконай 3 серії по 10 повільних напівприсідань у стійці для прийому знизу (руки з'єднані перед собою)."], "q": ["Коли варто використовувати коротку подачу?", "Що таке передчасне вторгнення?", "Чому самотня шашка в таборі суперника небезпечна?", "Як виконується прийом м'яча з накидання партнера?"]}, {"n": "76", "t": "Набивання м'ячика ракеткою на оцінку, гра в піддавки, «Малюкбол» та похідні ігри", "g": "Учень знатиме, як правильно виконати контрольне набивання м'ячика, правила гри в піддавки та різновиди ігор на основі «Малюкболу».", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Набивання", "підбивання м'ячика ракеткою вгору кілька разів поспіль без падіння."], ["Піддавки", "різновид шашок, у якому виграє той, хто першим позбудеться всіх своїх шашок."], ["Контроль м'ячика", "уміння точно керувати силою й напрямком удару."], ["Похідна гра", "гра, створена на основі іншої гри зі зміненими правилами."]], "th": [{"h": "Настільний теніс. Набивання м'ячика ракеткою на оцінку", "p": ["Набивання — простий тест на контроль. Гравець підбиває м'ячик ракеткою вгору невисоко, рахуючи удари. Можна набивати одним боком ракетки, іншим або чергуючи боки."], "ul": ["Тримай ракетку горизонтально, на рівні пояса.", "Підбивай м'ячик невисоко — 20–30 см.", "Дивись на м'ячик, ноги злегка зігнуті.", "Рух іде від кисті, рука майже нерухома.", "Свій результат порівнюй із попереднім — головне, щоб він зростав."]}, {"h": "Шашки. Гра в піддавки", "p": ["У піддавках мета протилежна до звичайних шашок: треба якомога швидше віддати всі свої шашки. Бити обов'язково, тому гравці намагаються «змусити» суперника бити."], "ul": ["Виграє той, у кого не залишилося шашок або ходів.", "Взяття обов'язкове, як і в звичайних шашках.", "Дамка — небажана, її важко віддати.", "Гра вчить бачити обов'язкові взяття.", "Корисно для розуміння комбінацій."]}, {"h": "Волейбол. Рухлива гра «Малюкбол» та похідні", "p": ["На основі «Малюкболу» можна придумати багато варіантів: грати лише передачами зверху, ловити м'яч тільки після відскоку, кидати однією рукою. Такі ігри поступово наближають до справжнього волейболу."], "ul": ["Варіант 1: кидок лише двома руками зверху.", "Варіант 2: обов'язкова передача партнеру перед кидком.", "Варіант 3: ловити м'яч тільки в стійці.", "Правила змінюються за рішенням вчителя.", "Зберігай правила безпеки в будь-якому варіанті."]}], "f": "Піддавки іноді називають «зворотними шашками», бо мета в них — програти всі свої шашки.", "pr": ["Зіграй із кимось із рідних партію в піддавки (або намалюй позицію, у якій біла шашка змушує чорну бити) і запиши, що було найважче.", "Придумай свою похідну гру від «Малюкболу» і запиши 4–5 її правил."], "q": ["Як правильно виконувати набивання м'ячика?", "Яка мета гри в піддавки?", "Чому в піддавках небажано отримати дамку?", "Які похідні ігри від «Малюкболу» ти знаєш?"]}, {"n": "77", "t": "Ігри й квести з тенісу, фізичні вправи шашкіста, передача м'яча знизу", "g": "Учень зможе поєднувати вивчені навички настільного тенісу в іграх, знатиме вправи для тіла й настрою шашкіста та закріпить передачу м'яча знизу.", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Квест", "гра з послідовними завданнями, які треба виконати, щоб дійти до мети."], ["Розслаблення", "зменшення напруги в м'язах і думках."], ["Передача знизу", "передача м'яча партнеру з'єднаними прямими руками."], ["Поєднання рухів", "виконання кількох рухів один за одним без зупинки."]], "th": [{"h": "Настільний теніс. Ігри та квести з елементами настільного тенісу", "p": ["Щоб закріпити навички, використовують ігри: індивідуально (набивання, влучання в ціль на столі), у парах (розіграші на точність) і командою (естафети з ракеткою й м'ячиком). Квест поєднує кілька таких завдань."], "ul": ["Набивання м'ячика на ходу.", "Влучання подачею в мішень на столі.", "Естафета: пронести м'ячик на ракетці.", "Розіграш до 5 очок у парі.", "Поєднання переміщення та удару."]}, {"h": "Шашки. Фізичні вправи та вправи для відновлення емоційного стану", "p": ["Сидіння за дошкою — теж навантаження. Щоб голова працювала ясно, між партіями корисно зробити легку розминку й кілька дихальних вправ."], "ul": ["Розминка шиї, плечей і спини.", "Потягування з піднятими руками.", "Вправи для пальців.", "Повільне дихання з рахунком.", "Посмішка й позитивні слова собі."]}, {"h": "Волейбол. Передача м'яча знизу від стіни, з накидання партнера", "p": ["Передача знизу схожа на прийом знизу, але її мета — точно спрямувати м'яч партнерові. Тренуються біля стіни або з партнером, який накидає м'яч."], "ul": ["Руки прямі, з'єднані.", "Кут рук визначає напрямок польоту м'яча.", "Розгинай ноги в момент удару.", "Не роби замах руками.", "Стоп у кінці руху — руки дивляться на партнера."]}], "f": "У квестах з настільного тенісу часто перемагає не найсильніший, а найуважніший і найпослідовніший гравець.", "pr": ["Придумай квест із 4–5 безпечних домашніх завдань (наприклад, утримати м'ячик на долоні, пройти по лінії, розв'язати шашкову задачу) і запиши його.", "Виконай комплекс «пауза шашкіста»: нахили голови, кругові рухи плечима, потягування, 5 повільних вдихів."], "q": ["Які ігри допомагають закріпити навички настільного тенісу?", "Що таке квест?", "Які вправи корисні шашкістові між партіями?", "Що визначає напрямок польоту м'яча під час передачі знизу?"]}, {"n": "78", "t": "Діагностична робота й підсумок ІІІ чверті: настільний теніс, шашки, волейбол", "g": "Учень повторить вивчене в ІІІ чверті, покаже свої знання й уміння в діагностичній роботі та оцінить власні досягнення.", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Діагностична робота", "перевірка знань і вмінь, яка показує, чого учень уже навчився."], ["Самооцінка", "чесне оцінювання власних результатів."], ["Групи результатів", "рівні досягнень (ГР 1, ГР 2, ГР 3), за якими оцінюють навчання."], ["Повторення", "повернення до вивченого для кращого запам'ятовування."]], "th": [{"h": "Настільний теніс. Навчальна гра. Підсумок модуля", "p": ["За чверть ми дізналися про історію гри та інвентар, вивчили стійку, переміщення, подачі з нижнім, верхнім і бічним обертанням, зрізки, накати, удари й контрудари. У навчальній грі покажи все, чого навчився, і дотримуйся правил."], "ul": ["Пригадай правила рахунку й зміни подачі.", "Виконуй подачу за правилами: підкидання з долоні.", "Використовуй зрізки в захисті та накати в атаці.", "Повертайся в стійку після кожного удару.", "Чесність і повага до суперника — обов'язкові."]}, {"h": "Шашки. Підсумок модуля", "p": ["Ми вивчили шашкову дошку й нотацію, правила ходу та взяття, дамку, етапи партії, комбінації, типові помилки дебюту, гру в піддавки. Не забуваймо й про спокій під час гри."], "ul": ["Назви поля дошки й запиши хід.", "Пригадай назви діагоналей.", "Поясни, що таке комбінація.", "Назви три етапи партії.", "Згадай вправи для відновлення емоційного стану."]}, {"h": "Волейбол. Навчальна гра. Діагностична робота", "p": ["У волейболі ми вивчили історію гри, розмітку майданчика, розміщення й перехід гравців, стійку, переміщення, передачу зверху, прийом і передачу знизу, гру «Малюкбол». Діагностична робота покаже, як ти володієш цими елементами. Оціни себе: що вже виходить, а над чим ще треба працювати."], "ul": ["Перед роботою — ретельна розминка.", "Виконуй завдання спокійно, не поспішай.", "Стеж за правильною технікою, а не лише за результатом.", "Порівнюй себе з собою, а не з іншими.", "Запиши, щ
