о хочеш покращити в наступній чверті."]}], "f": "Помилки на діагностичній роботі — це підказки, над чим варто попрацювати, а не привід засмучуватися.", "pr": ["Склади таблицю «Що я вмію / Що треба покращити» для трьох модулів чверті (настільний теніс, шашки, волейбол).", "Виконай комплекс розминки з 6 вправ, який ти вивчив у цій чверті, і запиши його послідовність."], "q": ["Які види обертання м'ячика в настільному тенісі ти знаєш?", "Назви етапи шашкової партії та їхні завдання.", "Як виконується перехід гравців у волейболі?", "Що в цій чверті вдавалося тобі найкраще?"]}]}, {"name": "IV чверть. Дитяча легка атлетика, доджбол, баскетбол 3×3", "lessons": [{"n": "79", "t": "Нові модулі IV чверті: дитяча легка атлетика, гігієна, історія баскетболу 3×3", "g": "Учень дізнається, що таке дитяча легка атлетика, знатиме правила гігієни на заняттях фізичною культурою та історію баскетболу 3×3.", "k": "Модулі: Дитяча легка атлетика · Доджбол · Баскетбол 3×3", "terms": [["Дитяча легка атлетика", "програма легкоатлетичних вправ та командних змагань в ігровій формі для дітей."], ["Гігієна", "правила догляду за тілом, одягом і місцем занять для збереження здоров'я."], ["Баскетбол 3×3", "різновид баскетболу, у якому дві команди по три гравці грають на одне кільце."], ["Спортивна форма", "зручний одяг і взуття, призначені для занять фізичними вправами."]], "th": [{"h": "Дитяча легка атлетика. Історія розвитку та різновиди", "p": ["Легка атлетика — один із найдавніших видів спорту, до неї належать біг, стрибки та метання. Щоб дітям було цікаво, Міжнародна федерація легкої атлетики (тепер World Athletics) розробила програму «дитячої легкої атлетики»: змагання відбуваються командами, в ігровій формі, з безпечним спрощеним інвентарем."], "ul": ["Бігові види: спринт, біг з бар'єрами, естафети.", "Стрибкові види: стрибки в довжину, у висоту, багатоскоки.", "Метання: малого м'яча, м'якого списа.", "Змагаються команди, а не лише окремі учні.", "Перед заняттями — розминка й правила безпеки."]}, {"h": "Доджбол. Правила гігієни та санітарії під час занять", "p": ["Під час занять ми пітніємо й торкаємося спільного інвентарю, тому гігієна дуже важлива. Чистий одяг, вимиті руки та провітрене приміщення допомагають не хворіти."], "ul": ["Займайся лише у спортивній формі та чистому взутті.", "Після заняття вмийся або прийми душ, переодягнися.", "Мий руки перед і після гри з м'ячем.", "Май свою пляшку з водою, не пий з чужої.", "Провітрюй приміщення до й після занять."]}, {"h": "Баскетбол 3×3. Історія розвитку", "p": ["Баскетбол 3×3 виріс із вуличного баскетболу, у який грали на дворових майданчиках з одним кільцем. Міжнародна федерація баскетболу (FIBA) створила для нього офіційні правила, і гра стала окремим видом спорту. На Олімпійських іграх у Токіо баскетбол 3×3 уперше був у програмі."], "ul": ["Грають дві команди по 3 гравці (плюс 1 запасний).", "Використовують половину звичайного майданчика й одне кільце.", "Гра триває 10 хвилин або до 21 очка.", "Кидок з-за дуги — 2 очки, зсередини — 1 очко.", "На атаку дається 12 секунд."]}], "f": "Баскетбол 3×3 зародився на вулицях, тому в ньому зберігся особливий дух — швидкий, енергійний і видовищний.", "pr": ["Склади пам'ятку «Гігієна на уроках фізичної культури» з 6 правил і повісь її вдома біля спортивної форми.", "Намалюй майданчик для баскетболу 3×3 (половина поля, одне кільце, дуга) і підпиши, скільки очок дає кидок з різних місць."], "q": ["Чим дитяча легка атлетика відрізняється від звичайної?", "Яких правил гігієни треба дотримуватися на заняттях?", "Звідки походить баскетбол 3×3?", "Скільки триває гра в баскетбол 3×3 і скільки очок дає кидок з-за дуги?"]}, {"n": "80", "t": "Бігові вправи, історія доджболу, основні правила баскетболу 3×3", "g": "Учень знатиме спеціальні бігові вправи, дізнається про розвиток доджболу та знатиме основні правила баскетболу 3×3 і правила поведінки на занятті.", "k": "Модулі: Дитяча легка атлетика · Доджбол · Баскетбол 3×3", "terms": [["Бігові вправи", "спеціальні вправи, що вчать правильної техніки бігу."], ["Доджбол", "командна гра, у якій гравці намагаються влучити м'ячем у суперників і ухилитися від їхніх кидків."], ["Атака", "дії команди, яка володіє м'ячем і намагається закинути його в кільце."], ["Час на атаку", "12 секунд, за які команда в баскетболі 3×3 має виконати кидок."]], "th": [{"h": "Дитяча легка атлетика. Навички техніки бігових вправ", "p": ["Бігові вправи допомагають навчитися бігати правильно: високо піднімати стегно, ставити ногу на передню частину стопи, працювати руками. Їх виконують на рівній доріжці після розминки."], "ul": ["Біг з високим підніманням стегна.", "Біг із закиданням гомілки назад.", "Дрібний біг на носках.", "Руки зігнуті в ліктях, рухаються вздовж тулуба.", "Дивись уперед, не нахиляй голову."]}, {"h": "Доджбол. Історія розвитку", "p": ["Доджбол виник як шкільна гра з м'ячем і поширився в багатьох країнах. Назва походить від англійського слова «dodge» — «ухилятися». В Україні доджбол розвивається як спортивна гра для школярів: проводять змагання й турніри для дітей різного віку."], "ul": ["Гра схожа на добре знайому «Вибивного».", "Головне вміння — ухилятися та влучно кидати.", "Грають м'якими м'ячами, щоб не травмуватися.", "Гра розвиває спритність, реакцію й командний дух.", "Правила можуть трохи відрізнятися на різних змаганнях."]}, {"h": "Баскетбол 3×3. Основні правила гри. Поведінка під час заняття", "p": ["У баскетбол 3×3 грають на одне кільце. Команда, що відібрала м'яч, має спочатку вивести його за дугу, а потім атакувати. На атаку дається 12 секунд. Перемагає команда, яка першою набрала 21 очко або має більше очок після 10 хвилин."], "ul": ["Кидок зсередини дуги — 1 очко, з-за дуги — 2 очки.", "Після відбору м'яча — вивести його за дугу.", "Не можна штовхатися, тримати й бити суперника.", "Займайся тільки за командою вчителя.", "Не висни на кільці та не кидай м'яч у людей."]}], "f": "Слово «доджбол» походить від англійського «dodge» — «ухилятися», адже вміння ухилитися від м'яча тут найголовніше.", "pr": ["Виконай на місці бігові вправи: біг з високим підніманням стегна та із закиданням гомілки по 15 секунд, 3 рази (без пересування кімнатою).", "Запиши 5 основних правил баскетболу 3×3 і поясни їх рідним."], "q": ["Які бігові вправи ти знаєш?", "Що означає слово «доджбол»?", "Скільки часу дається на атаку в баскетболі 3×3?", "Що треба зробити з м'ячем після його відбору в баскетболі 3×3?"]}, {"n": "81", "t": "Високий старт, гнучкість плечей доджболіста, ведення м'яча і кидок від грудей", "g": "Учень знатиме техніку високого старту і стартового розбігу, вправи для гнучкості плечового поясу доджболіста та способи ведення м'яча й кидка двома руками від грудей.", "k": "Модулі: Дитяча легка атлетика · Доджбол · Баскетбол 3×3", "terms": [["Високий старт", "початок бігу з положення стоячи, одна нога попереду, тулуб нахилений."], ["Стартовий розбіг", "перші кроки після старту, під час яких бігун набирає швидкість."], ["Ведення м'яча", "переміщення з м'ячем, коли гравець ударяє ним об підлогу однією рукою."], ["Гнучкість", "здатність виконувати рухи з великою амплітудою."]], "th": [{"h": "Дитяча легка атлетика. Техніка старту і стартового розбігу", "p": ["За командою «На старт!» бігун ставить сильнішу ногу вперед до лінії, іншу — позаду. За командою «Увага!» нахиляє тулуб уперед і переносить вагу на передню ногу. За командою «Руш!» (або сигналом) енергійно вибігає."], "ul": ["Не заступай за стартову лінію.", "Перші кроки — короткі й часті, тулуб нахилений.", "Поступово випрямляйся й подовжуй крок.", "Руки активно працюють.", "Помилка: випрямитися одразу після старту."]}, {"h": "Доджбол. Стрибкові вправи, гнучкість плечового поясу", "p": ["Доджболістові потрібні швидкі ноги, щоб ухилятися, і гнучкі плечі, щоб далеко й влучно кидати. Тому в розминку додають стрибки та вправи для плечей."], "ul": ["Стрибки на місці на двох ногах (у залі).", "Стрибки з ноги на ногу.", "Колові рухи руками.", "Відведення прямих рук назад.", "Розтягування плечей з рушником або гімнастичною палицею."]}, {"h": "Баскетбол 3×3. Ведення м'яча правою та лівою, кидок з місця двома руками від грудей", "p": ["Ведуть м'яч кінчиками пальців, а не долонею, м'яч відскакує не вище пояса. Треба вміти вести і правою, і лівою рукою. Кидок двома руками від грудей виконують із місця: м'яч біля грудей, руки й ноги разом розгинаються в бік кільця."], "ul": ["Під час ведення дивись уперед, а не на м'яч.", "Пальці розставлені, кисть м'яка.", "Інша рука захищає м'яч від суперника.", "Кидок: ноги зігнуті — розгинання — м'яч летить по дузі.", "Помилки: удар долонею, високий відскок, погляд униз."]}], "f": "Високий старт використовують на середніх і довгих дистанціях, а спринтери стартують з низького старту з колодок.", "pr": ["Виконай вдома розтягування плечей: колові рухи руками, відведення рук у замку за спину, потягування — по 10 разів.", "Опиши у зошиті три команди старту («На старт!», «Увага!», «Руш!») і що робить бігун після кожної."], "q": ["Які команди подають перед високим стартом?", "Яка типова помилка під час стартового розбігу?", "Навіщо доджболістові гнучкі плечі?", "Як правильно вести баскетбольний м'яч?"]}, {"n": "82", "t": "Біг на 30 метрів, правила безпеки в доджболі, ловіння й передача м'яча від грудей", "g": "Учень знатиме, як правильно пробігати відрізки по 30 м, правила безпеки на доджбольному майданчику та техніку ловіння й передачі м'яча двома руками від грудей.", "k": "Модулі: Дитяча легка атлетика · Доджбол · Баскетбол 3×3", "terms": [["Відрізок", "певна відстань, яку пробігають з максимальною або заданою швидкістю."], ["Фінішний ривок", "прискорення бігуна в останніх кроках перед фінішем."], ["Передача від грудей", "передача м'яча партнеру двома руками з рівня грудей."], ["Ловіння", "прийом м'яча руками з подальшим утриманням."]], "th": [{"h": "Дитяча легка атлетика. Біг по дистанції 3×30 м", "p": ["На уроці відрізок 30 метрів пробігають тричі з відпочинком між повтореннями. Так тренують швидкість і вміння правильно стартувати, розганятися й фінішувати. Між забігами відновлюють дихання ходьбою."], "ul": ["Старт — високий, за сигналом.", "Біжи по своїй доріжці, не заважай іншим.", "Не зупиняйся різко на фініші — пробіжи далі й поступово сповільнюйся.", "Між повтореннями — спокійна ходьба.", "Оцінюй себе: чи вдалося пробігти кожен відрізок рівно швидко."]}, {"h": "Доджбол. Правила безпеки на ігровому майданчику", "p": ["У доджболі м'ячі летять швидко, тому безпека понад усе. Кидати можна лише м'якими м'ячами й лише в дозволену частину тіла, за правилами — нижче плечей."], "ul": ["Не цілься в голову й обличчя.", "Грають тільки м'якими м'ячами.", "Не виходь за межі майданчика й не перетинай центральну лінію.", "Зніми окуляри, якщо можливо, або використовуй спортивні.", "Почув свисток — зупинись."]}, {"h": "Баскетбол 3×3. Ловіння та передачі м'яча на місці двома руками від грудей", "p": ["Щоб упіймати м'яч, витягни руки назустріч, пальці розстав. Торкнувшись м'яча, зігни руки й підтягни його до грудей. Передача від грудей: м'яч біля грудей, лікті вниз, руки випрямляються вперед, кисті завершують рух."], "ul": ["Ловлячи, «гаси» швидкість м'яча, згинаючи руки.", "Передавай партнеру в груди.", "Після передачі кисті повернуті долонями назовні.", "Крок уперед додає сили передачі.", "Помилки: прямі руки при ловінні, передача «зверху»."]}], "f": "У доджболі кидати в голову заборонено — це правило захищає гравців від травм.", "pr": ["Виконай вправу «передача й ловіння від стіни» з м'яким м'ячем (або повітряною кулькою) — 2 серії по 10 разів, стоячи на відстані 1 м від стіни.", "Запиши 5 правил безпеки під час гри в доджбол."], "q": ["Як правильно фінішувати після відрізку 30 м?", "Чому в доджболі не можна цілитися в голову?", "Як правильно ловити баскетбольний м'яч?", "Опиши техніку передачі від грудей."]}, {"n": "83", "t": "Естафети, загальна характеристика доджболу, історія баскетболу", "g": "Учень знатиме правила проведення легкоатлетичних естафет, основні правила й розмітку доджболу та історію баскетболу.", "k": "Модулі: Дитяча легка атлетика · Доджбол · Баскетбол 3×3", "terms": [["Рухлива гра", "гра з активними рухами і простими правилами."], ["Центральна лінія", "лінія, що ділить доджбольний майданчик на дві половини."], ["Вибування", "вихід гравця з гри після влучання м'ячем або упійманого його кидка."], ["Кільце", "металевий обід із сіткою, прикріплений до щита, у який закидають м'яч."]], "th": [{"h": "Дитяча легка атлетика. Рухливі ігри та естафети", "p": ["Естафети — улюблена частина дитячої легкої атлетики. Команди по черзі виконують бігові, стрибкові завдання й передають естафету наступному. Перемагає та команда, що першою і правильно виконала всі завдання."], "ul": ["Чекай свою чергу за лінією.", "Передавай естафету рукою або паличкою, не кидай.", "Біжи по своїй доріжці.", "Виконуй завдання повністю, а не навпіл.", "Підтримуй свою команду."]}, {"h": "Доджбол. Загальна характеристика гри", "p": ["Майданчик прямокутний, розділений центральною лінією. Дві команди стоять на своїх половинах. Гравці кидають м'ячі, намагаючись влучити в суперника. Якщо в тебе влучили — ти вибуваєш; якщо ти впіймав кинутий у тебе м'яч — вибуває той, хто кидав."], "ul": ["Не можна заступати за центральну лінію.", "Влучання після відскоку від підлоги не зараховується.", "Упійманий м'яч — вибуває кидаючий.", "Перемагає команда, яка вибила всіх суперників або має більше гравців наприкінці часу.", "Точні правила оголошує суддя чи вчитель."]}, {"h": "Баскетбол 3×3. Історія розвитку баскетболу, видатні баскетболісти", "p": ["Баскетбол придумав у 1891 році в США вчитель фізкультури Джеймс Нейсміт. Спершу кошиками служили кошики для персиків, звідси й назва: «basket» — кошик, «ball» — м'яч. Сьогодні баскетбол — один з найпопулярніших видів спорту у світі."], "ul": ["Одним із найвідоміших баскетболістів вважають Майкла Джордана.", "Українці також грали в найсильнішій лізі світу — НБА, наприклад, Олексій Лень та Святослав Михайлюк.", "Баскетбол — олімпійський вид спорту.", "Баскетбол 3×3 — молодший «брат» класичного баскетболу.", "Баскетбол розвиває стрибучість, спритність і командну взаємодію."]}], "f": "Перші баскетбольні кошики мали дно, тож після кожного влучання м'яч діставали драбиною або палицею.", "pr": ["Намалюй схему доджбольного майданчика з центральною лінією й позначеннями розміщення гравців обох команд.", "Підготуй усну розповідь (5–6 речень) про історію баскетболу й розкажи її рідним."], "q": ["Як правильно передавати естафету?", "Коли гравець вибуває в доджболі?", "Хто і коли придумав баскетбол?", "Звідки походить назва «баскетбол»?"]}, {"n": "84", "t": "Легка атлетика в Україні, біг 500 м, кидки зверху, почергове ведення м'яча", "g": "Учень знатиме про розвиток легкої атлетики в Україні, правила рівномірного бігу, способи пересування й кидок зверху в доджболі та почергове ведення м'яча.", "k": "Модулі: Дитяча легка атлетика · Доджбол · Баскетбол 3×3", "terms": [["Рівномірний біг", "біг з однаковою швидкістю на всій дистанції."], ["Витривалість", "здатність довго виконувати роботу без втоми."], ["Кидок зверху", "кидок м'яча однією рукою з-за голови або від плеча."], ["Почергове ведення", "ведення м'яча то правою, то лівою рукою."]], "th": [{"h": "Дитяча легка атлетика. Легка атлетика в Україні. Рівномірний біг 500 м", "p": ["В Україні легку атлетику розвиває Федерація легкої атлетики України. Українські легкоатлети здобували перемоги на чемпіонатах світу й Олімпійських іграх: наприклад, Сергій Бубка у стрибках з жердиною та Ярослава Магучіх у стрибках у висоту. Рівномірний біг на 500 м вчить розподіляти сили, щоб не втомитися завчасно."], "ul": ["Починай спокійно, не мчи з перших метрів.", "Тримай однаковий темп на всій дистанції.", "Дихай ритмічно: вдих — на 2–3 кроки, видих — на 2–3 кроки.", "Після фінішу пройдися, не сідай одразу.", "Якщо паморочиться голова — зупинись і скажи вчителю."]}, {"h": "Доджбол. Способи пересувань у нападі й захисті. Кидки м'яча зверху", "p": ["У захисті доджболіст рухається приставними кроками, присідає, відхиляється, щоб м'яч пролетів повз. У нападі — підходить ближче до центральної лінії для кидка. Кидок зверху виконують однією рукою, як метання м'ячика."], "ul": ["Захист: ноги зігнуті, увага на м'ячі суперника.", "Ухилення: присід, крок убік, нахил.", "Кидок зверху: замах рукою назад, крок протилежною ногою вперед.", "Рух іде від ніг через тулуб до руки.", "Цілься нижче плечей суперника."]}, {"h": "Баскетбол 3×3. Способи пересування, почергове ведення м'яча", "p": ["Баскетболіст пересувається звичайним бігом, приставними кроками, з поворотами й зупинками. Почергове ведення допомагає обходити суперника: м'яч переводять з руки в руку перед собою."], "ul": ["Веди м'яч з боку, далі від суперника.", "Переводь м'яч низько, перед собою.", "Не дивись на м'яч.", "Рухайся в стійці, коліна зігнуті.", "Помилка: подвійне ведення (взяти м'яч у дві руки і знову вести)."]}], "f": "Ярослава Магучіх стала олімпійською чемпіонкою в стрибках у висоту на Олімпійських іграх у Парижі.", "pr": ["Підготуй коротке повідомлення (4–5 речень) про одного відомого українського легкоатлета, використовуючи підручник або енциклопедію.", "Виконай імітацію кидка зверху без м'яча: замах, крок, рух рукою — 2 серії по 10 разів кожною рукою, нічого не кидаючи."], "q": ["Як правильно бігти рівномірно на дистанції 500 м?", "Назви відомих українських легкоатлетів.", "Як ухилятися від м'яча в доджболі?", "Що таке подвійне ведення в баскетболі?"]}, {"n": "85", "t": "Баскетбол 3×3: кидок у кільце, його різновиди та правильне виконання", "g": "Учень знатиме різновиди кидків у кільце та послідовність правильного виконання кидка однією рукою від плеча.", "k": "Модулі: Баскетбол 3×3", "terms": [["Кидок у кільце", "дія гравця, щоб закинути м'яч у кошик суперника."], ["Кидок від плеча", "кидок однією рукою, коли м'яч тримають над плечем і випускають кистю вгору-вперед."], ["Кидок у русі", "кидок після ведення або ловіння м'яча з двох кроків."], ["Дуга", "лінія навколо кільця, яка розділяє зони 1 і 2 очок у баскетболі 3×3."]], "th": [{"h": "Баскетбол 3×3. Різновиди кидків у кільце", "p": ["Кидки бувають з місця, у русі (після двох кроків) і в стрибку. Їх виконують двома руками від грудей або однією рукою від плеча. Для початківців головне — правильна техніка, а не дальність."], "ul": ["Кидок двома руками від грудей — для початківців.", "Кидок однією рукою від плеча — основний кидок.", "Кидок у русі — після ведення, з двох кроків.", "Кидок у стрибку — для досвідчених гравців.", "У 3×3 кидок з-за дуги — 2 очки, зсередини — 1 очко."]}, {"h": "Баскетбол 3×3. Правильне виконання кидка однією рукою від плеча", "p": ["Стань обличчям до кільця, ноги на ширині плечей, коліна зігнуті. М'яч лежить на пальцях сильної руки, інша рука підтримує його збоку. Розгинаючи ноги, підніми м'яч і випрями руку вгору-вперед, завершивши кидок рухом кисті вниз."], "ul": ["Лікоть під м'ячем, спрямований у бік кільця.", "М'яч летить по дузі, а не прямо.", "Кисть «махає» в кінці кидка, як у прощанні.", "Дивись на кільце, а не на м'яч.", "Помилки: кидок самою рукою без ніг, лікоть убік, низька траєкторія."]}], "f": "Кидок по високій дузі має більше шансів потрапити в кільце, бо м'яч падає в нього згори.", "pr": ["Перед дзеркалом виконай імітацію кидка однією рукою від плеча (без м'яча) — 3 серії по 10 разів, стежачи за ліктем і рухом кисті.", "Намалюй послідовність кидка від плеча у 3–4 малюнках («кадрах») і підпиши кожну фазу."], "q": ["Які різновиди кидків у кільце ти знаєш?", "Де має бути лікоть під час кидка від плеча?", "Чому м'яч треба кидати по дузі?", "Які помилки трапляються під час кидка?"]}, {"n": "86", "t": "Стрибок у довжину з місця, гігієна інвентарю, кидок у кільце і ведення", "g": "Учень знатиме техніку стрибка в довжину з місця, санітарно-гігієнічні вимоги до інвентарю та закріпить кидок у кільце, пересування й ведення м'яча.", "k": "Модулі: Дитяча легка атлетика · Доджбол · Баскетбол 3×3", "terms": [["Стрибок у довжину з місця", "стрибок двома ногами вперед без розбігу."], ["Відштовхування", "енергійне розгинання ніг, яке підкидає тіло вгору-вперед."], ["Приземлення", "завершальна фаза стрибка, коли стрибун м'яко опускається на ноги."], ["Здоровий спосіб життя", "звички, що зміцнюють здоров'я: рух, сон, харчування, гігієна."]], "th": [{"h": "Дитяча легка атлетика. Техніка стрибка в довжину з місця", "p": ["Стань біля лінії, ноги на ширині стоп. Відведи руки назад і зігни ноги — це замах. Різко махни руками вперед-вгору й відштовхнися двома ногами. У польоті підтягни коліна, а приземлися м'яко на обидві ноги, згинаючи їх."], "ul": ["Не заступай за лінію.", "Відштовхуйся одночасно двома ногами.", "Мах руками допомагає полетіти далі.", "Приземлення — на дві ноги з перекатом з п'ят на носки.", "Довжину стрибка вимірюють до найближчого сліду."]}, {"h": "Доджбол. Санітарно-гігієнічні вимоги до інвентарю. Здоровий спосіб життя", "p": ["М'ячі й інший інвентар торкаються багато рук, тому їх треба регулярно протирати й зберігати в чистому сухому місці. Здоровий спосіб життя — це не лише заняття спортом, а й правильний режим дня."], "ul": ["Пошкоджені або брудні м'ячі не використовують.", "Інвентар після заняття складають на місце.", "Спи достатньо (9–11 годин для твого віку).", "Їж овочі й фрукти, пий воду.", "Щодня рухайся хоча б годину."]}, {"h": "Баскетбол 3×3. Кидок у кільце, пересування в нападі і захисті, ведення м'яча", "p": ["У нападі гравець з м'ячем веде його, шукаючи можливість для кидка або передачі. У захисті гравець стоїть між суперником і кільцем, у низькій стійці, рухається приставними кроками."], "ul": ["Напад: веди м'яч подалі від захисника.", "Захист: тримай позицію між суперником і кільцем.", "Кидай, коли поруч немає захисника.", "Не торкайся суперника руками під час захисту.", "Після кидка — біжи на підбирання м'яча."]}], "f": "Під час стрибка в довжину з місця правильний мах руками може помітно збільшити результат.", "pr": ["Виконай підвідні вправи без стрибків: 10 напівприсідань із замахом рук назад і махом уперед-угору, піднімаючись на носки.", "Склади свій режим дня на будній день (сон, навчання, рух, харчування, відпочинок) і запиши його."], "q": ["Опиши фази стрибка в довжину з місця.", "Як правильно приземлятися?", "Які санітарно-гігієнічні вимоги до спортивного інвентарю?", "Як захисник повинен стояти щодо суперника й кільця?"]}, {"n": "87", "t": "Вправи для стрибка в довжину, сила кистей, ігри з елементами баскетболу", "g": "Учень знатиме комплекс вправ для навчання стрибка в довжину, вправи для сили кистей рук та правила рухливих ігор з елементами баскетболу.", "k": "Модулі: Дитяча легка атлетика · Доджбол · Баскетбол 3×3", "terms": [["Підвідні вправи", "прості вправи, що готують до виконання складного руху."], ["Багатоскоки", "серія стрибків з ноги на ногу з просуванням уперед."], ["Сила кисті", "здатність м'язів кисті міцно стискати й утримувати предмет."], ["Гра з елементами баскетболу", "рухлива гра, у якій використовують ведення, передачі чи кидки м'яча."]], "th": [{"h": "Дитяча легка атлетика. Комплекс вправ для вивчення стрибка в довжину", "p": ["Щоб стрибати далеко, треба мати сильні ноги та вміти поєднувати мах рук і відштовхування. Підвідні вправи виконують у залі або на стадіоні під наглядом учителя."], "ul": ["Стрибки на місці на двох ногах.", "Стрибки вгору з махом рук.", "Стрибки з місця до позначки.", "Багатоскоки на коротку відстань.", "Приземлення в яму з піском — м'яко, на зігнуті ноги."]}, {"h": "Доджбол. Вправи для розвитку сили м'язів кистей рук", "p": ["Сильні кисті допомагають міцно впіймати м'яч і влучно його кинути. Вправи виконують із м'якими предметами, поступово збільшуючи кількість повторень."], "ul": ["Стискання м'якого м'ячика.", "Віджимання від стіни.", "Обертання кистями з невеликим м'ячем.", "Перекидання м'яча з руки в руку.", "Розслаблення кистей після вправ — струшування."]}, {"h": "Баскетбол 3×3. Рухливі ігри з елементами баскетболу", "p": ["Рухливі ігри допомагають закріпити ведення, передачі й кидки у веселій формі. Наприклад, «М'яч капітанові», «Перестрілка», естафети з веденням м'яча."], "ul": ["Естафета з веденням м'яча навколо фішок.", "«М'яч капітанові»: передачі в команді до капітана.", "«Влучний кидок»: кидки в кільце по черзі.", "Дотримуйся правил: без штовхання і хапання.", "Після гри — відновлення дихання ходьбою."]}], "f": "Багатоскоки використовують не лише стрибуни, а й бігуни — вони розвивають силу ніг і довжину кроку.", "pr": ["Виконай вправи для кистей: стискання м'якого м'ячика або згорнутого рушника 3 серії по 15 разів кожною рукою, обертання кистями по 10 разів.", "Опиши правила однієї рухливої гри з елементами баскетболу, яку ти хотів би зіграти з друзями."], "q": ["Які підвідні вправи готують до стрибка в довжину?", "Що таке багатоскоки?", "Навіщо доджболістові сильні кисті?", "Які рухливі ігри з елементами баскетболу ти знаєш?"]}, {"n": "88", "t": "Човниковий біг 4×9 м, зупинка стрибком і ловіння, кидки після прискорення", "g": "Учень знатиме, як правильно виконувати човниковий біг 4×9 м і оцінювати свій результат, вмітиме зупинятися стрибком і ловити м'яч та знатиме, як виконувати кидок після прискорення.", "k": "Модулі: Дитяча легка атлетика · Доджбол · Баскетбол 3×3", "terms": [["Човниковий біг", "біг з кількома поворотами між двома лініями, які розташовані на певній відстані."], ["Спритність", "здатність швидко й точно змінювати рухи та напрямок."], ["Зупинка стрибком", "зупинка, коли гравець невисоко підстрибує й приземляється одночасно на дві ноги."], ["Прискорення", "швидке збільшення швидкості бігу на короткому відрізку."]], "th": [{"h": "Дитяча легка атлетика. Човниковий біг 4×9 м", "p": ["Човниковий біг — тест на спритність і швидкість. Між двома лініями 9 метрів, їх треба пробігти 4 рази, щоразу торкаючись лінії рукою або переносячи кубик. Час фіксують від старту до фінішу. Результат порівнюй зі своїм попереднім — так видно, як ти зростаєш."], "ul": ["Старт — високий, за сигналом.", "Перед поворотом сповільнися, зігни коліна й опусти центр ваги.", "Торкнися лінії рукою (або поклади кубик) і різко повертай.", "Не перестрибуй через лінію і не падай на неї.", "Перед тестом — ретельна розминка гомілкостопів."]}, {"h": "Доджбол. Пересування в нападі та захисті, зупинка стрибком, ловіння м'яча на місці й у русі", "p": ["Щоб упіймати м'яч, гравець виходить йому назустріч, а потім зупиняється стрибком на дві ноги — так тіло стійке і м'яч не випадає. Ловлячи в русі, гравець «гасить» м'яч, підтягуючи його до грудей."], "ul": ["Зупинка стрибком — приземлення одночасно на обидві ноги.", "Коліна зігнуті, тулуб злегка нахилений.", "Ловлячи, розстав пальці й притисни м'яч до грудей.", "Не відвертайся від м'яча й не заплющуй очі.", "У захисті рухайся приставними кроками."]}, {"h": "Баскетбол 3×3. Кидки в кільце після прискорення на 5, 10, 15 м за сигналами", "p": ["Гравець стартує з різних положень (стоячи, сидячи, з поворотом) за сигналом — зоровим (змах руки) чи звуковим (свисток). Він прискорюється на 5, 10 або 15 м, ловить або підбирає м'ячі й кидає в кільце. Це тренує реакцію та кидок у швидкому темпі."], "ul": ["Реагуй на сигнал якомога швидше.", "Перед кидком зроби коротку зупинку або два кроки.", "Не поспішай із кидком — спершу рівновага.", "Вибігай на вільне місце, не зіштовхуйся.", "Після кидка повертайся спокійним кроком."]}], "f": "Човниковий біг назвали так, бо бігун рухається туди й назад, як човник у ткацькому верстаті.", "pr": ["Опиши у зошиті правильну техніку повороту під час човникового бігу і назви 3 типові помилки.", "Виконай вдома імітацію зупинки стрибком на місці (невисокий підскок, приземлення на дві ноги на килимку) — 2 серії по 8 разів, обережно, у вільному просторі."], "q": ["Як правильно повертати під час човникового бігу?", "Як оцінити свій результат у човниковому бігу?", "Як виконується зупинка стрибком?", "Які бувають сигнали для старту?"]}, {"n": "89", "t": "Легкоатлетичні естафети, стійка доджболіста й імітаційні вправи, човниковий біг 4×5 м", "g": "Учень знатиме правила легкоатлетичних естафет, правильно ставатиме в стійку доджболіста та знатиме, як виконувати човниковий біг 4×5 м.", "k": "Модулі: Дитяча легка атлетика · Доджбол · Баскетбол 3×3", "terms": [["Стійка доджболіста", "положення тіла на зігнутих ногах з руками перед собою, готовність ухилитися або впіймати м'яч."], ["Імітаційні вправи", "вправи, що повторюють рухи з гри без м'яча."], ["Етап естафети", "частина дистанції, яку пробігає один учасник команди."], ["Зміна напрямку", "швидкий поворот під час бігу в інший бік."]], "th": [{"h": "Дитяча легка атлетика. Рухливі ігри та естафети", "p": ["Естафети в дитячій легкій атлетиці поєднують біг, стрибки й різні завдання. Кожен учасник пробігає свій етап і передає естафету наступному. Важливо не лише швидко бігти, а й чітко виконувати правила."], "ul": ["Естафета з паличкою: передавай у руку, не кидай.", "Естафета з перешкодами: обходь фішки, не збивай їх.", "Чекай свою чергу за лінією.", "Після свого етапу стань у кінець колони.", "Поважай суперників і суддю."]}, {"h": "Доджбол. Імітаційні вправи. Стійка доджболіста", "p": ["Стійка доджболіста: ноги на ширині плечей, коліна зігнуті, тулуб злегка нахилений, руки перед собою. З такої стійки легко ухилитися, присісти або впіймати м'яч. Імітаційні вправи — це рухи без м'яча: замах, кидок, ухилення."], "ul": ["Вага тіла — на передній частині стоп.", "Погляд — на суперника з м'ячем.", "Імітація кидка: замах, крок, рух рукою.", "Імітація ухилення: присід, крок убік, нахил.", "Виконуй рухи спершу повільно, потім швидше."]}, {"h": "Баскетбол 3×3. Човниковий біг 4×5 м", "p": ["Баскетболіст постійно змінює напрямок, тому човниковий біг на коротких відрізках (5 м) — гарне тренування. Пробігають 4 відрізки по 5 метрів зі швидкими поворотами."], "ul": ["Стартуй у баскетбольній стійці.", "Повертай, торкаючись лінії рукою.", "Перед поворотом — короткий гальмівний крок.", "Не випрямляйся на поворотах.", "Оцінюй себе: чи зменшився час з минулого разу."]}], "f": "У доджболі гравці, що добре тримають стійку, часто ухиляються від м'яча, навіть не зрушивши з місця, — лише присівши чи нахилившись.", "pr": ["Перед дзеркалом стань у стійку доджболіста й утримуй її 20 секунд, повтори 4 рази; потім 10 разів імітуй ухилення присідом.", "Придумай естафету з 3 етапами для однокласників і запиши її правила."], "q": ["Як правильно передавати естафету?", "Опиши стійку доджболіста.", "Що таке імітаційні вправи?", "Навіщо баскетболісту човниковий біг?"]}, {"n": "90", "t": "Метання малого м'яча, фізичні якості доджболіста, укривання м'яча", "g": "Учень знатиме техніку метання малого м'яча з-за голови через плече, вправи для розвитку фізичних якостей та способи утримання й укривання м'яча в баскетболі.", "k": "Модулі: Дитяча легка атлетика · Доджбол · Баскетбол 3×3", "terms": [["Метання", "кидок предмета якомога далі або влучніше."], ["Замах", "рух рукою назад перед кидком, щоб накопичити силу."], ["Укривання м'яча", "захист м'яча від суперника тілом і рукою."], ["Фізичні якості", "сила, швидкість, витривалість, спритність і гнучкість."]], "th": [{"h": "Дитяча легка атлетика. Техніка метання малого м'яча з-за голови через плече", "p": ["М'ячик тримають пальцями, не притискаючи до долоні. Метальник стоїть лівим боком до напрямку кидка (для правші), відводить руку назад, потім розгинає ноги, повертає тулуб і викидає руку з-за голови через плече вгору-вперед."], "ul": ["Ліва нога — попереду (для правші).", "Рука прямує через плече, лікоть вгорі.", "Кидок під кутом угору, а не вниз.", "Метай тільки за командою і в бік, де нікого немає.", "Підбирай м'ячі лише за сигналом учителя."]}, {"h": "Доджбол. Розвиток фізичних якостей", "p": ["Доджбол вимагає сили (для кидків), швидкості й спритності (для ухилення), витривалості (щоб грати довго) і гнучкості (щоб нахилятися й присідати). Кожну якість розвивають своїми вправами."], "ul": ["Сила: віджимання від стіни, присідання.", "Швидкість: біг на короткі відрізки.", "Спритність: човниковий біг, ухилення.", "Гнучкість: нахили, розтягування.", "Витривалість: рухливі ігри, рівномірний біг."]}, {"h": "Баскетбол 3×3. Техніка утримання і укривання м'яча", "p": ["Коли поруч суперник, м'яч треба надійно тримати. Гравець притискає м'яч до себе, розставивши лікті, або веде його далі від суперника, ставлячи між ними своє тіло."], "ul": ["Тримай м'яч двома руками, пальці розставлені.", "Відведи м'яч від суперника.", "Корпус — між суперником і м'ячем.", "Не відштовхуй суперника ліктями.", "Дивись, кому можна передати м'яч."]}], "f": "Метання малого м'яча — підготовча вправа до метання списа, бо рух руки в них дуже схожий.", "pr": ["Виконай імітацію метання з-за голови через плече без предмета — 3 серії по 8 разів, стежачи, щоб лікоть був угорі.", "Склади таблицю «Фізична якість — вправа» для 5 якостей і запиши по одній безпечній домашній вправі для кожної."], "q": ["Як правильно тримати малий м'яч для метання?", "Яке положення ніг для метання правою рукою?", "Які фізичні якості потрібні доджболістові?", "Як укрити м'яч від суперника?"]}, {"n": "91", "t": "Вправи для метання, кидок знизу й зупинка двома кроками, передача від грудей", "g": "Учень знатиме вправи для оволодіння метанням, техніку кидка знизу й зупинки двома кроками в доджболі та закріпить ловіння й передачу м'яча двома руками від грудей.", "k": "Модулі: Дитяча легка атлетика · Доджбол · Баскетбол 3×3", "terms": [["Кидок знизу", "кидок м'яча рукою, що рухається знизу вперед."], ["Зупинка двома кроками", "зупинка, під час якої гравець робить крок однією, а потім іншою ногою."], ["Фінальне зусилля", "швидкий завершальний рух усього тіла під час кидка."], ["Підвідна вправа до метання", "проста вправа для оволодіння окремою частиною кидка."]], "th": [{"h": "Дитяча легка атлетика. Вправи для оволодіння технікою метання малого м'яча", "p": ["Метання вивчають частинами: спочатку рух руки, потім рух ніг і тулуба, а далі — поєднання з кроками. Так рух поступово стає правильним і вільним."], "ul": ["Кидок м'ячика в стіну з місця.", "Кидок з положення боком до напрямку кидка.", "Кидок з кроку.", "Кидок у ціль (обруч на підлозі).", "Метання лише в одному напрямку, по черзі."]}, {"h": "Доджбол. Кидки знизу, зупинка двома кроками, ловіння, кидок з місця зверху", "p": ["Кидок знизу — простий і безпечний, його використовують, коли суперник близько. Зупинка двома кроками допомагає не заступити за центральну лінію після розбігу. Ловлячи м'яч, тримай руки перед собою."], "ul": ["Кидок знизу: рука рухається знизу вперед, як у боулінгу.", "Зупинка двома кроками: крок — крок — стоп.", "Ловіння: пальці розставлені, м'яч до грудей.", "Кидок зверху з місця — замах і поворот тулуба.", "Не наближайся впритул до центральної лінії."]}, {"h": "Баскетбол 3×3. Техніка ловіння і передачі м'яча двома руками від грудей", "p": ["Повторюємо найпростішу й найнадійнішу передачу. Тепер виконуємо її з кроком вперед і в русі: гравець ловить м'яч, робить крок і передає партнеру."], "ul": ["Перед ловінням покажи партнеру руки — «мішень».", "Прийми м'яч м'якими руками.", "Передача — з кроком уперед.", "Передавай туди, куди біжить партнер.", "Не передавай «наосліп»."]}], "f": "Кидок знизу в доджболі складно впіймати, бо він летить низько, на рівні ніг.", "pr": ["Намалюй послідовність зупинки двома кроками (3 «кадри») і підпиши кожну фазу.", "Виконай з м'якою іграшкою чи згорнутими шкарпетками 10 ловінь, підкидаючи їх перед собою невисоко двома руками."], "q": ["Як вивчають техніку метання частинами?", "Коли в доджболі зручно використовувати кидок знизу?", "Як виконується зупинка двома кроками?", "Що означає «показати руки» партнеру перед передачею?"]}, {"n": "92", "t": "Стрибок у висоту способом «переступання», гра «М'яч ведучому», підвідні ігри баскетболіста", "g": "Учень знатиме техніку стрибка у висоту способом «переступання», правила гри «М'яч ведучому» та підвідні ігри для баскетболу.", "k": "Модулі: Дитяча легка атлетика · Доджбол · Баскетбол 3×3", "terms": [["Стрибок у висоту способом «переступання»", "стрибок через планку збоку, коли ноги по черзі переносять через неї."], ["Планка", "легка жердина, яку кладуть на стійки для стрибків у висоту."], ["Махова нога", "нога, яку виносять угору першою під час стрибка."], ["Ведучий", "гравець, який стоїть у центрі гри і передає м'яч учасникам."]], "th": [{"h": "Дитяча легка атлетика. Стрибок у висоту з розбігу способом «переступання»", "p": ["Розбіг роблять під кутом до планки збоку. Відштовхуються ногою, дальшою від планки. Махова нога (ближча до планки) прямою виноситься вгору над планкою, за нею переноситься поштовхова нога. Приземлення — на махову ногу на м'який мат."], "ul": ["Розбіг — кілька кроків під кутом до планки.", "Відштовхування дальньою від планки ногою.", "Мах прямою ногою вгору.", "Тулуб тримай рівно, не падай на планку.", "Стрибай лише за наявності мату та під наглядом учителя."]}, {"h": "Доджбол. Рухлива гра «М'яч ведучому»", "p": ["Гравці стоять колом або шеренгою, у центрі — ведучий. Він по черзі передає м'яч кожному гравцю, а той повертає його назад. Гра вчить точно ловити й передавати м'яч."], "ul": ["Ведучий передає м'яч по черзі.", "Гравці ловлять м'яч двома руками.", "Повертай м'яч точно в руки ведучому.", "Помилився — стаєш на 1 крок далі або змінюєш ведучого.", "Грай уважно, не відволікайся."]}, {"h": "Баскетбол 3×3. Рухливі та підвідні ігри", "p": ["Підвідні ігри — це ігри, що готують до баскетболу: у них використовують ведення, передачі, кидки. Вони вчать діяти разом із командою та швидко ухвалювати рішення."], "ul": ["«Передачі в трійках» — м'яч не повинен упасти.", "«Вибий м'яч» — ведучий охороняє м'яч від інших.", "«Квач з веденням» — тікати можна, тільки ведучи м'яч.", "Без штовхання і хапання суперників.", "Після гри — відновлення дихання."]}], "f": "Спосіб «переступання» — один із найдавніших способів стрибків у висоту, з нього зазвичай починають навчання.", "pr": ["Намалюй схему стрибка «переступання»: розбіг під кутом, місце відштовхування, перехід через планку, приземлення.", "Виконай стоячи біля опори махи прямою ногою вперед-угору по 10 разів кожною ногою."], "q": ["Під яким кутом виконують розбіг у стрибку «переступанням»?", "Якою ногою відштовхуються?", "Як грати в «М'яч ведучому»?", "Які підвідні ігри до баскетболу ти знаєш?"]}, {"n": "93", "t": "Стрибкові естафети, кидки в русі та знизу в доджболі, передача м'яча однією рукою від плеча", "g": "Учень знатиме правила стрибкових естафет, техніку кидків у русі та знизу із зупинкою, а також передачу м'яча однією рукою від плеча.", "k": "Модулі: Дитяча легка атлетика · Доджбол · Баскетбол 3×3", "terms": [["Стрибкова естафета", "естафета, у якій учасники долають етап стрибками."], ["Кидок у русі", "кидок м'яча під час бігу чи після кроків."], ["Передача від плеча", "передача м'яча однією рукою з положення біля плеча."], ["Рівновага", "здатність утримувати стійке положення тіла."]], "th": [{"h": "Дитяча легка атлетика. Стрибкові вправи та естафети", "p": ["У стрибкових естафетах учасники долають етап стрибками на двох ногах, на одній нозі, через невисокі перешкоди. Це розвиває силу ніг і координацію."], "ul": ["Стрибки на двох ногах до позначки і назад.", "Стрибки на одній нозі (зміна ніг).", "Стрибки через низькі перешкоди.", "Приземляйся м'яко, на передню частину стопи.", "Тримай дистанцію від інших учасників."]}, {"h": "Доджбол. Кидки в русі, зупинка після кидка, кидки знизу", "p": ["Кидок у русі виконують після кількох кроків. Після кидка важливо одразу зупинитися, щоб не заступити за центральну лінію й бути готовим ухилятися від відповідного кидка."], "ul": ["Крок — замах — кидок — зупинка.", "Після кидка — у стійку доджболіста.", "Кидок знизу — коли треба кинути низько.", "Цілься нижче плечей.", "Не заступай за центральну лінію."]}, {"h": "Баскетбол 3×3. Ловіння і передача м'яча однією рукою від плеча на місці та в русі", "p": ["Передача однією рукою від плеча потрібна, коли партнер далеко. М'яч підтримують двома руками, потім сильна рука виносить його до плеча й різко випрямляється вперед, кисть завершує рух."], "ul": ["Крок уперед протилежною ногою.", "Лікоть позаду м'яча.", "Кисть і пальці завершують рух.", "У русі — передача після кроку, не стрибаючи.", "Ловлячи, витягни руки назустріч."]}], "f": "Стрибки на одній нозі добре тренують рівновагу, яка потрібна майже в кожному виді спорту.", "pr": ["Виконай вправу на рівновагу: стій на одній нозі по 20 секунд на кожній, 3 рази, руки в сторони.", "Опиши письмово, чим передача від плеча відрізняється від передачі від грудей і коли яку краще використовувати."], "q": ["Які стрибкові вправи використовують в естафетах?", "Що робити доджболісту після кидка в русі?", "Як виконується передача однією рукою від плеча?", "Коли краще використовувати передачу від плеча?"]}, {"n": "94", "t": "Розбіг і відштовхування, зупинки й повороти в доджболі, ведення і передача", "g": "Учень знатиме, як поєднувати розбіг і відштовхування в стрибках, як зупинятися й повертатися після кидка в доджболі та як передавати м'яч після ведення.", "k": "Модулі: Дитяча легка атлетика · Доджбол · Баскетбол 3×3", "terms": [["Розбіг", "біг перед стрибком або кидком, щоб набрати швидкість."], ["Поштовхова нога", "нога, якою стрибун відштовхується від землі."], ["Поворот на місці", "зміна напрямку тіла, коли одна нога залишається на місці як опора."], ["Опорна нога", "нога, на якій тримається вага тіла під час повороту."]], "th": [{"h": "Дитяча легка атлетика. Техніка розбігу і відштовхування", "p": ["Розбіг має бути рівним і поступово прискорюватися. Останні кроки — найважливіші: стрибун готується до відштовхування, не сповільнюючись. Відштовхуються енергійно, з махом рук і махової ноги вгору."], "ul": ["Розбіг з однієї й тієї ж позначки.", "Кроки рівні, без підстрибування.", "Останній крок — трохи коротший.", "Відштовхування — швидке й енергійне.", "Помилка: зупинка або «підкрадання» перед відштовхуванням."]}, {"h": "Доджбол. Зупинка стрибком і двома кроками, повороти на місці після кидка, кидок у русі зверху", "p": ["Після кидка в русі гравець зупиняється стрибком або двома кроками й одразу повертається до суперника, щоб бачити відповідний кидок. Поворот виконують на опорній нозі."], "ul": ["Зупинка — на зігнутих ногах.", "Поворот — на передній частині опорної стопи.", "Після повороту — стійка доджболіста.", "Кидок у русі зверху: крок, замах, кидок.", "Не відвертайся від суперників надовго."]}, {"h": "Баскетбол 3×3. Ведення та передача м'яча іншому гравцю", "p": ["Після ведення гравець бере м'яч двома руками й передає партнеру. Важливо побачити відкритого партнера заздалегідь і не зупинятися надовго з м'ячем у руках."], "ul": ["Під час ведення дивись на партнерів.", "Зупинись і передай без затримки.", "Передача від грудей або від плеча.", "Після передачі рухайся на вільне місце.", "Помилка: пробіжка — кроки з м'ячем у руках без ведення."]}], "f": "Стрибуни здебільшого відміряють свій розбіг кроками й завжди починають його з однієї позначки.", "pr": ["Намалюй схему розбігу й відштовхування для стрибка в довжину або у висоту (місце старту розбігу, кроки, місце відштовхування).", "Виконай повороти на місці на опорній нозі (по 90 градусів) — по 8 разів у кожен бік, повільно, у вільному просторі."], "q": ["Чим важливі останні кроки розбігу?", "Як виконується поворот на місці?", "Що робити доджболісту після кидка в русі?", "Що таке пробіжка в баскетболі?"]}, {"n": "95", "t": "Метання м'ячика в ціль, гра «Хто найвлучніший», рухливі ігри з пересуваннями в баскетболі", "g": "Учень знатиме, як метати м'ячик у вертикальну й горизонтальну ціль, правила гри «Хто найвлучніший» та рухливі ігри з пересуваннями.", "k": "Модулі: Дитяча легка атлетика · Доджбол · Баскетбол 3×3", "terms": [["Вертикальна ціль", "мішень, розташована на стіні чи щиті."], ["Горизонтальна ціль", "мішень, розташована на землі, наприклад, обруч."], ["Влучність", "уміння точно потрапити м'ячем у ціль."], ["Дистанція кидка", "відстань від гравця до цілі."]], "th": [{"h": "Дитяча легка атлетика. Метання м'ячика у вертикальну і горизонтальну ціль", "p": ["Під час метання в ціль головне — не сила, а точність. Метальник прицілюється, обирає потрібну дугу польоту й кидає з правильним рухом руки. У вертикальну ціль кидають прямішою траєкторією, у горизонтальну — по дузі."], "ul": ["Стань боком до цілі (для кидка зверху).", "Дивись на ціль, а не на м'ячик.", "Регулюй силу кидка під відстань.", "Метай лише за сигналом, по черзі.", "Підбирай м'ячики після того, як усі кинули."]}, {"h": "Доджбол. Навчальна гра «Хто найвлучніший»", "p": ["Гравці по черзі кидають м'яч у ціль або в рухомого гравця-«мішень» (м'яким м'ячем, нижче плечей). За кожне влучання — очко. Перемагає найвлучніший гравець або команда."], "ul": ["Кидай з-за лінії.", "Чергуй кидки зверху й знизу.", "Кидок у гравця — лише нижче плечей.", "Не кидай, доки ціль не готова.", "Рахуйте очки чесно."]}, {"h": "Баскетбол 3×3. Рухливі ігри з пересуваннями", "p": ["Рухливі ігри з пересуваннями тренують біг, приставні кроки, зупинки й повороти. Наприклад, «Дзеркало» — гравець повторює рухи партнера в баскетбольній стійці, або «Квач» у стійці приставними кроками."], "ul": ["«Дзеркало» — повторюй рухи партнера.", "«Квач» — тікати лише приставними кроками.", "Естафета з різними способами пересування.", "Тримай стійку й не схрещуй ноги.", "Стеж за іншими, щоб не зіткнутися."]}], "f": "Тренування влучності корисне для багатьох видів спорту: баскетболу, гандболу, доджболу та навіть настільного тенісу.", "pr": ["Удома на килимі поклади обруч або коло з мотузки і кидай у нього м'які шкарпетки знизу з відстані 2 м — 3 серії по 10 кидків, рахуючи влучання.", "Опиши правила гри «Дзеркало» й зіграй у неї з кимось із рідних 2–3 хвилини (без бігу)."], "q": ["Чим метання у вертикальну ціль відрізняється від метання в горизонтальну?", "Що найважливіше під час метання в ціль?", "Як грати в «Хто найвлучніший»?", "Які ігри з пересуваннями ти знаєш?"]}, {"n": "96", "t": "Стрибкові естафети, кидок у русі двома руками в доджболі, стійки й пересування баскетболіста", "g": "Учень закріпить стрибкові вправи, знатиме техніку кидка двома руками в русі та ловіння й передачі на місці, а також стійки й пересування баскетболіста в нападі та захисті.", "k": "Модулі: Дитяча легка атлетика · Доджбол · Баскетбол 3×3", "terms": [["Координація", "уміння узгоджувати рухи різних частин тіла."], ["Кидок двома руками", "кидок м'яча обома руками з-за голови або від грудей."], ["Захисна стійка", "низька стійка баскетболіста з розставленими руками для протидії суперникові."], ["Атакувальна стійка", "стійка гравця з м'ячем, з якої зручно вести, передати чи кинути."]], "th": [{"h": "Дитяча легка атлетика. Стрибкові вправи та естафети", "p": ["Повторюємо стрибкові вправи, але тепер ускладнюємо їх: стрибки зі зміною напрямку, «класики», стрибки в обручі. Такі вправи розвивають координацію."], "ul": ["Стрибки в обручі по черзі.", "«Класики» на одній і двох ногах.", "Стрибки боком через лінію.", "Приземлення м'яке, на зігнуті ноги.", "Перед стрибками — розминка гомілкостопів."]}, {"h": "Доджбол. Кидок у русі двома руками, ловля й передачі на місці, кидок з місця", "p": ["Кидок двома руками в русі — сильний і точний. Гравець робить кілька кроків, тримаючи м'яч двома руками, і викидає його вперед від грудей або з-за голови. На місці гравці тренують ловлю й передачі в парах."], "ul": ["Тримай м'яч обома руками перед грудьми.", "Кидок — з кроком уперед.", "Ловля — пальці розставлені, руки назустріч.", "Передача партнеру — точно в груди.", "Після кидка — у стійку."]}, {"h": "Баскетбол 3×3. Стійки баскетболіста, пересування в нападі і захисті", "p": ["У нападі гравець з м'ячем тримає його біля пояса, готовий вести, передати чи кинути. У захисті стійка нижча, руки розставлені, гравець рухається приставними кроками, не схрещуючи ніг."], "ul": ["Атакувальна стійка: м'яч біля пояса, ноги зігнуті.", "Захисна стійка: низько, руки в сторони.", "Пересування в захисті — приставними кроками.", "У нападі — ривки на вільне місце.", "Помилка: стояти на прямих ногах."]}], "f": "Добра координація допомагає не лише в спорті, а й у щоденному житті — менше падати й спотикатися.", "pr": ["Затримайся в захисній стійці баскетболіста по 20 секунд, 4 рази, а між ними зроби по 5 приставних кроків у кожен бік.", "Запиши у зошит 3 відмінності між атакувальною і захисною стійками баскетболіста."], "q": ["Які вправи розвивають координацію?", "Як виконується кидок двома руками в русі?", "Чим захисна стійка відрізняється від атакувальної?", "Як пересуватися в захисті?"]}, {"n": "97", "t": "Фінальне зусилля в метанні, зв'язки рухів у доджболі, зупинки й повороти", "g": "Учень знатиме, як виконувати фінальне зусилля й гальмування під час метання, поєднуватиме вивчені рухи в доджболі та знатиме різновиди зупинок, поворотів і стрибків у баскетболі.", "k": "Модулі: Дитяча легка атлетика · Доджбол · Баскетбол 3×3", "terms": [["Гальмування", "зупинка руху тіла після кидка, щоб не переступити лінію."], ["Зв'язка рухів", "кілька вивчених рухів, виконаних один за одним без пауз."], ["Стрибок угору", "вертикальне відштовхування від підлоги однією або двома ногами."], ["Поворот уперед", "поворот на опорній нозі в бік обличчя."]], "th": [{"h": "Дитяча легка атлетика. Метання малого м'яча з-за голови через плече: фінальне зусилля і гальмування", "p": ["Фінальне зусилля — найважливіша частина метання: ноги розгинаються, таз і груди повертаються вперед, а рука з-за голови різко викидає м'ячик. Після кидка метальник гальмує: переносить вагу на передню ногу, ставить праву вперед (для правші) і зупиняється перед лінією."], "ul": ["Рух іде знизу вгору: ноги — тулуб — рука.", "Рука виконує «хльосткий» рух через плече.", "Після кидка — крок-гальмування.", "Не переступай лінію метання.", "Метай лише за дозволом учителя."]}, {"h": "Доджбол. Поєднання рухів та навичок", "p": ["У грі рухи не виконуються окремо: гравець ловить м'яч, зупиняється, повертається, кидає і знову ухиляється. Ці зв'язки тренують, щоб у грі все виходило швидко й без зайвих думок."], "ul": ["Ловіння — зупинка — кидок.", "Ухилення — стійка — ловіння.", "Кидок у русі — зупинка — поворот.", "Спочатку повільно, потім у темпі гри.", "Головне — правильна техніка кожного руху."]}, {"h": "Баскетбол 3×3. Різновиди зупинок і поворотів, стрибки вгору з однієї та двох ніг", "p": ["Баскетболіст зупиняється стрибком або двома кроками, а потім може повернутися на опорній нозі вперед чи назад. Стрибки вгору з двох ніг використовують для підбирання м'яча, з однієї — після розбігу, наприклад, під час кидка в русі."], "ul": ["Зупинка стрибком — дві ноги одночасно.", "Зупинка двома кроками — нога за ногою.", "Поворот вперед і назад на опорній нозі.", "Опорну ногу не відривай, поки тримаєш м'яч.", "Приземлення після стрибка — на зігнуті ноги."]}], "f": "Сильний кидок у метанні робиться не рукою, а всім тілом — рука лише завершує рух, що починається від ніг.", "pr": ["Виконай імітацію метання з фінальним зусиллям і кроком-гальмуванням без предмета — 2 серії по 8 разів, перед собою має бути вільний простір.", "Запиши у зошит послідовність рухів у зв'язці «ловіння — зупинка — поворот — кидок»."], "q": ["Що таке фінальне зусилля в метанні?", "Навіщо потрібне гальмування після кидка?", "Які зупинки виконує баскетболіст?", "Коли баскетболіст стрибає з двох ніг, а коли з однієї?"]}, {"n": "98", "t": "Перехід через планку, гра «М'яч ведучому», передачі в парах і трійках", "g": "Учень знатиме, як переходити через планку й приземлятися у стрибку у висоту, грати в ускладнену гру «М'яч ведучому» та виконувати передачі в колонах, парах і трійках.", "k": "Модулі: Дитяча легка атлетика · Доджбол · Баскетбол 3×3", "terms": [["Перехід через планку", "фаза стрибка, коли тіло стрибуна переноситься над планкою."], ["Мат", "м'який товстий матрац для безпечного приземлення."], ["Трійка", "група з трьох гравців, які виконують вправу разом."], ["Ведення в русі", "ведення м'яча під час ходьби чи бігу."]], "th": [{"h": "Дитяча легка атлетика. Техніка переходу через планку і приземлення", "p": ["У способі «переступання» спочатку над планкою проходить махова нога, потім тулуб трохи нахиляється до неї, а поштовхова нога швидко переноситься слідом. Приземлення — на махову ногу, м'яко, на мат."], "ul": ["Над планкою тулуб вертикальний, не падай назад.", "Поштовхову ногу переносити швидко й високо.", "Приземлення — на махову ногу.", "Стрибай лише на мат, ніколи на тверду підлогу.", "Збив планку — не страшно, повтори спробу."]}, {"h": "Доджбол. Рухлива гра «М'яч ведучому»", "p": ["Ускладнюємо гру: ведучий передає м'яч у різному порядку, а гравці мають бути готові щомиті. Можна грати двома командами — чия команда швидше й без помилок передасть м'яч усім гравцям."], "ul": ["Ведучий передає м'яч у будь-якому порядку.", "Будь уважним — м'яч може прилетіти будь-якої миті.", "Передачі зверху й знизу почергово.", "Перемагає команда без помилок.", "Ведучий змінюється по черзі."]}, {"h": "Баскетбол 3×3. Ведення м'яча на місці та в русі, передачі в колонах, парах, трійках", "p": ["Ведення на місці тренує контроль м'яча, ведення в русі — уміння бігти з м'ячем. Передачі в парах і трійках учать грати разом: м'яч рухається швидше за будь-якого гравця."], "ul": ["Ведення на місці — правою, лівою, почергово.", "Ведення в русі — м'яч трохи попереду збоку.", "Пари: передачі від грудей на місці й у русі.", "Трійки: передача тому, хто відкрився.", "Не тримай м'яч довго — передавай."]}], "f": "У баскетболі кажуть: «М'яч бігає швидше за гравця» — тому командна гра передачами така ефективна.", "pr": ["Намалюй у 3 «кадрах» фази стрибка «переступанням»: відштовхування, перехід через планку, приземлення.", "Виконай ведення м'яча на місці правою і лівою рукою (якщо є м'яч і вільне безпечне місце) або імітацію ведення без м'яча — по 30 секунд кожною рукою, 3 рази."], "q": ["На яку ногу приземляються у стрибку «переступанням»?", "Чому стрибати у висоту можна тільки на мат?", "Як ускладнити гру «М'яч ведучому»?", "Навіщо тренувати передачі в трійках?"]}, {"n": "99", "t": "Стрибкові естафети, кидки однією рукою, гнучкість і взаємодія в баскетболі", "g": "Учень удосконалить стрибкові вправи, знатиме техніку кидка однією рукою з місця та передач у русі в доджболі, а також вправи на гнучкість і основи взаємодії в баскетболі.", "k": "Модулі: Дитяча легка атлетика · Доджбол · Баскетбол 3×3", "terms": [["Стрибучість", "здатність високо або далеко стрибати."], ["Кидок однією рукою", "кидок м'яча зверху однією рукою після замаху."], ["Взаємодія", "узгоджені дії двох або більше гравців команди."], ["Розтягування", "вправи, що збільшують рухливість суглобів і еластичність м'язів."]], "th": [{"h": "Дитяча легка атлетика. Стрибкові вправи та естафети", "p": ["Стрибкові вправи розвивають стрибучість — силу й швидкість ніг. В естафетах їх поєднують із бігом: учасник пробігає частину етапу, а частину долає стрибками."], "ul": ["Стрибки «жабкою» (на коротку відстань).", "Стрибки з ноги на ногу.", "Стрибки через лінії, розмічені на підлозі.", "Відпочинок між серіями обов'язковий.", "Якщо болять коліна чи гомілки — скажи вчителю."]}, {"h": "Доджбол. Кидки з місця однією рукою, ловля та передачі в русі", "p": ["Кидок однією рукою з місця виконують боком до суперника: замах назад, поворот тулуба й кидок. Передачі в русі між партнерами допомагають швидко переправити м'яч гравцеві, який стоїть ближче до суперника."], "ul": ["Тримай м'яч пальцями, не долонею.", "Протилежна нога — попереду.", "Передачі в русі — точно на партнера.", "Ловлячи в русі, не зупиняйся різко.", "Цілься нижче плечей."]}, {"h": "Баскетбол 3×3. Вправи на гнучкість. Взаємодія з партнерами", "p": ["Гнучкість допомагає уникати травм і робить рухи вільнішими. У баскетболі 3×3 на майданчику лише троє гравців, тому кожен важливий: треба відкриватися, передавати м'яч, допомагати в захисті."], "ul": ["Нахили вперед до носків, без ривків.", "Розтягування стегна й литок стоячи.", "Відкривайся для передачі.", "Передай м'яч тому, хто ближче до кільця.", "Допомагай партнеру в захисті."]}], "f": "У баскетболі 3×3 на майданчику всього шестеро гравців, тому кожна помилка чи вдала передача одразу впливає на результат.", "pr": ["Виконай комплекс розтягування: нахили вперед, розтягування стегна стоячи біля опори, розтягування литок — по 20 секунд кожна вправа, 2 рази.", "Опиши письмово 3 способи, як гравці можуть допомагати один одному в баскетболі 3×3."], "q": ["Що таке стрибучість?", "Як виконується кидок однією рукою з місця?", "Навіщо баскетболісту гнучкість?", "Що означає взаємодія з партнерами?"]}, {"n": "100", "t": "Стрибок у довжину з розбігу, захист у доджболі, кидок з близької дистанції", "g": "Учень знатиме вправи для вивчення стрибка в довжину з розбігу, як розподіляються обов'язки в захисті доджбольної команди та техніку кидка з близької дистанції.", "k": "Модулі: Дитяча легка атлетика · Доджбол · Баскетбол 3×3", "terms": [["Брусок для відштовхування", "смужка біля ями з піском, від якої відштовхуються у стрибку в довжину."], ["Спосіб «зігнувши ноги»", "найпростіший спосіб стрибка в довжину, коли в польоті ноги підтягують до грудей."], ["Розподіл обов'язків", "визначення, хто за що відповідає в команді."], ["Кидок з близької дистанції", "кидок у кільце з відстані кількох кроків від нього."]], "th": [{"h": "Дитяча легка атлетика. Комплекс вправ для вивчення стрибка в довжину", "p": ["Стрибок у довжину з розбігу способом «зігнувши ноги» складається з розбігу, відштовхування від бруска, польоту й приземлення в яму з піском. Вивчаємо його частинами: стрибки з 3–5 кроків розбігу, відштовхування з махом, приземлення."], "ul": ["Стрибки з короткого розбігу.", "Відштовхування однією ногою з махом іншої.", "Підтягування колін у польоті.", "Приземлення на дві ноги з виносом рук уперед.", "Не заступай за брусок — спроба не зарахується."]}, {"h": "Доджбол. Розподіл обов'язків між гравцями в захисті", "p": ["У захисті команда діє разом: хтось стежить за суперником з м'ячем, хтось готовий ловити, хтось прикриває інших. Добре організована команда рідше втрачає гравців."], "ul": ["Гравці «ловці» — стоять попереду й ловлять м'ячі.", "Інші — ухиляються й підбирають м'ячі.", "Не стійте купою — так легше влучити.", "Попереджайте одне одного голосом.", "Кожен знає свою роль у команді."]}, {"h": "Баскетбол 3×3. Кидок з близької дистанції з місця та в русі", "p": ["Кидок з близької відстані — найнадійніший спосіб набрати очко. Його виконують з місця або в русі, часто з відскоком від щита: м'яч спрямовують у верхній кут намальованого на щиті квадрата."], "ul": ["З місця: стійка, м'яч над плечем, кидок по дузі.", "У русі: ведення — два кроки — кидок.", "Використовуй щит, коли кидаєш збоку.", "Дивись на точку, куди цілишся.", "Не поспішай, кидай упевнено."]}], "f": "Прямокутник, намальований на баскетбольному щиті, допомагає гравцям цілитися, кидаючи з відскоком від щита.", "pr": ["Намалюй схему стрибка в довжину з розбігу: розбіг, брусок, політ, приземлення в яму з піском — і підпиши кожну фазу.", "Виконай 10 разів вправу на відштовхування на місці: крок, підйом на носок поштовхової ноги з махом коліна іншої ноги вгору (без стрибка)."], "q": ["З яких фаз складається стрибок у довжину з розбігу?", "Що буде, якщо заступити за брусок?", "Як розподіляються обов'язки в захисті доджбольної команди?", "Як використовувати щит під час кидка з близької дистанції?"]}, {"n": "101", "t": "Баскетбол 3×3: рухливі та підвідні ігри, спеціальні й підвідні вправи баскетболіста", "g": "Учень знатиме спеціальні та підвідні вправи баскетболіста й правила рухливих ігор, що допомагають закріпити техніку баскетболу.", "k": "Модулі: Баскетбол 3×3", "terms": [["Спеціальні вправи баскетболіста", "вправи, що розвивають якості й навички, потрібні саме в баскетболі."], ["Підвідна гра", "спрощена гра, яка готує до справжньої гри."], ["Контроль м'яча", "уміння впевнено вести, тримати й передавати м'яч."], ["Відкритися", "вийти на вільне місце, щоб отримати передачу."]], "th": [{"h": "Баскетбол 3×3. Спеціальні та підвідні вправи баскетболіста", "p": ["Спеціальні вправи розвивають стрибучість, спритність рук і швидкість. Підвідні вправи готують до складних прийомів: спочатку рух виконують без м'яча, потім з м'ячем на місці, далі — в русі."], "ul": ["Обертання м'яча навколо пояса, ніг, голови.", "Перекидання м'яча з руки в руку.", "Ведення м'яча з заплющеними очима (на місці).", "Стрибки вгору з махом рук.", "Імітація кидка без м'яча."]}, {"h": "Баскетбол 3×3. Рухливі та підвідні ігри", "p": ["Рухливі ігри допомагають закріпити вивчене у веселій формі. Підвідні ігри наближені до справжнього баскетболу: їх грають на одне кільце з невеликою кількістю гравців."], "ul": ["«Два на два» на одне кільце.", "«Десять передач» — команда має зробити 10 передач без втрати м'яча.", "«Вибивний з веденням» — вибий м'яч у суперника, зберігаючи свій.", "Без грубості, хапання й штовхання.", "Після гри — дякуємо суперникам."]}], "f": "Обертання м'яча навколо тіла — улюблена розминка багатьох баскетболістів, бо вона вчить «відчувати» м'яч.", "pr": ["Виконай вправи з м'ячем або згорнутим рушником: обертання навколо пояса й навколо голови — по 10 разів у кожен бік.", "Опиши правила підвідної гри «Десять передач» і запропонуй, як її ускладнити."], "q": ["Які спеціальні вправи баскетболіста ти знаєш?", "Чим підвідні ігри відрізняються від справжньої гри?", "Як грати в «Десять передач»?", "Що означає «відкритися» для передачі?"]}, {"n": "102", "t": "Біг за зоровим і слуховим сигналом, кидки однією рукою й різка зупинка, стійки баскетболіста", "g": "Учень знатиме, як реагувати на сигнали під час бігу, техніку кидків однією рукою та різкої зупинки в доджболі й повторить стійки баскетболіста в нападі та захисті.", "k": "Модулі: Дитяча легка атлетика · Доджбол · Баскетбол 3×3", "terms": [["Зоровий сигнал", "сигнал, який сприймають очима, наприклад, змах прапорця."], ["Слуховий сигнал", "сигнал, який сприймають вухами, наприклад, свисток."], ["Різка зупинка", "швидке гальмування після бігу або кидка."], ["Стійка в нападі", "положення гравця з м'ячем, готове до ведення, передачі чи кидка."]], "th": [{"h": "Дитяча легка атлетика. Біг за сигналом (зоровим, слуховим)", "p": ["Під час бігу за сигналом учні змінюють дію: прискорюються, зупиняються, змінюють напрямок. Це розвиває реакцію та увагу. Сигнали бувають зорові (змах руки, прапорець) і слухові (свисток, оплеск, слово)."], "ul": ["Слухай і дивись уважно.", "Реагуй одразу, без зайвих рухів.", "Не зіштовхуйся з іншими — дивись довкола.", "Почни з повільного бігу, потім прискорюйся.", "Помилився — не страшно, продовжуй."]}, {"h": "Доджбол. Кидки з місця однією рукою, кидки зверху в русі та різка зупинка", "p": ["Кидок зверху в русі закінчується різкою зупинкою, щоб не перетнути центральну лінію. Гравець гальмує, ставлячи ногу вперед і згинаючи коліна, а потім одразу займає стійку для захисту."], "ul": ["Розбіг — кілька кроків, не більше.", "Кидок зверху — з поворотом тулуба.", "Зупинка — коліна зігнуті, вага на передній нозі.", "Не перетинай центральну лінію.", "Після кидка — готовність ухилитися."]}, {"h": "Баскетбол 3×3. Повторення стійок баскетболіста в нападі і захисті", "p": ["У нападі гравець тримає м'яч біля пояса, захищаючи його, і може швидко вести, передати чи кинути. У захисті — низька стійка, руки розставлені, погляд на суперника. Без м'яча нападник також у стійці, готовий відкритися."], "ul": ["Ноги зігнуті в обох стійках.", "Захист: між суперником і кільцем.", "Напад: м'яч захищений тілом.", "Переходь зі стійки в стійку швидко.", "Помилка: випрямлятися під час гри."]}], "f": "Швидкість реакції на звук і на світло в людини відрізняється, тому тренувати варто обидва види сигналів.", "pr": ["Попроси рідних подавати сигнали (оплеск — присісти, підняти руку — підстрибнути на місці невисоко, слово «стоп» — завмерти) і виконуй їх 2 хвилини.", "Затримайся почергово в атакувальній і захисній стійках баскетболіста по 15 секунд, 5 разів, переходячи швидко."], "q": ["Які бувають сигнали під час бігу?", "Чому корисно тренувати біг за сигналом?", "Як виконується різка зупинка після кидка?", "Чим стійка в нападі відрізняється від стійки в захисті?"]}, {"n": "103", "t": "Стрибок «переступанням», зупинки й повороти з кидком, навчальна гра в баскетбол", "g": "Учень удосконалить техніку стрибка у висоту способом «переступання», закріпить зупинки, повороти й кидок у русі в доджболі та знатиме правила навчальної гри в баскетбол.", "k": "Модулі: Дитяча легка атлетика · Доджбол · Баскетбол 3×3", "terms": [["Висота планки", "відстань від підлоги до планки, яку піднімають після вдалих спроб."], ["Спроба", "одне виконання стрибка або кидка на змаганні чи уроці."], ["Навчальна гра в баскетбол", "гра за спрощеними правилами для закріплення техніки."], ["Розминка", "комплекс вправ, що готує тіло до навантаження."]], "th": [{"h": "Дитяча легка атлетика. Техніка стрибка у висоту з розбігу способом «переступання»", "p": ["Тепер поєднуємо всі частини стрибка: розбіг під кутом, відштовхування дальньою ногою, мах, перехід через планку й приземлення. Висоту планки збільшують поступово, лише коли стрибок виходить правильно."], "ul": ["Перевір розбіг: однакова кількість кроків.", "Відштовхуйся біля планки, а не далеко від неї.", "Мах ногою — прямо вгору.", "Збив планку — проаналізуй, чому.", "Стрибаємо лише на мат і під наглядом."]}, {"h": "Доджбол. Зупинка стрибком і двома кроками, повороти після кидка, кидок у русі зверху", "p": ["Повторюємо зв'язку: кидок у русі зверху — зупинка стрибком або двома кроками — поворот на опорній нозі. Мета — виконувати її швидко й без втрати рівноваги."], "ul": ["Кидок зверху з 2–3 кроків.", "Зупинка — стійко, на зігнутих ногах.", "Поворот — на опорній нозі, обличчям до суперника.", "Одразу — стійка доджболіста.", "Виконуй правильно, а потім — швидше."]}, {"h": "Баскетбол 3×3. Вправи на розтягування. Навчальна гра", "p": ["Перед грою — розминка й розтягування, щоб м'язи стали еластичними. Під час навчальної гри застосовуємо ведення, передачі, кидки й захист, дотримуючись правил 3×3."], "ul": ["Розтягуйся плавно, без болю.", "Кидок зсередини дуги — 1 очко, з-за дуги — 2.", "Після відбору м'яча — вивести його за дугу.", "12 секунд на атаку.", "Чесна гра й повага до суперника."]}], "f": "С const LINKS = [];

function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const norm = t => t.toLowerCase().replace(/[«»"()]/g, "").trim();

function makeQuiz(l){
  if (l.qz) return shuffle(l.qz).slice(0, 5).map(x => ({ q: x.q, sub: "", why: x.why || "", opts: shuffle(x.o.map((o, j) => [o, j === x.a])) }));
  const s = l.subj;
  const uniq = arr => { const seen = new Set(); return arr.filter(([t]) => { const k = norm(t); if (seen.has(k)) return false; seen.add(k); return true; }); };
  const themeTerms = uniq(l.theme.lessons.flatMap(x => x.terms));
  const subjTerms = uniq(s.flat.flatMap(x => x.terms));
  let pool = shuffle(uniq(l.terms));
  if (pool.length < 5) pool = pool.concat(shuffle(themeTerms.filter(t => !pool.some(p => norm(p[0]) === norm(t[0])))));
  if (pool.length < 5) pool = pool.concat(shuffle(subjTerms.filter(t => !pool.some(p => norm(p[0]) === norm(t[0])))));
  pool = pool.slice(0, 5);
  return pool.map(([term, def], i) => {
    const others = shuffle(themeTerms.filter(t => norm(t[0]) !== norm(term) && t[1] !== def));
    let dis = others.slice(0, 3);
    if (dis.length < 3) dis = dis.concat(shuffle(subjTerms.filter(t => norm(t[0]) !== norm(term) && !dis.includes(t))).slice(0, 3 - dis.length));
    const byDef = i % 2 === 1;
    const opts = shuffle([[byDef ? term : def, true], ...dis.map(d => [byDef ? d[0] : d[1], false])]);
    return byDef
      ? { q: "Який термін відповідає визначенню?", sub: def, opts }
      : { q: "Що означає термін «" + term + "»?", sub: "", opts };
  });
}

function renderToc(){
  const s = DATA.find(x => x.id === cur.s);
  document.documentElement.style.setProperty("--subj", COLORS[s.id] || COLORS[s.id.replace(/\d+$/, "")]);
  [...tabs.children].forEach(b => b.setAttribute("aria-selected", b.dataset.s === s.id));
  const qv = norm(document.getElementById("search").value || "");
  const toc = document.getElementById("toc"); toc.innerHTML = "";
  let shown = 0;
  s.themes.forEach(t => {
    const ls = t.lessons.filter(l => !qv || norm(l.t).includes(qv) || l.terms.some(x => norm(x[0]).includes(qv)));
    if (!ls.length) return;
    const d = document.createElement("div"); d.className = "theme";
    d.innerHTML = "<h3>" + esc(t.name) + "</h3>";
    ls.forEach(l => {
      shown++;
      const r = results[l.id];
      const b = document.createElement("button"); b.className = "les";
      b.setAttribute("aria-current", l.id === cur.id);
      const no = s.id === "zu" ? "№ " + l.n : l.n;
      b.innerHTML = '<span class="no">' + esc(no) + '</span><span class="tt">' + esc(l.t) + '</span>' +
        (r ? '<span class="st ' + (r >= 4 ? "done" : "part") + '">' + r + "/5</span>" : "");
      b.onclick = () => open(l.id);
      d.appendChild(b);
    });
    toc.appendChild(d);
  });
  if (!shown) toc.innerHTML = '<p class="empty">Нічого не знайдено. Спробуйте інше слово.</p>';
  const ql = s.flat.filter(l => !l.noquiz), done = ql.filter(l => (results[l.id] || 0) >= 4).length;
  document.getElementById("progTxt").textContent = done + " / " + ql.length;
  document.getElementById("progBar").style.width = (100 * done / ql.length) + "%";
}

function renderLesson(){
  const l = LES[cur.id], s = l.subj;
  const A = document.getElementById("art");
  let h = '<div class="eyebrow">' + esc(s.name) + " · " + esc(l.theme.name) + "</div>";
  h += "<h1>" + esc(l.t) + "</h1><div class=\"meta\">";
  h += '<span class="chip">' + (s.id === "zu" ? "Заняття " : s.id.startsWith("pe") ? "Конспект " : s.id === "tech" ? "Тема " : "Урок ") + esc(l.n) + "</span>";
  if (l.noquiz) h += '<span class="chip">Творчий проєкт</span>';
  if (l.book) h += '<a class="chip" href="' + esc(l.book.href) + '" target="_blank" rel="noopener">' + esc(l.book.label) + ' ↗</a>';
  if (l.k) h += '<span class="chip">' + (/^Модулі/.test(l.k) ? esc(l.k) : 'Уроки за КТП: ' + esc(l.k.replace(/^Уроки за КТП:\s*/, ""))) + "</span>";
  h += "</div>";
  if (l.g) h += '<div class="goal"><b>Мета.</b>' + esc(l.g) + "</div>";
  if (l.terms.length && !l.bl) { h += "<h2>Ключові поняття</h2><dl class=\"terms\">" + l.terms.map(([t, d]) => "<dt>" + esc(t) + "</dt><dd>" + esc(d) + "</dd>").join("") + "</dl>"; }
  if (l.bl) {
    h += '<div class="prose">';
    const li = ([a, b]) => "<li>" + (a ? "<b>" + esc(a) + "</b> " : "") + esc(b) + "</li>";
    l.bl.forEach(b => {
      if (b.k === "h2") h += "</div><h2>" + esc(b.v) + '</h2><div class="prose">';
      else if (b.k === "h3") h += "<h3>" + esc(b.v) + "</h3>";
      else if (b.k === "p") h += "<p>" + esc(b.v) + "</p>";
      else if (b.k === "lead") h += '<p class="lead">' + esc(b.v) + "</p>";
      else if (b.k === "call") h += '<div class="call">' + esc(b.v) + "</div>";
      else if (b.k === "fig") h += '<figure class="fig"><img src="' + b.src + '" alt="' + esc(b.alt) + '" loading="lazy"></figure>';
      else if (b.k === "ul") h += "<ul>" + b.v.map(li).join("") + "</ul>";
      else if (b.k === "ol" || b.k === "crit") h += "<ol>" + b.v.map(li).join("") + "</ol>";
      else if (b.k === "steps") h += '<ol class="steps">' + b.v.map(([a, c]) => "<li><b>" + esc(a) + "</b>" + esc(c) + "</li>").join("") + "</ol>";
      else if (b.k === "terms") h += '<ul class="tgrid">' + b.v.map(([a, c]) => "<li><b>" + esc(a) + "</b>" + esc(c) + "</li>").join("") + "</ul>";
      else if (b.k === "cards") h += '<div class="cardsx">' + b.v.map(c => '<article class="cardx"><img src="' + c.src + '" alt="' + esc(c.alt) + '" loading="lazy"><div>' + (c.h ? "<h4>" + esc(c.h) + "</h4>" : "") + c.v.map(([a, d]) => "<p>" + (a ? "<b>" + esc(a) + "</b>" : "") + esc(d) + "</p>").join("") + "</div></article>").join("") + "</div>";
    });
    h += "</div>";
  }
  if (l.th.length) {
    h += "<h2>" + (l.terms.length ? "Теоретичний матеріал" : "Узагальнення") + '</h2><div class="prose">';
    l.th.forEach(b => {
      if (b.h) h += "<h4>" + esc(b.h) + "</h4>";
      b.p.forEach(p => h += "<p>" + esc(p) + "</p>");
      if (b.ul.length) h += "<ul>" + b.ul.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul>";
    });
    h += "</div>";
  }
  if (l.f) h += '<div class="fact"><b>Цікаво знати</b>' + esc(l.f) + "</div>";
  if (l.pr.length) h += '<h2>Практичне завдання</h2><div class="prose"><ul class="tasks">' + l.pr.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul></div>";
  if (l.q.length) h += '<h2>Питання для самоперевірки</h2><div class="prose"><ol>' + l.q.map(x => "<li>" + esc(x) + "</li>").join("") + "</ol></div>";
  if (!l.noquiz) h += '<section class="quiz" id="quiz"></section>';
  A.innerHTML = h;
  A.querySelectorAll(".fig img,.cardx img").forEach(im => im.onclick = () => {
    const d = document.createElement("div"); d.className = "lb"; d.innerHTML = '<img alt="">'; d.firstChild.src = im.src; d.firstChild.alt = im.alt;
    d.onclick = () => d.remove(); document.body.appendChild(d); });
  if (!l.noquiz) renderQuiz(l);
  const i = s.flat.indexOf(l), pv = s.flat[i - 1], nx = s.flat[i + 1];
  const P = document.getElementById("pager"); P.innerHTML = "";
  [[pv, "← Попередній"], [nx, "Наступний →"]].forEach(([x, lab]) => { if (!x) return;
    const b = document.createElement("button"); b.innerHTML = esc(lab) + "<b>" + esc(x.t) + "</b>"; b.onclick = () => open(x.id); P.appendChild(b); });
}

function renderQuiz(l){
  const Q = makeQuiz(l), box = document.getElementById("quiz");
  const prev = results[l.id];
  let h = '<div class="qhead"><h2>Тест · 5 завдань</h2><p>' + (prev ? "Найкращий результат: " + prev + " з 5" : "Оберіть одну відповідь у кожному завданні") + "</p></div><form id=\"qf\">";
  Q.forEach((q, i) => {
    h += '<div class="q"><div class="qt"><span>' + (i + 1) + ".</span><div>" + esc(q.q) + (q.sub ? "<br><em>" + esc(q.sub) + "</em>" : "") + '</div></div><div class="opts">';
    q.opts.forEach(([t], j) => h += '<label class="opt"><input type="radio" name="q' + i + '" id="q' + i + "o" + j + '" value="' + j + '"><span>' + esc(t) + "</span></label>");
    h += "</div></div>";
  });
  h += '<div class="qfoot"><button class="btn" type="submit" id="chk" disabled>Перевірити</button><button class="btn ghost" type="button" id="again">Інші питання</button><span class="score" id="sc" aria-live="polite"></span></div></form>';
  box.innerHTML = h;
  const f = document.getElementById("qf"), chk = document.getElementById("chk");
  f.addEventListener("change", () => { chk.disabled = Q.some((_, i) => !f["q" + i] || ![...f.querySelectorAll('[name="q' + i + '"]')].some(x => x.checked)); });
  document.getElementById("again").onclick = () => renderQuiz(l);
  f.addEventListener("submit", e => {
    e.preventDefault(); if (f.classList.contains("checked")) return;
    let ok = 0;
    Q.forEach((q, i) => {
      const inputs = [...f.querySelectorAll('[name="q' + i + '"]')];
      inputs.forEach((inp, j) => { inp.disabled = true; const lab = inp.parentElement;
        if (q.opts[j][1]) lab.classList.add("right"); else if (inp.checked) lab.classList.add("wrong"); });
      if (q.why) { const w = document.createElement("p"); w.className = "why"; w.textContent = q.why; inputs[0].closest(".opts").after(w); }
      const sel = inputs.findIndex(x => x.checked); if (sel >= 0 && q.opts[sel][1]) ok++;
    });
    f.classList.add("checked"); chk.disabled = true;
    const sc = document.getElementById("sc");
    sc.className = "score " + (ok >= 4 ? "good" : ok >= 3 ? "mid" : "low");
    sc.textContent = "Результат: " + ok + " з 5. " + (ok === 5 ? "Чудово!" : ok >= 4 ? "Добре засвоєно." : ok >= 3 ? "Повторіть ключові поняття." : "Перечитайте конспект і спробуйте ще раз.");
    if (ok > (results[l.id] || 0)) { results[l.id] = ok; store.set(results); }
    renderToc();
  });
}

function open(id){
  cur = { s: LES[id].subj.id, id };
  try { localStorage.setItem("yasno-last", id); } catch(e){}
  try { history.replaceState(null, "", "#" + id); } catch(e){}
  renderToc(); renderLesson();
  document.getElementById("side").classList.remove("open");
  document.getElementById("tocBtn").setAttribute("aria-expanded", "false");
  window.scrollTo({ top: 0 });
}
document.getElementById("search").addEventListener("input", renderToc);
document.getElementById("tocBtn").onclick = e => { const sd = document.getElementById("side"); const o = sd.classList.toggle("open"); e.currentTarget.setAttribute("aria-expanded", o); };
open(cur.id);
</script>
