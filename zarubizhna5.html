<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Зарубіжна література · 5 клас</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f2ed; --card:#ffffff; --ink:#1f1d1a; --muted:#6b6560; --line:#e7e1d8;
  --ok:#2f8a4f; --ok-soft:#e3f3e8; --bad:#c2382d; --bad-soft:#fae3e0;
  --shadow:0 1px 2px rgba(40,30,20,.04);
  --shadow-h:0 10px 28px rgba(40,30,20,.10);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1a18; --card:#262421; --ink:#eeeae4; --muted:#a59e95; --line:#38342f;
  --ok:#7fcf98; --ok-soft:#1f3527; --bad:#f08b80; --bad-soft:#3e2523; --shadow:none; --shadow-h:0 10px 28px rgba(0,0,0,.4);}}
:root[data-theme="dark"]{
  --bg:#1b1a18; --card:#262421; --ink:#eeeae4; --muted:#a59e95; --line:#38342f;
  --ok:#7fcf98; --ok-soft:#1f3527; --bad:#f08b80; --bad-soft:#3e2523; --shadow:none; --shadow-h:0 10px 28px rgba(0,0,0,.4);}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 Inter,"Segoe UI",system-ui,sans-serif}
a{color:inherit}
.page{max-width:1380px;margin:0 auto;padding:36px 36px 72px}
h1,h2,h3,.ttl{font-family:Montserrat,"Segoe UI",sans-serif}

/* hero */
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:36px}
.hero .kick{font:700 13px Montserrat,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#ef8a00}
.hero h1{font-size:40px;line-height:1.15;margin:6px 0 10px;font-weight:800}
.hero p{margin:0;color:var(--muted);font-size:18px;max-width:720px}
.hero-actions{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px Inter,sans-serif;text-decoration:none;cursor:pointer}
.btn:hover{box-shadow:var(--shadow-h)}
.btn.fill{background:var(--c,#ef8a00);border-color:var(--c,#ef8a00);color:#fff}
.icon-btn{width:42px;height:42px;justify-content:center;padding:0;font-size:18px}
.stats{display:flex;gap:22px;margin-top:16px;color:var(--muted);font-size:14px}
.stats b{color:var(--ink);font-size:18px;font-family:Montserrat,sans-serif}

/* sections */
.sec{margin-bottom:44px}
.sec-h{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.num{width:46px;height:46px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:700 19px Montserrat,sans-serif;flex:0 0 auto}
.sec-h h2{margin:0;font-size:28px;font-weight:700;line-height:1.2}
.sec-body{display:grid;grid-template-columns:226px 1fr;gap:28px;align-items:start}
.cover{background:var(--card);border-radius:16px;border-top:6px solid var(--c);box-shadow:0 6px 18px rgba(40,30,20,.08);padding:30px 18px 0;text-align:center;overflow:hidden;min-height:318px;position:relative;display:flex;flex-direction:column;align-items:center}
.cover .ci{width:48px;height:48px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:22px;filter:saturate(1.1)}
.cover .rz{font:800 20px Montserrat,sans-serif;color:var(--c);letter-spacing:.04em;margin:30px 0 8px}
.cover .rn{font:700 11.5px Inter,sans-serif;line-height:1.35}
.cover .doodles{margin-top:auto;width:100%;padding:18px 0 14px;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 10px;font-size:30px;opacity:.85;filter:saturate(.75)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tcard{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 22px 18px;text-decoration:none;min-height:142px;transition:box-shadow .15s,transform .15s;position:relative}
.tcard:hover{box-shadow:var(--shadow-h);transform:translateY(-2px)}
.tcard .tn{font:700 14px Montserrat,sans-serif;letter-spacing:.06em;color:var(--c);text-transform:uppercase}
.tcard .tt{font-size:19px;line-height:1.35;margin:8px 0 14px;font-weight:500}
.tcard .tm{margin-top:auto;color:var(--muted);font-size:15px}
.tcard .chk{position:absolute;top:18px;right:18px;width:24px;height:24px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.tcard .badge{display:inline-block;margin-left:6px;font:600 11px Inter,sans-serif;color:var(--c);border:1px solid var(--c);border-radius:999px;padding:0 7px;vertical-align:2px}

/* lesson */
.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--muted);font-weight:600;margin-bottom:22px}
.back:hover{color:var(--c)}
.lhead{display:flex;gap:18px;align-items:flex-start;margin-bottom:26px}
.lhead .tn{font:700 14px Montserrat,sans-serif;letter-spacing:.06em;color:var(--c);text-transform:uppercase}
.lhead h1{font-size:32px;line-height:1.25;margin:4px 0 10px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:13px;font-weight:600;padding:4px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.chip.c{border-color:var(--c);color:var(--c)}
.lgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 26px;margin-bottom:20px}
.box h3{margin:0 0 14px;font-size:20px;display:flex;align-items:center;gap:12px}
.box h3 .bi{width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:15px;flex:0 0 auto}
.box p{margin:0 0 10px}
.box ul,.box ol{margin:0 0 10px;padding-left:22px}
.box li{margin-bottom:4px}
ol.cols{columns:2;column-gap:28px}
.tbl{width:100%;border-collapse:collapse;margin:8px 0 12px;font-size:14.5px}
.tbl th,.tbl td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.tbl th{background:var(--bg)}
.ktp{font-size:14.5px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 14px;margin-bottom:14px}
.term{padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.term:first-of-type{border-top:0;padding-top:0}
.term b{color:var(--c)}
.side{position:sticky;top:20px}
.bookpg{font:700 22px Montserrat,sans-serif;color:var(--c)}
.nobook{font-size:14.5px;line-height:1.5;background:var(--bg);border-left:4px solid var(--c);border-radius:8px;padding:10px 12px}
.small{font-size:13px;color:var(--muted)}
.vid{aspect-ratio:16/9;width:100%;border:0;border-radius:12px;background:#000;display:block}
.vlink{display:inline-block;margin-top:8px;font-size:13.5px;color:var(--muted)}
.qst{padding:16px 0;border-top:1px solid var(--line)}
.qst:first-of-type{border-top:0;padding-top:0}
.qst .qt{font-weight:600;margin-bottom:10px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:7px;cursor:pointer;font-size:15px;background:var(--card)}
.opt:hover{border-color:var(--c)}
.opt input{margin-top:5px;accent-color:var(--c)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.result{margin-top:14px;padding:12px 16px;border-radius:12px;font-weight:600;display:none}
.result.show{display:block}
.result.good{background:var(--ok-soft);color:var(--ok)}
.result.mid{background:var(--bad-soft);color:var(--bad)}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.hw{border-left:6px solid var(--c)}
.train{display:flex;gap:16px;align-items:center;background:var(--card);border:2px solid var(--c);border-radius:16px;padding:18px 22px;margin-bottom:22px;font-size:16.5px;line-height:1.5}
.train b{color:var(--c);font-size:18px}
.train .ti{width:48px;height:48px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:22px;flex:0 0 auto}
.work h4{font:700 15px Montserrat,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--c);margin:20px 0 10px}
.wmeta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--muted)}
ol.plot{list-style:none;padding:0;margin:0;counter-reset:p}
ol.plot li{counter-increment:p;position:relative;padding:0 0 14px 44px;margin:0}
ol.plot li::before{content:counter(p);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;border:2px solid var(--c);color:var(--c);display:grid;place-items:center;font:700 14px Montserrat,sans-serif}
ol.plot li:not(:last-child)::after{content:"";position:absolute;left:15px;top:32px;bottom:2px;width:2px;background:var(--line)}
.heroes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.hero-c{background:var(--bg);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;font-size:14.5px;line-height:1.4}
.hero-c b{color:var(--c);font-size:15px}
.nav{display:flex;justify-content:space-between;gap:16px;margin-top:8px}
.nav a{flex:1;max-width:49%;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.nav a:hover{box-shadow:var(--shadow-h)}
.nav a.next{text-align:right;margin-left:auto}
.nav .tn{font:700 12px Montserrat,sans-serif;letter-spacing:.06em;color:var(--c);text-transform:uppercase}
.nav .t{font-size:15px;line-height:1.35}

@media (max-width:1100px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.lgrid{grid-template-columns:1fr}.side{position:static}}
@media (max-width:760px){
  .page{padding:22px 16px 56px}
  .hero h1{font-size:28px}.hero p{font-size:16px}
  .sec-h h2{font-size:22px}.num{width:38px;height:38px;font-size:16px}
  .sec-body{grid-template-columns:1fr}
  .cover{min-height:0;flex-direction:row;text-align:left;padding:16px;gap:14px;border-top-width:0;border-left:6px solid var(--c)}
  .cover .rz{margin:0 0 2px;font-size:16px}.cover .doodles{display:none}
  .cards{grid-template-columns:1fr}
  .tcard{min-height:0}
  .lhead h1{font-size:24px}
  .box{padding:18px 16px}
  ol.cols{columns:1}
  .nav{flex-direction:column}.nav a{max-width:none}
}
</style>
</head>

{info:`<p><b>Книжка в третьому тисячолітті.</b> Сьогодні в нас є інтернет, фільми, ігри, але книжка залишається одним із найважливіших джерел знань, уяви й мудрості.</p>
<p><b>Навіщо читати художню літературу?</b></p>
<ul><li>книжка розвиває <b>уяву</b>: читаючи, ми самі «малюємо» героїв і світи;</li><li>вчить <b>співчувати</b>: ми переживаємо разом із героями, розуміємо інших людей;</li><li>збагачує <b>мовлення</b> й мислення;</li><li>знайомить із життям різних народів і епох;</li><li>допомагає зрозуміти себе й відповісти на важливі питання.</li></ul>

{info:`<p><b>Казка</b> — один із найдавніших жанрів усної народної творчості (<b>фольклору</b>): розповідь про вигадані, часто чарівні події з повчальним змістом.</p>
<p><b>Різновиди народних казок:</b></p>
<ul><li><b>казки про тварин</b> — герої тварини з людськими рисами (хитра лисиця, хвалькуватий вовк);</li><li><b>чарівні (фантастичні)</b> — чарівні предмети, перетворення, чудовиська, боротьба добра і зла;</li><li><b>соціально-побутові</b> — про життя людей, кмітливих бідняків і жадібних багачів.</li></ul>
<p><b>Ознаки казки:</b> вигадка; боротьба добра і зла, перемога добра; казкові числа (3, 7, 12); повтори; казкові зачини («Жили-були…») і кінцівки; постійні епітети; повчальність.</p>
<p><b>Загальнолюдські ідеали</b> в казках різних народів однакові: доброта, працьовитість, справедливість, сміливість, дружба. А <b>національна самобутність</b> виявляється в іменах, побуті, природі, звичаях, які описано в казці.</p>`,

{info:`<p><b>«Момотаро, або Хлопчик-Персик»</b> — японська народна чарівна казка. Ім'я героя означає «хлопчик із персика» (момо — персик, таро — поширене хлопчаче ім'я).</p>
<p><b>Сюжет:</b> бездітна стара прала білизну в річці й виловила великий персик. Коли старі хотіли його розрізати, з персика вийшов хлопчик. Його назвали Момотаро. Він виріс сильним і добрим.</p>
<p>Дізнавшись, що на острові живуть демони (<b>оні</b>), які грабують людей, Момотаро вирушає їх перемогти. Стара дає йому в дорогу <b>рисові колобки</b>. Дорогою він пригощає ними пса, мавпу й фазана — і вони стають його друзями й помічниками.</p>
<p>Разом друзі перемагають демонів, і Момотаро повертається додому зі скарбами, щоб старі жили щасливо.</p>
<p><b>Японський колорит:</b> персик (символ довголіття), рисові колобки, демони-оні, самурайська мужність і вірність.</p>`,

{info:`<p>Головна думка казки — <b>сила дружби та вірності</b>.</p>
<p><b>Герда</b> — маленька, тендітна дівчинка, але з великим серцем. Коли всі вважають Кая загиблим, лише вона вірить, що він живий, і вирушає на пошуки сама, боса, через увесь світ. Вона не здається ні перед небезпеками, ні перед спокусами (квітник чарівниці, де можна забути про все).</p>
<p><b>Кай</b> під дією скалок стає жорстоким, глузливим, байдужим. У палаці Снігової королеви він складає з крижинок слово <b>«Вічність»</b>, але не може — його серце замерзло. Лише любов Герди повертає йому справжнього себе.</p>
<p><b>Сила Герди:</b> фінка каже, що не може дати дівчинці більшої сили, ніж та вже має: її сила — у її <b>доброму, невинному серці</b>.</p>

{info:`<p><b>Оскар Вайлд (Уайльд)</b> (1854–1900) — ірландський письменник, поет і драматург. Народився в Дубліні в родині лікаря й поетеси. Блискуче навчався в Оксфорді, славився дотепністю, вишуканим одягом і афоризмами. Писав п'єси, роман «Портрет Доріана Грея» і казки.</p>
<p>Для своїх синів Вайлд створив дві збірки казок: «Щасливий принц та інші казки» і «Гранатовий будиночок». <b>«Хлопчик-зірка»</b> (1891) входить до другої.</p>
<p><b>Цікаві факти:</b> Вайлд казав, що «кожна людина може бути гарною, якщо в неї добре серце»; його казки, на перший погляд дитячі, сповнені глибокого філософського змісту про красу, доброту, милосердя.</p>
<p><b>Про що казка:</b> лісоруб знаходить у лісі немовля в золотому плащі, що впало разом із зіркою. Хлопчик виростає вродливим, але жорстоким і гордим. Відцуравшись рідної матері-жебрачки, він утрачає красу — і проходить довгий шлях до каяття.</p>`,

{info:`<p><b>«Хлопчик-зірка»</b> — літературна казка Оскара Вайлда.</p>
<ol><li>Зимової ночі двоє бідних лісорубів бачать, як із неба падає зірка. На місці падіння знаходять немовля в золотому плащі з бурштиновим намистом. Один із них забирає дитину додому, хоч у самого багато дітей.</li><li>Хлопчик виростає надзвичайно вродливим, але стає пихатим і жорстоким: знущається з тварин, бідних, калік, вважає себе вищим за всіх.</li><li>До села приходить жебрачка, яка впізнає в ньому свого сина. Хлопчик із презирством проганяє її.</li><li>За це він утрачає вроду: обличчя стає, як у ропухи, тіло — як у гадюки.</li><li>Хлопчик-зірка розкаюється й три роки шукає матір, зазнаючи знущань і злиднів.</li><li>Він потрапляє в рабство до злого чарівника, який посилає його по три золоті монети. Заєць допомагає їх знайти, але хлопчик щоразу віддає монету жебракові-прокаженому.</li><li>Коли він віддає останню, до нього повертається краса. Жебрачка й прокажений виявляються королевою і королем — його батьками. Хлопчик стає справедливим правителем.</li></ol>`,

{info:`<p><b>Динаміка образу</b> — зміна характеру героя протягом твору.</p>
<p><b>Хлопчик-зірка спочатку:</b> вродливий, але жорстокий, пихатий, байдужий до страждань інших. Знущається з тварин, жебраків, калік; не любить і не шанує прийомних батьків. Його краса — лише зовнішня.</p>
<p><b>Стосунки з матір'ю:</b> відцуравшись рідної матері, бо вона жебрачка, він здійснює найтяжчий гріх. Саме тоді в ньому прокидається совість — він розуміє свою провину й вирушає на пошуки.</p>
<p><b>Стосунки з іншими:</b> тварини, яких він кривдив, відвертаються від нього; але заєць, якого він визволив із пастки, допомагає йому. Люди глузують із нього, як він колись глузував з інших.</p>
<p><b>Хлопчик-зірка наприкінці:</b> добрий, милосердний, скромний; віддає останню монету жебракові, хоча знає, що його за це поб'ють. Тепер його краса — і зовнішня, і внутрішня.</p>`,

{info:`<p><b>Урок розвитку мовлення.</b> Пошук відповіді на проблемні питання за казкою «Хлопчик-зірка».</p>

<p><b>Підказки:</b> хлопчик найбільше пишався своєю красою — тому втратив саме її; покарання змусило його побачити себе з боку й зрозуміти, як почувалися ті, з кого він глузував; справжні цінності роблять людину кращою й допомагають іншим.</p>`,

{info:`<p><b>Роальд Дал</b> (1916–1990) — британський письменник норвезького походження. Народився в Уельсі. У дитинстві навчався в школі-інтернаті, неподалік якої була шоколадна фабрика «Кедбері»: учням давали куштувати нові шоколадки — звідси виникла ідея книжки. Під час Другої світової війни був пілотом, зазнав аварії в пустелі.</p>
<p>Найвідоміші книжки: «Чарлі і шоколадна фабрика» (1964), «Чарлі і великий скляний ліфт», «Матильда», «Великий дружній велетень», «Відьми», «Фантастичний містер Лис».</p>
<p><b>Цікаві факти:</b> писав у дерев'яному сарайчику в саду, у старому кріслі, олівцями на жовтому папері; вигадував власні слова; 13 вересня (день народження Дала) — Міжнародний день Роальда Дала.</p>
<p><b>«Чарлі і шоколадна фабрика»</b> — повість-казка про бідного хлопчика Чарлі Бакета, який знаходить золотий квиток і потрапляє на чарівну фабрику Віллі Вонки.</p>`,

{info:`<p><b>Шлях Чарлі до мети.</b> Чарлі Бакет живе з батьками й чотирма бабусями й дідусями в маленькому холодному будиночку. Родина дуже бідна: їдять капустяний суп, а шоколадку Чарлі отримує лише раз на рік — на день народження.</p>
<p>Містер <b>Віллі Вонка</b>, власник найбільшої шоколадної фабрики, оголошує: п'ятеро дітей, які знайдуть у шоколадках <b>золоті квитки</b>, побувають на фабриці. Чарлі мріє про це, але шансів у нього майже немає.</p>
<p>Квитки знаходять Авґустус Ґлуп, Верука Солт, Віолетта Боригард, Майк Тіві. Чарлі не має грошей, але одного дня знаходить на вулиці монету, купує шоколадку — і знаходить <b>п'ятий золотий квиток</b>!</p>
<p>З дідусем Джо він вирушає на фабрику. Інші діти через свої вади вибувають, а Чарлі, скромний і чесний, залишається до кінця — і Вонка оголошує його <b>спадкоємцем фабрики</b>.</p>`,

{info:`<p><b>Чарлі Бакет</b> — головний герой повісті-казки. Його риси:</p>
<ul><li><b>доброта</b> — він любить рідних, хоче поділитися з ними шоколадкою; знайшовши монету, думає про голодну родину;</li><li><b>щирість і чесність</b> — не хвалиться, не бреше, не порушує правил на фабриці;</li><li><b>скромність</b> — не вимагає більше, ніж має;</li><li><b>наполегливість і терплячість</b> — не втрачає надії, навіть коли надії майже немає;</li><li><b>вдячність</b> — радіє простим речам, шанує старших;</li><li><b>уважність і слухняність</b> на фабриці, на відміну від інших дітей.</li></ul>
<p>Саме ці якості, а не гроші чи таланти, роблять Чарлі гідним спадкоємцем фабрики. Вонка шукав не найбагатшу, а <b>найдобрішу</b> дитину.</p>`,

{info:`<p><b>Родина Бакетів:</b> батьки Чарлі, дідусь Джо й бабуся Джозефіна, дідусь Джордж і бабуся Джорджина. Усі живуть в одному тісному будиночку; четверо старих лежать в одному ліжку. Тато втрачає роботу на фабриці зубної пасти. Родина бідна й голодна, але <b>дружна й любляча</b>: усі піклуються про Чарлі, а він — про них. Дідусь Джо віддає онукові свої заощадження на шоколадку.</p>
<p><b>Інші родини:</b></p>
<ul><li><b>Ґлупи</b> — батьки балують Авґустуса, дозволяють йому об'їдатися;</li><li><b>Солти</b> — батько виконує кожну примху Веруки, купує їй усе, що вона забажає;</li><li><b>Боригарди</b> — мама пишається рекордами доньки з жування гумки;</li><li><b>Тіві</b> — батьки не можуть відірвати Майка від телевізора.</li></ul>
<p><b>Висновок:</b> Дал показує, що щастя родини — не в грошах, а в любові, турботі й правильному вихованні. Розпещені діти — провина батьків.</p>`,

<ul><li><b>співчуття</b> — Чарлі співчуває іншим дітям, навіть тим, що поводилися погано;</li><li><b>милосердя</b> — родина Бакетів, бідна, ділиться останнім;</li><li><b>взаємодопомога</b> — рідні підтримують одне одного;</li><li><b>відповідальність</b> — кожна дитина відповідає за свої вчинки; батьки — за виховання;</li><li><b>моральний вибір</b> — на фабриці кожна дитина вибирає: послухатися чи порушити правила. Діти, які обрали свої примхи, отримали покарання.</li></ul>
<p><b>Фінал:</b> Вонка забирає всю родину Бакетів на фабрику у великому скляному ліфті. Добро винагороджене: бідний хлопчик отримує більше, ніж мріяв, бо зберіг добре серце.</p>`,

{info:`<p><b>Урок позакласного читання.</b> Арабська народна казка <b>«Синдбад-мореплавець»</b> зі збірки <b>«Тисяча й одна ніч»</b>.</p>
<p><b>Чому збірка має таку назву:</b> за легендою, жорстокий цар Шахріяр щоночі страчував своїх дружин. Мудра Шахразада почала розповідати йому казки й щоразу зупинялася на найцікавішому місці. Цар відкладав страту, щоб почути продовження. Так минула тисяча й одна ніч — і цар відмовився від жорстокості.</p>
<p><b>Чому Синдбад став мореплавцем-купцем:</b> він розтратив батьківську спадщину, але вирішив виправити помилку — продав майно, купив товари й вирушив у море торгувати.</p>
<p><b>Перша подорож:</b> мандрівники зупинилися на «острові», розпалили вогонь — а «острів» виявився величезною <b>рибиною (китом)</b>, яка пірнула. Синдбад урятувався на <b>ночвах</b> (дерев'яному кориті), дістався землі, де служив цареві Міхраджану, і зрештою повернувся додому з багатством.</p>
<p><b>Чого вчить:</b> сміливості, кмітливості, наполегливості, вірі в себе, умінню не втрачати надії.</p>`,

<p><b>Лицарська поведінка:</b> коли Лобо спіймали, він не просив пощади, не скиглив. Вовк гідно дивився на людей, а коли його зв'язали, лише мовчки дивився на рідні простори. Він відмовився від їжі й води — і вранці його знайшли мертвим. Лобо помер від горя за коханою і через утрату свободи.</p>
<p><b>Висновок:</b> Лобо — гордий, вірний, благородний; автор захоплюється ним, як героєм.</p>`,

{info:`<p><b>Ернст-Теодор-Амадей Гофман</b> (1776–1822) — німецький письменник-романтик, композитор, художник, юрист. Так любив Моцарта, що замінив своє третє ім'я Вільгельм на Амадей. Його казки поєднують буденне життя і фантастику.</p>
<p><b>«Лускунчик і Мишачий король»</b> (1816) — повість-казка, за якою Петро Чайковський створив знаменитий балет «Лещатник» («Лускунчик»).</p>
<p><b>Реальний світ:</b> Різдвяний вечір у будинку радника медицини <b>Штальбаума</b>. Діти — <b>Марі</b> й <b>Фріц</b> — чекають подарунків. Хрещений <b>Дросельмаєр</b>, годинникар і майстер механічних іграшок, дарує дивовижний замок. Марі отримує незграбного дерев'яного <b>Лускунчика</b>, який розколює горіхи.</p>
<p><b>Чарівний світ:</b> уночі іграшки оживають; Лускунчик веде олов'яних солдатиків на бій із мишачим військом Мишачого короля з сімома головами. Марі рятує Лускунчика, кинувши в Мишачого короля свій черевичок.</p>
<p><b>Дросельмаєр</b> існує в обох світах: у реальному — дивакуватий годинникар, у чарівному — таємничий чарівник, що розповідає казку про принцесу Пірліпат і твердий горіх Кракатук.</p>`,

{info:`<p><b>Битва добра і зла</b> — центральний епізод казки.</p>
<p>Опівночі з-під підлоги вилазять полчища мишей на чолі з Мишачим королем. <b>Лускунчик</b> веде в бій іграшкове військо: олов'яних солдатиків, ляльок, гусарів, артилерію з горохом і пряниками. Він хоробрий, але мишей більше. Коли Лускунчика ось-ось схоплять, <b>Марі</b> кидає черевичок — і миші зникають, а дівчинка непритомніє, поранивши руку об скло шафи.</p>
<p>Згодом Мишачий король знову погрожує й вимагає солодощів і ляльок. Марі віддає їх. Тоді Лускунчик просить шаблю, і Фріц дає її. У вирішальному бою Лускунчик <b>перемагає Мишачого короля</b> й приносить Марі сім його корон.</p>
<p><b>Символіка:</b> Лускунчик — добро, мужність, честь; Мишачий король — зло, жадібність, підступність. Перемагають <b>сміливість, дружба й любов</b>.</p>`,

{info:`<p><b>Символічний образ Різдва, різдвяної ялинки.</b> Дія казки починається у Святвечір — час чудес, коли сім'я збирається разом, а діти чекають подарунків. <b>Різдвяна ялинка</b> з вогниками, солодощами й іграшками — символ свята, радості, дива, родинного тепла.</p>
<p>Саме в Різдвяну ніч відкривається чарівний світ: іграшки оживають, добро бореться зі злом. Різдво — <b>межа між буденним і чарівним</b>.</p>
<p>Марі з Лускунчиком мандрує в <b>Ляльковому королівстві</b>: Цукатний гай, Мигдалево-Родзинкові ворота, Марципановий замок, Лимонадна річка. Ця країна — втілення дитячої мрії.</p>
<p><b>Ідеї казки:</b> добро, людяність і любов перемагають зло; справжня цінність — не у вроді, а в доброму серці; <b>мрія</b> і уява роблять життя прекрасним. У фіналі молодий Дросельмаєр приходить до Марі, освідчується, і через рік вони одружуються; Марі стає королевою Лялькового королівства.</p>`,

{info:`<p><b>Елеанор Портер</b> (1868–1920) — американська письменниця. Навчалася співу в консерваторії, потім присвятила себе літературі. Її роман <b>«Полліанна»</b> (1913) став всесвітнім бестселером, а слово «полліанна» в англійській мові означає оптиміста, людину, яка в усьому бачить хороше. Згодом вона написала продовження — «Полліанна дорослішає».</p>
<p><b>Про що роман:</b> одинадцятирічна сирота <b>Полліанна Віттієр</b>, дочка бідного пастора, після смерті батька переїжджає до суворої, багатої тітки <b>Поллі Гаррінгтон</b> у містечко Белдінгсвіль.</p>

{info:`<p><b>Туве Маріка Янсон</b> (1914–2001) — фінська письменниця й художниця, яка писала шведською мовою. Народилася в Гельсінкі в родині скульптора й художниці-ілюстраторки. Сама ілюструвала свої книжки.</p>
<p><b>Мумі-тролі</b> — вигадані Туве Янсон білі пухнасті істоти, схожі на бегемотиків. Вони живуть у затишній <b>Долині Мумі-тролів</b>. Цикл творів про мумі-тролів налічує дев'ять книжок і кілька збірок коміксів; за ними знімали мультфільми, а у Фінляндії є тематичний парк «Світ мумі-тролів».</p>
<p>Книжки Янсон про мумі-тролів почали з'являтися з 1945 р., у роки після Другої світової війни: вони про тепло родини, дружбу, гостинність і віру в добро навіть у страшні часи.</p>
<p>1966 р. Туве Янсон отримала <b>премію Андерсена</b> — найвищу нагороду в дитячій літературі.</p>`,

{info:`<p><b>«Комета прилітає»</b> — повість-казка Туве Янсон про мумі-тролів.</p>
<p><b>Сюжет:</b> у Долині Мумі-тролів усе стає сірим і тривожним. З'являються тривожні знаки, і друзі дізнаються, що до Землі летить <b>комета</b>, яка може зруйнувати світ. <b>Мумі-троль</b> і його друг <b>Сніфф</b> вирушають до Обсерваторії на Самотніх горах, щоб дізнатися, коли комета прилетить.</p>
<p>Дорогою вони зустрічають мандрівника-музиканта <b>Снусмумрика</b>, а також <b>Снорка</b> і його сестру <b>фрекен Снорк</b>, яку Мумі-троль рятує від отруйного куща. Друзі долають багато небезпек: печеру, гігантську ящірку, висохле море, смерч, рій сарани.</p>
<p>В обсерваторії вчені називають точний час: комета прилетить через чотири дні. Друзі поспішають додому, щоб попередити рідних. Разом із Мамою й Татом Мумі-тролями вони ховаються в печері — і комета пролітає повз, лише зачепивши Землю хвостом. Долина знову оживає.</p>`,

{info:`<p><b>Позакласне читання №3.</b> <b>Льюїс Керролл</b> (справжнє ім'я — Чарльз Лютвідж Доджсон, 1832–1898) — англійський письменник, математик, викладач Оксфордського університету, фотограф.</p>

{info:`<p><b>Позакласне читання №4.</b> <b>«Аліса в Країні Див».</b></p>
<p><b>Світ уяви Аліси і її пригоди:</b> Алісі нудно сидіти з сестрою на березі. Раптом повз пробігає <b>Білий Кролик</b> із годинником, бурмочучи, що запізнюється. Аліса біжить за ним і падає в кролячу нору — у <b>Країну Див</b>.</p>
<ul><li>Вона п'є з пляшечки «Випий мене» і зменшується, їсть пиріжок «З'їж мене» — і виростає до стелі;</li><li>пливе в морі власних сліз;</li><li>зустрічає <b>Гусінь</b> на грибі, <b>Чеширського Кота</b>, що зникає, залишаючи лише усмішку;</li><li>потрапляє на божевільне чаювання з <b>Капелюшником</b> і <b>Березневим Зайцем</b>;</li><li>грає в крокет із <b>Червоною Королевою</b>, що кричить: «Відрубати голову!» (м'ячі — їжаки, молотки — фламінго);</li><li>бере участь у суді над Валетом, який нібито вкрав тістечка.</li></ul>
<p>Коли Аліса виростає й каже, що всі вони — лише колода карт, карти злітають у повітря — і вона прокидається.</p>
<p><b>Елементи казки:</b> чарівний світ, перетворення, говорячі тварини, чарівні предмети. Але це <b>казка-нісенітниця</b>: логіка тут навиворіт, гра слів, абсурдні ситуації.</p>`,

heroes:[["Марі","добра, мрійлива, мужня дівчинка"],["Лускунчик (молодий Дросельмаєр)","хоробрий зачарований юнак"],["Фріц","брат Марі, любить солдатиків"],["Хрещений Дросельмаєр","годинникар і чарівник"],["Мишачий король","семиголовий ватажок мишей"]]},

pollyanna:{name:"«Полліанна»", author:"Елеанор Портер, 1913", genre:"Роман",
about:"Роман про дівчинку-сироту, яка грає «в радість» — у будь-якій ситуації шукає, чому можна порадіти. Своїм світлим поглядом на життя вона змінює похмуру тітку й ціле містечко.",
plot:["Одинадцятирічна Полліанна після смерті батька-пастора переїжджає до суворої тітки Поллі Гаррінгтон.","Вона навчає «гри в радість» служницю Ненсі, хвору місіс Сноу, похмурого містера Пендлтона, сироту Джиммі Біна.","Люди в містечку стають добрішими й радіснішими.","Полліанну збиває автомобіль, і вона не може ходити. Мешканці міста приходять розповісти тітці, як дівчинка змінила їхнє життя.","Тітка Поллі змінюється, виходить заміж за доктора Чілтона; Полліанну лікують, і вона знову ходить."],

tom:{name:"«Пригоди Тома Соєра»", author:"Марк Твен, 1876", genre:"Повість",
about:"Повість про веселого бешкетника Тома Соєра, його друзів і пригоди в маленькому містечку на Міссісіпі: від фарбування паркану до пошуків скарбу.",
plot:["Том живе з тіткою Поллі. За покарання він має пофарбувати паркан — і хитро змушує інших хлопців зробити це за нього.","Том закохується в нову дівчинку Беккі Тетчер.","Том і Гек уночі на цвинтарі стають свідками вбивства, яке скоїв Індіанець Джо. Згодом Том свідчить на суді й рятує невинного Меффа Поттера.","Хлопці тікають на острів гратися в піратів; містечко вважає їх утопленими, і вони з'являються на власному похороні.","Том і Беккі губляться в печері, але Том знаходить вихід. Пізніше Том і Гек знаходять скарб Індіанця Джо."],
heroes:[["Том Соєр","бешкетник, вигадник, сміливий і шляхетний"],["Гекльберрі Фінн","вільний, безпритульний друг Тома"],["Беккі Тетчер","дочка судді, кохана Тома"],["Тітка Поллі","сувора й любляча вихователька Тома"],["Індіанець Джо","злочинець"],["Мефф Поттер","несправедливо звинувачений"]]},

comet:{name:"«Комета прилітає»", author:"Туве Янсон", genre:"Повість-казка",

plot:["Долина Мумі-тролів стає тривожною; друзі дізнаються, що до Землі летить комета.","Мумі-троль і Сніфф вирушають до Обсерваторії на Самотніх горах; дорогою зустрічають Снусмумрика.","Мумі-троль рятує фрекен Снорк від отруйного куща; друзі долають висохле море, смерч, сарану.","В Обсерваторії вони дізнаються точний час прильоту комети й поспішають додому попередити рідних.","Уся родина ховається в печері; комета пролітає повз, і Долина знову оживає."],
heroes:[["Мумі-троль","добрий, сміливий, вірний друг"],["Сніфф","боязкий, але добрий товариш"],["Снусмумрик","мандрівник-музикант, філософ"],["Фрекен Снорк і Снорк","нові друзі Мумі-троля"],["Мама й Тато Мумі-тролі","втілення тепла й затишку"]]},

alice:{name:"«Аліса в Країні Див»", author:"Льюїс Керролл, 1865", genre:"Казка-нісенітниця",

plot:["Аліса біжить за Білим Кроликом із годинником і падає в кролячу нору.","Вона п'є з пляшечки й зменшується, їсть пиріжок і виростає, плаває в морі власних сліз.","Аліса зустрічає Гусінь, Чеширського Кота, потрапляє на божевільне чаювання до Капелюшника й Березневого Зайця.","Вона грає в крокет із Червоною Королевою, де м'ячі — їжаки, а молотки — фламінго.","На суді над Валетом Аліса каже, що всі вони — лише колода карт; карти злітають — і вона прокидається."],
heroes:[["Аліса","допитлива, смілива, розсудлива дівчинка"],["Білий Кролик","вічно запізнюється"],["Чеширський Кіт","загадковий кіт, що зникає"],["Капелюшник","дивак із божевільного чаювання"],["Червона Королева","грізна королева карт"]]}
};
const WORK_OF = {3:"momotaro",4:"momotaro",6:"metelytsia",7:"metelytsia",8:"metelytsia",9:"jackal",
13:"snowqueen",14:"snowqueen",15:"snowqueen",16:"snowqueen",17:"starchild",18:"starchild",19:"starchild",20:"starchild",21:"starchild",22:"starchild",
23:"charlie",24:"charlie",25:"charlie",26:"charlie",27:"charlie",28:"charlie",29:"charlie",31:"sindbad",
33:"keats",34:"keats",35:"mowgli",36:"mowgli",37:"mowgli",38:"mowgli",39:"lobo",40:"lobo",41:"lobo",42:"lobo",
45:"nutcracker",46:"nutcracker",47:"nutcracker",48:"nutcracker",49:"nutcracker",50:"pollyanna",51:"pollyanna",52:"pollyanna",53:"pollyanna",
55:"tom",56:"tom",57:"tom",58:"tom",59:"tom",60:"tom",61:"comet",62:"comet",63:"comet",64:"comet",65:"comet",67:"alice",68:"alice"};


const LESSONS = META.map((m,i)=>Object.assign({}, m, L[i]||{}));

const SEC_STYLE = [
  {c:"#ef8a00", i:"📚", d:"📖✨🔖🌍💡"},
  {c:"#d6336c", i:"🍑", d:"🐕🐒🐦❄️🦊"},
  {c:"#3a6fd8", i:"❄️", d:"🌹⭐🍫🦌⛵"},
  {c:"#2e8b57", i:"🐺", d:"🦗🐻🐆🐍🌿"},
  {c:"#7b4fd6", i:"🎄", d:"🥜🐭👑🌞🎁"},
  {c:"#1c9aa8", i:"☄️", d:"🛶🗝️🎩🐇🃏"},
  {c:"#c0562a", i:"⭐", d:"🏆📚✨🎓📝"}
];

const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let done = store.get("zl5_done")||{};

const SECTIONS = [];
LESSONS.forEach((l,i)=>{ let s=SECTIONS.find(x=>x.name===l.section); if(!s){s={name:l.section,items:[],st:SEC_STYLE[SECTIONS.length%SEC_STYLE.length]};SECTIONS.push(s)} s.items.push(i); l.sec=s; l.tnum=s.items.length; });

function firstPage(p){const m=/(\d+)/.exec(p||"");return m?+m[1]:0;}
function qWord(n){const a=n%10,b=n%100; if(a===1&&b!==11) return "запитання"; if(a>=2&&a<=4&&(b<10||b>=20)) return "запитання"; return "запитань";}
function meta(l){ const q=(l.q||[]).length; return q+" "+qWord(q); }
function themeBtn(){ return `<button class="btn icon-btn" onclick="toggleTheme()" title="Світла / темна тема">🌓</button>`; }

function renderHome(){
  const total=LESSONS.length, dn=Object.keys(done).length;
  $("#app").innerHTML = `
  <div class="hero">
    <div>
      <div class="kick">Ліцей «Ясно» · 5 клас</div>
      <h1>Зарубіжна література</h1>
      <p>Уроки за календарно-тематичним плануванням: основна інформація, про що твір, сюжет і герої, тест для самоперевірки.</p>
      <div class="stats"><span><b>${SECTIONS.length}</b> розділів</span><span><b>${total}</b> тем</span><span><b>${dn}</b> пройдено</span></div>
    </div>
    <div class="hero-actions"><a class="btn" href="index.html">← Усі предмети</a><a class="btn fill" style="--c:#ef8a00" href="https://schoolappweb.blob.core.windows.net/314-book/314_0_639241065288225427.pdf" target="_blank" rel="noopener">📘 Підручник</a>${themeBtn()}</div>
  </div>
  ${SECTIONS.map((s,si)=>`
  <section class="sec" style="--c:${s.st.c}">
    <div class="sec-h"><div class="num">${si+1}</div><h2>${esc(s.name)}</h2></div>
    <div class="sec-body">
      <div class="cover"><div class="ci">${s.st.i}</div><div><div class="rz">РОЗДІЛ ${si+1}</div><div class="rn">${esc(s.name)}</div></div><div class="doodles">${[...s.st.d].join("")}</div></div>
      <div class="cards">${s.items.map(i=>{const l=LESSONS[i];return `
        <a class="tcard" href="#${i+1}">${done[i+1]?'<span class="chk">✓</span>':""}
          <div class="tn">Тема ${l.tnum}${l.diag?'<span class="badge">тренувальна</span>':""}</div>
          <div class="tt">${esc(l.title)}</div>
          <div class="tm">${meta(l)}</div>
        </a>`}).join("")}</div>
    </div>
  </section>`).join("")}`;
  document.title="Зарубіжна література · 5 клас";
}

function shuffle(a,seed){ const r=a.slice(); let s=seed; for(let i=r.length-1;i>0;i--){ s=(s*9301+49297)%233280; const j=Math.floor(s/233280*(i+1)); [r[i],r[j]]=[r[j],r[i]] } return r; }

function renderLesson(i){
  const l=LESSONS[i], n=i+1, s=l.sec, si=SECTIONS.indexOf(s);
  const chips = `<span class="chip c">Розділ ${si+1}</span>`+(l.codes?l.codes.split(/,\s*/).map(c=>`<span class="chip">${esc(c)}</span>`).join(""):"")+(l.diag?'<span class="chip c">Тренувальна діагностувальна робота</span>':"")+`<span class="chip">${(l.q||[]).length} ${qWord((l.q||[]).length)}</span>`;
  const ktp = l.ktp ? `<div class="ktp"><b>За КТП:</b> ${esc(l.ktp)}</div>` : "";
  const terms = (l.terms&&l.terms.length) ? `<div class="box"><h3><span class="bi">✎</span>Ключові поняття</h3>${l.terms.map(t=>`<div class="term"><b>${esc(t[0])}</b> — ${esc(t[1])}</div>`).join("")}</div>` : "";
  const w = W[WORK_OF[n]];
  const work = w ? `<div class="box work"><h3><span class="bi">📖</span>Про твір: ${esc(w.name)}</h3>
      <div class="wmeta"><span>✍ ${esc(w.author)}</span><span>◆ ${esc(w.genre)}</span></div>
      <h4>Про що твір</h4><p>${esc(w.about)}</p>
      <h4>${esc(w.plotTitle||"Короткий сюжет")}</h4><ol class="plot">${w.plot.map(p=>`<li>${esc(p)}</li>`).join("")}</ol>
      <h4>${w.poem?"Ліричний герой":"Головні герої"}</h4><div class="heroes">${w.heroes.map(h=>`<div class="hero-c"><b>${esc(h[0])}</b><span>${esc(h[1])}</span></div>`).join("")}</div>
    </div>` : "";
  const workSide = w ? `<div class="box"><h3><span class="bi">✍</span>Твір уроку</h3><div style="font:700 18px Montserrat,sans-serif;line-height:1.3">${esc(w.name)}</div><div class="small" style="margin-top:4px">${esc(w.author)}</div><div class="small">${esc(w.genre)}</div><a class="btn" style="margin-top:14px" href="#work" onclick="document.querySelector('.work').scrollIntoView({behavior:'smooth'});return false">Сюжет і герої ↓</a></div>` : "";
  const qs=(l.q||[]).map((q,qi)=>{const order=shuffle(q[1].map((_,k)=>k),n*31+qi*7+3);
    return `<div class="qst" data-c="${q[2]}"><div class="qt">${qi+1}. ${esc(q[0])}</div>`+order.map(k=>`<label class="opt" data-k="${k}"><input type="radio" name="q${qi}" value="${k}"><span>${esc(q[1][k])}</span></label>`).join("")+`</div>`}).join("");
  const hw = "";
  const pl=i>0?LESSONS[i-1]:null, nl=i<LESSONS.length-1?LESSONS[i+1]:null;
  const navA=(x,k,cls)=>x?`<a class="${cls}" href="#${k}" style="--c:${x.sec.st.c}"><div class="tn">${cls==="next"?"Далі →":"← Назад"} · Тема ${x.tnum}</div><div class="t">${esc(x.title)}</div></a>`:"";

  $("#app").innerHTML = `<div style="--c:${s.st.c}">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><a class="back" href="#">← Усі розділи</a>${themeBtn()}</div>
    <div class="lhead"><div class="num">${si+1}</div><div>
      <div class="tn">${esc(s.name)} · Тема ${l.tnum}</div>
      <h1>${esc(l.title)}</h1><div class="chips">${chips}</div></div></div>
    ${l.diag?`<div class="train"><div class="ti">📝</div><div><b>Це тренувальна діагностувальна робота.</b><br>Виконайте завдання, щоб підготуватися до діагностувальної роботи. Ці завдання не на оцінку.</div></div>`:""}
    <div class="lgrid"${w?"":' style="grid-template-columns:1fr"'}>
      <div>
        <div class="box"><h3><span class="bi">✦</span>Основна інформація</h3>${ktp}${l.info||""}</div>
        ${work}
        ${terms}
        <div class="box" id="test"><h3><span class="bi">✓</span>${l.diag?"Тренувальні тестові завдання":"Тест для самоперевірки"}</h3>${qs}
          <div class="actions"><button class="btn fill" id="check">Перевірити</button><button class="btn" id="reset">Спробувати ще раз</button></div>
          <div class="result" id="res"></div></div>
        ${hw}
      </div>
      <div class="side">
        ${workSide}
      </div>
    </div>
    <div class="nav">${navA(pl,n-1,"prev")}${navA(nl,n+1,"next")}</div></div>`;

  $("#check").onclick=()=>{let ok=0;const all=document.querySelectorAll(".qst");
    all.forEach(q=>{const c=q.dataset.c,sel=q.querySelector("input:checked");
      q.querySelectorAll(".opt").forEach(o=>{o.classList.remove("right","wrong");if(o.dataset.k===c)o.classList.add("right")});
      if(sel){if(sel.value===c)ok++;else sel.closest(".opt").classList.add("wrong");}});
    const r=$("#res"),p=ok/all.length;r.className="result show "+(p>=.75?"good":"mid");
    r.textContent=`Правильних відповідей: ${ok} з ${all.length}. `+(p===1?"Чудово!":p>=.75?"Добре! Перегляньте позначені питання.":"Перечитайте основну інформацію й спробуйте ще раз.");
    if(p>=.75){done[n]=true;store.set("zl5_done",done);}};
  $("#reset").onclick=()=>{document.querySelectorAll(".qst input").forEach(x=>x.checked=false);document.querySelectorAll(".opt").forEach(o=>o.classList.remove("right","wrong"));$("#res").className="result";};
  document.title=`${l.title} · Зарубіжна література 5`;
}

function route(){ const n=parseInt(location.hash.slice(1)); if(n>=1&&n<=LESSONS.length) renderLesson(n-1); else renderHome(); window.scrollTo(0,0); }
function toggleTheme(){ const d=document.documentElement; const dark=d.dataset.theme?d.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches; d.dataset.theme=dark?"light":"dark"; store.set("zl5_theme",d.dataset.theme); }
const th=store.get("zl5_theme"); if(th) document.documentElement.dataset.theme=th;
window.addEventListener("hashchange",route);
route();
</script>
</body>
